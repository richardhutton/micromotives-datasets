study_id: yv2ta
source: tess
title: "Opting into Work-Family Policies: Comparing the Effects of Material and Cultural Concerns"
data_file: TESS215_Pedulla_Client.dta
licence: >-
  none stated on the OSF deposit (checked via the OSF API, 2026-10-01: node_license null, no license relationship). TESS archived its post-2009 projects through the Roper Center and its own site states no reuse terms; TESS has since suspended operations. So there is no explicit grant of redistribution rights for this deposit, and none should be assumed.
experiment: flexible_scheduling

# See yv2ta_parental_leave.yaml for the full crosscheck writeup — the same
# reasons apply here: SocSci210 built one combined index spanning BOTH
# sub-experiments, only one outcome (their "likelihood" item), and their own
# reconstruction has internal gaps. Not comparable on scope or on index.
comparable_to_socsci210: false

notes: >
  TESS3 215 (Pedulla). Companion file to yv2ta_parental_leave.yaml — read that
  file's notes first; this one does not repeat the shared background (the
  two-sub-experiment structure, DOV_BLOCK, the source-authority ruling, the
  crosscheck findings). Source of record: the same fielded questionnaire,
  "310.209.00994.1_TESS3 215_Pedulla_FINAL.txt". This file builds BLOCK 2
  (flexible scheduling, Q4-Q6, Q10-Q11).


  THE DESIGN — 2 (policy type) x 5 (message) = 10 CELLS, ONE COMBINED
  VARIABLE.

  Line 166: "SCRIPTER: Create DOV_TESS215F. Randomly assign each respondent a
  value of 1-10, blocking by gender." Lines 171-204 are the lookup chart
  ("Use below chart for DOV_TESS215F insert values for Display 2"), columns
  XTESS215F / INSERT 3 / INSERT 4:

    raw  INSERT 3 (policy_type)        INSERT 4 (social_message)
     1   job sharing                   more than 80% have used this policy (norm: high usage)
     2   flexible scheduling           less than 10% have used this policy (norm: low usage)
     3   job sharing                   manager says it may decrease promotion chances
     4   flexible scheduling           manager says it would NOT affect promotion chances
     5   job sharing                   [NO INSERT] (no message)
     6   flexible scheduling           more than 80% have used this policy
     7   job sharing                   less than 10% have used this policy
     8   flexible scheduling           manager says it may decrease promotion chances
     9   job sharing                   manager says it would NOT affect promotion chances
    10   flexible scheduling           [NO INSERT]

  2 (job-sharing/flexible-scheduling) x 5 (high-usage/low-usage/decrease-
  warning/reassurance/none) = 10, matching DOV_TESS215F's 10 values exactly.
  VERIFIED against the .dta: DOV_TESS215F is 100% populated (n=2,036, no
  missing), 10 distinct values, counts 175-224. Both policy_type and
  social_message are fully crossed (each of the 10 combinations above
  realised by exactly one raw value) — a single combined code already
  exists, so `Condition.source_vars` (ledger #33) is not needed here either.

  Note that INSERT 4's wording for levels C/D ("...using this policy may
  decrease/would not affect your chances of being promoted", lines 183/186)
  differs from Block 1's INSERT 2 levels C/D ("...taking the full amount of
  leave may decrease/would not affect...") — a genuine difference between the
  two vignettes' own text, not an inconsistency on our part. Levels A/B are
  word-for-word identical between the two blocks' message inserts.

  CONDITION MAPPING — DECLARED (rule 2): condition_num = DOV_TESS215F - 1,
  the chart's own row order (raw 1-10 -> condition_num 0-9), same convention
  as the parental-leave file.


  TEXT PROVENANCE.

  Line 212 ("Display2", shown on the same page as Q4, line 210): "Please
  imagine that the company where you work offers all employees access to
  [INSERT 3]. This policy has been in place for the past decade. [INSERT 4]."
  shared_context is the invariant prefix up to "access to"; each arm's `text`
  is INSERT 3 verbatim + the fixed "has been in place..." sentence + INSERT 4
  verbatim (with its own trailing full stop) where INSERT 4 is not
  "[NO INSERT]". For the two raw values with "[NO INSERT]" (5, 10), the
  second sentence is dropped entirely, same treatment as Block 1's
  no-message arms. Nothing added, reordered or paraphrased.


  OUTCOMES.

  Q4 (line 217-218, scale instruction at line 216): "How likely would you be
  to utilize this scheduling policy?" — 1-100, "Very Unlikely" (1) to
  "Very Likely" (100).

  Q5 (lines 220-228) is FOUR separate sliders under one stem ("If you were to
  use this scheduling policy, to what extent would the following
  possibilities be a concern for you?"), each its own .dta column
  (Q5_1..Q5_4). Same four sub-items as Block 1's Q2 (competence / commitment
  / financial security / relationships), 1-100. Built the same way as Q2:
  four outcomes, task_num 1-4, "stem: sub-item" question text.

  Q6 (lines 232-235): "If you were to use this scheduling policy, how do you
  think other people in your organization would see you in terms of
  masculinity and femininity?" — 1-100, "Highly Feminine" (1) to "Highly
  Masculine" (100).

  NOT BUILT, BY PROJECT RULING (2026-10-01). Q10/Q11 (lines 280-297) are post-vignette RECALL
  CHECKS — they ask the respondent which pay level and which message appeared
  in the vignette they had just read, which is how researchers spot someone who
  skim-read. They are genuine answers from real people, so excluding them is a
  judgement about what this dataset is for, not about data quality: the answer
  is recoverable from the condition text alone, so a model would score highly on
  them while learning nothing about behaviour, and any evaluation including them
  would read better than it deserves. See docs/CONVENTIONS.md, "Attention and
  recall checks are not outcomes". Cost: 4,045 rows.

  This paragraph previously described them as built, at task_num 6 and 7, with
  their refusal counts — stale after the removal, and found by the checker. The
  removal had been recorded in a YAML comment beside the outcomes block rather
  than here, and `notes` is the field the schema actually carries as the audit
  trail, so a reader relying on it would have concluded the recall checks were
  in the corpus.

  RESPONSE CODING. Same identity-map treatment as the parental-leave file:
  Q4, Q5_1-4, Q6 are 1-100 sliders (-1 "Refused" dropped); verified refusal
  counts from the .dta: Q4 31, Q5_1-4 9/7/16/8, Q6 14. (Q10/Q11 are not built — see above.)


  SECOND-RANDOMISATION SWEEP. Same two candidates as the parental-leave file,
  reversed: DOV_TESS215P (the companion experiment's own assignment) and
  DOV_BLOCK (presentation order only) — see `considered_and_rejected` below.


  CROSSCHECK. See yv2ta_parental_leave.yaml — the same finding applies to
  both files: SocSci210's single combined index spans both sub-experiments
  and only reconstructs Q1/Q4 ("likelihood"), with internal gaps of its own.
  `comparable_to_socsci210: false`, no numeric assertion made.


  ONE DISCLOSED WORD CHANGE in the Q5_1-4 join. The source stem is plural —
  "to what extent would the following possibilities be a concern for you?" —
  because it introduces all four sub-items on one screen. Each built outcome
  carries one sub-item, so the rendered stem reads "the following possibility",
  singular, to agree with it. This recipe previously claimed "both halves are
  the source's own words, only the joining punctuation is ours"; that was not
  accurate, and the checker was right to say so. The change is grammatical
  agreement forced by splitting one screen into several rows (the same cause as
  docs/CONVENTIONS.md, "One stem, several labelled answer fields"), and it is
  recorded here rather than left to be rediscovered.

  OPEN QUESTIONS FOR THE CHECKER. Same as the parental-leave file (the
  "stem: sub-item" construction for Q5; the generated
  1-100 identity recode; the two considered_and_rejected entries) — see that
  file for the full list, which applies here unchanged.

condition:
  source_var: DOV_TESS215F
  factors: [policy_type, social_message]

  considered_and_rejected:
    DOV_TESS215P: "The companion sub-experiment's OWN assignment variable (the 15-arm parental-leave design, Q1-Q3/Q8-Q9). Independently randomised (line 73) and fully crossed with DOV_TESS215F, but it manipulates a different vignette entirely and governs different outcomes. Out of scope for this file; built separately as yv2ta_parental_leave.yaml (experiment: parental_leave)."
    DOV_BLOCK: "Presentation-order variable only (line 69: which vignette block, and which pair of recall-check items, is shown first). Independently randomised and crossed with DOV_TESS215F, but it does not change this vignette's text, Q4-Q6's wording, or Q10/Q11's wording — it only reorders which block the respondent sees first. Not a content manipulation."

  shared_context: >
    Please imagine that the company where you work offers all employees access
    to

  arms:
    # DOV_TESS215F = 1: job sharing / high-usage norm
    - raw: 1
      condition_num: 0
      factors: {policy_type: job_sharing, social_message: high_usage_norm}
      text: >-
        a job sharing program, where they can reduce their hours by up to 50%
        without changing their job title. As part of this program, employees are
        only paid for the proportion of their full-time schedule that they work.
        This policy has been in place for the past decade. Of the eligible
        workers within your organization, including managers, more than 80% have
        used this policy over the past five years.
    # DOV_TESS215F = 2: flexible scheduling / low-usage norm
    - raw: 2
      condition_num: 1
      factors: {policy_type: flexible_scheduling, social_message: low_usage_norm}
      text: >-
        a flexible scheduling policy that provides them with a degree of control
        over their work schedule. As part of this program, employees receive
        their full compensation as long as they do not decrease the total number
        of hours they work per week. This policy has been in place for the past
        decade. Of the eligible workers within your organization, including
        managers, less than 10% have used this policy over the past five years.
    # DOV_TESS215F = 3: job sharing / promotion-risk warning
    - raw: 3
      condition_num: 2
      factors: {policy_type: job_sharing, social_message: promotion_risk_warning}
      text: >-
        a job sharing program, where they can reduce their hours by up to 50%
        without changing their job title. As part of this program, employees are
        only paid for the proportion of their full-time schedule that they work.
        This policy has been in place for the past decade. However, your manager
        recently indicated that using this policy may decrease your chances of
        being promoted.
    # DOV_TESS215F = 4: flexible scheduling / promotion reassurance
    - raw: 4
      condition_num: 3
      factors: {policy_type: flexible_scheduling, social_message: promotion_reassurance}
      text: >-
        a flexible scheduling policy that provides them with a degree of control
        over their work schedule. As part of this program, employees receive
        their full compensation as long as they do not decrease the total number
        of hours they work per week. This policy has been in place for the past
        decade. In addition, your manager recently indicated that using this
        policy would not affect your chances of being promoted.
    # DOV_TESS215F = 5: job sharing / no message
    - raw: 5
      condition_num: 4
      factors: {policy_type: job_sharing, social_message: no_message}
      text: >-
        a job sharing program, where they can reduce their hours by up to 50%
        without changing their job title. As part of this program, employees are
        only paid for the proportion of their full-time schedule that they work.
        This policy has been in place for the past decade.
    # DOV_TESS215F = 6: flexible scheduling / high-usage norm
    - raw: 6
      condition_num: 5
      factors: {policy_type: flexible_scheduling, social_message: high_usage_norm}
      text: >-
        a flexible scheduling policy that provides them with a degree of control
        over their work schedule. As part of this program, employees receive
        their full compensation as long as they do not decrease the total number
        of hours they work per week. This policy has been in place for the past
        decade. Of the eligible workers within your organization, including
        managers, more than 80% have used this policy over the past five years.
    # DOV_TESS215F = 7: job sharing / low-usage norm
    - raw: 7
      condition_num: 6
      factors: {policy_type: job_sharing, social_message: low_usage_norm}
      text: >-
        a job sharing program, where they can reduce their hours by up to 50%
        without changing their job title. As part of this program, employees are
        only paid for the proportion of their full-time schedule that they work.
        This policy has been in place for the past decade. Of the eligible
        workers within your organization, including managers, less than 10% have
        used this policy over the past five years.
    # DOV_TESS215F = 8: flexible scheduling / promotion-risk warning
    - raw: 8
      condition_num: 7
      factors: {policy_type: flexible_scheduling, social_message: promotion_risk_warning}
      text: >-
        a flexible scheduling policy that provides them with a degree of control
        over their work schedule. As part of this program, employees receive
        their full compensation as long as they do not decrease the total number
        of hours they work per week. This policy has been in place for the past
        decade. However, your manager recently indicated that using this policy
        may decrease your chances of being promoted.
    # DOV_TESS215F = 9: job sharing / promotion reassurance
    - raw: 9
      condition_num: 8
      factors: {policy_type: job_sharing, social_message: promotion_reassurance}
      text: >-
        a job sharing program, where they can reduce their hours by up to 50%
        without changing their job title. As part of this program, employees are
        only paid for the proportion of their full-time schedule that they work.
        This policy has been in place for the past decade. In addition, your
        manager recently indicated that using this policy would not affect your
        chances of being promoted.
    # DOV_TESS215F = 10: flexible scheduling / no message
    - raw: 10
      condition_num: 9
      factors: {policy_type: flexible_scheduling, social_message: no_message}
      text: >-
        a flexible scheduling policy that provides them with a degree of control
        over their work schedule. As part of this program, employees receive
        their full compensation as long as they do not decrease the total number
        of hours they work per week. This policy has been in place for the past
        decade.

outcomes:
  - var: Q4
    task_num: 0
    question: "How likely would you be to utilize this scheduling policy?"
    scale: {min: 1, max: 100, min_label: "Very Unlikely", max_label: "Very Likely"}
  - var: Q5_1
    task_num: 1
    question: >-
      If you were to use this scheduling policy, to what extent would the
      following possibility be a concern for you: "Other people in my
      organization may see me as a less competent worker."
    scale: {min: 1, max: 100, min_label: "Not at all concerned", max_label: "Very concerned"}
  - var: Q5_2
    task_num: 2
    question: >-
      If you were to use this scheduling policy, to what extent would the
      following possibility be a concern for you: "Other people in my
      organization may see me as a less committed worker."
    scale: {min: 1, max: 100, min_label: "Not at all concerned", max_label: "Very concerned"}
  - var: Q5_3
    task_num: 3
    question: >-
      If you were to use this scheduling policy, to what extent would the
      following possibility be a concern for you: "My financial security may
      be at risk."
    scale: {min: 1, max: 100, min_label: "Not at all concerned", max_label: "Very concerned"}
  - var: Q5_4
    task_num: 4
    question: >-
      If you were to use this scheduling policy, to what extent would the
      following possibility be a concern for you: "My relationships with
      managers, co-workers, customers, or clients may be harmed."
    scale: {min: 1, max: 100, min_label: "Not at all concerned", max_label: "Very concerned"}
  - var: Q6
    task_num: 5
    question: >-
      If you were to use this scheduling policy, how do you think other
      people in your organization would see you in terms of masculinity and
      femininity?
    scale: {min: 1, max: 100, min_label: "Highly Feminine", max_label: "Highly Masculine"}
  # Q8/Q9 (parental leave) and Q10/Q11 (scheduling) are NOT built. They are
  # post-vignette RECALL CHECKS — "thinking back to the scenario, how much of
  # your pay was covered?" — which researchers use to spot respondents who
  # skim-read. They are real answers from real people, but they measure whether
  # someone read the stimulus, not how they behave: the answer is recoverable
  # from the condition text alone, so a model would score highly on them while
  # learning nothing about behaviour, and any evaluation including them would
  # read better than it deserves. Excluded by project ruling, 2026-10-01; see
  # docs/CONVENTIONS.md, "Attention and recall checks are not outcomes".
  # Cost: 4,047 rows here, 4,045 in the scheduling recipe.
