study_id: ukds_6849
source: innovation_panel
title: "Understanding Society Innovation Panel, experiment 9.31: GHQ-12, asked with or without the ReQoL-10 and EQ-5D-3L earlier (wave 14)"
data_file: reqol_w14-derived.sav
licence: |-
  UK Data Service End User Licence (UKDS SN 6849). NOT redistributable. The EUL's
  definition of "Data Collection" includes the Documentation, so the variable and value
  labels are part of the collection as much as the microdata is. Nothing built from this
  recipe may leave the machine: `data/raw/` and `data/processed/*.parquet` are gitignored,
  and `src/micromotives_datasets/jev.py` refuses `source="ukds"` outright.

comparable_to_socsci210: false
experiment: ghq_w14
participant_id_var: person

notes: |-
  University of Essex, Institute for Social and Economic Research, "Understanding
  Society: Innovation Panel, Waves 1-17, 2008-2024", UK Data Service SN 6849.
  Experiment 9.31 in the Innovation Panel User Guide ("Comparison of ReQoL-10 to other
  scales"); wave 14 (2021). The User Guide cites no publication.
  `ukds_6849_reqol_w14.yaml` is the other half.

  AN ORDER EXPERIMENT, BUILT ON WHAT WAS ASKED BEFORE (rich's ruling for 9.24, applied
  to the same design). Arm 1 answered the ReQoL-10 and EQ-5D-3L early and the GHQ-12
  late; arm 2 the reverse. This recipe holds the GHQ-12 answers, conditioned on whether
  the ReQoL-10 and EQ-5D-3L had been asked earlier.

  THE ALLOCATION IS IN TWO VARIABLES, AND ONE IS WRONG FOR HALF THE SAMPLE (ledger 134).
  Continuing households: `n_req10cond`, allocated in the script. Refreshment households
  (`hhorig` = 19): `n_ff_req10cond` in `n_hhsamp_ip`, allocated before fieldwork. For
  refreshment respondents `n_req10cond` ALSO carries a value, and it has no relation to
  what they were asked (it splits 253/226 and 252/233 across the two blocks); the
  household variable matches exactly. `scripts/gen_ip_reqol.py` takes each from the right
  place, and its `--check` finds 0 answers in a module the arm did not use. Every
  allocated respondent was routed into their early module (5 refused it, which is still
  being asked), so nobody is excluded.

  THE CONDITION IS NARRATED. "Earlier in the interview you were asked:" followed by the
  other block, every item quoted with its options; or "You had not been asked the
  questions that begin "..." earlier in the interview.", quoting the other block's
  opening sentence. The framing words, the quotation marks and the " / " separators are
  ADDED (docs/CONVENTIONS.md, "Narrating what the respondent did"); every quoted word is
  from `6849_ip_wave_14_questionnaire.pdf`, modules Scareqol10early/late,
  Scaeq5d3learly/late and Scaghqearly/late_ip14, extracted programmatically. Early and
  late wording is identical for all 28 items.

  WORDING VARIES BY MODE, AND IS RESOLVED PER ROW. Telephone respondents (`indmode` = 2)
  heard different ReQoL and EQ-5D wording ("I will now read statements that relate to
  your quality of life ..."; "Would you say that:"), so condition and question carry an
  inline directive on `indmode` (`respondent_vars`), the `a2nbf` mechanism. The GHQ has
  no telephone variant. Two edits to the source, both recorded here: the instruction
  shown in brackets on items after the first ("(For each of the following statements
  ...)") is kept on every item without the brackets; and the telephone EQ-5D's "First, ",
  "Next, " and "Finally, " are dropped, because they cite a position in a sequence
  (docs/CONVENTIONS.md, "Sequence signposting"). Telephone respondents also heard the
  EQ-5D OPTIONS in the second person ("You have no problems in walking about."), and get
  them; the first build gave them the self-completion wording ("I have ..."), and the
  independent checker caught it (ledger 137).

  Two caveats, from the checker. `indmode` is the interview's mode, not necessarily each
  block's: one face-to-face respondent answered the early GHQ without being offered
  early self-completion, and a switch from web to phone cannot be detected. The GHQ has
  no mode variant, so no text goes wrong for them. And two face-to-face respondents had
  the self-completion read to them (`scac` = 2); the questionnaire defines no other
  wording for that, so they get the self-completion text.

  HELD-OUT SPLITS: the refreshment sample was allocated by household, so splitting by
  participant puts members of one household, who shared a condition, on both sides.

  THE QUESTION LISTS ITS OPTIONS, numbered by their codes, because the GHQ's options
  differ from item to item and the middle levels carry meaning (ledger 133).

  `person` is a hash of `pidp`, the same construction as every Innovation Panel build.

condition:
  source_var: prior_ghq
  factors: [reqol_asked_earlier]
  considered_and_rejected:
    prior_reqol: "the exposure code for the sibling experiment ukds_6849_reqol_w14; derived by the same generator, not a second randomisation"
    arm: "the allocated arm; this recipe's condition is the exposure derived from it"
  arms:
    - raw: 1
      condition_num: 0
      factors: {reqol_asked_earlier: "no"}
      text: "[IF indmode=2 INSERT: You had not been asked the questions that begin \"I will now read statements that relate to your quality of life followed by 5 possible responses.\" earlier in the interview.; IF indmode=1 INSERT: You had not been asked the questions that begin \"For each of the following statements, please tick ONE box that best describes your thoughts, feelings and activities over the LAST WEEK:\" earlier in the interview.; IF indmode=3 INSERT: You had not been asked the questions that begin \"For each of the following statements, please tick ONE box that best describes your thoughts, feelings and activities over the LAST WEEK:\" earlier in the interview.]"
