      factors: {frame: restrictive_clinton, cue: republican}
      text: |-
        Please take a moment to read the argument carefully and then tell us what you think.

        "All Americans, not only in the states most heavily affected but in every place in this country, are rightly disturbed by the large numbers of illegal aliens entering our country. The jobs they hold might otherwise be held by citizens or legal immigrants. The public services they use impose burdens on our taxpayers. We are a nation of immigrants. But we are also a nation of laws. It is wrong and ultimately self-defeating for a nation of immigrants to permit the kind of abuse of our immigration laws we have seen in recent years, and we must do more to stop it."

        President Bill Clinton - Democrat

        You were asked: "Do you think the number of immigrants to America should be...." You then read:

        Please take a moment to read the argument carefully and then tell us what you think.

        Twenty states have expanded access to in-state college tuition rates to include students who are in the United States illegally. Republican Rick Perry was the first governor to support this legislation and now these students can pay about $5,000 per year instead of $20,000 per year if they meet certain criteria like living in the state for several years and having a diploma from a high school in the state.

        We should make sure that illegal immigrant students in all states can access an affordable college education.

        You were asked: "How strongly do you agree or disagree with the above statement?" You then read:

        Please take a moment to read the argument carefully and then tell us what you think.

        Old fingerprint records can be used to identify immigrants who mislead the government by using a different name on their visa application to stay in the country and then get citizenship. The Trump administration began checking old records to identify immigrants who may have fraudulently obtained citizenship.

        We should revoke the citizenship and deport any immigrant who used a different name to get a visa.
