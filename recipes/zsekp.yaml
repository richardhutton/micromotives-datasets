      text: |-
        Below are report card data for Oak High School. The performance of the students at Oak High School has been measured and the school's performance index scores are listed for each area. The performance index is a weighted average of the tests given to students at all grade levels. This results in a scale from 0 to 200 points. Considering the provided data, please answer the accompanying questions.

        Oak High School
        Educational Goal | Performance Index (0-200)
        Academics | 164
        Arts | 190
        Citizenship and Community Responsibility | 190

        You were asked: "Satisfaction means many things. Overall, how SATISFIED are you with Oak High School based on these data?" "Considering all of your EXPECTATIONS for the performance of a high school in your state, to what extent has the performance of Oak High School fallen short of your expectations or exceeded your expectations?" "Imagine the IDEAL high school for you and your household. How well do you think Oak High School compares with your ideal?" You then read:

        Below are report card data for Elm High School. The performance of the students at Elm High School has been measured and the school's performance index scores are listed for each area. The performance index is a weighted average of the tests given to students at all grade levels. This results in a scale from 0 to 200 points. Considering the provided data, please answer the accompanying questions.

