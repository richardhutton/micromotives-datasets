study_id: zsekp
source: tess
title: "Informing the Public or Information Overload? School Accountability Data Format (Jacobsen, TESS2 091)"
data_file: TESS2_091_Jacobsen_client.dta
licence: >-
  none stated on the OSF deposit, as for every TESS deposit built here (TESS
  archived its projects without reuse terms and has since suspended
  operations). Not re-checked against the OSF API for this node in this build.
  So there is no explicit grant of redistribution rights for this deposit, and
  none should be assumed.

# In SocSci210 (one of its 40 held-out studies: our Eval set). The crosscheck
# FAILS by design (see ANSWER KEY); build without --crosscheck.
comparable_to_socsci210: true

notes: |-
  TESS2 091 (Rebecca Jacobsen, Michigan State University; Knowledge Networks),
  "Informing the Public or Information Overload? The influence of school
  accountability data format on public satisfaction", questionnaire dated
  October / November 2011. The .dta has 1,111 rows, CaseID unique. Deposit OSF
  zsekp, Jacobsen176.zip: the .dta, the fielded questionnaire
  ("TESS2 091 Jacobsen_vFINAL.doc"), the response rate report; Jacobsen176.pdf
  is the proposal.

  Line citations are 1-based line numbers in
    Q = "TESS2 091 Jacobsen_vFINAL.txt" (textutil from the .doc, the wording
        authority).


  DESIGN AND ASSIGNMENT

  XTESS291 ("Condition 1-4"; Q 41-50 call it xTESS279 in one table and
  xTESS291 in the item map, the data's name is XTESS291): the FORMAT of a school
  report card. 1 performance index (0-200), 2 letter grade, 3 percent meeting or
  exceeding standards, 4 achievement level. Counts 284 / 269 / 288 / 270, sum
  1,111.
  Within each format every respondent sees three schools (Oak, Elm, Cedar), each
  on its own screen with its own table, and rates each on three 7-point items.
  The schools are the same in every format; only the format of the numbers
  differs (Oak best, Cedar worst, in every format). School order was
  randomised and recorded (ORDER_SCHOOLS, 6 orders, Q 157-161).
  recipe_prep.py was not used for the assignment: the data has exactly one
  condition variable, named and labelled as such ("Condition A: performance
  index format" ..), and Q's item map (Q 164-184) ties it to the outcome
  variables; the routing agrees (Q2A-Q10A answered only by XTESS291 = 1, etc.).


  CONDITION TEXT

  shared_context: the introduction screen shown to everyone before the schools
  (Q 151-154, two paragraphs, word-for-word including its own slips "asked judge
  it's performance" and "There a total of three schools").
  Per item, the school's own screen: its lead paragraph word-for-word (Q 193,
  321, 453; 590, 717, 850; 987, 1114, 1248; 1385, 1510, 1643; note the four
  formats' paragraphs differ, and C's Elm and Cedar paragraphs end "0 percent of
  students to 100 percent of students." without Oak's "meeting the standards"),
  then the table. Q shows the table on the display screen AND again with each
  question ("[SHOW OAK HIGH SCHOOL PERFORMANCE INDEX TABLE]").
  TABLE LAYOUT, ours: the school name, then "Educational Goal | <column
  header>", then one line per goal, "<goal> | <value>". The words and values
  are Q's; the " | " separators and line breaks stand in for table cells.
  ORDER: the school order was randomised AND recorded (ORDER_SCHOOLS, 6 orders,
  labelled "OAK, ELM, CEDAR" .. "CEDAR, ELM, OAK"; 180-200 respondents each), so
  each row's condition is everything shown up to its own school, in that
  person's order (CONVENTIONS, "Repeated measures within one block": later
  screens never named, earlier questions narrated as asked). Conditions are
  format x order, 24 cells, condition_num = 6 x (format - 1) + (order - 1).
  ADDED WORDS, ours, true for everyone in the cell, between schools:
    'You were asked: "<satisfaction q>" "<expectations q>" "<ideal q>" You
    then read:'
  with the previous school's three questions quoted word-for-word. Each arm's
  `text` is its whole block (the last school's condition); the item overrides
  cut it at the row's own school. (First draft built each school alone; the
  checker, 25 Nov 2026, held the convention applies literally, and it does.)


  OUTCOMES

  For each school (Oak tasks 0-2, Elm 3-5, Cedar 6-8), Q2-Q4 / Q5-Q7 / Q8-Q10
  with the format letter (A-D) as suffix:
    satisfaction: "Satisfaction means many things. Overall, how SATISFIED are
      you with <school> High School based on these data?" 1 Very dissatisfied ..
      7 Very satisfied;
    expectations: "Considering all of your EXPECTATIONS ... fallen short of your
      expectations or exceeded your expectations?" 1 .. 7;
    ideal: "Imagine the IDEAL high school ... How well do you think <school>
      High School compares with your ideal?" 1 Very far .. 7 Very close.
  Wording identical in all four formats (checked: each of the nine questions
  occurs exactly four times in Q). Stored as coded. Missing: -1 Refused.
  NOT BUILT: Q1, a 10-point allocation among three education goals, asked of
  everyone before the report cards (no contrast).


  PERSONA

  Knowledge Networks profile, as 4zscf: PPAGE, PPGENDER, PPEDUCAT, PPETHM,
  PPINCIMP, PPMARIT, PPWORK, PPREG4, PPHHSIZE, PPHOUSE, PPRENT, PPMSACAT, PPNET,
  plus the panel's XPARTY7, XIDEO, XREL1, XREL2. In this file the X variables
  are NOT merged with a re-ask (Q: "DID NOT INCLUDE PARTY1-4 ... ONLY LOADING
  PANELISTS WITH KNOWN VALUE IN XPARTY7=1-3, 5-7"), so their "Missing" codes
  survive: XIDEO 9 (8), XREL1 14 (2), XREL2 9 (185), declared in
  persona_missing. XPARTY7 has no 9 (the panel loaded only known party IDs);
  code 4 Undecided/Independent/Other occurs (32).


  ANSWER KEY

  SocSci210 (crosscheck, 25 Nov 2026): 4 conditions, 3 tasks, 9,615 rows; ours
  24 conditions (4 formats x 6 school orders), 9 tasks, 9,798. Their three tasks POOL the three schools per
  question (satisfaction, expectations, ideal), so each of their rows no longer
  says which school's table it answers; their counts equal our three schools
  summed: 3,269 = 1,093 + 1,087 + 1,089; 3,267 = 1,092 + 1,089 + 1,086.
  Their third task (ideal) has 3,079 against our 1,087 + 1,088 + 1,087 = 3,262:
  they are missing exactly 183 rows, and the whole difference is code 7 (ours
  495 sevens in total, theirs 312). The ideal items' code 7 is labelled "Very
  close to my ideal" with no "7 " prefix, where every other label reads "7 Very
  satisfied" etc.; their parse dropped those answers. Every other response code
  matches exactly (1: 1,957; 2: 1,674; 3: 1,645; 4: 1,678; 5: 1,326; 6: 1,023).

  CHECKED 25 Nov 2026 by a separate checker (Sonnet), briefed to break it. It
  rebuilt all 36 first-draft cells from Q (0 differences in words or table
  values) and matched every cell's counts and 1-7 distribution to the .dta; both
  ANSWER KEY findings confirmed. It FAILED the first draft for building each
  school alone although ORDER_SCHOOLS records a randomised order; rebuilt
  cumulatively (24 conditions, ORDER above). Also corrected: XPARTY7 code 4
  occurs. RE-CHECKED (Sonnet), PASS: all 216 cells carry exactly the schools
  shown up to their own in the recorded order, none later; counts and
  distributions match the .dta; condition_num and factors map correctly.

  UK CHECK

  Not applicable as a fit test: an Eval study, built to compare with SocSci210.
  US school report cards.

condition:
  source_vars: [XTESS291, ORDER_SCHOOLS]
  factors: [format, school_order]
  shared_context: |-
    Schools today are required to provide the public with annual information on their performance. Just like students receive report cards to evaluate their performance in each subject area, schools are evaluated in different subject areas and that information is provided in a school report card. These report cards are then made publicly available through the Internet, which enables the public to judge how well schools in their area are doing to meet their educational goals.
    
    Imagine you are asked to evaluate your satisfaction with a school's performance based on its report card data. On the following screens, you will be provided with school report card data. After examining the report cards, you will be asked judge it's performance. There a total of three schools that you will be asked to evaluate.
