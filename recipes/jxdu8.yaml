notes: |-
  TESS 45 (Darley), "Moral Luck, Loss of Chance, and Legal Liability", fielded
  by Knowledge Networks 17-24 Aug 2005: 554 fielded, 373 completed (completion
  report). The .sav has 373 rows, CASEID unique (DT_START 20050817-20050824).
  One experiment, one recipe. A US tort frame throughout: "punitive damages",
  juries, "American states have different laws", dollar figures. Kept exactly as
  fielded; a UK reader meets an unfamiliar legal institution (punitive damages
  are rare in UK law), so the transfer is the mechanism, not the legal detail.


  SOURCES AND PROVENANCE

