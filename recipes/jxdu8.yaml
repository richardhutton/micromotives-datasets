    question: |-
      Kyle hasn't had a stroke, but if he suffers a stroke now, his total financial losses will amount to $575,000. People have suggested several ways of dealing with this. Which strikes you as best? Mark the solution below you would prefer and add any comments you would wish.
      1 means "Right now, Pilling and the company should pay Kyle enough money to compensate him for his total financial losses for the stroke he might have, which will be about $575,000."; 2 means "Pilling and the company should be required to deposit in a special account enough money to compensate Kyle for the stroke he might later have. This money would be paid to Kyle if he has a stroke and if the medical evidence shows that the chemical caused the stroke. The money should be enough to pay Kyle both for his lost income and other costs, including medical expenses not covered by insurance, home care, and rehabilitation that he will have to undergo. If Kyle doesn't suffer a stroke, or if he suffers a stroke much later so that money remains in the account after he has been taken care of during his disability, any left over money will be returned to the company."; 3 means "Pilling and the company put Kyle at risk of having a stroke. Even though he has not had a stroke I think that they should now pay him a percentage of the costs he will have ($575,000) if he eventually does have a stroke."; 4 means "I have a better way of doing this.".
    scale: {min: 1, max: 4, nominal: true}
    response_recode: {1: 1, 2: 2, 3: 3, 4: 4}
  # SS6a (Q 364-368): stroke arms only
  - task_num: 4
    var: SS6A
    question: |-
      Kyle had the stroke and his total financial losses will amount to $575,000. People have suggested several ways of dealing with this. Which strikes you as best? Mark the solution below you would prefer and add any comments you would wish.
      1 means "Right now, Pilling and the company should pay Kyle enough money to compensate him for his total financial losses, which will be about $575,000. (It will actually be somewhat lower than $575,000 because Kyle will be expected to put it into an account that earns some interest so he can draw on the account each year to pay his expenses. But it will eventually pay Kyle $575,000 over his estimated lifetime.)"; 2 means "Pilling and the company should be required to put into a special account enough money to compensate Kyle for the stroke, paying it out each year. (It will be somewhat lower than $575,000 because it will earn some interest each year. But it will eventually pay Kyle $575,000 over his estimated lifetime.)"; 3 means "I have a better way of doing this.".
    scale: {min: 1, max: 3, nominal: true}
