      text: |-
        Your task is to read the following story. In it a small, one-person owned manufacturing firm has a chemical leak. The leak puts some people in the neighborhood at risk of having a stroke. After reading the story, you will be asked a series of questions about what sorts of actions should be taken to compensate the possible victims.

        Pilling's Company
        The Glu-Tight Cement Company is owned and run by Henry Pilling, who invented a glue for installing wall-to-wall carpets. Pilling manufactures the glue through Glu-Tight, which has been in successful business for 25 years. Last year, Glu-Tight made about $1 million in profits. It has assets of about $4 million. Pilling is very secretive about manufacturing his glue. He insists on mixing the chemicals and controlling the process himself. Pilling does not want anyone, even his employees to know these manufacturing secrets.

        The Manufacturing Danger
        Because Glu-Tight has only one product and distributes it narrowly, it was only recently discovered that Glu-Tight's manufacturing process emits a chemical which, when inhaled, is toxic to people who take Tridoxin. Tridoxin is common medication for high blood pressure, and its users are more likely to suffer a stroke when they inhale the fumes. Inhaling the chemical does not always cause a stroke, but it significantly increases the likelihood of a stroke. People who do not take Tridoxin are not at increased risk.
        These chemically-induced strokes can occur up to five years from the time the chemicals are inhaled, and sometimes happen as quickly as within one month. After five years, the concentration of the chemical in the blood stream decreases enough so that earlier exposure to the chemical is no longer a factor in the risk of having a stroke.

        When a patient does have a stroke as a result of inhaling this chemical, doctors can tell that the chemical was involved if they do a brain scan. It is also possible to detect the presence and concentration of the chemical in the blood stream even if a stroke has not occurred.

        Once Pilling learned that his manufacturing process emitted the dangerous chemical, he worked out a way to make the process safe. He revised the process to include adding a buffer that neutralizes all of the dangerous molecules, preventing them from ever reaching the air through the plant's smokestacks. Pilling regards this buffering process as a trade secret and insists that he be the only one to operate this aspect of the process.

        However, last month, a batch of cement was made in a dangerous manner that allowed the chemical to escape into the air with Pilling's knowledge. Pilling had failed to add the neutralizing chemical to the filtering system. When he saw what he had done, he decided not to stop the process, because it would cost a great deal of money finding a way to dispose of the toxic batch legally. This may have required him to shut down the plant for a few days, losing even more money. Instead, he decided just to pretend that the problem didn't occur.

        Kyle and Dana Jackson live a few blocks from the Glu-Tight factory. Kyle, who is 59, takes Tridoxin to treat his high blood pressure. Two weeks after the emission of the toxic chemical, a local newspaper reporter heard that people in Kyle's neighborhood had detected a strange smell in the air. The reporter wrote an article that linked the smell to toxic emissions and mentioned their connection to Tridoxin. When Kyle read the article, he went to a specialist, who found high concentrations of the chemical in Kyle's blood, and confirmed that he was at an increased risk of stroke.

        Quickly thereafter, Kyle had a stroke. He remains partly paralyzed, his speech is slurred, and little or no additional improvement is expected. Tests showed that the chemical combined with his medicine to induce the stroke. Kyle's doctors explained the studies to him, and he now knows what caused the stroke. He and Sue are very upset, and have been unable to sleep since learning of this fact. Also, Kyle can no longer work.

        It would take $300,000 to make up for the income that Kyle will lose as a result of the stroke, and an additional $275,000 to cover other costs, including medical expenses not covered by insurance, home care, and rehabilitation that he will have to undergo. Thus, Kyle's total financial loss will amount to $575,000.

        Some people have asked us for information about how much the chemical increases the risk of stroke, so we are giving that information to everyone. Here it is.

        Even without exposure to the chemicals emitted by the plant, older people with high blood pressure are already at some risk of having a stroke. For those who control their high blood pressure with Tridoxin, it is about 11% over a 5 year period.

