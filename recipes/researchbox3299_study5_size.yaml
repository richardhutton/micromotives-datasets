participant_id_var: pid
notes: 'Gaertig C & Simmons JP (2025), "Why (and When) Are Uncertain Price Promotions More Effective Than
  Equivalent Sure Discounts?", Journal of Consumer Research, doi:10.1093/jcr/ucaf036. ResearchBox 3299
  (https://researchbox.org/3299).


  GENERATED by scripts/gen_researchbox3299.py; every judgement is in its docstring. Study 5, Prolific,
  April 2023. An $11 product; 10% off framed as "10%" or "$1.10", against a 10% chance it is free; option
  order randomised and recorded (SureDiscountFirst). 1,187 of 1,227 kept (do file: 18 duplicate IPs, 2
  duplicate Prolific IDs, 20 who did not answer). The size question came on the next page, after the choice;
  its condition is the choice screen, then ''You were asked "Which price promotion would you like to receive?"''
  (ours), then that page''s reminder word-for-word. Its wording pipes in the discount (10% or $1.10),
  so the question is set per arm.


  Wording from the .qsf (Qualtrics_Study_5.qsf; its twin export has the same questions, see the docstring).
  Typography normalised (curly quotes, non-breaking and zero-width spaces). Persona: age (years; outside
  18-100 left blank) and gender, labels from the .qsf''s own choices.'
