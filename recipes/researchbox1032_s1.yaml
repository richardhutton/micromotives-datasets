study_id: researchbox1032
source: researchbox
experiment: s1
title: 'Joint evaluation: the same potato chips maker, facing higher production costs, raises the price,
  and shrinks the pack; is each fair or unfair? (Study S1)'
data_file: researchbox1032_s1.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/1032 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Evangelidis I (2024), "Frontiers: Shrinkflation Aversion: When and Why Product Size Decreases
  Are Seen as More Unfair than Equivalent Price Increases", Marketing Science 43(2):280-288, doi:10.1287/mksc.2023.0269.
  ResearchBox 1032 (https://researchbox.org/1032).


  GENERATED by scripts/gen_researchbox1032.py; every judgement is in its docstring. Study S1 (pre-registered
  Sep 2023, AsPredicted #144974), 200 people, all kept. Within person: everyone judged both the price
  increase ($3 to $4) and the size decrease (12 oz to 9 oz), each person two rows. The two questions were
  in one block whose order the deposit does not record (block option RandomWithXPerPage with the size
  question listed as fixed; the pre-registration: "The order of the two scenarios will be randomized"),
  so neither row mentions the other (CONVENTIONS: an order not recorded cannot be narrated). The scenario
  wording is Study 2''s. 1 = fair, 2 = unfair, as answered.


  Wording from Study S1 - Materials.qsf. Each fairness screen was the scenario followed by "This is" and
  the two answers; the scenario is the condition and "This is" the question, both word-for-word. The assignment
  is derived from which arm''s column is filled (every fairness question was ForceResponse, so a blank
  means not shown). Typography normalised (HTML entities, non-breaking spaces). No words added. Persona:
  age (years; outside 18-100 left blank) and gender, labels from the .qsf''s own choices.'
condition:
  source_vars:
  - arm_price
  factors:
  - action
  arms:
  - raw_values:
      arm_price: 1
    condition_num: 0
    factors:
      action: price_increase
    text: Production costs for a potato chips manufacturer have recently increased. As a result, the firm
      decided to increase the price of its product from $3 to $4. The size of the product will remain
      the same (12 oz).
  - raw_values:
      arm_price: 2
    condition_num: 1
    factors:
      action: size_decrease
    text: Production costs for a potato chips manufacturer have recently increased. As a result, the firm
      decided to decrease the size of its product from 12 oz to 9 oz. The price of the product will remain
      the same ($3).
outcomes:
- var: price
  task_num: 0
  question: This is
  scale:
    min: 1
    max: 2
    min_label: fair
    max_label: unfair
  condition_var: arm_price
- var: size
  task_num: 1
  question: This is
  scale:
    min: 1
    max: 2
    min_label: fair
    max_label: unfair
  condition_var: arm_size
response_recode:
  1: 1
  2: 2
missing_codes: []
persona_map:
  age: age
  gender: gender
