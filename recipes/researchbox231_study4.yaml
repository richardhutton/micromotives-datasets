study_id: researchbox231
source: researchbox
experiment: study4
title: 'A simulated month, paid daily or weekly and spending daily or weekly: how wealthy it felt (Study
  4)'
data_file: researchbox231_study4.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/231 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'De La Rosa W & Tully SM (2022), "The Impact of Payment Frequency on Consumer Spending and Subjective
  Wealth Perceptions", Journal of Consumer Research 48(6), doi:10.1093/jcr/ucab052. ResearchBox 231 (https://researchbox.org/231).


  GENERATED by scripts/gen_researchbox231.py; every judgement is in its docstring. Study 4, autumn 2020,
  2 x 2: paid $100 every day or $700 every week, and paying expenses every day or every week (the same
  totals), $500 to start. A passive month-long simulation (no choices): one screen per day of February
  with that day''s deposit, spending and balance, each screen word-for-word with the loop-and-merge values
  of the arm''s block in the .qsf ("You also spent $-76" is the screen''s own rendering). Six subjective-wealth
  sliders then four prediction-uncertainty sliders, 0-100, each set shown in a random order. Column Subjective
  Wealth k / Prediction Uncertainty k is the k-th question of its block in the .qsf: the deposit''s columns
  follow the export''s block order, and the codebook''s polarity (items 4-6 and 1-2 reversed) matches
  it. The manipulation checks (how often / how much were you paid, range of expenses) are recall checks,
  not built. 528 of 599 kept (paper: 37 had taken part before, 34 failed the checks).


  Wording from Study_4_-_Subjective_Wealth_2_Pay_Frequency_x_2_Expense_Frequency.qsf. Typography normalised
  (curly quotes, non-breaking spaces); line breaks kept as the screen had them; one blank line between
  screens. Persona: age (years; outside 18-100 left blank), and gender, income, education, labels from
  the .qsf''s own choices (income and education harmonised by the crosswalk scheme us_researchbox231_qualtrics).
  Ethnicity (multi-select) and own pay frequency not mapped.'
