outcomes:
- var: decision1
  task_num: 0
  question: 'Tuesday, September 3, 2019

    Your friend Joe hears about your work troubles and invites you out for drinks. You are feeling down
    and can use a friend right now. However, you know Joe likes to go to expensive bars and you expect
    you will have to pay $35 for drinks.

    What do you do?

    1 means "Get drinks with Joe"; 2 means "Stay home".'
