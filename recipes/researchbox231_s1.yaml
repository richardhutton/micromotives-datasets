experiment: s1
title: 'Life simulator: drinks with a friend after being paid daily or weekly (Supplemental Study 1)'
data_file: researchbox231_s1.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/231 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'De La Rosa W & Tully SM (2022), "The Impact of Payment Frequency on Consumer Spending and Subjective
  Wealth Perceptions", Journal of Consumer Research 48(6), doi:10.1093/jcr/ucab052. ResearchBox 231 (https://researchbox.org/231).


  GENERATED by scripts/gen_researchbox231.py; every judgement is in its docstring. Supplemental Study
  1, 2019. As Study 2 but a negative balance is described as borrowing to be paid back, and the friend
  is Joe. Only the FIRST spending decision is built. Every screen before it is the same for everyone in
  an arm, so its condition is fixed by the assignment. Every later screen shows a result and a balance
  that follow from the respondent''s own earlier choices ("You were late to work ...", "Alert: Your checking
  account balance is less than $0"), so no later decision, and no end-of-study question, has a condition
  shared by an arm: it would be one condition per path, stating each person''s own earlier answers as
  given. Not built for that reason: 13 further decisions. The TRUE/FALSE items that restate the instructions
  are comprehension checks, dropped. Balances are those the survey flow''s own embedded-data arithmetic
  produced for the arm (see the docstring). The decision screen showed a balance box beneath the question;
  it follows the added clause "Beneath the question below, the same screen showed:" (ours). Options in
  the .qsf order, which was fixed. 146 of 149 kept (pre-registration: exclude failed attention checks).


  Wording from Supplemental_Study_1_-_Life_Simulator_Daily_vs_Weekly.qsf. Typography normalised (curly
  quotes, non-breaking spaces); line breaks kept as the screen had them; one blank line between screens.
  Persona: age (years; outside 18-100 left blank), and gender, income, labels from the .qsf''s own choices
  (income and education harmonised by the crosswalk scheme us_researchbox231_qualtrics). Ethnicity (multi-select)
  and own pay frequency not mapped.'
condition:
  source_vars:
  - pay
  factors:
  - pay_frequency
  arms:
  - raw_values:
      pay: 1
    condition_num: 0
    factors:
      pay_frequency: daily
    text: 'You are about to start a life simulator. In this simulator, you will work, incur expenses,
      and make spending decisions just as you would in real life.

      It is important that you make decisions as you would in your everyday life. You will simulate life
      for five weeks.

      To start, you have $850 in your checking account. You will always be shown your daily checking account
      balance at the bottom of the screen. If at any point your checking account balance goes below 0,
      that means you are borrowing money that you will have to pay back.

      ----------------------------------

      Checking Account Balance: $ 850

      ----------------------------------


      We are about to start the life simulator.

      We ask that you take the simulation seriously. Please make decisions as you would in real life.


      Friday, August 30, 2019

      Your rent is due on the last day of every month. Your rent is due tomorrow, August 31. Pay your
      landlord $650.

      ----------------------------------

