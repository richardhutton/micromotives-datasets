study_id: ukds_6849
source: innovation_panel
title: "Understanding Society Innovation Panel, experiment 9.49: consent to an in-home sensor, varying where the information sat, the stated duration and a promised feedback report, face-to-face (wave 17)"
data_file: sensor_w17-derived.sav
licence: |-
  UK Data Service End User Licence (UKDS SN 6849). NOT redistributable. The EUL's
  definition of "Data Collection" includes the Documentation, so the variable and value
  labels are part of the collection as much as the microdata is. Nothing built from this
  recipe may leave the machine: `data/raw/` and `data/processed/*.parquet` are gitignored,
  and `src/micromotives_datasets/jev.py` refuses `source="ukds"` outright.

comparable_to_socsci210: false
experiment: sensor_consent_w17_ftf
participant_id_var: person

notes: |-
  University of Essex, Institute for Social and Economic Research, "Understanding
  Society: Innovation Panel, Waves 1-17, 2008-2024", UK Data Service SN 6849. Experiment
  9.49 in the Innovation Panel User Guide ("Indoor residential environment: consent for
  in-home sensor"); wave 17 (2024) only. The User Guide cites no publication. GENERATED
  by `scripts/gen_ip_sensor.py --recipes`; every quoted string is asserted by `--check`
  to occur in `6849_innovation_panel_wave_17_questionnaire.pdf`.
  `ukds_6849_sensor_consent_w17_web.yaml` is the other mode.

  THIS EXPERIMENT: FACE-TO-FACE: households whose household questionnaire was done in
  person (`q_modetype` = 1, "capi"; `q_hhintmode` agrees for every household).
  Face-to-face and web are two experiments because mode was not randomised and the
  information-location factor is a different manipulation in each: face-to-face it
  changes what the interviewer read out; on the web it changes what was on the screen
  and what sat behind a help click (ledger 151).

  WHAT WAS RANDOMISED (User Guide 9.49, confirmed by the Technical Report: "All
  randomisations were conducted at the household level"). Per HOUSEHOLD, on
  `q_hhsamp_ip`, joined on `q_hidp`: `ff_esensinfow17` (1/2 each) 1 "Full information in
  question text" (ENVSENSCONS1), 2 "Key information in question text, rest in help text"
  (ENVSENSCONS2); `ff_esensdurw17` (1/3 to code 1, 1/6 to each other) the maximum
  duration filled into the text and the question: 1 "up to 6 months", 2 "up to 12
  months", 3 "up to a year", 4 "up to 24 months", 5 "up to 2 years" (12 months / a year
  and 24 months / 2 years state the same length in different words); `ff_esensfbw17`
  (1/2 each) 1 "Feedback from sensor promised" (the paragraph "A personalised report
  giving a summary comparing the conditions in your home to the average home will be
  sent to you once we have analysed the data." is shown), 2 "not mentioned" (it is not).
  Fully crossed: 2 x 5 x 2 = 20 cells, every one holding rows in this mode (`--check`).

  THE LABELS WERE NOT TRUSTED (ledger 138). `--check` cross-tabulates the allocation
  against the routing: in each mode every version-1 household was asked ENVSENSCONS1
  (`envsenscons1`) and not ENVSENSCONS2, every version-2 household the reverse, with no
  blank in a household's own-version variable. The duration and feedback fills are
  asserted against the PDF's own fill notation code by code.

  WHO ANSWERED. The consent was in the HOUSEHOLD questionnaire, answered once per
  household. The persona is the person the household file records as answering the
  household questions (`q_ivh1`..`q_ivh16`; exactly one per household, never a
  non-member), read from their own individual interview (`q_indresp_ip`, joined on
  household and person number). Households whose household-questions respondent gave no
  individual interview have no persona and are NOT built: 7 answered households in this
  mode (declared; `--check` fails if it changes). One row per household, so `person` is
  also the household.

  THE CONDITION (module household_ip17, ENVSENSINTRO then ENVSENSCONS1 or ENVSENSCONS2,
  pp. 190-194). Every household first saw the introduction ENVSENSINTRO ("We know the
  conditions in our homes can ..."), then the consent text of its version with its
  duration and feedback fills resolved. Version 1 carries the full "If you agree:" list
  of eight bullets; version 2 carries one sentence, "If you agree, we will send ...",
  with the other seven bullets in help text. The two versions' wordings also differ
  where the questionnaire differs ("collect these data" / "collect this data"; in the
  question "address, telephone number" / "address telephone number"). Both transcribed
  as fielded.

  WORD-FOR-WORD VS OURS. Inside the double quotes, every word is the questionnaire's,
  typography normalised (curly quotes straightened; en dashes, the pound sign and the
  source's "- " bullet markers kept). ADDED BY US (narration and the layout exception,
  docs/CONVENTIONS.md): "The interviewer read out this text:" before the introduction
  and "The interviewer then read out this text:" before the consent text. Narration of
  reading out follows the face-to-face precedent of `ukds_6849_hmrc_consent_w15` (the
  questionnaire gives no showcard). The interviewer instruction "PLEASE HAND LEAFLET
  IN-HOME SENSORS TO RESPONDENT AND ALLOW RESPONDENT TIME TO READ IT AND ASK QUESTIONS."
  is not narrated (the same precedent): whether the leaflet was handed over is not
  recorded per household. In version 2 the help text was in the interviewer's script,
  not in front of the respondent; whether an interviewer read any of it out is not
  recorded, so nothing is said about it. The face-to-face leaflet sentence names the
  leaflet: 'Please read this leaflet on "In-Home Sensors" for further information.'

  ONE OUTCOME. The version's own question with its duration fill, word-for-word: "Do you
  give permission for us to pass your name, address[,] telephone number, and email
  address to the University of Glasgow so they can send you a sensor to place in your
  home for up to ...?" 1 "Yes" 2 "No", read from the version's own variable. Don't know
  and refusal dropped.

  NOT BUILT. CATI (telephone) households: the module is face-to-face and web only; the
  User Guide documents that CATI households allocated to version 2 were asked
  ENVSENSCONS2 in error (34 asked, 31 answered), while version-1 CATI households were
  correctly not asked, so a CATI arm would exist for one version only, and the
  face-to-face text (handing a leaflet) was not what a telephone respondent met. 1 web
  household with no allocation on `q_hhsamp_ip` that was asked version 1 (its fills
  cannot be known). The 156 households whose data were lost (User Guide, `q_ivfho`
  17/39) are not in `q_hhresp_ip` at all. The debrief questions (ESENSDEBRY /
  ESENSDEBRN): code-all-that- apply lists whose universe and options follow the
  respondent's own consent answer (ledger 132, 142). The Technical Report records no
  other script error touching this module; its two data issues (the CAWI-CAPI grid
  overwrite, the missing health-condition feed-forward) do not.

  ROW COUNTS (aggregates). By condition_num (0 = info 1, duration 1, feedback 1, 1 =
  info 1, duration 1, feedback 2, ... info slowest, then duration, then feedback): 0 27,
  1 29, 2 13, 3 14, 4 12, 5 11, 6 12, 7 12, 8 15, 9 13, 10 29, 11 27, 12 16, 13 8, 14
  15, 15 20, 16 19, 17 13, 18 15, 19 19. Version 1 158, version 2 181; 339 rows, one per
  household.

  PERSONA. The same spine as every Innovation Panel build, from the household-questions
  respondent's own individual interview. `person` is a hash of `pidp`. A
  participant-level split is a household-level split here.

