      factors: {information: "full_in_question", duration: "6_months", feedback: "promised"}
      text: "The interviewer read out this text: \"We know the conditions in our homes can be different according to where we live, even in different homes in the same street. The air can contain different levels of certain gases (such as carbon dioxide) and microscopic particles. These variations in air quality, as well as things like air temperature, humidity, noise levels and light levels, may affect our physical health, and how we feel – and might affect different people in different ways.\" The interviewer then read out this text: \"To understand how conditions inside people's homes vary, we would like to invite some households to place a sensor in their home for a period of time. The sensor will record things about indoor conditions such as air temperature, humidity, noise levels (but not actual sounds), light levels, and the presence of certain gases and microscopic particles in the air. Information collected by these sensors would be linked to the answers you have given in this study. The sensor will be in your home for up to 6 months, and the team will contact you to arrange its return when it is time to do so. A personalised report giving a summary comparing the conditions in your home to the average home will be sent to you once we have analysed the data. Once you have returned the sensor, you will receive £20 as a thank you. If you agree: - We will send your name, address, telephone number, and – if you have provided it – email address to researchers at the University of Glasgow, who are partnering with Understanding Society to collect these data using sensors. - The University of Glasgow researchers will send you a sensor with simple instructions on how to use it. - The sensor will just need to be plugged in and left in a room until it is time to return it. You will not need to do anything with it until it is time to send it back. - When it is time to return the sensor, the University of Glasgow will contact you to arrange returning it via a courier service that they will pay for. - You will be asked to complete a short questionnaire about where the sensor was located while it was in your home and your experiences with this task. - Data from the sensor will be passed back to Understanding Society and connected to the answers you have given in this study. - We will make the combined anonymous data available for academic and policy research purposes only. - Access to the data will be restricted and controlled, to make sure that researchers use the information responsibly and safely. The number of sensors available for this study is limited, so not everyone who agrees to have a sensor will be sent one. It may also be that those who are happy to help with this part of the research may have to wait until later in the year for a sensor to be available. Please read this leaflet on \"In-Home Sensors\" for further information.\""
