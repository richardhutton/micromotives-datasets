study_id: researchbox2057
source: researchbox
experiment: study2a
title: Six products, two options or a third (a compromise or a decoy), made to choose or free to look
  for other options (Study 2a)
data_file: researchbox2057_study2a.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/2057 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy https://zenodo.org/records/21935325. Read
  19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: '"A Reexamination of the Effect of Forced Choice", ResearchBox 2057 (https://researchbox.org/2057),
  anonymous author, no paper named in the box. Study 2a.


  GENERATED by scripts/gen_researchbox2057.py; every judgement is in its docstring. 2 x 2 between people:
  made to choose or offered a no-choice option; two options, or a third (a compromise option for camera,
  CD player and barbecue, a dominated decoy for microwave, cassette player and binoculars). Six problems
  each. Problem order random and not recorded, so each row carries its own problem only. 801 people, all
  kept (AsPredicted #168970: ''I will not exclude any data''); sample: Prolific (the survey records Prolific
  fields), country not stated. The forced and no-choice pages of a problem show the same lead and table;
  the manipulation is in the answer options, so it is in each arm''s outcome question (factor `choice`,
  carried on every arm, is not a condition factor here because the condition text does not express it;
  both arms of a problem declare the shared text).


  Wording from Study 2a - Materials.qsf (the blocks the survey flow reaches), word-for-word; no picture,
  script or piped text in it. Tables are one line per row, cells joined by " | ". Typography normalised.
  Added words (ours): the options'' enumeration after each question, ''1 means "..."; 2 means "..."''.
  Each answer is coded to its option''s position on screen. Persona: age (years) and gender, labels from
  the .qsf''s own choices.'
