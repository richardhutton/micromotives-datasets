      6:
        outcome_question: To what extent do you experience each of the following feelings when thinking
          about political candidates who do not currently identify with a religion? Anxiety
      7:
        outcome_question: To what extent do you experience each of the following feelings when thinking
          about political candidates who do not currently identify with a religion? Anger
      8:
        outcome_question: On a scale from 0 to 10 where 0 means "not at all supportive" and 10 means "very
          supportive," how supportive or unsupportive do you think political candidates who do not currently
