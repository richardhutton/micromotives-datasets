          there is a God. Please rate political candidates who are not sure there is a God using something
          we call the feeling thermometer. Ratings between 51 degrees and 100 degrees mean that you feel
          favorable and warm toward political candidates who are not sure there is a God. Ratings between
          0 degrees and 49 degrees mean that you don't feel favorable toward them and that you don't care
          too much for them. You would rate political candidates who are not sure there is a God at the
          50 degree mark if you don't feel particularly warm or cold toward them. Please click on the
          rating that best matches your feelings.
      1:
        outcome_question: How strongly do you agree or disagree with each of the following statements
          about political candidates who are not sure there is a God. Political candidates who are not
          sure there is a God pose challenges to people like me.
      2:
        outcome_question: How strongly do you agree or disagree with each of the following statements
          about political candidates who are not sure there is a God. Political candidates who are not
          sure there is a God pose problems for people like me.
      3:
        outcome_question: How strongly do you agree or disagree with each of the following statements
          about political candidates who are not sure there is a God. Political candidates who are not
          sure there is a God promote values that are seen as immoral by people like me.
      4:
        outcome_question: How strongly do you agree or disagree with each of the following statements
          about political candidates who are not sure there is a God. Political candidates who are not
          sure there is a God promote values that go against the values of people like me.
      5:
        outcome_question: To what extent do you experience each of the following feelings when thinking
          about political candidates who are not sure there is a God? Moral disgust
      6:
        outcome_question: To what extent do you experience each of the following feelings when thinking
          about political candidates who are not sure there is a God? Anxiety
      7:
        outcome_question: To what extent do you experience each of the following feelings when thinking
          about political candidates who are not sure there is a God? Anger
      8:
        outcome_question: On a scale from 0 to 10 where 0 means "not at all supportive" and 10 means "very
          supportive," how supportive or unsupportive do you think political candidates who are not sure
          there is a God are toward religion in the public sphere?
      9:
        outcome_question: The following scale represents different political views, from "extremely liberal"
          to "extremely conservative." Where you would place political candidates who are not sure there
          is a God on this scale?
      10:
        outcome_question: On a scale from 0 ("not at all trustworthy") to 10 ("very trustworthy"), how
          trustworthy or untrustworthy would you say political candidates who are not sure there is a
          God are?
  - raw: 3
