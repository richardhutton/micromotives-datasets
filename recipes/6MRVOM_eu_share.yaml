persona_missing:
  age: [-9, -8]
  profile_gender: [8, 9]
  # 19 "Don't know", 20 "Prefer not to say". 98/99 sentinels declared, never occur.
  profile_education_level: [19, 20, 98, 99]
  # 7 "Can't remember" is a non-answer, blanked. 6 "Still at school/Full time
  # student" is a real answer and is kept.
  profile_education_age: [7, 8, 9]
  # 16 "Prefer not to say". 98/99 sentinels declared, never occur.
  profile_ethnicity: [16, 98, 99]
  # 13 "Non UK & Invalid" only. 12 "Northern Ireland" is a REAL region and is
  # kept — see notes (this deposit happens to have zero NI respondents, which
  # is exactly the condition under which a wrong declaration would go
  # unnoticed, so it was resolved against the file's own value labels).
  profile_GOR: [13, 98, 99]
  # 8 "Other" is a real answer and is kept; only the sentinels go.
  profile_work_stat: [98, 99]
  socialgrade: [8, 9]
  polAttention: [98, 99]
  # 99 "Don't know" is a non-answer, blanked. 998/999 sentinels declared,
  # never occur; respondents who did not vote in 2015 are plain system-missing
  # and are already left blank with no code needed.
  pastvote_2015: [99, 998, 999]
