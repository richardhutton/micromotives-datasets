outcomes:
- var: overall
  task_num: 0
  question: How would you rate this restaurant? Report only the rating for "Overall".
  scale:
    min: 1
    max: 10
- var: go_again
  task_num: 1
  question: How likely would you be to go to this restaurant again?
  scale:
    min: 1
    max: 9
    min_label: Not at all likely
    max_label: Extremely likely
- var: recommend
  task_num: 2
  question: How likely would you be to recommend a friend to go to this restaurant?
  scale:
    min: 1
    max: 9
    min_label: Would definitely not recommend
    max_label: Would definitely recommend
