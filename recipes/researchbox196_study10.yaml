notes: 'Mehr KS, Simmons JP (2024), "How Does Rating Specific Features of an Experience Alter Consumers''
  Overall Evaluations of That Experience?", Journal of Consumer Research 51(4):739-760, doi:10.1093/jcr/ucae005.
  ResearchBox 196 (https://researchbox.org/196).


  GENERATED by scripts/gen_researchbox196.py; every judgement is in its docstring. Study 10 (AsPredicted
  #85954), 1,991 people kept by the authors'' R script''s exclusions. One of two subpar restaurant scenarios
  (undercooked food; cold food the waiter will not take back) x the rating question''s rows (Overall only,
  or Overall, Food, Service, Ambiance and Value in that fixed order), between people; scenario and rating
  on one page. Next page: the scenario again (''On the previous page, you read the following scenario:'',
  not repeated in the row) and how likely you would be to go again and to recommend a friend (1-9, end
  labels only). Those rows narrate the rating question as asked. 10 stars.


  Wording from Study 10.(file id 194).qsf (the blocks the survey flow reaches), word-for-word: the scenario
  is the condition, the rating question the outcome. Typography normalised (HTML, non-breaking spaces,
  curly quotes); emphasis dropped. Added words (ours): ''Beneath the scenario was the rating question
  below, with one row of stars, labelled "Overall".''; ''Beneath the scenario was the rating question
  below, with a row of stars labelled "Overall" and, beneath it, rows labelled "Food", "Service", "Ambiance"
  and "Value".''; ''You were asked "How would you rate this restaurant?", with one row of stars, labelled
  "Overall".''; ''You were asked "How would you rate this restaurant?", with a row of stars labelled "Overall"
  and, beneath it, rows labelled "Food", "Service", "Ambiance" and "Value".''; and in each outcome, ''Report
  only the rating for "Overall".'' after the question. Data: Study 10.(file id 196).csv. Persona: age
  (years, as exported) and gender, labels from the .qsf''s own choices.'
