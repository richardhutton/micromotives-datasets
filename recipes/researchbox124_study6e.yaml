study_id: researchbox124
source: researchbox
experiment: study6e
title: 'Choices between gambles (coins, dice, cards): X against an option that lets you pick Y or Z, against
  Y or Z alone, all three side by side, and Y against Z; which do you prefer? (Study 6e)'
data_file: researchbox124_study6e.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/124 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy, record 21301841 (https://zenodo.org/records/21301841).
  Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Smith S & Spiller SA, "Undervaluation of Multi-Option Alternatives" (the box title; authors from
  AsPredicted #41630; no publication is named in the deposit). ResearchBox 124 (https://researchbox.org/124).


  GENERATED by scripts/gen_researchbox124.py; every judgement is in its docstring. 6E (AsPredicted #44164,
  2020), 176 of 298 finished kept by the authors'' rule (all three dominance checks right); 12 of them,
  who started on the first day before the flow set instructions = ''new'' (which picks the third instruction
  screen), are not built, as which version of that screen they read cannot be determined: 164 built. Incentivised
  choices between gambles, each a dollar amount and a way to win it by coins, dice or cards; one option
  may let the person pick between two ways to win (A or B). Per-person draws, recorded, decide which version
  of each set''s trials a person meets; every trial question is its own outcome naming its own arm column
  (a_<tag>), 344 questions over 316 distinct choice sets. All trials were in one block in a random order
  the deposit does not record, so no row names another, and the order of the options on screen was randomised
  and not recorded, so they are listed in the .qsf''s order. The trial screens carry no question text.
  Every row opens with the instruction screens word-for-word (without their INSTRUCTIONS headings and
  the line ''Click the arrow to continue reading the instructions.''); the comprehension questions, the
  three dominance checks and everything after the trials are not narrated. Added words (ours): ''(the
  options were shown in a random order)'' after the instructions; ''Option 1:'', ''Option 2:'', ''Option
  3:'' before each option; and, after the question, ''1 means "Option 1"; 2 means "Option 2".'' (with
  ''; 3 means "Option 3"'' for three options). The question, ''Choose whichever option you prefer.'',
  is transcribed from Instructions1 (''In each decision, you should choose whichever option you prefer.'');
  it is not on the trial screens. Codes are each option''s position in that list, mapped from the export''s
  values through the .qsf''s RecodeValues.


  Wording from UV_S6e.qsf (a 2026 copy of the fielded survey; every trial column of UVExp6erawdata.csv
  carries the ImportId of its .qsf question), word-for-word; no picture and no JavaScript in it. Typography
  normalised (HTML, non-breaking spaces, curly quotes). Data: the raw export (three header rows). Persona:
  age (a text box; 18-100 kept, else blank) and gender (the .qsf''s labels). US sample (MTurk); dollar
  stakes.'
condition:
  source_vars:
  - a_Q1a_X_YZ
  shared_context: 'In this study, you will be asked to make several decisions among two or three options.
    In each decision, you should choose whichever option you prefer. Each option will provide an opportunity
    to win money. The amount of money might differ between options and between decisions. Also, the probability
    of winning the money might differ between options and between decisions.


    In all decisions, the probability of winning the money will be determined by some combination of coin
    flips, dice rolls, and card draws.


    See below for additional information about each of these probabilistic events:


    - Coins: in all decisions, the coins are fair. That is, when the coin is flipped, there is a 50% chance
    that it lands on "heads" and a 50% chance that it lands on "tails."


    - Dice: in all decisions, the dice are fair and have 6 sides. That is, when the die is rolled, it
    is equally likely to land on each of the 6 sides (numbered 1, 2, 3, 4, 5, and 6).


    - Cards: in all decisions, the card draws will be fair draws from a standard 52-card deck. In a standard
    52-card deck, there are two colors and four suits. Half of the cards (26) are black and the other
    half of the cards (26) are red. Half of the black cards (13) are clubs and the other half of the black
    cards (13) are spades. Half of the red cards (13) are hearts and the other half of the red cards (13)
    are diamonds. Thus, there are 13 cards in each suit (clubs, spades, hearts, diamonds), and 26 cards
    in each color (black, red). The order of the cards is not relevant for today''s study.


    For example, a decision might look like this:


    Do you prefer:


    1 $5


    Flipping heads on one coin


    OR


    2 $20


    Flipping heads on two coins


    In this scenario, if you choose option 1, this means that if you flip heads on one coin, you would
    win $5, but if you flip tails on one coin, you wouldn''t win any money. If you choose option 2, this
    means that if you flip heads on two coins, you would win $20, but if you flip tails on both coins,
    or flip one coin to be heads and one coin to be tails, then you wouldn''t win any money.


    In all scenarios, the winning opportunity (for example, flipping heads on one coin) has to happen
    on the first try.


    Sometimes, you''ll have a choice within a single option. For example, a decision might look like this:


    Do you prefer:


    3 $5


    Flipping heads on one coin


    OR


    4 $20


    A) Flipping two heads on two coins


    B) Rolling a 1 or 2


    So, if you choose option 4, then you get to choose between A and B to try to win $20. You don''t get
    to try both A and B; you only get to try one of them. If you choose option 4, whether you try A or
    B is entirely up to you, but you can only try one of them and you have to choose before you flip a
    coin or roll a die.


    In all scenarios, the winning opportunity (for example, flipping a coin and getting "heads") has to
    happen on the first try.


    Please take these decisions seriously. At the end of the study, we will randomly select five participants
    in a lottery. If you are selected, we will randomly choose one of your decisions and you will receive
    the outcome of your choice. Treat every decision like it is the only one that matters. You will make
    the same number of decisions, regardless of what you choose.


    (the options were shown in a random order)'
