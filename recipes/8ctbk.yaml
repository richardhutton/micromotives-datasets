  THE DESIGN — a paired forced-choice conjoint, 5 pairs per respondent, two
  measures per pair

  Q 27 / PG 784 (identical paragraph, both files): "In the paired forced-choice
  conjoint survey experiment, respondents view a pair of two life situations
  comprising randomly varied attributes representing: (1) number of children;
  (2) time intensity of career; (3) division of care in the family; (4) family
  policy; (5) financial stability; and (6) marital status. Respondents are
  required to choose which of the two scenarios they prefer in order to
  advance. After choosing between the two scenarios, respondents are asked to
  give each of the two scenarios a numeric rating (from 0 to 10) of how
  desirable they would consider that scenario. In total, respondents will
  evaluate five pairs of scenarios. As an attention check, after completing
  these tasks, respondents are asked whether the scenarios they evaluated
  contained information about child gender."

  So each respondent sees 5 pairs x 2 "life situations" = 10 profiles, each
  built from 6 independently-varying attributes, PLUS a 6th pair (Q11) that
  repeats pair 1 with the two profiles' on-screen positions swapped, as a
  robustness check (PG 877-884, verbatim: "THIS QUESTION IS A ROBUSTNESS CHECK
  WHERE RESPONDENTS ARE SHOWN THE SAME TWO LIFE SITUATIONS THERE WERE SHOWN IN
  QUESTION 1, WITH THE LEFT AND RIGHT COLUMNS SWITCHED ... WE ONLY WILL DO THIS
  ROBUSTNESS CHECK FOR QUESTION 1"). Confirmed empirically (SAV): LS11A1..A6
  equal LS2A1..A6 for all 1,794 respondents, and LS12A1..A6 equal LS1A1..A6 for
  all 1,794 — exact, 0 mismatches either way.

  Two distinct measures per pair, on TWO distinct manipulations (same pair of
  profiles, different task):
    (a) a FORCED CHOICE between the two profiles (Q1, Q3, Q5, Q7, Q9, plus the
        Q11 swap) — response is nominal, which profile was preferred;
    (b) a DESIRABILITY RATING of each profile separately, 0-10 (Q2_1/Q2_2,
        Q4_1/Q4_2, Q6_1/Q6_2, Q8_1/Q8_2, Q10_1/Q10_2 — CB: "Desirability_LS1"
        .. "Desirability_LS10").

  THIS RECIPE BUILDS (b) ONLY — the desirability ratings, 10 outcomes, one
  profile per outcome. (a) is NOT built; see SCOPE below for why, in detail.
  `experiment: desirability` names this sub-experiment explicitly, per
  CONVENTIONS.md ("one recipe per sub-experiment"); the forced-choice task is a
  second sub-experiment of the same deposit, owed.


