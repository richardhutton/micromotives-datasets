  THE EXCLUSION RULE (Q 73, PG 830) — which division-of-care levels are valid
  with which childbearing/marital combination:

    "First, if respondents are assigned option 1a (zero children) they should
    only be assigned options 3d-3f for attribute 3. Second, if respondents are
    assigned options 1b-1e (1-4 children), they should only be assigned
    options 3a-3c for attribute 3. Third, if respondents are assigned option
    6b (single) they should only be assigned options 3b or 3e for attribute 3."

  Table 2 itself (the visual cross-reference, Q 75-77) did not survive text
  extraction (it is a table image/graphic), so the rule is taken from the
  prose above, which fully specifies it, and VERIFIED EXHAUSTIVELY against the
  data rather than trusted on the prose alone: for every one of the 1,794 x 12
  = 21,528 (respondent, life-situation) profile draws (LS1..LS12), the
  programmatically-derived allowed set
    allowed = {4,5,6} if childbearing==1 else {1,2,3}; if marital==2: allowed &= {2,5}
  was checked against the actual division-of-care code. 0 violations. This
  both confirms the exclusion rule is read correctly and confirms LS1-LS12 are
  the live conjoint-assignment columns (not, say, some other unused design
  variable).

  Two attribute options are read as "[LEAVE BLANK]"/no-op by this rule: family
  policy level 3 (above) is UNRELATED to the exclusion rule — it is a
  legitimate, always-available third level ("no stated policy"), not a
  disallowed combination. The exclusion rule only concerns division-of-care
  (attribute 3) vs. childbearing (attribute 1) and marital status (attribute 6).


  THE CONJOINT UNIVERSE AND WHICH ARMS ARE DECLARED

  Full crossing of the five unconstrained attributes (childbearing 5 x career
  4 x policy 3 x financial 3 x marital 3), with division-of-care's allowed set
  determined by (childbearing, marital) per the exclusion rule above, gives a
  THEORETICAL valid universe of 1,260 distinct profiles (computed: for each of
  the 5x3=15 (childbearing, marital) pairs, the allowed division set has either
  1 or 3 members per the rule above, summing to 7 per childbearing level x 4
  career x 3 policy x 3 financial = 252 per childbearing level x 5 = 1,260).

  This recipe declares only the subset of that universe that ACTUALLY APPEARS
  in LS1 through LS10 across all 1,794 respondents — **1,146 of the 1,260**
  theoretically-valid profiles — rather than the full 1,260. Declaring the full
  theoretical universe was tried first and produces 114 "declared arms with no
  rows" QC warnings (rule 2); declaring only the observed set is zero-warning
  and loses nothing, because:
    - every one of the 1,146 declared combinations was independently checked
      against the exclusion rule (0 violations, see above), so this is not a
      looser or different design than the declared universe, only a subset of
      it that happens to be everything actually drawn;
    - the text-composition RULE (attribute code -> level text, see THE
      ATTRIBUTES above) is the same declared, deterministic mapping either
      way — generating from the full 1,260-cell universe or from the observed
      1,146 is mechanical in both cases, not a judgment call; the observed set
      was read directly off LS1A1..LS10A6 (pyreadstat), sorted
      lexicographically by (childbearing, career, division, policy, financial,
      marital), and condition_num assigned 0..1,145 in that sorted order — a
      DECLARED, reproducible ordering (CONVENTIONS rule 2), not an artefact of
      iteration order;
    - if a future respondent in an extended fielding drew one of the 114
      unobserved-but-valid combinations, that row would currently fail to
      match any declared arm and be silently dropped (`build.py`'s `arm_for`
      returns `arms.get(...)` with no match -> None -> skipped) rather than
      raising. This is the one real cost of the observed-only choice, flagged
      for the checker; it does not affect THIS build, which is closed over a
      fixed, final data file.


  ARM TEXT RENDERING — judgement, not evidenced beyond the two example
  screenshots

  IMG image3.png / image7.png (the actual rendered Q1 and Q2 screens) show
  each life situation as a NUMBERED LIST of its 6 attribute bullets (e.g. "1
  You have four children", "2 Your household struggles...", "6 -"), headed
  "Life situation 1" / "Life situation 2" (image3) or, on the rating screen,
  the SAME profiles re-labelled "Scenario 1" / "Scenario 2" (image6). This
  recipe renders each arm as the 6-line numbered list ("1. {text}" .. "6.
  {text}"), WITHOUT a "Life situation N" / "Scenario N" header — see SCOPE /
  JUDGEMENT CALLS below for why (it is a position reference, same class as the
  ruling in CONVENTIONS "Sequence signposting", and QC rule 15's own regex
  would flag it: "situation" + digit and "scenario" + digit are both in its
  pattern).

  CRITICAL LIMITATION, flagged prominently: the two example screenshots show
  attribute bullets in DIFFERENT orders from each other and from Table 1's own
  listing order (image3's Life situation 1 is ordered childbearing, financial,
  career, marital, division, policy — not 1-2-3-4-5-6). This is not a
  rendering accident: PG 854 states "the order in which attributes are
  presented should be randomly varied between respondents, though should
  remain constant within respondents" and SAV carries six per-respondent order
  variables (Attribute1_Order_ChildBearing .. Attribute6_Order_MaritalStatus)
  that are, for every one of 1,794 respondents, a genuine permutation of 1-6
  (checked programmatically: 100% of rows have {1,2,3,4,5,6} across the six
  columns). So the literal on-screen bullet SEQUENCE varies by respondent,
  while the CONTENT (which 6 statements appear) does not.

  This recipe renders every arm's 6 bullets in the FIXED CANONICAL order
  matching Table 1 / the LSnA1..A6 column order (childbearing, career,
  division, policy, financial, marital) for EVERY respondent, not the
  respondent's own randomized screen order. Reasons:
    - attribute order is not one of the six declared experimental factors (it
      is a counterbalancing nuisance variable to guard against primacy
      effects contaminating the ATTRIBUTE-level estimates, not a condition
      under study in its own right);
    - the information content is identical regardless of order;
    - the schema's Arm.text is ONE string per declared condition_num, shared
      across every respondent who drew that arm; rendering the true
      per-respondent order would require crossing the 1,146-cell content
      universe with up to 720 order permutations, which is not tractable and
      is the same class of problem as the forced-choice task's combinatorics
      (see SCOPE).
  This is the same shape as ledger #27 (b87sm's SMARTPHONE=2 clause: "the
  recipe cannot vary stimulus text by respondent... clause omitted for
  everyone") — here the recipe cannot vary stimulus ORDER by respondent, so it
  renders one fixed, declared order for everyone. Flagged as the single
  judgement call in this recipe I am least sure about; see JUDGEMENT CALLS.


  WORDING: Q1/Q2 TEXT vs. THE SCREENSHOT

  The screenshot (image3.png) reads "(1/6) Which of these two life situations
  would you personally prefer? Please click on the option you prefer" and
  image6.png reads "How a scale of 1 to 10 how desirable would you personally
  find each of the two scenarios? (1= Not desirable at all and 10= Very
  desirable)" — both captioned illustrative examples, and both disagree with
  the fielded Q/PG text in ways that look like an earlier draft: "(1/6)" is a
  progress counter (a sequence self-reference, dropped per the ruling above
  regardless); "please click" vs Q's "Please select"; and critically the
  screenshot's scale reads "1 to 10" while Q's own text says "0 to 10" and the
  SAV value labels confirm 0 is a real, used code ("0 - Not desirable at all",
  n=... see ROW ARITHMETIC). This recipe follows Q's literal text (0-10, matching
  the data) and treats the screenshots as evidence of LAYOUT ONLY (list
  formatting, per-respondent order, the "-" blank placeholder), not of final
  wording — consistent with CONVENTIONS' preference for the fielded
  questionnaire as the wording authority. The two screenshots agree with each
  other and with Q on everything that is not wording (numbered-list format,
  two-profile side-by-side framing, blank-as-dash).


  OUTCOME TEXT — no per-field disambiguation sentence needed, unlike cug34

  Q2 (Q 88-91): "On a scale of 0 to 10, how desirable would you personally
  find each of the two life situations that you just decided between? Please
  choose a response for each life situation." PG 863: "LABEL VERTICAL SCALE
  WITH 0=not desirable at all and 10 = very desirable" — matches SAV's value
  labels for Q2_1/Q2_2/Q4_1.../Q10_2 exactly ("0 - Not desirable at all" ..
  "10 - Very desirable"), checked for all ten.

  CONVENTIONS' "one stem, several labelled answer fields" rule (used by
  `cug34`) exists for screens where ONE shared stimulus produces two
  differently-labelled numbers and only the FIELD disambiguates which is
  which. That is not this case: here the CONDITION ITSELF already differs
  between, e.g., task 0 (LS1's 6 attributes) and task 1 (LS2's 6 attributes) —
  every row's condition text already names the one profile being rated, so no
  added sentence is needed to say which profile a response is "for". The Q2
  question text is therefore used VERBATIM, including "each of the two life
  situations that you just decided between" (literally true — the respondent
  did just choose between two — even though this row's condition shows only
  the one being rated here). Using the literal field label ("Life situation
  N" / "Scenario N") the way cug34 used "Shared Account" / "Individual
  Account" was considered and rejected: that phrase is a position reference
  (QC rule 15's own pattern: "situation"/"scenario" + digit) and is also
  unnecessary for disambiguation here, for the reason just given.


  SCOPE — the forced-choice task (Q1, Q3, Q5, Q7, Q9, Q11) is NOT built

  Two independent reasons, either one sufficient on its own:

  1. SCHEMA WIDTH. `Recipe._check` requires every outcome's
     `condition_vars_for()` to have the SAME LENGTH as
     `len(condition.variables)` (recipe.py: "the arms are keyed by {width}
     ... the key would never match"), and that width is fixed ONCE per
     recipe via `condition.source_vars`. The desirability task's natural key
     is 6 variables (one profile's attributes: LSnA1..A6). The forced-choice
     task's natural key is 12 variables (BOTH profiles' attributes, since the
     stimulus shown and compared is the PAIR, not either profile alone — a
     respondent chooses between two full profiles, so "what they were shown"
     for that row is both). 6 != 12, so the two tasks cannot share one
     `condition.arms` list and cannot live in one recipe. This is the same
     constraint that forces `rpw4u`'s ~15 sub-experiments and `a5v96`'s two
     vignettes into separate recipe files — here it is forced within a SINGLE
     deposit's two measures of the SAME five pairs.

  2. SCALE, even in a separate recipe. A `8ctbk_choice.yaml` with
     `condition.source_vars` = 12 variables (6 per profile) is schema-legal,
     but the PAIRS compared are two INDEPENDENTLY drawn profiles from the
     1,146/1,260-cell universe, so the realized (profile-A, profile-B) pairs
     are overwhelmingly distinct across (respondent x task): up to
     1,794 x 6 = 10,764 choice events (5 pairs + the Q11 swap), each needing
     its OWN declared 12-variable arm with fully composed two-profile text.
     Unlike the single-profile universe (1,260 theoretical / 1,146 observed —
     tractable, and what this recipe declares), the paired universe does not
     collapse to a small reusable set: most pairs occur once. Enumerating on
     that order of magnitude is mechanically possible (same deterministic
     text-composition rule) but would produce a recipe file roughly an order
     of magnitude larger than this one's 1,146-arm, ~13,750-line block,
     undermining CONVENTIONS' "recipe reviewed as a text file" and
     "declared, never inferred" as a HUMAN-REVIEWABLE declaration (an
     arms list this size is only mechanically checkable, not actually read).

  Logged as owed, not forced — matching precedent (`rpw4u`'s ~14 other
  sub-experiments, `a5v96`'s second vignette, `z358z`'s Q1/Q2, `b87sm`'s
  slots 2-8 before `Outcome.condition_var` existed). An unbuilt item is a
  debt; a wrongly built one is a defect.

  Also out of scope, and not a loss of anything expressible: Q12 (attention
  check — "which statement about child gender is correct", not a response to
  any experimental manipulation) and Q13 (respondent's actual number of
  children — considered for persona and rejected, see JUDGEMENT CALLS).


