  `comparable_to_socsci210: false` remains correct at the CONDITION level:
  their `condition_num` (0-5) is a PAIR-POSITION bucket, not a conjoint
  profile — condition 0 holds pair 1's choice-and-both-ratings for every
  respondent regardless of which of the 1,146 profiles that respondent's
  pair 1 actually was (confirmed: `min(stimuli)` for a given condition_num
  shows ONE specific respondent's actual drawn text, and
  `rows_per_condition` = {0: 5283, 1: 5276, 2: 5291, 3: 5288, 4: 5296,
  5: 1794}, i.e. ~3 sub-items/respondent per pair-position minus that pair's
  own refusals, not 1,146-way profile structure). This is the same
  position-not-manipulation shape already documented for `b87sm` — their
  per-row stimulus TEXT does appear to be the respondent's own true draw
  (unlike b87sm, which hard-coded one fixed vignette for every "condition"),
  but the condition_num groups by SCREEN POSITION, so a condition-by-
  condition crosscheck would compare apples to nothing — confirmed, not
  assumed, which is why `mmds crosscheck` SKIPs rather than running a
  per-condition diff. The TASK-level check above is what actually verifies
  the build, and it is exact.


  PERSONA

  Standard AmeriSpeak preloads, read directly off SAV (CB confirms var names
  match: PartyID7, IDEO, RELIG, ATTEND, GENDER, AGE, AGE4, AGE7, RACETHNICITY,
  EDUC5, MARITAL, EMPLOY, INCOME, INCOME4, INCOME9, REGION4, REGION9, METRO,
  INTERNET, HOUSING, HOME_TYPE, PHONESERVICE, HHSIZE). All respondents are
  GENDER=2 (Female, SAV: 1,794/1,794) — consistent with the eligibility
  screen (PG 428, "[IF GENDER2=1, TERMINATE AND SET QUAL=2]", women only).

  Mapped the single richest (least-banded) variable per construct, matching
  dh3nj's precedent for the same AmeriSpeak panel family: `age` from raw AGE
  (years, 18-35, not AGE4/AGE7's bands), `income` from the 18-band INCOME (not
  INCOME4/INCOME9's coarser derivatives), `party_id` from PartyID7 (not
  PartyID5), `region` from REGION4 (not REGION9) — matching the corpus
  convention already set by dh3nj for comparability across AmeriSpeak-sourced
  studies, since the persona crosswalk keys off the variable the recipe
  DECLARES (ledger finding on crosswalk design), not the most granular one in
  the abstract.

  Added beyond dh3nj's field set, since available here and not there:
  `housing_ownership` (HOUSING) and `phone_service` (PHONESERVICE) — both
  present in this deposit's standard preloads and previously unmapped only
  because dh3nj's own source lacked them, not because of any project rule
  against them.

  `religious_attendance` (ATTEND) has no named field on the Persona model, so
  it is mapped into `extra` (persona_map accepts any field name; unrecognised
  names fall through to `Persona.extra`, per schema.py / build.py's
  `_persona` function). Declared sentinel codes for it even though only code
  98 occurs in this file (6 respondents), because 77/99 ARE part of the
  variable's own declared scheme (SAV value labels) and the Q13-adjacent
  argument that "accurate even if unused" applies here too.

  PERSONA_MISSING declared, checked against SAV value counts (not assumed):
    PartyID7: -1 "Unknown", n=13
    PartyID5: -1 "Unknown" (not mapped — redundant coarsening of PartyID7, see
      above; the sentinel is noted for completeness only)
    IDEO: -1 "Unknown", n=55
    RELIG: 77/98/99 (DON'T KNOW/SKIPPED ON WEB/REFUSED) — only 98 occurs, n=12
    ATTEND: 77/98/99 — only 98 occurs, n=6
    GENDER: 0 "Unknown" — 0 occurrences in this file (every respondent is
      GENDER=2), declared anyway because it is the variable's own documented
      sentinel (SAV value label), not because any row needs it.

  Q13 ("How many children do you have?") was CONSIDERED for persona (it is a
  real respondent attribute, thematically central to the study, and would
  have been a strong signal) and REJECTED: unlike the standard preloads above,
  it is a substantive question administered AFTER all ten conjoint tasks
  (Q 115-125), not a panel preload collected before the experiment. Including
  a post-task response as "who the respondent is" risks reading as
  outcome-adjacent (a study about childbearing preferences asking actual
  parity right after), and no other recipe in this corpus has used an
  in-survey post-task item as persona. Left out; flagged for the checker in
  case this judgement should go the other way.


  THE UNDECLARED-ASSIGNMENT SCREENS

  Declared in `condition.considered_and_rejected` below, with the accurate
  reason in each case (checked against the dry-run build's actual warnings,
  not guessed preemptively):
    - Attribute1_Order_ChildBearing .. Attribute6_Order_MaritalStatus: the
      per-respondent bullet-order permutation discussed above — balanced,
      fully crossed with nothing (it is layout, not content), not a
      declared factor.
    - LS11A1..A6, LS12A1..A6: deterministic copies of LS2/LS1 (0 mismatches
      over all 1,794), used only by the Q11 robustness swap — part of the
      undeclared forced-choice sub-experiment, not this one.
    - Q1, Q3, Q5, Q7, Q9, Q11 (the forced-choice/robustness responses), Q12
      (attention check), Q13 (parity, considered above): all out of scope for
      this recipe, not assignment variables for the desirability task.
    - CBCVersion: Sawtooth's internal profile-generation block id (300 blocks
      of ~6 respondents each, SAV: 1,794/300=5.98) — a delivery/balancing
      artefact of HOW the LSnAk values were generated, not an independent
      manipulation; the LSnAk columns it produced are what this recipe
      declares directly.


  JUDGEMENT CALLS FOR THE CHECKER, IN ORDER OF HOW UNSURE I AM

   1. ATTRIBUTE ORDER (least sure). Rendering every arm in fixed canonical
      order (childbearing, career, division, policy, financial, marital)
      rather than each respondent's own randomized screen order. I believe
      this is right because order is layout/counterbalancing, not a declared
      factor, and the schema cannot cheaply express a per-respondent order
      crossed with a 1,146-cell content universe — but it is the one place
      this recipe knowingly renders something slightly different from what a
      specific respondent actually saw (same information, different
      sequence), and I'd like a second opinion on whether that crosses the
      "never fabricate" line or sits safely on the layout side of it (per the
      `evnyh` precedent).
   2. DECLARING ONLY THE OBSERVED 1,146 OF 1,260 theoretically-valid
      combinations, to keep QC at zero warnings (rule 2 otherwise fires 114
      "declared arms with no rows"). I believe this is sound (see THE
      CONJOINT UNIVERSE above) but it is a real choice between two legitimate
      options, not a forced one.
   3. OMITTING THE FORCED-CHOICE TASK ENTIRELY rather than attempting a
      second, much larger recipe. I am confident the SCHEMA WIDTH reason (1)
      is a hard blocker for combining it with this recipe, less confident
      that the SCALE reason (2) is enough to defer the whole task rather than
      attempt `8ctbk_choice.yaml` now. Flagging it rather than deciding it
      finally.
   4. Q13 excluded from persona. Reasonable people could map it.
   5. No shared_context. There is no literal common lead-in sentence in Q/PG
      before the attribute list (the header "Life situation N" is the only
      candidate and is excluded as a position reference, see OUTCOME TEXT
      above) — `shared_context` is therefore left unset (None) rather than
      an invented transition sentence. Flagged only because every other
      conjoint-shaped recipe so far (b87sm) DID have a shared_context; this
      one genuinely does not, and that is a fact about this instrument, not
      an oversight.
   6. CBCVersion and the 60 LS11/LS12 columns are declared
      considered_and_rejected preemptively, by reasoning rather than
      confirmed empty on a dry run, because the design makes a positive
      argument. All others below (Order1-6, Q-series) are ALSO checked
      against the actual dry-run warnings before this recipe is finalised,
      per the build/verify step.


  QC WARNINGS — investigated, both explained, neither a recipe defect

  The dry-run build produces 0 failures, 2 warnings (confirmed after the
  undeclared-assignment entries above were added; no rule-9/11 warnings fire,
  confirming those entries silenced exactly what they claimed to):

   A. Rule 10 ("arms measured on far fewer outcomes than their peers"),
      against nearly all 1,146 arms, max tasks-per-arm = 6 of 10. Rule 10 was
      built (ledger #40) to catch a DECLARATION bug — an outcome variable
      missing for some arms, so those arms are silently asked fewer
      questions than their peers BY DESIGN ERROR. That is not what is
      happening here: all 10 outcome variables are declared uniformly and
      apply identically to every one of the 1,146 arms (there is no
      arm-specific override anywhere in this recipe). What rule 10 is
      actually detecting is COMBINATORIAL SPARSITY: with 1,146 declared
      profiles and only 10 task slots, each profile is independently
      re-drawn at random per slot (this is a conjoint, not a fixed small arm
      set reused symmetrically across items), so most profiles are observed
      in only a handful of the 10 slots purely by chance — exactly
      proportional to how many times each profile was drawn at all (observed
      per-condition row counts in the dry-run output range from 4 to 54; an
      arm drawn 4 times cannot possibly span more than 4 distinct task
      slots). This is the rule's own stated escape clause ("if the design is
      branched this is expected") applying to a design shape — a large
      profile-conjoint — that the rule was not written against; it is not a
      hidden instance of the bug the rule exists to catch. I have not
      modified `qc.py`: that is a corpus-wide, method-level change outside a
      single recipe's authority, and is flagged for the checker/maintainer
      rather than decided here.
   B. Rule 14 (persona values outside the canonical vocabulary):
      `education: "Some college/ associates degree"` (EDUC5 code 3, SAV's own
      spelling, including the stray space before "associates") and
      `ethnicity: "Asian-Pacific Islander, non-Hispanic"` (RACETHNICITY code
      6). Both are genuine, verbatim source labels (not a mapping error in
      this recipe) that are new SPELLINGS of concepts the crosswalk already
      has schemes for elsewhere in the corpus. Per the rule's own remedy
      ("re-run scripts/persona_harmonise.py for those fields") this is
      resolved by a corpus-wide harmonisation pass, which is out of scope for
      a single-study maker recipe (it re-derives the shared crosswalk JSON
      from every recipe's declared variable, not just this one, and calls an
      LLM judge) — flagged for the checker/maintainer rather than run here.
      Nothing is silently mis-described in the meantime: rule 14's own design
      is to pass the raw label THROUGH UNCHANGED rather than blank it, so no
      row is corrupted, only left pre-crosswalk.

