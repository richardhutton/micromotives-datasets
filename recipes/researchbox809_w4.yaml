notes: 'ResearchBox 809, "Periodic Corporate Donations" (https://researchbox.org/809), Zenodo record 21934081.
  The paper is not named in the box and was not read.


  GENERATED by scripts/gen_researchbox809.py; every judgement is in its docstring. W4. Addressing alternatives
  (AsPredicted #158321; Prolific, January 2024; US sample). 429 people kept by the authors'' .rmd (Status
  0, Finished 1, the recall check answered right for the arm). Between-person: one scenario each, assigned
  by the .qsf''s randomisers (condition; every recorded fill checked against the .qsf for every kept row).
  The row is every text screen from the scenario''s first screen to the reminder at the top of the measure
  page, word-for-word with its piped fields filled; the welcome screen, consent and id are dropped; bullets
  are written as lines starting ''- ''. The sacrifice, commitment, future donation likelihood, skepticism
  and impact blocks after the admire/favor/positive page are built (rich, 20 Nov 2026), shown in a block
  order the .qsf randomises and the deposit does not record: each row carries the scenario, that block''s
  own reminder and its own question only, with nothing narrated about the other blocks, as 5a''s two pages
  are. Matrix rows are one outcome each, the row''s label appended to the stem in double quotes (layout,
  ours), each column tied to its row by the authors'' codebook. A slider question is followed by one sentence
  of ours naming its only label, written word-for-word in these notes. The future-likelihood slider keeps
  its fielded range (0-100, whole numbers, no end labels); added words (ours), after its question: ''The
  answer was a slider from 0 to 100, labelled "Percent (%) likelihood".'' Not built: the recall check
  (attention, used only for the exclusion).


  Wording from W4. Addressing alternatives.qsf (the blocks the survey flow reaches). Typography normalised
  (HTML, non-breaking spaces, curly quotes); bold and underline dropped. Data: W4. Addressing alternatives.csv.
  Persona: age (years; outside 18-100 left blank) and gender (the .qsf''s labels; ''Prefer not to say''
  left blank). US sample, US dollars; invented companies.'
condition:
  source_vars:
  - condition
  factors:
  - schedule
  arms:
  - raw_values:
      condition: 1
    condition_num: 0
    factors:
      schedule: aggregate
    text: 'YNA Corporation is an American fashion retailer company that sells accessories, beauty products,
      and clothing for people of all ages, with over 700 stores across North America, Europe, and Asia.


      Hunger Donation


      Imagine that YNA Corporation recently pledged to donate a portion of their earnings to support ending
      World Hunger. This was their pledging statement:


      "YNA Corporation recognizes that we can use part of our earnings to do a significant amount of good
      to end world hunger. We pledge to donate a one-time donation of $720,000 in 2024 to international
      non-profit organizations that aim to create a hunger-free world."


      Reminder: YNA pledged to donate a one-time donation of $720,000 in 2024 to international non-profit
      organizations that aim to create a hunger-free world.'
  - raw_values:
      condition: 2
    condition_num: 1
    factors:
      schedule: periodic
    text: 'YNA Corporation is an American fashion retailer company that sells accessories, beauty products,
      and clothing for people of all ages, with over 700 stores across North America, Europe, and Asia.


      Hunger Donation


      Imagine that YNA Corporation recently pledged to donate a portion of their earnings to support ending
      World Hunger. This was their pledging statement:


      "YNA Corporation recognizes that we can use part of our earnings to do a significant amount of good
      to end world hunger. We pledge to donate $60,000 every month between January 2024 and December 2024
      to international non-profit organizations that aim to create a hunger-free world."


      Reminder: YNA pledged to donate $60,000 every month between January 2024 and December 2024 to international
      non-profit organizations that aim to create a hunger-free world.'
