    text: 'In this study, we will ask you for your thoughts and opinions about overdraft on checking accounts.
      When we say "overdraft," we mean:


      An overdraft occurs when you don''t have enough money for a transaction, but your bank or credit
      union pays it anyway.


      An overdraft is NOT when your bank moves money automatically from one of your accounts to another.


      Please read the description below carefully. Then, please tell us whether you think this customer
      should get overdraft when opening a new checking account.


      Personal background:

      - This person enters a {bank_type}.

      - {slack}

      - {purchase_purpose}

      - {alt_payment}


      Overdraft program:

      - The {bank_type.word}''s overdraft fee is ${fee_amount} per transaction.

      - The maximum number of overdraft fees is {number_of_fees} each day, or ${daily_cap}.'
    dimensions:
      fee_amount:
        var: fee_amount_1
        levels:
          0:
            level: $25
            text: '25'
          1:
            level: $35
            text: '35'
      number_of_fees:
        var: number_of_fees_1
        levels:
          0:
            level: 3_per_day
            text: '3'
          1:
            level: 6_per_day
            text: '6'
      slack:
        var: slack_1
        levels:
          0:
            level: month_to_month
            text: They make an average income and live in a high cost area, so they don't have much money
              left over at the end of the month.
          1:
            level: savings
            text: They make an average income and live in a low cost area, so they are able to save some
              money at the end of the month.
      purchase_purpose:
        var: purchase_purpose_1
        levels:
          0:
            level: discretionary
            text: They are not responsible for making important purchases (like car repairs and groceries)
              and leave that to others in the household. They use a debit card only for everyday purchases.
          1:
            level: critical
            text: They are responsible for making important purchases (like car repairs and groceries)
              and use the debit card for those purchases.
      alt_payment:
        var: alt_payment_1
        levels:
          0:
            level: 'no'
            text: They don't have other ways to pay if their debit card is declined.
          1:
            level: 'yes'
            text: They have other ways to pay if their debit card is declined.
      bank_type:
        var: bank_type_1
        levels:
          0:
            level: credit_union
            text: credit union
            parts:
              word: credit union
          1:
            level: bank
            text: bank
            parts:
              word: bank
      daily_cap:
        var: daily_cap_1
        levels:
          75:
            level: $75
            text: '75'
          105:
            level: $105
            text: '105'
          150:
            level: $150
            text: '150'
          210:
            level: $210
            text: '210'
