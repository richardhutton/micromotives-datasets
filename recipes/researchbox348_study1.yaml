study_id: researchbox348
source: researchbox
experiment: study1
title: 'A person opening a checking account: the overdraft fee ($25 or $35), the most fees a day (3 or
  6), money left over or not, the debit card for important purchases or not, other ways to pay or not,
  a bank or a credit union; should they get overdraft coverage? (Study 1)'
data_file: researchbox348_study1.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/348 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Chin A, Zimmerman D, Johnson H, Shu SB (2022), "Decisions about overdraft coverage: Disclosure
  design and personal finances", Journal of Experimental Psychology: Applied 28(4):746-774, doi:10.1037/xap0000460.
  ResearchBox 348 (https://researchbox.org/348).


  GENERATED by scripts/gen_researchbox348.py; every judgement is in its docstring. Study 1 (AsPredicted
  #28262, wave 1), 869 people kept by the authors'' pre-registered exclusions (analogies, age and consent,
  the overdraft definition right at the first or second try, finished, more than 180 seconds). Within
  person: everyone rated all ten profiles, each on its own page, in a random order the deposit does not
  record, so each row carries its own profile only, and each outcome names its own profile''s codes (condition_vars
  <dimension>_<1-10>, constant columns). Six two-level attributes, read back from each profile''s words
  and asserted against its export tag; the profiles are a fractional design (10 of 64), declared as a
  sparse template whose seventh dimension, daily_cap, is the day''s maximum shown on screen (fee x number,
  not randomised on its own). Every row opens with the definition screen that opens the overdraft part
  of the survey (QID18), then the scenario page''s lead, both word-for-word; between them the survey asked
  a quiz on that definition and three knowledge questions, not narrated, and the scenario block''s first
  screen, which describes the sequence, is dropped. List items are written as lines starting ''- ''. Added
  words (ours), after the question: ''The answer was a slider from 0 to 100; its labels, from 0 towards
  100, were "Definitely no", "Probably no", "Probably yes" and "Definitely yes".'' (the slider''s four
  labels sit over quarters of the track, so no end label is claimed for 0 or 100). The slider started
  at 50 (not narrated). The Study 1 codebook''s ''number of fees (1=4, 0=1)'' is wrong: the fielded .qsf,
  stimuli_generation.Rmd and the analysis all have 3 or 6.


  Wording from Study 1 (Conjoint).qsf (the blocks the survey flow reaches), word-for-word; no picture
  anywhere in it. Typography normalised (HTML, non-breaking spaces, curly quotes); underline dropped.
  Data: study_1.csv. Persona: gender (the .qsf''s labels; ''Other/Prefer not to say'' kept as the source
  merges it) and year of birth as answered (age not derived). US sample; the overdraft product is the
  US opt-in kind, defined on screen.'
