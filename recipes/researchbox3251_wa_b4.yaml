study_id: researchbox3251
source: researchbox
experiment: wa_b4
title: 'Headphones at $179.99, 30% off if you meet one of twelve conditions (be a student, a veteran,
  a senior citizen, spend $200, refer two people ...): how hard is it for you, and how willing are you?
  (Web Appendix B4)'
data_file: researchbox3251_wa_b4.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/3251 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Cheng A, Stadler Blank A (2025), "The Conditional-Promotion Paradox: When and Why Conditional
  Promotions Decrease Total Sales of the Promoted Product", Journal of Marketing Research 62(3):526-542,
  doi:10.1177/00222437241309324. ResearchBox 3251 (https://researchbox.org/3251).


  GENERATED by scripts/gen_researchbox3251.py; every judgement is in its docstring. Web Appendix B4 (not
  pre-registered), 210 people: the data file''s Finished = 1 rows, as the authors'' script keeps and the
  paper reports. Twelve conditional promotions on the same headphones, each a 30% discount with its own
  condition; every person saw all twelve, each on its own page, in a random order the deposit does not
  record (BlockRandomizer, SubSet 12, no _DO column), so each row carries its own promotion only and each
  outcome names a constant column (arm_loyal .. arm_geo). Per promotion: how difficult or easy it is for
  you personally to qualify (1 Extremely difficult, 4 Neither difficult nor easy, 7 Extremely easy; the
  other labels are not carried) and how willing you are to do what it takes, each with the block''s own
  parenthesis (1 very unwilling, 7 very willing). Not built: four further questions per block (take advantage,
  deal, fairness, a Firm B alternative) that the data do not carry. A university lab sample; persona sex
  as asked; age is 18-21 or "22 or older", the latter left blank.


  Wording from WA-B4_Qualtrics survey.qsf (the blocks the survey flow reaches), word-for-word: the scenario
  is the condition, each question the outcome. Typography normalised (HTML, non-breaking spaces, curly
  quotes); emphasis dropped. No words added. Data: WA-B4_Qualtrics data_Researchbox.xlsx. Persona: age
  (years, from the .qsf''s list; a band such as "22 or older" left blank) and gender (WA-B4: sex, as it
  asks), labels from the .qsf''s own choices, "Prefer not to respond" left blank and ", write in:" dropped
  from "Identity not listed".'
condition:
  source_vars:
  - arm_loyal
  shared_context: Imagine that you're interested in purchasing a pair of noise cancelling headphones from
    Firm A that cost $179.99.
  factors:
  - precondition
  arms:
  - raw_values:
      arm_loyal: 1
    condition_num: 0
    factors:
      precondition: loyalty
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to sign up
      for the brand's insider club and have accumulated enough status to receive it (i.e., a loyalty program).
  - raw_values:
      arm_loyal: 2
    condition_num: 1
    factors:
      precondition: additional_purchase
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to buy the
      corresponding service plan to receive it (i.e., with an additional purchase).
  - raw_values:
      arm_loyal: 3
    condition_num: 2
    factors:
      precondition: referral
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to provide
      names and contact information of 2 people to this company in order to receive it (i.e., a referral
      program).
  - raw_values:
      arm_loyal: 4
    condition_num: 3
    factors:
      precondition: minimum_dollar
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to spend $200
      to receive it (i.e., a minimum dollar amount).
  - raw_values:
      arm_loyal: 5
    condition_num: 4
    factors:
      precondition: senior_citizen
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to be a senior
      citizen to receive it (i.e., at least 65 years old).
  - raw_values:
      arm_loyal: 6
    condition_num: 5
    factors:
      precondition: student
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to be a student
      to receive it (i.e., have a student id).
  - raw_values:
      arm_loyal: 7
    condition_num: 6
    factors:
      precondition: mother
    text: Currently, Firm A has a mother's day promotion where you can get a 30% discount on this product
      - but you have to be a mother to receive it (i.e., show proof you are a mom).
  - raw_values:
      arm_loyal: 8
    condition_num: 7
    factors:
      precondition: veteran
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to be a veteran
      to receive it (i.e., have worked for the military).
  - raw_values:
      arm_loyal: 9
    condition_num: 8
    factors:
      precondition: minimum_quantity
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to buy 2 items
      to receive it (i.e., a minimum quantity).
  - raw_values:
      arm_loyal: 10
    condition_num: 9
    factors:
      precondition: happy_hour
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to buy the
      headphones on a specific day of the week and time to receive it (i.e., a happy hour special).
  - raw_values:
      arm_loyal: 11
    condition_num: 10
    factors:
      precondition: flash_sale
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to buy the
      headphones within a very short window of time to receive it (i.e., a flash sale).
  - raw_values:
      arm_loyal: 12
    condition_num: 11
    factors:
      precondition: geography
    text: Currently, Firm A has a promotion where you can get a 30% discount - but you have to buy the
      headphones at a specific store to receive it (i.e., only available at certain locations).
