study_id: ukds_6849
source: innovation_panel
title: "Understanding Society Innovation Panel, experiment 9.25: consent to link HMRC records, standard or easy wording (wave 11, web)"
data_file: hmrc_w11-derived.sav
licence: |-
  UK Data Service End User Licence (UKDS SN 6849). NOT redistributable. The EUL's
  definition of "Data Collection" includes the Documentation, so the variable and value
  labels are part of the collection as much as the microdata is. Nothing built from this
  recipe may leave the machine: `data/raw/` and `data/processed/*.parquet` are gitignored,
  and `src/micromotives_datasets/jev.py` refuses `source="ukds"` outright.

comparable_to_socsci210: false
experiment: hmrc_consent_w11_web
participant_id_var: person

notes: |-
  University of Essex, Institute for Social and Economic Research, "Understanding
  Society: Innovation Panel, Waves 1-17, 2008-2024", UK Data Service SN 6849.
  Experiment 9.25 in the Innovation Panel User Guide ("HMRC data linkage consent
  experiment"); wave 11 (2018), WEB respondents. The User Guide cites no publication. The
  face-to-face half, which also varied placement, is `ukds_6849_hmrc_consent_w11.yaml`.
  Split out after the independent check: the web respondents had a wording allocation and
  no placement allocation, so as cells of the face-to-face 2x2 they made "placement" a
  declared factor that was not randomised.

  WHAT WAS RANDOMISED (User Guide 9.25). Per RESPONDENT, `condiffcawi` on `k_indresp_ip`:
  1 "Standard HMRC consent question", 2 "Easy HMRC consent question". 657 standard, 642
  easy. Every web respondent was asked in the late module (Hmrcconsentlate_ip11 is the
  only consent module whose universe includes web). Placement is constant, so it is not
  declared, and the condition does not narrate it. `scripts/gen_ip_hmrc.py --check`
  confirms the allocation against the routing (ledger 138): every standard respondent was
  asked `consentq3`'s web version and every easy one `consentq4`'s, none another.

  THE TWO VERSIONS, AS FIELDED (`6849_ip_wave_11_questionnaires.pdf`, module
  Hmrcconsentlate_ip11, the "Web Interview" mixed-mode alternatives of ConsentQ3 and
  ConsentQ4). Standard: two sentences on what HMRC holds and who may use it, then "Please
  read this leaflet explaining how we would like to attach your HMRC records to the
  answers you have given in this study." Easy: "If you agree:" and seven bullets, then
  "Please read this leaflet for further information." Neither has the face-to-face "let me
  know if you have any questions". Options: standard 1 "I have read the leaflet and am
  happy to give consent" 2 "I do not want to give consent"; easy "Yes" / "No". Codes are
  the source's own, 1 = consent.

  WORD-FOR-WORD VS OURS. Inside the double quotes, every word is the questionnaire's,
  typography normalised; `--check` asserts each quoted string occurs in the PDF. ADDED BY
  US: "You were shown this text on the web:" and 'The screen also gave a link to the
  leaflet and a link, "How will my data be linked?", to a flowchart.' The second is
  DESCRIPTION of layout (the layout exception). The PDF shows the leaflet URL in brackets
  and the label "[How will my data be linked?]" with "(LINK URL FLOWCHART VERSION A/B
  ...)". The URLs are not rendered (QC rule 21), nor is anything behind the links (the
  leaflet, the flowchart image). The source does not contain that content as text, and
  whether anyone opened a link is not recorded. One difference the condition therefore
  does NOT carry: the standard version linked flowchart version A
  ("data-linkage-flowchart-old.png") and the easy version version B ("Linking data.jpg"),
  so the wording contrast also carries a flowchart difference that is not rendered. The
  standard text reads "...responsibly and safely.> Please read" in the PDF. The ">" is
  dropped as a stray markup character, a judgement recorded here; `--check` asserts that
  the PDF string exists, so a reader can find it.

  NOT AFFECTED by the face-to-face script error (Technical Report 5.3), which concerned the
  interviewer's laptop.

  ROW COUNTS (aggregates). Don't know and refusal dropped. Standard 649, easy 632: 1,281
  rows, one per respondent.

  PERSONA. The same spine as every Innovation Panel build. `person` is a hash of `pidp`,
  the same construction as every Innovation Panel build.

condition:
  source_vars: [indmode, wording]
  factors: [wording]
  arms:
    - raw_values: {indmode: 3, wording: 1}
      condition_num: 0
      factors: {wording: "standard"}
      text: "You were shown this text on the web: \"We would like to add records held by HM Revenue and Customs, or HMRC, containing information on your employment and self-employment history, your income, National Insurance contributions and tax credits. All information will be used for research purposes only by academic or policy researchers under restricted access arrangements which make sure that the information is used responsibly and safely. Please read this leaflet explaining how we would like to attach your HMRC records to the answers you have given in this study.\" The screen also gave a link to the leaflet and a link, \"How will my data be linked?\", to a flowchart."
      items:
        0:
          outcome_var: consentq3
          outcome_question: "Do you give permission for us to pass your name, address, sex and date of birth to HMRC for this purpose? 1 \"I have read the leaflet and am happy to give consent\" 2 \"I do not want to give consent\""
          scale: {min: 1, max: 2, nominal: true}
          response_recode: {1: 1, 2: 2}
    - raw_values: {indmode: 3, wording: 2}
      condition_num: 1
      factors: {wording: "easy"}
      text: "You were shown this text on the web: \"We would like to add records held by HM Revenue and Customs, or HMRC, to the answers you have given in this study. If you agree: • We will send HMRC your name, address, sex and date of birth so that they can identify the records they have about you. The HMRC records contain information about your current and previous employment, your income, National Insurance contributions and tax credits. • We will not send HMRC the answers you have given in this study. • HMRC will send us your records. These will contain an anonymous identification number but not your name, address, sex or date of birth. • We will add the HMRC records to the answers you have given in this study. • We will make the combined anonymous data available for academic and policy research purposes only. • Access to the data will be restricted and controlled, to make sure that researchers use the information responsibly and safely. • This will not affect the way that you deal with HMRC in any way. Please read this leaflet for further information.\" The screen also gave a link to the leaflet and a link, \"How will my data be linked?\", to a flowchart."
      items:
        0:
          outcome_var: consentq4
          outcome_question: "Do you give permission for us to pass your name, address, sex and date of birth to HMRC for this purpose? 1 \"Yes\" 2 \"No\""
          scale: {min: 1, max: 2, nominal: true}
          response_recode: {1: 1, 2: 2}

# No `var`: each arm names its own. The question here is a fallback every arm
# overrides; no built row may carry it.
outcomes:
  - task_num: 0
    question: "[consent to link HMRC records, in the version's own wording]"
    scale: {min: 1, max: 2, nominal: true}

response_recode: {1: 1, 2: 2}

