study_id: researchbox1032
source: researchbox
experiment: study1
title: 'A chocolate maker and an orange juice maker, facing higher production costs, raise the price or
  shrink the product: acceptable or unfair? (Study 1)'
data_file: researchbox1032_study1.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/1032 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Evangelidis I (2024), "Frontiers: Shrinkflation Aversion: When and Why Product Size Decreases
  Are Seen as More Unfair than Equivalent Price Increases", Marketing Science 43(2):280-288, doi:10.1287/mksc.2023.0269.
  ResearchBox 1032 (https://researchbox.org/1032).


  GENERATED by scripts/gen_researchbox1032.py; every judgement is in its docstring. Study 1 (pre-registered
  Nov 2022, AsPredicted #113919), 501 people, all kept (no exclusions pre-registered). Everyone judged
  two scenarios, a chocolate manufacturer and an orange juice manufacturer; for each, whether the firm
  raised the price or shrank the product was drawn separately (two randomizers), so the arm varies within
  person and each outcome names its own assignment column (arm_chocolate: 1 price, 2 size; arm_orange_juice:
  3 price, 4 size). The two products were shown in a random order that the deposit does not record, so
  neither row mentions the other product (CONVENTIONS: an order randomised and not recorded cannot be
  narrated); each person also judged the other product, before or after. 1 = acceptable, 2 = unfair, as
  answered.


  Wording from Study 1 - Materials.qsf. Each fairness screen was the scenario followed by "This is" and
  the two answers; the scenario is the condition and "This is" the question, both word-for-word. The assignment
  is derived from which arm''s column is filled (every fairness question was ForceResponse, so a blank
  means not shown). Typography normalised (HTML entities, non-breaking spaces). No words added. Persona:
  age (years; outside 18-100 left blank) and gender, labels from the .qsf''s own choices.'
