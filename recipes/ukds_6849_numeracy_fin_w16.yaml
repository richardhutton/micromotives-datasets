  sex: [-9, -8, -7, -2, -1]
  gor_dv: [-9, -8, -7, -2, -1]
  jbstat: [-9, -8, -7, -2, -1]
  hiqual_dv: [-9, -8, -7, -2, -1]
  mastat_dv: [-9, -8, -7, -2, -1]
