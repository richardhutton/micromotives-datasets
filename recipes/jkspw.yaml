outcomes:
  # No `var`: every arm names its own in `items` (A for arms 1-2, B for 3-4).
  - task_num: 0
    question: "The consequences of a sore like this are probably:"
    scale: {min: 1, max: 9, min_label: "Not at all serious", max_label: "Very serious"}
  - task_num: 1
    question: "How easy would it be for you to get a doctor or other medical professional to evaluate (and, if necessary, treat) this type of sore within 48 hours?"
    scale: {min: 1, max: 9, min_label: "Very easy", max_label: "Very difficult"}
  - task_num: 2
    question: "How likely would you be to treat a sore like that yourself? That is, how likely would you be to deal with the sore without going to get professional care?"
    scale: {min: 1, max: 9, min_label: "Not at all likely", max_label: "Very likely"}
  - task_num: 3
    question: "If you have a painful skin sore of the type described earlier, how likely is it that the sore is MRSA (antibiotic-resistant staph infection)?"
    scale: {min: 1, max: 9, min_label: "Not at all likely", max_label: "Very likely"}
  - task_num: 4
    question: "How likely would you be to seek medical care if you had a red, painful, sore on your skin that is about 1.5 inches across and is starting to ooze thick pus (white liquid)?"
    scale: {min: 1, max: 9, min_label: "Not at all likely", max_label: "Very likely"}
  - task_num: 5
    question: "If left untreated, the consequences of a red, painful, sore on your skin that is about 1.5 inches across and is starting to ooze thick pus are probably:"
    scale: {min: 1, max: 9, min_label: "Not at all serious", max_label: "Very serious"}
  - task_num: 6
    question: "If you had a red, painful, sore on your skin that is about 1.5 inches across and is starting to ooze thick pus, how likely is it that the sore would be MRSA (antibiotic-resistant staph infection)?"
    scale: {min: 1, max: 9, min_label: "Not at all likely", max_label: "Very likely"}

