notes: 'ResearchBox 809, "Periodic Corporate Donations" (https://researchbox.org/809), Zenodo record 21934081.
  The paper is not named in the box and was not read.


  GENERATED by scripts/gen_researchbox809.py; every judgement is in its docstring. 2. Stimulus sampling
  (AsPredicted #165250; CloudResearch Connect, March 2024; US sample). 1,540 people kept by the authors''
  .rmd (Status 0, Finished 1, the recall check answered right for the arm). Between-person: one scenario
  each, assigned by the .qsf''s randomisers (amount, scenario, condition; every recorded fill checked
  against the .qsf for every kept row). The row is every text screen from the scenario''s first screen
  to the reminder at the top of the measure page, word-for-word with its piped fields filled; the welcome
  screen, consent and id are dropped; bullets are written as lines starting ''- ''. Not built: the recall
  check (attention, used only for the exclusion).


  Wording from 2. Stimulus sampling.qsf (the blocks the survey flow reaches). Typography normalised (HTML,
  non-breaking spaces, curly quotes); bold and underline dropped. Data: 2. Stimulus sampling.csv. Persona:
  age (years; outside 18-100 left blank) and gender (the .qsf''s labels; ''Prefer not to say'' left blank).
  US sample, US dollars; invented companies.'
