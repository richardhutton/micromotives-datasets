  - var: Q1A
    task_num: 0
    question: |-
      How serious of a threat do you find each of the following?
      Perinia Accetis superbacteria
      Influenza (seasonal flu)
      SARS-CoV-2 (COVID-19)
      Report only the answer for "Perinia Accetis superbacteria".
