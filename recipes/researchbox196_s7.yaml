study_id: researchbox196
source: researchbox
experiment: s7
title: Two of six restaurant visits, each rated Overall alone or beside Food, Service, Ambiance and Value
  (Study S7)
data_file: researchbox196_s7.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/196 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Mehr KS, Simmons JP (2024), "How Does Rating Specific Features of an Experience Alter Consumers''
  Overall Evaluations of That Experience?", Journal of Consumer Research 51(4):739-760, doi:10.1093/jcr/ucae005.
  ResearchBox 196 (https://researchbox.org/196).


  GENERATED by scripts/gen_researchbox196.py; every judgement is in its docstring. Study S7 (AsPredicted
  #76255), 1,567 people kept by the authors'' R script''s exclusions. Rating rows (Overall only, or Overall,
  Food, Service, Ambiance and Value in that fixed order) between people; two of six restaurant scenarios
  each, in a random order that IS recorded (orderS1 .. orderS6). Each scenario page was followed by a
  page repeating it word-for-word with the rating question; the row states it once. Task 0 is the scenario
  seen first (arm_1), task 1 the one seen second (arm_2), whose condition narrates the first scenario
  and its rating question as asked, then ''You were then shown:'' (ours) and its own scenario. 10 stars.


  Wording from Study S7.(file id 119).qsf (the blocks the survey flow reaches), word-for-word: the scenario
  is the condition, the rating question the outcome. Typography normalised (HTML, non-breaking spaces,
  curly quotes); emphasis dropped. Added words (ours): ''Beneath the scenario was the rating question
  below, with one row of stars, labelled "Overall".''; ''Beneath the scenario was the rating question
  below, with a row of stars labelled "Overall" and, beneath it, rows labelled "Food", "Service", "Ambiance"
  and "Value".''; ''You were asked "What rating would you provide?", with one row of stars, labelled "Overall".'';
  ''You were asked "What rating would you provide?", with a row of stars labelled "Overall" and, beneath
  it, rows labelled "Food", "Service", "Ambiance" and "Value".''; ''You were then shown:''; and in each
  outcome, ''Report only the rating for "Overall".'' after the question. Data: Study S7.(file id 117).csv.
  Persona: age (years, as exported) and gender, labels from the .qsf''s own choices.'
condition:
  source_vars:
  - arm_1
  factors:
  - scenario
  - rating_rows
  - earlier_scenario
  arms:
  - raw_values:
      arm_1: 1
    condition_num: 0
    factors:
      scenario: '1'
      rating_rows: overall_only
      earlier_scenario: none
    text: 'Imagine you''ve made a reservation for a restaurant on OpenTable.


      You arrive at the restaurant on time and are promptly seated. You notice that the dining room is
      dark and loud, so that you have to speak loudly to have a conversation with the people at your table.
      You can also smell a faint odor from the bathroom near you.


      The waitstaff promptly arrives at your table to take your drink order and bring out some fresh bread.
      Once the food comes out, you find that it is very tasty and an appropriate portion. The prices are
      quite high for this area.


      Beneath the scenario was the rating question below, with one row of stars, labelled "Overall".'
  - raw_values:
      arm_1: 2
    condition_num: 1
    factors:
      scenario: '2'
      rating_rows: overall_only
      earlier_scenario: none
    text: 'Imagine you''ve made a reservation for a restaurant on OpenTable.


      You arrive at the restaurant on time but have to wait 15 minutes for your table, even though you
      have a reservation. You sit at the table for 35 minutes, but nobody comes to take your drink order.
      When someone finally comes, they are unfriendly. When the food comes out, you find that it is very
      tasty and an appropriate portion.


      The dining room is comfortable and stylish and the prices are quite high for the area.


      Beneath the scenario was the rating question below, with one row of stars, labelled "Overall".'
  - raw_values:
      arm_1: 3
    condition_num: 2
    factors:
      scenario: '3'
      rating_rows: overall_only
      earlier_scenario: none
    text: 'Imagine you''ve made a reservation for a restaurant on OpenTable.


      You arrive at the restaurant on time but have to wait 20 minutes for your table, even though you
      have a reservation. You sit at the table for 25 minutes, but nobody comes to take your drink order.
      You finally get the attention of a passing waiter, but he simply shouts that someone will be with
      you soon and keeps moving past your table. When you finally order and the food comes out, you find
      that it is very tasty and an appropriate portion.


      The dining room is really cold (around 55 degrees), and the furniture is uncomfortable. The prices
      are quite low for the area.


      Beneath the scenario was the rating question below, with one row of stars, labelled "Overall".'
  - raw_values:
      arm_1: 4
    condition_num: 3
    factors:
      scenario: '4'
      rating_rows: overall_only
      earlier_scenario: none
    text: 'Imagine you''ve made a reservation for a restaurant on OpenTable.


      You arrive at the restaurant on time and are immediately seated. The waitstaff is quick, refilling
      your water glass often and giving you an appropriate amount of time to look at the menu. Once the
      food comes out, you find that it is so over-salted that it is almost inedible. The dining room is
      stylish and comfortable, but the prices are quite high for the area.


      Beneath the scenario was the rating question below, with one row of stars, labelled "Overall".'
  - raw_values:
      arm_1: 5
    condition_num: 4
