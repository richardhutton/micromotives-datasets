outcomes:
  - var: Q8
    task_num: 0
    question: >-
      All things considered, is it better for him if he stays at his job,
      cuts back to part-time, or stays home?
    scale: {min: 1, max: 3, nominal: true}
  - var: Q9
    task_num: 1
    question: >-
      All things considered, is it better for the child if he stays at his
      job, cuts back to part-time, or stays home?
    scale: {min: 1, max: 3, nominal: true}
  - var: Q10
    task_num: 2
    question: >-
      All things considered, is it better for the marriage if he stays at
      his job, cuts back to part-time, or stays home?
    scale: {min: 1, max: 3, nominal: true}
  - var: Q11
    task_num: 3
    question: >-
      All things considered, what do you think he should do: stay at his
      job, cut back to part-time, or stay home?
    scale: {min: 1, max: 3, nominal: true}

