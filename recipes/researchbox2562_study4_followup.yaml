study_id: researchbox2562
source: researchbox
experiment: study4_followup
title: 'An orange juice maker, facing higher costs, raises the price, shrinks the pack or dilutes the
  juice by 10%: how big is the change? (Study 4 follow-up)'
data_file: researchbox2562_study4_followup.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/2562 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); archived as Zenodo doi:10.5281/zenodo.20808095. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Evangelidis I (2026), "Skimpflation Penalty: Decreases in Product Quality Trigger Stronger Consumer
  Reactions than Decreases in Size or Increases in Price", Journal of Consumer Research, doi:10.1093/jcr/ucag019.
  ResearchBox 2562 (https://researchbox.org/2562).


  GENERATED by scripts/gen_researchbox2562.py; every judgement is in its docstring. Study 4 (Follow-up)
  (pre-registered, AsPredicted #218825), 300 people. Three arms between people, each change by 10%. The
  question names the changed attribute, so its wording differs by arm (an item override on each arm).
  A slider from 0 (Very small) to 100 (Very big), whole numbers; its row label "Magnitude of change" is
  not carried. The slider was not forced: one of 301 people moved none, so their arm is unknown and they
  are dropped; 300 kept. No exclusions were pre-registered.


  Wording from Study 4 (Follow-up) - Materials.qsf. The scenario is the condition and the closing question
  the outcome, both word-for-word. Where there are arms, the assignment is derived from which arm''s column
  is filled (each such question was ForceResponse, so a blank means not shown). Typography normalised
  (HTML entities, non-breaking spaces, curly quotes). Persona: age (years; the .qsf accepts 15-100) and
  gender, labels from the .qsf''s own choices, "I prefer not to answer" and "None of the above" left blank
  (Jev: non-answer, 1.00 and 0.66).'
condition:
  source_vars:
  - arm
  factors:
  - action
  arms:
  - raw_values:
      arm: 1
    condition_num: 0
    factors:
      action: price_increase
    text: Costs for an orange juice manufacturer recently increased. As a result, the firm decided to
      increase the price of its product by 10%. The package size and concentration of orange juice in
      the product will remain the same.
    items:
      0:
        outcome_question: In your opinion, how big is the change in the product's price?
  - raw_values:
      arm: 2
    condition_num: 1
    factors:
      action: size_decrease
    text: Costs for an orange juice manufacturer recently increased. As a result, the firm decided to
      decrease the package size of its product by 10%. The price and concentration of orange juice in
      the product will remain the same.
    items:
      0:
        outcome_question: In your opinion, how big is the change in the product's package size?
  - raw_values:
      arm: 3
    condition_num: 2
    factors:
      action: quality_decrease
    text: Costs for an orange juice manufacturer recently increased. As a result, the firm decided to
      decrease the concentration of orange juice in its product by 10%. The price and package size of
      the product will remain the same.
    items:
      0:
        outcome_question: In your opinion, how big is the change in the concentration of orange juice
          in the product?
outcomes:
- var: magnitude
  task_num: 0
  question: In your opinion, how big is the change in the product's price?
  scale:
    min: 0
    max: 100
    min_label: Very small
    max_label: Very big
