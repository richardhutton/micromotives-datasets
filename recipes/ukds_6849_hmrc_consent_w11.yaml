          outcome_question: "Do you give permission for us to pass your name, address, sex and date of birth to HMRC for this purpose? 1 \"Respondent has read leaflet and is happy to give consent\" 2 \"Respondent does not want to give consent\""
          scale: {min: 1, max: 2, nominal: true}
          response_recode: {1: 1, 2: 2}
    - raw_values: {indmode: 1, wording: 2, placement: 1, scripterr: 0}
      condition_num: 2
      factors: {wording: "easy", placement: "early"}
      text: "You had not been asked the questions that begin \"One of the most important parts of our research is how people are getting by financially these days. We have found that we need to ask about a number of different types of income, otherwise our results could be misleading. Please think about ALL of the extra sources of income you receive, as well as any benefits or tax credits.\" earlier in the interview. The interviewer then read out this text: \"We would like to add records held by HM Revenue and Customs, or HMRC, to the answers you have given in this study. If you agree: • We will send HMRC your name, address, sex and date of birth so that they can identify the records they have about you. The HMRC records contain information about your current and previous employment, your income, National Insurance contributions and tax credits. • We will not send HMRC the answers you have given in this study. • HMRC will send us your records. These will contain an anonymous identification number but not your name, address, sex or date of birth. • We will add the HMRC records to the answers you have given in this study. • We will make the combined anonymous data available for academic and policy research purposes only. • Access to the data will be restricted and controlled, to make sure that researchers use the information responsibly and safely. • This will not affect the way that you deal with HMRC in any way. Please read this leaflet for further information. Let me know if you have any questions.\""
      items:
