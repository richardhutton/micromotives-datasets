study_id: researchbox3299
source: researchbox
experiment: s4
title: 'A $15 or $315 product, then an $11 one: a sure discount or a 10% chance it is free (Study S4)'
data_file: researchbox3299_s4.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/3299 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); archived as Zenodo doi:10.5281/zenodo.15453383. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Gaertig C & Simmons JP (2025), "Why (and When) Are Uncertain Price Promotions More Effective Than
  Equivalent Sure Discounts?", Journal of Consumer Research, doi:10.1093/jcr/ucaf036. ResearchBox 3299
  (https://researchbox.org/3299).


  GENERATED by scripts/gen_researchbox3299.py; every judgement is in its docstring. Study S4, MTurk, May
  2018. Two scenarios in fixed order: the context product ($15 or $315), then the $11 target. Task 0 is
  the first (ContextRating); task 1 the second (Rating), whose condition is the first screen, then ''You
  were asked "Which price promotion would you like to receive?" You were then shown another scenario:''
  (ours), then the target screen. "Click >> to see the next scenario." is dropped. The same option order
  applied to both scenarios. 984 of 996 kept (do file: 12 duplicate IPs).


  Wording from the .qsf (Qualtrics_Study_S4.qsf; its twin export has the same questions, see the docstring).
  Typography normalised (curly quotes, non-breaking and zero-width spaces). Persona: age (years; outside
  18-100 left blank) and gender, labels from the .qsf''s own choices.'
