      SureDiscountFirst: 1
    condition_num: 0
    factors:
      context_price: low
      order: sure_first
    text: 'Imagine you are about to buy a product.


      The original price of the product is $15.


      You learn that the product comes with one of two types of price promotions, and that you can choose
      which type of price promotion you would like to receive.


      You can choose between two promotions:


      Promotion A: $1.50 off of the price of the product

      Promotion B: A 10% chance to get the product for free


      The promotion that you choose will be applied to the original price of the product ($15).'
