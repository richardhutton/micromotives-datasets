study_id: researchbox402
source: researchbox
experiment: study4
title: 'A tablet whose price fell or rose by $100 to $299, in the last week, three weeks ago, or week
  by week: buy now or later, and what will it cost in a week? (Study 4)'
data_file: researchbox402_study4.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/402 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Gunadi MP, Evangelidis I (2022), "The Impact of Historical Price Information on Purchase Deferral",
  Journal of Marketing Research 59(3):623-640, doi:10.1177/00222437211060359. ResearchBox 402 (https://researchbox.org/402).


  GENERATED by scripts/gen_researchbox402.py; every judgement is in its docstring. Study 4 (pre-registered
  Mar 2021, AsPredicted #60510), 1,506 people, all kept. 2 x 3 between people: the tablet was $399 (decrease)
  or $199 (increase) five weeks ago and is $299 now, having changed once in the last week (single late),
  once three weeks ago (single early), or every week (multiple). Buy now or later (1 now, 2 later) and
  the price in a week (whole dollars, the PDF''s bounds $0-$500), on two pages in a random order the deposit
  does not record, each repeating the scenario; neither row narrates the other.


  Wording: every scenario and question is the fielded screen''s, from the data file''s variable labels
  (Qualtrics'' export of each question), typos kept; the materials PDF (no .qsf) supplies the page structure
  and order, the answer options, the price bounds and any text no label carries. No picture on any built
  study''s pages. Each data column is tied to its PDF screen by the dollar amounts in its label, exactly
  one match each. Where the PDF''s words differ from the fielded ones: the fielded screen has "(in $).",
  which the PDF lacks; fielded "$199", the PDF "$199."; fielded "$299", the PDF "$299."; fielded "$399",
  the PDF "$399.". Typography normalised. The assignment is derived from which arm''s columns are filled.
  Persona: age (years; outside 18-100 left blank) and gender, labels from the .sav''s value labels.'
