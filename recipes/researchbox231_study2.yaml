outcomes:
- var: decision1
  task_num: 0
  question: 'Tuesday, September 3, 2019

    Your friend Alex hears about your work troubles and invites you out for drinks. You are feeling down
    and can use a friend right now. However, you know Alex likes to go to expensive bars and you expect
    you will have to pay $35 for drinks.

    What do you do?

    1 means "Get drinks with Alex"; 2 means "Stay home".'
