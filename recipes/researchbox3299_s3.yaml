    text: 'Imagine that you have just decided to buy a 1-year membership to a gym close to your home,
      as well as a week''s worth of personal training sessions. The membership usually costs $40/month,
      and a week''s worth of personal training sessions costs $50.


      At the time of your purchase, you learn that the membership is being offered at a discount of $4
      off of the monthly membership price. You also learn that the personal training sessions come with
      one of two types of price promotions, and that you can choose which type of price promotion you
      would like to receive.


      Specifically, when purchasing the gym membership and the personal training sessions, you can choose
