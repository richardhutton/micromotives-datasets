  # --- Q1/Q2, the study's PRIMARY outcomes (ledger open item, resolved below) ---
  # One variable per CELL (Q1a/b/c/d, Q2a/b/c/d — lines 390-620), a genuine
  # per-(arm, outcome) design: Q1 and Q2 are two outcomes of the SAME 4-arm
  # condition, and each needed its own variable per arm, which `Arm.outcome_var`
  # cannot express (it holds one variable for the whole arm). `Arm.items`
  # (ItemOverride, keyed by task_num) now does: every arm declares `outcome_var`
  # for task_num 10 and 11 separately. `var` is left unset here because every
  # arm supplies one via its item override (see `condition.arms[*].items`); the
  # `question`/`scale` below are therefore placeholders, never rendered —
  # every arm's own item override always wins (see recipe.py scale_for/
  # outcome_text_for). Scale is 1-4, a genuine bipolar continuum (1 = Definitely
  # Written Consent ... 4 = Definitely the alternative), confirmed from the
  # [grid, sp across] layout at lines 392-401 etc: column headers "Written
  # Consent" / alternative, row headers "Definitely / Probably / Probably /
  # Definitely" mapped to codes 1/2/3/4 in that order — NOT nominal, since 2 and
  # 3 sit strictly between the two poles on one continuum. Same 1-4 codebook on
  # all eight columns, no option-order reversal between arms (checked: every
  # [grid] block lists "Written Consent" first and the alternative second,
  # Definitely/Probably always nearest its own column) so no `response_recode`
  # override is needed; the study-level 1..7 map already carries 1-4 unchanged.
  - var: null
    task_num: 10
    question: >-
      If you were to give advice to the ethics review board, would you recommend
      Written Consent or [the arm's consent alternative]?
    scale: {min: 1, max: 4, min_label: "Definitely Written Consent", max_label: "Definitely the alternative"}
  - var: null
    task_num: 11
    question: >-
      If you were a patient in this health care system, which would you personally
      prefer, Written Consent or [the arm's consent alternative]?
    scale: {min: 1, max: 4, min_label: "Definitely Written Consent", max_label: "Definitely the alternative"}

