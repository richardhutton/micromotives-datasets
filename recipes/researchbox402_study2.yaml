study_id: researchbox402
source: researchbox
experiment: study2
title: 'A Bluetooth speaker whose price fell or rose, once or week by week, to $60 now: buy now or later,
  what will it cost in a week, and will the price keep moving? (Study 2)'
data_file: researchbox402_study2.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/402 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Gunadi MP, Evangelidis I (2022), "The Impact of Historical Price Information on Purchase Deferral",
  Journal of Marketing Research 59(3):623-640, doi:10.1177/00222437211060359. ResearchBox 402 (https://researchbox.org/402).


  GENERATED by scripts/gen_researchbox402.py; every judgement is in its docstring. Study 2 (pre-registered
  Dec 2020, AsPredicted #54323), 802 people, all kept. 2 x 2 between people: the speaker was $100 (decrease)
  or $20 (increase) four weeks ago and is $60 now, having changed once or every week. Page 1: buy now
  or later (1 now, 2 later). Pages 2-3, in a random order the deposit does not record, each repeating
  the scenario: the price in a week (whole dollars, the PDF''s bounds $0-$150) and agreement, 1-7, that
  the price will continue to decrease (decrease arms) or increase (increase arms). The page-2 and page-3
  rows narrate page 1 as asked, in words of OURS: ''You were asked "What would you do?"''; neither names
  the other, whose position is unrecorded.


  Wording: every scenario and question is the fielded screen''s, from the data file''s variable labels
  (Qualtrics'' export of each question), typos kept; the materials PDF (no .qsf) supplies the page structure
  and order, the answer options, the price bounds and any text no label carries. No picture on any built
  study''s pages. Each data column is tied to its PDF screen by the dollar amounts in its label, exactly
  one match each. Where the PDF''s words differ from the fielded ones: the fielded screen has "(in $).",
  which the PDF lacks. Typography normalised. The assignment is derived from which arm''s columns are
  filled. Persona: age (years; outside 18-100 left blank) and gender, labels from the .sav''s value labels.'
