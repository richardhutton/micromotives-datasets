title: "Game Responses as Survey Instruments: Measuring the Constituents of Social Capital"
data_file: Houser.sav
licence: >-
  none stated on the OSF deposit (checked via the OSF API, 2026-10-10:
  registration gyrp9 and its child components t6uwp "Data" and bgp3k "Materials
  and Methods" have no licence; same finding recorded 2026-10-02 in
  data/catalog/tess_uk_foundation_sources.csv). TESS states no reuse terms for its
