outcomes:
  - var: Q1
    task_num: 0
    question: >-
      All things considered, is it better for her if she stays at her job,
      cuts back to part-time, or stays home?
    scale: {min: 1, max: 3, nominal: true}
  - var: Q2
    task_num: 1
    question: >-
      All things considered, is it better for the child if she stays at her
      job, cuts back to part-time, or stays home?
    scale: {min: 1, max: 3, nominal: true}
  - var: Q3
    task_num: 2
    question: >-
      All things considered, is it better for the marriage if she stays at
      her job, cuts back to part-time, or stays home?
    scale: {min: 1, max: 3, nominal: true}
  - var: Q4
    task_num: 3
    question: >-
      All things considered, what do you think she should do: stay at her
      job, cut back to part-time, or stay home?
    scale: {min: 1, max: 3, nominal: true}

