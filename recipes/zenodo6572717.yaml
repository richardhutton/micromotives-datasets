          2:
            level: evening_weekend
            text: Given appointment for evening/weekend
          3:
            level: walk_in
            text: Walk in with no appointment (unknown wait)
      advice_B:
        var: advice_B
        levels:
          1:
            level: telephone_advice
            text: Telephone advice from healthcare professional about what to do
          2:
