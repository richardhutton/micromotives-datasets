study_id: zenodo6572717
source: zenodo
title: 'CUPID (Ireland, Feb 2021): parents choose between two health services for an unwell child (paired-choice
  DCE)'
data_file: zenodo6572717_coded.csv
licence: CC BY 4.0 (cc-by-4.0), stated on Zenodo record 6572717 and read from https://zenodo.org/api/records/6572717
  on 16 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: "Nicholson, McDonnell, Conlon, De Brún, Doherty & McAuliffe, \"Parent's preferences for\nunscheduled\
  \ paediatric healthcare: A discrete choice experiment\", Health Expectations 26(5)\n(2023) 1931-1940,\
  \ doi:10.1111/hex.13802 (open access). Zenodo record 6572717\n(doi:10.5281/zenodo.6572717), CUPID project,\
  \ UCD. Qualtrics research panels, February 2021:\nparents of a child under 16 living in IRELAND, not\
  \ the UK. Euro amounts and the Irish GP /\npractice-nurse framing are the source's and are kept.\n\n\
  GENERATED by scripts/gen_zenodo6572717.py, which also writes the derived long file\nzenodo6572717_coded.csv\
  \ from the deposit's .dta. Every judgement is in that script's\ndocstring; in brief:\n\n- A paired-choice\
  \ DCE: 24 fixed choice sets (Bayesian efficient design) in two blocks of\n  12; each parent saw one\
  \ block, so 12 rows per person. The docx shows only six tables per\n  block, and they are the authors'\
  \ working copy (\"I have added our copy of the scenarios\n  below\"), not the fielded screens: none\
  \ matches the data. The services shown are read from\n  the authors' attribute dummies, which match\
  \ the paper's Figure 1 (task 1) exactly and\n  reproduce its Table 3 conditional logit.\n- Condition:\
  \ the intro screen word-for-word (the full stop after \"in a health service\" is\n  ours, where the\
  \ dropped \"There will be 12 different scenarios ...\" ran on), then Service A\n  and Service B as two\
  \ lists of \"<row heading>: <cell>\", headings and cells as on Figure 1,\n  five cells from the docx\
  \ copy only. Attribute order taken as fixed (Figure 1, every docx\n  table and the intro's list agree;\
  \ nothing in the data records an order). The riskiest\n  judgement: five level texts and the order rest\
  \ on the docx copy and one screenshot.\n- Outcome: the intro's instruction, then '1 means \"Service\
  \ A\"; 2 means \"Service B\".' (ours).\n- 450 of 458 parents: the paper's eight exclusions (implausible\
  \ child age or visit count).\n- Persona: survey answer text; family status, number of children, youngest\
  \ child's age and\n  the Ireland screening question as extras. Medical card / GP visit card / insurance\
  \ not\n  mapped (they set what the respondent pays for the care being priced).\n- IP address and location\
  \ columns exist in the .dta, are empty, and are never read.\n"
condition:
  considered_and_rejected:
    task: 'The choice-set number, 1-24, of the fixed Ngene design (1-12 block 1, 13-24 block 2). Not a
      second randomisation: it determines all ten level codes, which are the declared source_vars, one-to-one
      (24 tasks, 24 distinct cells). Kept in the derived file so a row can be traced to its task.'
  template:
    sparse: true
    text: 'For each scenario, please imagine that your youngest (or only) child has not been well (not
      been themselves) for a period of time. You have managed the illness to the best of your ability;
      however, you have now decided that you need further support from a health professional in a health
      service. When responding to these scenarios, we would like you to think of a time before the COVID-19
      pandemic and to not consider how the pandemic may impact your choice.


      Service A

      - How long to wait for appointment: {wait_A}

      - Appointment system: {appointment_A}

      - Advice before attending: {advice_A}

      - Who you will see: {who_A}

      - Cost: {cost_A}


      Service B

      - How long to wait for appointment: {wait_B}

      - Appointment system: {appointment_B}

      - Advice before attending: {advice_B}

      - Who you will see: {who_B}

      - Cost: {cost_B}'
    dimensions:
      wait_A:
        var: wait_A
        levels:
          1:
            level: same_day
            text: Same day
          2:
            level: next_day
            text: Next day
          3:
            level: two_days
            text: In two days' time
      appointment_A:
        var: appointment_A
        levels:
          1:
            level: nine_to_five
            text: Given appointment between 9am-5pm
          2:
            level: evening_weekend
            text: Given appointment for evening/weekend
          3:
            level: walk_in
            text: Walk in with no appointment (unknown wait)
      advice_A:
        var: advice_A
        levels:
          1:
            level: telephone_advice
            text: Telephone advice from healthcare professional about what to do
          2:
            level: no_advice
            text: No advice
      who_A:
        var: who_A
        levels:
          1:
            level: own_gp
            text: Your own GP
          2:
            level: any_doctor_or_nurse
            text: Any doctor or nurse
          3:
            level: practice_nurse
            text: The practice nurse
      cost_A:
        var: cost_A
        levels:
          1:
            level: eur_0
            text: €0
          2:
            level: eur_15
            text: €15
          3:
            level: eur_30
            text: €30
          4:
