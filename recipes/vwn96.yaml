    text: |-
      On the next screen, you'll read a brief story about a student. When reading it, imagine you were a teacher. Then say what you would be most likely to do in the situation.

      Imagine a student from a poor family who attends a public high school located in the inner-city. You hear the student say "I don't want to do this assignment any more. I don't see the point. I'm giving up."

      Imagine you were this student's teacher and wanted to motivate the student.

      You were asked to select, from the statements listed below, the statement that best describes what you would be MOST likely to do; then, of the remaining statements, the one you would be MOST LIKELY to do; then, of the last two statements, the one you would be MORE LIKELY to do.

      Now please read a story about a second student. Again, imagine you were a teacher and say what you would be most likely to do.

      Imagine a student from a moderately wealthy family who attends a public high school located in a suburban neighborhood. You hear the student say "I don't want to do this assignment any more. I don't see the point. I'm giving up."

      Imagine you were this student's teacher and wanted to motivate the student.

      The statements were listed in this order:
      • Mention that they need to do the work if they want to earn a lot of money in a good job one day.
      • Mention that their family is counting on them to do the work, graduate and go to college.
      • Mention how the assignment could be related to their personal interests, like sports or music.
      • Mention that if they really learn from the assignment, they may be able to help people by using that knowledge one day.
