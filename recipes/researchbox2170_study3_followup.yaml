study_id: researchbox2170
source: researchbox
experiment: study3_followup
title: 'T-shirt: pay $24 now, in 30 days or in 3 instalments of $8; how clear and fair the price seems,
  and the benefit and price appeal of the purchase (Study 3)'
data_file: researchbox2170_study3.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/2170 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Maesen S & Ang D, "Buy Now Pay Later: Impact of Installment Payments on Customer Purchases" (project
  title in the deposit''s README; no publication is named). ResearchBox 2170 (https://researchbox.org/2170).


  GENERATED by scripts/gen_researchbox2170.py; every judgement is in its docstring. Study 3, the questions
  after the financial-constraint page, in two blocks shown in a randomised and recorded order (FL_33_DO,
  coded price_first): the price page ("What is the price of the T-shirt?", a recall check not built, then
  five statements on how clear and fair the price is) and the benefits block (four statements on one page,
  then the three-statement price-attractiveness matrix on the next). Each row''s condition is the stimulus
  screen and then every earlier page, narrated (see the docstring): in the price-first order the benefit
  rows follow the price page, in the benefits-first order the price rows follow both benefit pages. 598
  kept, as in study3. Every scale is 1 = Strongly disagree to 9 = Strongly agree, as answered (PB4R is
  the authors'' reverse-scored item).


  Wording from BNPL_T-shirt_Study_3.qsf (the fielded export; the submission export Study3_BNPL_T-shirt.qsf
  agrees on every question shown, see the docstring). Typography normalised (non-breaking spaces); line
  breaks kept as the screen had them. Added words (ours): ''You were then asked (the statements were shown
  in a random order):'' and ''You were then asked:'', each followed by the earlier page''s lines in quotation
  marks. Persona: age (years; outside 18-100 left blank) and gender, labels from the .qsf''s own choices.'
