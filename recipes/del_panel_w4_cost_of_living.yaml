study_id: del
source: dataverse
title: "Development Engagement Lab, Panel Great Britain wave 4 (2022): cost-of-living allocation"
data_file: DEL_Panel_GreatBritain_Wave_4_2022_Data.sav
licence: CC0 1.0 doi:10.7910/DVN/WZPNNU, stated on the Harvard Dataverse deposit "DEL
  Panel 2022" and read from the Dataverse API (latestVersion.license, version 2) on 10 Oct
  2026. The deposit's Readme adds "DEL datasets are a public good and can be used with the
  appropriate citation."

comparable_to_socsci210: false
experiment: panel_w4_cost_of_living
participant_id_var: GUNQID

notes: |-
  Hudson, Jennifer; Hudson, David; Morini, Paolo; Oh, Soomin, 2024, "DEL Panel 2022",
  https://doi.org/10.7910/DVN/WZPNNU, Harvard Dataverse; DEL_Panel_GreatBritain_Wave_4_
  2022_Data.sav. YouGov online panel, wave 4, fielded 30 September - 28 October 2022,
  n = 8,008 adults in Great Britain (the deposit's Readme).

  THE DESIGN. "Research 6, Cost of Living Experiment (1)" in the questionnaire
  (DEL_Panel_GreatBritain_Wave_4_2022_Survey.docx). `CoLSplit =
  panman.assign_treatment(4,[],"CostOfLivingSplit")`, unstratified, splits the sample
  four ways: 2,014 / 2,004 / 2,005 / 1,985 (no blank, no -8/-9). Module ControlGroup
  (CoLSplit==1) asks only the allocation grid. Modules T1-T3 (2-4) first ask the
  respondent to place people on a 1-100 world wealth slider (`{rule 1 100 left="1 - Poor"
  right="100 - Rich" dk=0 show_value=1}`, no Don't know), then the same grid:
  T1 places "you" in 2019 and today (2 sliders); T2 adds "an average person in your local
  community" in 2019 and today (4 sliders); T3 adds "an average person in a poor country"
  instead (4 sliders). One factor, `comparison`, four levels, randomised by one
  assignment. recipe_prep.py's Jev assignment question (all 396 candidate columns) put
  `split_sample` first at conf 0.39 and `CoLSplit` second at 0.26, flagged REVIEW: OVERRULED.
  `split_sample` is the later aid-project conjoint's split; the questionnaire's own
  `{module ... if CoLSplit==k}` lines name CoLSplit as this item's routing, and the data
  agree (below).

  THE CONDITION. Control (raw 1): "You were shown no text before the question." True for
  everyone in that arm: the ControlGroup module is the bare grid. Arms 2-4 narrate what
  was ASKED, never what was answered (docs/CONVENTIONS.md, "Narrating what the respondent
  did"; del_sandbox_jul2020_global_goals precedent). Each slider question is quoted
  word-for-word from the questionnaire; `<<br/>>` breaks become spaces, the `<b>` and
  `<u>` emphasis is dropped, the curly apostrophe in "people’s" is straightened
  (typography only). "in the world as whole" (no "a") is the source's own wording and
  is kept. The scale endpoints "1 - Poor" and "100 - Rich" are the slider's own labels.
  Every slider screen after the first showed a recap of the respondent's earlier
  placements (`{text}` blocks such as "You said that in 2019 you were at
  $treatment1part1a"). The recap's words are kept word-for-word; the piped number is the
  respondent's own answer and is NOT rendered (per-respondent, and an answer, not a
  stimulus we may reproduce here). In its place, outside the quotes, one clause of ours
  names which answer the screen showed, the IP 9.26 pattern (docs/CONVENTIONS.md, "A
  per-respondent fill the deposit does not hold"). We say "with this shown:" and NOT
  where on the page: the instrument places a `{text}` block after the slider question
  and says nothing about its position on screen.
  A LOCKED MARKER, NOT RENDERED AND UNSETTLED BY THE INSTRUMENT. Script comments on the
  later slider pages read "show the position the respondent selected in
  treatment2part1a (not moveable)" (T2 and T3; T3's comment names T2's variable) and,
  on the last page, "show the position the respondent selected in treatment2part1a,
  treatment2part1b, treatment2part2a (all not moveable)" (T3: "treatment3part1a,
  treatment3part1b, treatment3part2a"). They suggest the slider also carried locked
  markers at the respondent's earlier placements. Nothing in the `{rule ...}` line
  itself implements that, so whether markers appeared is not settled by the
  instrument. Either way a marker shows an earlier OWN answer, so under the same ruling
  it would not be rendered; the condition does not mention it.
  ADDED by us, word-for-word: "Before the question, you were asked:", "You were then
  asked:", "Next you were asked:", "Then you were asked:", ", with this shown:"
  (several times), "(here the screen showed your answer
  for yourself in 2019)", "(here the screen showed your answer for yourself today)",
  "(here the screen showed your answer for an average person in your local community in
  2019)", "(here the screen showed your answer for an average person in a poor country in
  2019)", "Both were answered on a scale from "1 - Poor" to "100 - Rich"." and "All four
  were answered on a scale from "1 - Poor" to "100 - Rich".", plus the quotation marks.

  SCRIPT ERROR IN ARM 4 (T3), KEPT WORD-FOR-WORD AND FLAGGED. On T3's last slider page
  (`p_treatment3part2b`) the third recap line reads "You said that in 2019 the average
  person in your community was at $treatment3part2a" - but `treatment3part2a` asked about
  "an average person in a poor country" (its .sav label agrees). The script was copied
  from T2, where the line is correct. So arm-4 respondents saw their poor-country 2019
  placement labelled as "the average person in your community". The arm-4 condition keeps
  the label word-for-word and our fill clause says what number actually sat under it
  ("(here the screen showed your answer for an average person in a poor country in
  2019)"), so the row states what the screen said AND what it meant, and asserts nothing
  the script does not show. This is an EXTENSION of ledger 150 ("a documented script
  error is a data defect"), not 150 applied: 150's case (9.25) EXCLUDED rows whose
  condition could not be verified for a subset; here every arm-4 row saw the same
  error, so the treatment is keep-and-flag, and nothing is excluded. KEPT: rich ruled keep
  over exclude on 10 Oct 2026 (ledger 156). The evidence is the exported script only: the deposit's Readme
  does not mention it, and no technical report was consulted (none is in the deposit
  as downloaded). The defect is in the STIMULUS. It does
  mean arm 4 is not a clean "poor country" contrast: one recap line also invoked "your
  community". Anyone estimating the T3 effect should know that; the arm is kept, not
  rendered as if the screen had been correct.

  THE OUTCOME. One grid (`{grid-open colsum=1000}`) with three £ fields, built as three
  outcomes (docs/CONVENTIONS.md, "One stem, several labelled answer fields"): task_num 0
  "You and your household", 1 "People in your local community", 2 "People in a poor
  country", each arm with its own variables (control_1_1..3_1, treatement1part2a_1..c_1,
  treatement2part3a_1..c_1, treatement3part3a_1..c_1; the source's own spelling
  "treatement"). The stem is word-for-word; ADDED by us after it: 'Report only the amount
  for "You and your household".' (and likewise for the other two field labels, quoted).
  The stem's closing parenthesis DIFFERS BY ARM in the instrument and is kept per arm:
  control "(Please ensure the total adds up to £1000)", T1-T3 "(Please make sure your
  allocation adds up to £1000)". The "…" after "allocate to" is normalised to "...".
  T2/T3's double space before "<<br/>>" is whitespace. Scale 0-1000 (£), whole pounds,
  identity recode, no endpoint labels (the fields are bare "£" boxes). One answer type
  (ledger 147). -8 "Skipped" / -9 "Not Asked" are declared from the variables' own labels;
  none occur.

  SUM TO £1000. `colsum=1000` was enforced by the script: all 8,008 respondents' three
  amounts sum to exactly 1000 (0 exceptions in any arm), every amount 0-1000, all whole
  numbers, no blank or skip code among the assigned. The per-grid variables `control`,
  `treatement1part2` etc. hold a constant 1 and are not answers.

  ROUTING. `routing_check: true` ("not asked" is blank in this file): 0 respondents in any
  arm hold a code in another arm's allocation, grid or slider variables, so
  `ambiguous_routing` is 0. Each arm's sliders are fully answered by that arm (T1 2,004/
  2,004; T2 2,005; T3 1,985). Slider oddities, NOT rendered and not our rows: five
  respondents each have ONE slider outside the 1-100 rule - four in T2
  (treatment2part1a = 0, treatment2part1b = 0, treatment2part2b = 0, treatment2part2b =
  890, four different people) and one in T3 (treatment3part2b = 0). Where such a value
  was piped into a later recap, that recap showed it. Their allocations sum to 1000 like
  everyone's and are kept.

  WHAT CAME BEFORE (every respondent): the wave's attitude block (mig1_w4 .. cos1_w4,
  incl. dnut_w4 growth-vs-environment and deserv_w4). Common to all arms, not narrated.

  RISKIEST JUDGEMENT: keeping arm 4 with its mislabelled recap rendered word-for-word plus
  our clause naming what the number really was, rather than excluding the arm (ledger 150)
  or silently correcting the label. Second: narrating the recap at all (it holds the
  respondent's own numbers), with the numbers replaced by our clauses.

  PERSONA and PERSON ID as in del_panel_w4_climate_harm_stories.yaml (same file): study_id
  `del`, `GUNQID` (unique, never blank); education is `education`, household income
  `income`; AGE IS REAL YEARS here (18-94; only labels -9/-8). Every persona_missing code
  re-read against this file's value labels on 10 Oct 2026: each is Don't know / Prefer not
  to say / Refused / Unknown / Skipped / Not Asked / Can't remember / Non UK & Invalid;
  98 "Other" on pastvote_ge_2019 and the "Any other ..." / "Yes - Other" answers are kept.

condition:
  source_var: CoLSplit
  factors: [comparison]
  routing_check: true
  considered_and_rejected:
    split_sample: >-
      The later aid-project conjoint's split (assigned after this item, by
      panman.assign_treatment(2,[],"sample_alloc")); Jev's first pick at conf 0.39,
      overruled by the questionnaire's module routing on CoLSplit.
    DonationSplit: >-
      A later, separate experiment (Ukraine donation follow-up), randomised after this
      item and stratified on CoLSplit.
    connectstorysplit: >-
      A later, separate experiment (climate harm stories), randomised after this item.
    climatescenariosplit: >-
      A later, separate experiment, randomised after this item.
    EAsplit: >-
      A later, separate experiment, randomised after this item.
  arms:
    - raw: 1
      condition_num: 0
      factors: {comparison: none}
      text: You were shown no text before the question.
      items:
        0:
          outcome_var: control_1_1
          outcome_question: >-
            Imagine you have been unexpectedly given £1000. You can divide the money in any
            way between yourself, people in your local community, and people in a poor
            country. Unfortunately, the money is not real, but please make your choices as
            if it were real. Please indicate how much you would allocate to... (Please
            ensure the total adds up to £1000) Report only the amount for "You and your
            household".
        1:
          outcome_var: control_2_1
          outcome_question: >-
            Imagine you have been unexpectedly given £1000. You can divide the money in any
            way between yourself, people in your local community, and people in a poor
            country. Unfortunately, the money is not real, but please make your choices as
            if it were real. Please indicate how much you would allocate to... (Please
            ensure the total adds up to £1000) Report only the amount for "People in your
            local community".
        2:
          outcome_var: control_3_1
          outcome_question: >-
            Imagine you have been unexpectedly given £1000. You can divide the money in any
            way between yourself, people in your local community, and people in a poor
            country. Unfortunately, the money is not real, but please make your choices as
            if it were real. Please indicate how much you would allocate to... (Please
            ensure the total adds up to £1000) Report only the amount for "People in a
            poor country".
    - raw: 2
      condition_num: 1
      factors: {comparison: self}
      text: >-
        Before the question, you were asked: "Across the globe, people have very different
        levels of wealth: some people are richer, and some people are poorer. The scale
        below shows people's relative economic position in the world as whole, with the
        poorest people of the world at 1 and the richest people of the world at 100.
        Thinking back to 2019, in your opinion, where do you think you were on the scale
        in 2019?" You were then asked: "Now, in your opinion, where do you think you are
        on the scale today?", with this shown: "You said that in 2019 you were
        at" (here the screen showed your answer for yourself in 2019). Both were answered
        on a scale from "1 - Poor" to "100 - Rich".
      items:
        0: {outcome_var: treatement1part2a_1}
        1: {outcome_var: treatement1part2b_1}
        2: {outcome_var: treatement1part2c_1}
    - raw: 3
      condition_num: 2
      factors: {comparison: self_and_local_community}
      text: >-
        Before the question, you were asked: "Across the globe, people have very different
        levels of wealth: some people are richer, and some people are poorer. The scale
        below shows people's relative economic position in the world as whole, with the
        poorest people of the world at 1 and the richest people of the world at 100.
        Thinking back to 2019, in your opinion, where do you think you were on the scale
        in 2019?" You were then asked: "Now, in your opinion, where do you think you are
        on the scale today?", with this shown: "You said that in 2019 you were
        at" (here the screen showed your answer for yourself in 2019). Next you were asked:
        "Next, imagine an average person in your local community. Thinking back to 2019,
        in your opinion, where do you think they were on the scale in 2019?", with this
        shown: "You said that in 2019 you were at" (here the screen showed your
        answer for yourself in 2019). Then you were asked: "Now, in your opinion, where do
        you think they are on the scale today?", with this shown: "You said that
        in 2019 you were at" (here the screen showed your answer for yourself in 2019) "You
        said that in 2022 you are at" (here the screen showed your answer for yourself
        today) "You said that in 2019 the average person in your community was at" (here
        the screen showed your answer for an average person in your local community in
        2019). All four were answered on a scale from "1 - Poor" to "100 - Rich".
      items:
        0: {outcome_var: treatement2part3a_1}
        1: {outcome_var: treatement2part3b_1}
        2: {outcome_var: treatement2part3c_1}
    - raw: 4
      condition_num: 3
      factors: {comparison: self_and_poor_country}
      text: >-
        Before the question, you were asked: "Across the globe, people have very different
        levels of wealth: some people are richer, and some people are poorer. The scale
        below shows people's relative economic position in the world as whole, with the
        poorest people of the world at 1 and the richest people of the world at 100.
        Thinking back to 2019, in your opinion, where do you think you were on the scale
        in 2019?" You were then asked: "Now, in your opinion, where do you think you are
        on the scale today?", with this shown: "You said that in 2019 you were
        at" (here the screen showed your answer for yourself in 2019). Next you were asked:
        "Next, imagine an average person in a poor country. Thinking back to 2019, in your
        opinion, where do you think they were on the scale in 2019?", with this shown: "You said that in 2019 you were at" (here the screen showed your answer
        for yourself in 2019). Then you were asked: "Now, in your opinion, where do you
        think they are on the scale today?", with this shown: "You said that in
        2019 you were at" (here the screen showed your answer for yourself in 2019) "You
        said that in 2022 you are at" (here the screen showed your answer for yourself
        today) "You said that in 2019 the average person in your community was at" (here
        the screen showed your answer for an average person in a poor country in 2019). All
        four were answered on a scale from "1 - Poor" to "100 - Rich".
      items:
        0: {outcome_var: treatement3part3a_1}
        1: {outcome_var: treatement3part3b_1}
        2: {outcome_var: treatement3part3c_1}

outcomes:
  - task_num: 0
    question: >-
      Imagine you have been unexpectedly given £1000. You can divide the money in any way
      between yourself, people in your local community, and people in a poor country.
      Unfortunately, the money is not real, but please make your choices as if it were
      real. Please indicate how much you would allocate to... (Please make sure your
      allocation adds up to £1000) Report only the amount for "You and your household".
    scale: &scale
      min: 0
      max: 1000
  - task_num: 1
    question: >-
      Imagine you have been unexpectedly given £1000. You can divide the money in any way
      between yourself, people in your local community, and people in a poor country.
      Unfortunately, the money is not real, but please make your choices as if it were
      real. Please indicate how much you would allocate to... (Please make sure your
      allocation adds up to £1000) Report only the amount for "People in your local
      community".
    scale: *scale
  - task_num: 2
    question: >-
      Imagine you have been unexpectedly given £1000. You can divide the money in any way
      between yourself, people in your local community, and people in a poor country.
      Unfortunately, the money is not real, but please make your choices as if it were
      real. Please indicate how much you would allocate to... (Please make sure your
      allocation adds up to £1000) Report only the amount for "People in a poor
      country".
    scale: *scale

