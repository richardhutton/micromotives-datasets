  GENERATED by scripts/gen_researchbox196.py; every judgement is in its docstring. Study S5 (AsPredicted
  #107579), 2,341 people kept by the authors'' R script''s exclusions. One of two subpar restaurant scenarios
  x three layouts of the next page, between people: the Overall question alone; the Overall question with
  the attribute question (Food, Service, Ambiance, Value, fixed order) below it; or the attribute question
  above it. The page repeated the scenario after ''Here is the scenario you read on the previous page:'';
  the row states it once. 10 stars.


  Wording from Study S5.qsf (the blocks the survey flow reaches), word-for-word: the scenario is the condition,
  the rating question the outcome. Typography normalised (HTML, non-breaking spaces, curly quotes); emphasis
  dropped. Added words (ours): ''Beneath the scenario was the question below, alone, with one row of stars,
  labelled "Overall".''; ''Beneath the scenario was the question below, with one row of stars, labelled
  "Overall", and beneath that a second question, "How would you rate the following aspects of the experience
  at the restaurant?", with rows of stars labelled "Food", "Service", "Ambiance" and "Value".''; ''Beneath
  the scenario was first a question, "How would you rate the following aspects of the experience at the
  restaurant?", with rows of stars labelled "Food", "Service", "Ambiance" and "Value", and beneath that
  the question below, with one row of stars, labelled "Overall".''; and in each outcome, ''Report only
  the rating for "Overall".'' after the question. Data: Study S5.csv. Persona: age (years, as exported)
  and gender, labels from the .qsf''s own choices.'
condition:
  source_vars:
  - arm
  factors:
  - scenario
  - rating_layout
  arms:
  - raw_values:
      arm: 1
    condition_num: 0
    factors:
      scenario: '1'
      rating_layout: overall_only
    text: 'Imagine you''ve made a reservation for a restaurant on OpenTable.


      You arrive at the restaurant on time and are promptly seated. You order your reasonably priced food
      but find that it is extremely undercooked when it arrives. You send it back, and the waiter brings
      a new dish, which is still slightly undercooked and cold. The restaurant is nicely decorated but
      a bit louder than you would have liked.


      After leaving the restaurant, the OpenTable app sends you a notification, asking you to rate your
      restaurant experience.


      Beneath the scenario was the question below, alone, with one row of stars, labelled "Overall".'
  - raw_values:
      arm: 2
    condition_num: 1
    factors:
      scenario: '2'
      rating_layout: overall_only
    text: 'Imagine you''ve made a reservation for a restaurant on OpenTable.


      You arrive at the restaurant on time and are promptly seated. The food is moderately priced and
      the dining room is stylish. It isn''t too loud, so you can hold a normal conversation. The service
      is prompt, but when your food is brought out, it is cold and doesn''t taste good. You tell the waiter
      that you didn''t enjoy the food, but the waiter refuses to take it back to the kitchen or take it
      off of your bill.


      After leaving the restaurant, the OpenTable app sends you a notification, asking you to rate your
      restaurant experience.


      Beneath the scenario was the question below, alone, with one row of stars, labelled "Overall".'
