outcomes:
  - var: QV21
    task_num: 0
    question: "How favorable are you to the way Susan and John decided to divide up their time spent with their children?"
    scale: {min: -5, max: 5, min_label: "Very unfavorable", max_label: "Very favorable"}
  - var: QV22
    task_num: 1
    question: "How fair is Susan and John's decision to divide up their time spent with their children?"
    scale: {min: -5, max: 5, min_label: "Very unfair", max_label: "Very fair"}
  - var: QV23
    task_num: 2
    question: "How fair will other people find Susan and John's decision to divide up their time spent with their children?"
    scale: {min: -5, max: 5, min_label: "Very unfair", max_label: "Very fair"}
  - var: QV25
    task_num: 3
    question: "How strongly can differences in the amount of time parents spent with their children affect a child's development, do you think?"
    scale: {min: 0, max: 10, min_label: "Not at all", max_label: "Very strongly"}
    response_recode: {1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 8: 7, 9: 8, 10: 9, 11: 10}

response_recode: {1: -5, 2: -4, 3: -3, 4: -2, 5: -1, 6: 0, 7: 1, 8: 2, 9: 3, 10: 4, 11: 5}
