source: tess
title: "Whom Do You Believe? Assessing Credibility of the Accuser and Accused in Sexual Assault"
data_file: "8041.033_Hamilton_TESS033_weighted.sav"
licence: >-
  none stated on the OSF deposit (checked via the OSF API, 2026-11-09: node 3muqx, node_license null, no license relationship). TESS archived its post-2009 projects through the Roper Center and its own site states no reuse terms; TESS has since suspended operations. So there is no explicit grant of redistribution rights for this deposit, and none should be assumed.

# SocSci210 merged Q1a/Q1b on raw codes and dropped Q1c's unlabelled points;
