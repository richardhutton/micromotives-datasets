comparable_to_socsci210: false
participant_id_var: pid
notes: 'Evangelidis I (2024), "Frontiers: Shrinkflation Aversion: When and Why Product Size Decreases
  Are Seen as More Unfair than Equivalent Price Increases", Marketing Science 43(2):280-288, doi:10.1287/mksc.2023.0269.
  ResearchBox 1032 (https://researchbox.org/1032).


  GENERATED by scripts/gen_researchbox1032.py; every judgement is in its docstring. Study 4 (pre-registered
  May 2023, AsPredicted #133756), 4,010 people, all kept. 2 x 2 between people: price $16 to $19 or net
  weight 140 fl oz to 118, and whether the firm states the change on the packaging (high transparency)
  or no more is said (low). 1 = fair, 2 = unfair, as answered.


  Wording from Study 4 - Materials.qsf. Each fairness screen was the scenario followed by "This is" and
  the two answers; the scenario is the condition and "This is" the question, both word-for-word. The assignment
  is derived from which arm''s column is filled (every fairness question was ForceResponse, so a blank
  means not shown). Typography normalised (HTML entities, non-breaking spaces). No words added. Persona:
  age (years; outside 18-100 left blank) and gender, labels from the .qsf''s own choices.'
condition:
  source_vars:
  - arm
  factors:
  - action
  - transparency
  arms:
  - raw_values:
      arm: 1
    condition_num: 0
    factors:
      action: price_increase
      transparency: low
    text: Production costs for a detergent manufacturer recently increased. A few days ago, the manufacturer
      increased the price of its product from $16 to $19. The net weight of the product remained the same
      (140 fl oz).
  - raw_values:
      arm: 2
    condition_num: 1
    factors:
      action: size_decrease
      transparency: low
    text: Production costs for a detergent manufacturer recently increased. A few days ago, the manufacturer
      decreased the net weight of its product from 140 fl oz to 118 fl oz. The price of the product remained
      the same ($16).
  - raw_values:
      arm: 3
    condition_num: 2
    factors:
      action: price_increase
      transparency: high
    text: 'Production costs for a detergent manufacturer recently increased. A few days ago, the manufacturer
      increased the price of its product from $16 to $19. The net weight of the product remained the same
      (140 fl oz). The firm explicitly communicates the change in the price of its product to consumers
      on the packaging (the packaging states: "$19, 140 fl oz; previously $16, 140 fl oz").'
  - raw_values:
      arm: 4
    condition_num: 3
