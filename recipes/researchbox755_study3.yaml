study_id: researchbox755
source: researchbox
experiment: study3
title: 'Avery (and Blake) chose a side dish from 2 or from 6, seen alone or side by side: how much do
  they like it? (Study 3)'
data_file: researchbox755_study3.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/755 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Hu B, Moon A, VanEpps EM (2026), "Choice Set Size Neglect in Predicting Others'' Preferences",
  Psychological Science, doi:10.1177/09567976251400333. ResearchBox 755 (https://researchbox.org/755).


  GENERATED by scripts/gen_researchbox755.py; every judgement is in its docstring. Study 3 (AsPredicted
  #225471), 587 people: the authors'' exclusions as their .do file applies them (attrition, duplicate
  IP address or Prolific ID, failed attention check). Between people: separate evaluation (Avery, told
  of 2 side dishes or of 6, chooses one; ConditionName SE-2 / SE-6) or joint evaluation (Avery and Blake
  at the same restaurant, one choosing from 2 and the other from 6, the 2-set first or second as recorded
  in twofirst), crossed with why the sets differ (reason: a sandwich or a lunch plate; lunch or dinner;
  weekday or weekend). The chosen dish (one of six) and, in a 2-set, the other dish (one of the remaining
  five) were drawn per person and are piped in; the 6-set is always the same six. Arms are the cells drawn.
  The scenario unfolds over two or three pages, each restating the last; the condition is the last page,
  on which the question sits (1 Not at all, 7 Very much). Joint evaluation asks about Avery (like_a) then
  Blake (like_b) on that page; separate evaluation asks about Avery once (like_SE). In joint evaluation
  both choose the same dish ("Blake chooses ...") as the screen says.


  Wording from Study 3.qsf (the blocks the survey flow reaches), word-for-word, pipes filled from each
  person''s recorded fields: the scenario is the condition, each question the outcome. Typography normalised
  (HTML, non-breaking spaces, curly quotes); emphasis and highlighting dropped; a loading spinner picture
  (Study 4) dropped. No words added. Data: Study 3.xlsx. Persona: age (years, as typed) and gender (the
  .qsf''s labels; "Prefer not to disclose" left blank).'
