study_id: researchbox482
source: researchbox
experiment: s3
title: 'A navigation app or a food delivery app estimates 43 minutes or 33-53 minutes: which arrival times,
  from under 21 to over 65 minutes, are consistent with the estimate? (Study S3)'
data_file: researchbox482_s3.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/482 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy, record 15033033 (https://zenodo.org/records/15033033).
  Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Hu B, Gaertig C, Dietvorst BJ, "How Should Time Estimates be Structured to Increase Customer Satisfaction?"
  (manuscript title from the box''s ReadMe). ResearchBox 482 (https://researchbox.org/482).


  GENERATED by scripts/gen_researchbox482.py; every judgement is in its docstring. Study S3 (AsPredicted
  #150577; Online Supplement 6), 188 people kept by the authors'' exclusions (duplicate IP addresses,
  then duplicate Prolific ids). 2 x 2 between people: a navigation app or a food delivery app, a point
  estimate (''43 minutes'') or a range (''33-53 minutes''). Each row is the instructions page, the scenario
  page and the response page''s own instructions, word-for-word; the response page repeats the scenario
  in grey, identical to the scenario page, so it is written once. Consent and the opening location check
  (which ends the survey on a fail) are not narrated. Eleven outcomes, one per time bin of a fixed-order
  matrix on one page; each question is the matrix''s stem with the arm''s estimate piped in, then the
  bin. Answers as coded: 1 ''Yes, consistent'', 2 ''No, inconsistent''. One kept person has a blank consent
  cell; the authors keep them.


  Wording from Study S3.qsf (the blocks the survey flow reaches), word-for-word; no picture anywhere in
  it. Typography normalised (HTML, non-breaking spaces, curly quotes); bold and grey dropped. Data: Study
  S3.xlsx. Persona: age (years, as typed; outside 18-100 left blank) and gender (the .qsf''s labels).
  US sample (Prolific).'
