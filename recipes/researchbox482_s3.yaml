    text: 'Instructions:


      In this study, you will imagine driving to a destination using a navigation app and will answer
      some questions.


      When you are reading the scenario, please treat it as if you are in the described situation and
      make sure your responses truly reflect your preferences.


      Imagine that you decide to drive to a local shopping mall, and you decide to try out a new navigation
      app. The app estimates that it will take 43 minutes for you to drive to the destination.


      We''d like you to think about which arrival times you''d consider to be consistent with the app''s
      estimate of 43 minutes.


      For each arrival time below, please indicate whether you believe that this arrival time is consistent
      or inconsistent with the arrival estimate of "43 minutes."


      Please choose "Yes, consistent" when you feel that the arrival time below would be in line with
      the app''s estimate. Please choose "No, inconsistent" if you feel that the arrival time below would
      not be in line with the app''s estimate.'
