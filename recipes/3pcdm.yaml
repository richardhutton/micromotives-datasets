study_id: 3pcdm
source: tess
title: "Public Opinion and Attributions for Health Care Costs (McCabe, TESS 018)"
data_file: 8041.018_TESSMcCabe_26April18.sav
licence: >-
  none stated on the OSF deposit, as for every TESS deposit built here (TESS
  archived its projects without reuse terms and has since suspended
  operations). Not re-checked against the OSF API for this node in this build.
  So there is no explicit grant of redistribution rights for this deposit, and
  none should be assumed.

# In SocSci210 (one of its 40 held-out studies: our Eval set). See ANSWER KEY.
comparable_to_socsci210: true

notes: |-
  TESS 018 (Katherine McCabe), NORC AmeriSpeak project 8041.018, fielded in
  one omnibus with Martin (TESS 017), April 2018. The .sav has 2,016 rows,
  CaseId unique. Deposit OSF 3pcdm, McCabeS19.zip: the .sav, .sas7bdat,
  codebook, the omnibus questionnaire "8041.017.018_Martin.McCabe_v11clean";
  McCabeS19.pdf and "S19 description" are the proposal.

  Line citations are 1-based line numbers in
    Q = "8041.017.018_Martin.McCabe_v11clean.txt" (textutil from the .docx).
  Only "TESS 018 MCCABE ITEMS" (Q 428-569) is used.


  ASSIGNMENT

  EXPM (Q 430): 1 CONTROL (401), 2 INSURANCE (430), 3 PROVIDER (405), 4
  INSURANCE+GOVERNMENT CUE (394), 5 PROVIDER+GOVERNMENT CUE (386). raw n ->
  condition_num n-1. Factors: bill_source (none | insurance | provider),
  government_cue (absent | present). CONDITION is the Martin study's
  assignment, REC_ORDER the omnibus block order.


  CONDITION TEXT

  Arms 2-5: their Item 1 screen (Q10A-Q10D, Q 445-506), word-for-word: (arms 4-5)
  "Some people want Democrats and Republicans in government to address the
  costs of health care.", then "Please read about an unexpected cost that some
  people experience with their health care:" and the surprise-bill sentence
  (insurer would not pay / provider charged more than expected). The screen
  closes with "Have you had this experience?", narrated as asked (ADDED: 'You
  were asked: "..."'); that answer is not an outcome here (a report of the
  respondent's own past). Control saw no Item 1: its rows carry the fixed
  sentinel (CONVENTIONS, "A source with no stimulus"), true for Q11 and Q12,
  which everyone answered.


  OUTCOMES (12 tasks)

  tasks 0-4   Q11A-E, a forced ranking of who would deserve the blame for an
              unexpected, hard-to-pay medical bill (Republicans in government,
              Democrats in government, a provider, an insurer, you), 1 most ..
              5 least blame; items randomised, not recorded. One stem, five
              fields, ADDED SENTENCE 'Report only the rank for "<item>".'
              Q's "the<u>least</u>" renders as "the least".
  tasks 5-11  Q12A-G, how likely to contact each of seven parties about the
              bill, 1 Definitely would not .. 5 Definitely would contact; same
              added sentence form ('Report only the answer for ...').
  Missing: 77, 98, 99.
  NOT BUILT: Q10A-D ("Have you had this experience?"), the respondent's own
  history, asked as part of the stimulus screen; Q20-Q22 (health profile
  items).


  PERSONA

  NORC AmeriSpeak, as 3muqx: AGE, GENDER, EDUC, RACETHNICITY, INCOME, MARITAL,
  EMPLOY, REGION4, HHSIZE, HOME_TYPE, HOUSING, METRO, INTERNET, PHONESERVICE,
  PartyID7, IDEO, RELIG, ATTEND. Declared missing: PartyID7 -1 (7), IDEO -1
  (31), RELIG 98 (9), ATTEND 98 (6). RELIG code 1's label is severed;
  restored from the AmeriSpeak P_RELIG list; code 14 drops "(please specify):"; this
  deposit's list prints "Other" where other AmeriSpeak years print "Something
  else" (Q 650, the same position 14), so the us_amerispeak crosswalk maps
  "Other" to that same category (added 25 Nov 2026).


  UK CHECK

  Not applicable as a fit test: an Eval study.


  ANSWER KEY

  SocSci210 (crosscheck, 25 Nov 2026): 3 tasks, 25,617 rows. Their task 0 is
  Q10 ("Have you had this experience?", 1,611 rows, treated arms only), which
  we do not build; their tasks 1 and 2 POOL Q11A-E (10,035 = our five ranks)
  and Q12A-G (13,971 = our seven contact ratings). Codes 4 and 5 match exactly
  (4,304, 4,929); codes 1-3 differ by Q10's answers. FAILS on scope and pooling.


  CHECKED 25 Nov 2026 by a separate checker (Sonnet), briefed to break it: PASS.
  Arms word-for-word against Q, control sentinel right; all 60 cells match the
  .sav (24,006 rows); the ANSWER KEY's code 4/5 totals reproduce; persona
  codes exercised. It flagged narrating Q10's question in the condition as
  borderline (a question shown with no answer given); kept, as it is what the
  arm saw.
condition:
  source_var: EXPM
  factors: [bill_source, government_cue]
  considered_and_rejected:
    CONDITION: The Martin study's (TESS 017) assignment in the same omnibus; not this design.
    REC_ORDER: Order of the Martin and McCabe blocks in the omnibus.
    RND_POST: A random dollar value used by the Martin block.
  arms:
    - raw: 1
      condition_num: 0
      factors: {bill_source: none, government_cue: absent}
      text: "No stimulus was shown; the question was asked of everyone."
    # Q10A
    - raw: 2
      condition_num: 1
      factors: {bill_source: insurance, government_cue: absent}
      text: |-
        Please read about an unexpected cost that some people experience with their health care:

        You were surprised to find out that your insurance plan would not pay any part of a medical bill for care you received to treat an illness, injury, or other medical event.

        You were asked: "Have you had this experience?"
    # Q10B
    - raw: 3
      condition_num: 2
      factors: {bill_source: provider, government_cue: absent}
      text: |-
        Please read about an unexpected cost that some people experience with their health care:

        You were surprised to find out that your hospital, clinic, or other health care provider charged you more than you expected in a medical bill for care you received to treat an illness, injury or other medical event.

        You were asked: "Have you had this experience?"
    # Q10C
    - raw: 4
      condition_num: 3
      factors: {bill_source: insurance, government_cue: present}
      text: |-
        Some people want Democrats and Republicans in government to address the costs of health care. Please read about an unexpected cost that some people experience with their health care:

        You were surprised to find out that your insurance plan would not pay any part of a medical bill for care you received to treat an illness, injury, or other medical event.

        You were asked: "Have you had this experience?"
    # Q10D
    - raw: 5
      condition_num: 4
      factors: {bill_source: provider, government_cue: present}
      text: |-
        Some people want Democrats and Republicans in government to address the costs of health care. Please read about an unexpected cost that some people experience with their health care:

        You were surprised to find out that your hospital, clinic, or other health care provider charged you more than you expected in a medical bill for care you received to treat an illness, injury or other medical event.

        You were asked: "Have you had this experience?"

outcomes:
  - var: Q11A
    task_num: 0
    question: |-
      Suppose you received an unexpected medical bill, and the amount you had to pay out-of-pocket was expensive and difficult to pay in full.

      If you received this type of medical bill, who would deserve the blame for your experience?

      Rank the following, where 1= deserves the most blame, 2= the second most blame, 3= the third most blame, 4= the fourth most blame, 5= the least blame.
      Republicans in government, for failing to address rising health care costs.
      Democrats in government, for failing to address rising health care costs.
      A health care provider, for failing to be transparent about costs or provide affordable services.
      A health insurance company, for failing to provide adequate coverage for medical care.
      You, as the consumer, for failing to save enough money or purchase adequate health insurance.
      Report only the rank for "Republicans in government, for failing to address rising health care costs.".
    scale: {min: 1, max: 5, min_label: "1 - Most blame", max_label: "5 - Least blame"}
