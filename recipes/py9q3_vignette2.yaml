study_id: py9q3
source: tess
title: "Attitudes toward the Employment of Mothers and Fathers"
data_file: "TESS2-094 - Jacobs.sav"
experiment: vignette2_single_mother
licence: >-
  none stated on the OSF deposit (checked via the OSF API, 2026-10-01: node_license null, no license relationship). TESS archived its post-2009 projects through the Roper Center and its own site states no reuse terms; TESS has since suspended operations. So there is no explicit grant of redistribution rights for this deposit, and none should be assumed.

# Not just "different scope" (as for the vignette1 sibling) -- SocSci210's
# reconstruction of this part of the deposit is internally scrambled: see
# notes "SOCSCI210 DISAGREEMENT" for the proof. Their build omits two of this
# vignette's three real items entirely and substitutes two Part-2 items
# (Q12/Q13, a different sub-experiment, extended 4-option responses) under a
# condition_num/text pair that claims to be this vignette. A numeric
# crosscheck would therefore not merely disagree, it would compare against
# content that is not this experiment at all.
comparable_to_socsci210: false

notes: >
  TESS2-094 (Jacobs & Gerson). Sibling of py9q3_vignette1.yaml -- see that
  file's notes for the shared design background (the three-sub-experiment
  deposit structure, why XTESS094 is a sample-split/routing variable and not
  a treatment, why this is three separate recipes rather than one, and the
  sequence-signposting rule). This file covers Part 1, Vignette 2 (single
  mother; Q5-Q7) only.


  THE DESIGN -- VIGNETTE 2 (SINGLE MOTHER), 2x2x2 = 8 ARMS

  Lines 172-180. Base text (viewing-order clause dropped, per
  py9q3_vignette1.yaml's "SEQUENCE SIGNPOSTING"): "The family consists of a
  single mother with a preschool child. She is: employed full-time; [JOB]
  with her job; [CARE] with her child care arrangements; and [INCOME]."
  Unlike vignette 1/3, the income bracket here already contains the full
  clause including "on her income" -- the fielded text differs by the
  SOURCE's own construction, not by our transcription (line 178-179):

    factor                  variable                   levels (raw 1 / raw 2)
    job_satisfaction        VIGNETTE2A_Job_Insert       "satisfied" / "not satisfied"
    child_care_satisfaction VIGNETTE2B_Care_Insert      "satisfied" / "not satisfied"
    financial_need          VIGNETTE2C_Income_Insert    "her family depends on her
                                                         income" / "her family does
                                                         not depend on her income
                                                         because she has other
                                                         resources at her disposal"

  Checked against the .sav: VIGNETTE2A_Job_Insert {1:872, 2:820},
  VIGNETTE2B_Care_Insert {1:850, 2:842}, VIGNETTE2C_Income_Insert {1:820,
  2:872}, each populated for exactly the 1,692 XTESS094=2 respondents,
  independently of vignette 1's and vignette 3's own triplets (same
  structure as vignette 1 -- not re-proven here).

  CONDITION MAPPING -- same convention as vignette 1: condition_num =
  4*(job-1) + 2*(care-1) + (income-1).

  CELL SIZES (VIGNETTE2A/B/C, n=1,692, no missing): (1,1,1) 207, (1,1,2) 219,
  (1,2,1) 215, (1,2,2) 227, (2,1,1) 213, (2,1,2) 206, (2,2,1) 201, (2,2,2)
  204.


  OUTCOMES -- ONLY THREE, BY DESIGN (no "better for the marriage" question --
  there is no spouse)

    task 0  Q5  "is it better for HER if she..."
    task 1  Q6  "is it better for the CHILD if she..."
    task 2  Q7  "what do you think she should do?"

  Same 3-way nominal choice set as vignette 1 (Stays at her job / Cuts back
  to part-time / Stays home for Q5/Q6; Stay/Cut back/Stay home for Q7), same
  `{1:1,2:2,3:3}` map, -1 "Refused" the only missing code. Q7's stem-plus-
  options join uses the identical punctuation substitution as vignette 1's
  Q4 (trailing "?" -> ": ... ?"), same liberty, same reasoning.

  ROW ARITHMETIC. Valid counts from the .sav: Q5 1,664, Q6 1,665, Q7 1,676.
  Total 5,005.


  SOCSCI210 DISAGREEMENT -- NOT JUST A DIFFERENT SCOPE, A SCRAMBLED ONE.
  Queried `task_num, response, count(*)` directly against the HuggingFace
  parquet mirror. Their condition_num=5 holds three task_nums (7, 8, 9) whose
  response distributions I matched EXACTLY against our own raw .sav tallies:
  task7 {1:927,2:428,3:321} = our Q7 exactly; task8 {1:1155,2:338,3:182} =
  our Q8 (VIGNETTE 3's "better for him") exactly; task9
  {1:1011,2:400,3:265} = our Q9 (VIGNETTE 3's "better for the child")
  exactly. Their OWN rendered prompt text for these three tasks claims
  Vignette 2 ("is it better for her/the child/what should she do"), i.e.
  they have attached Vignette-2-shaped TEXT to Q7/Q8/Q9's DATA, two of which
  (Q8, Q9) are not Vignette 2 items at all -- they belong to Vignette 3. Q5
  and Q6 (this vignette's own first two items) do not appear UNDER ANY
  task_num in their build -- confirmed by checking every task_num 0-13 against
  Q5's distribution ({1:971,2:426,3:267}) and Q6's ({1:742,2:480,3:443}): no
  match anywhere. Their condition_num=6 similarly turns out to hold Q10, Q11
  (genuinely Vignette 3) PLUS Q12, Q13 (verified exact matches on response
  distribution: {1:317,2:166,3:134,4:216} and {1:211,2:185,3:319,4:120}) --
  which are Part 2 (Vignette 4, extended 4-option responses, a different
  sub-experiment) mislabelled with Vignette-3 text. So this is not the usual
  "dropped factor, numbers otherwise sound" pattern (vignette1's own
  disagreement, or a42yg/z358z's) -- here SocSci210's task-to-variable
  mapping for this part of the deposit is itself internally scrambled, two
  real items are missing outright, and two unrelated items from a different
  sub-experiment are substituted in their place. Recorded in full because
  "their numbers are usually right even when their text is wrong" does NOT
  hold here, and a future reader comparing against their condition_num 5/6
  would otherwise be comparing against a chimera, not against Vignette 2.


  PERSONA, MISSING CODES, SECOND-RANDOMISATION SWEEP: identical to
  py9q3_vignette1.yaml (same respondent population, XTESS094=2) -- see that
  file for the full reasoning. `considered_and_rejected` below swaps which
  triplet is "ours" vs "sibling" accordingly.

condition:
  source_vars: [VIGNETTE2A_Job_Insert, VIGNETTE2B_Care_Insert, VIGNETTE2C_Income_Insert]
  factors: [job_satisfaction, child_care_satisfaction, financial_need]
  considered_and_rejected:
    VIGNETTE1A_Job_Insert: "Independent randomisation for Vignette 1 (married mother), covered by the sibling recipe py9q3_vignette1.yaml. Out of scope here."
    VIGNETTE1B_Care_Insert: "Same — Vignette 1's own child-care factor."
    VIGNETTE1C_Income_Insert: "Same — Vignette 1's own income factor."
    VIGNETTE3A_Job_Insert: "Independent randomisation for Vignette 3 (married father), covered by the sibling recipe py9q3_vignette3.yaml. Out of scope here."
    VIGNETTE3B_Care_Insert: "Same — Vignette 3's own child-care factor."
    VIGNETTE3C_Income_Insert: "Same — Vignette 3's own income factor."
    Vignette_Shown_First: "Presentation-order randomisation across the three vignette topics, not content. Its signalling words are dropped per the sequence-signposting convention; see py9q3_vignette1.yaml."
    Vignette_Shown_Second: "Same — presentation order, not content."
    Vignette_Shown_Third: "Same — presentation order, not content."
    XTESS094: "Sample-split/routing variable (see py9q3_vignette1.yaml notes), not a treatment of Vignette 2's content."
    Assign1: "Belongs to Part 3 (GSS question-wording split ballot), a different, out-of-scope sub-experiment."
    Assign2: "Same — Part 3's other split-ballot assignment."
    Order1: "Controls whether Part 3's GSS questions appear before or after the vignettes. Out-of-scope sub-experiment."
  shared_context: >
    On the following screens we briefly describe several different family and
    work situations. Please answer a short set of questions about each of
    them.
  arms:
    - raw_values: {VIGNETTE2A_Job_Insert: 1, VIGNETTE2B_Care_Insert: 1, VIGNETTE2C_Income_Insert: 1}
      condition_num: 0
      factors: {job_satisfaction: satisfied, child_care_satisfaction: satisfied, financial_need: depends}
      text: >-
        The family consists of a single mother with a preschool child. She
        is: employed full-time; satisfied with her job; satisfied with her
        child care arrangements; and her family depends on her income.
    - raw_values: {VIGNETTE2A_Job_Insert: 1, VIGNETTE2B_Care_Insert: 1, VIGNETTE2C_Income_Insert: 2}
      condition_num: 1
      factors: {job_satisfaction: satisfied, child_care_satisfaction: satisfied, financial_need: does_not_depend}
      text: >-
        The family consists of a single mother with a preschool child. She
        is: employed full-time; satisfied with her job; satisfied with her
        child care arrangements; and her family does not depend on her
        income because she has other resources at her disposal.
    - raw_values: {VIGNETTE2A_Job_Insert: 1, VIGNETTE2B_Care_Insert: 2, VIGNETTE2C_Income_Insert: 1}
      condition_num: 2
      factors: {job_satisfaction: satisfied, child_care_satisfaction: not_satisfied, financial_need: depends}
      text: >-
        The family consists of a single mother with a preschool child. She
        is: employed full-time; satisfied with her job; not satisfied with
        her child care arrangements; and her family depends on her income.
    - raw_values: {VIGNETTE2A_Job_Insert: 1, VIGNETTE2B_Care_Insert: 2, VIGNETTE2C_Income_Insert: 2}
      condition_num: 3
      factors: {job_satisfaction: satisfied, child_care_satisfaction: not_satisfied, financial_need: does_not_depend}
      text: >-
        The family consists of a single mother with a preschool child. She
        is: employed full-time; satisfied with her job; not satisfied with
        her child care arrangements; and her family does not depend on her
        income because she has other resources at her disposal.
    - raw_values: {VIGNETTE2A_Job_Insert: 2, VIGNETTE2B_Care_Insert: 1, VIGNETTE2C_Income_Insert: 1}
      condition_num: 4
      factors: {job_satisfaction: not_satisfied, child_care_satisfaction: satisfied, financial_need: depends}
      text: >-
        The family consists of a single mother with a preschool child. She
        is: employed full-time; not satisfied with her job; satisfied with
        her child care arrangements; and her family depends on her income.
    - raw_values: {VIGNETTE2A_Job_Insert: 2, VIGNETTE2B_Care_Insert: 1, VIGNETTE2C_Income_Insert: 2}
      condition_num: 5
      factors: {job_satisfaction: not_satisfied, child_care_satisfaction: satisfied, financial_need: does_not_depend}
      text: >-
        The family consists of a single mother with a preschool child. She
