study_id: ukds_6849
source: innovation_panel
title: "Understanding Society Innovation Panel, experiment 9.23: ever adopted, ever lived with step-children, ever had biological children, asked before or after the questions about relatives living elsewhere (wave 10)"
data_file: nrp_w10-derived.sav
