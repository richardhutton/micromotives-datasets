comparable_to_socsci210: false
participant_id_var: pid
notes: 'De La Rosa W & Tully SM (2022), "The Impact of Payment Frequency on Consumer Spending and Subjective
  Wealth Perceptions", Journal of Consumer Research 48(6), doi:10.1093/jcr/ucab052. ResearchBox 231 (https://researchbox.org/231).


  GENERATED by scripts/gen_researchbox231.py; every judgement is in its docstring. Study 3, autumn 2020.
  Paid $100 every day (start $20) or $700 every week (start $500), with the same daily expenses. A passive
  month-long simulation (no choices): one screen per day of February with that day''s deposit, spending
  and balance, each screen word-for-word with the loop-and-merge values of the arm''s block in the .qsf
  ("You also spent $-76" is the screen''s own rendering). Six subjective-wealth sliders then four prediction-uncertainty
  sliders, 0-100, each set shown in a random order. Column Subjective Wealth k / Prediction Uncertainty
  k is the k-th question of its block in the .qsf: the deposit''s columns follow the export''s block order,
  and the codebook''s polarity (items 4-6 and 1-2 reversed) matches it. The manipulation checks (how often
  / how much were you paid, range of expenses) are recall checks, not built. 112 of 152 kept (paper: 31
  had taken part before, 9 failed the checks).


  Wording from Study_3_-_Subjective_Wealth_Mediation_Study.qsf. Typography normalised (curly quotes, non-breaking
  spaces); line breaks kept as the screen had them; one blank line between screens. Persona: age (years;
  outside 18-100 left blank), and gender, income, education, labels from the .qsf''s own choices (income
  and education harmonised by the crosswalk scheme us_researchbox231_qualtrics). Ethnicity (multi-select)
  and own pay frequency not mapped.'
