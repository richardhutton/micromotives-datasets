study_id: 5an26
source: tess
title: Gender and Physical Attractiveness as Status Beliefs
data_file: TESS2_069_Paustian-Underdahl_Client.sav
licence: 'None stated: the OSF deposit 5an26 has no licence (node_license null, checked 2026-10-02), TESS
  archived it without reuse terms, and TESS has since suspended operations. The photos appear to be of
  real people, with no statement of who they are or of their consent. Used with rich''s ruling of 9 Nov
  2026 accepting both.'
comparable_to_socsci210: false
participant_id_var: CaseID
notes: "Write recipes/images/5an26.yaml: a headshot and a short profile of \"Diane\" or \"David\".\n\n\
  Paustian-Underdahl, TESS2 069 (University of North Carolina at Charlotte), \"Gender and\nPhysical Attractiveness\
  \ as Status Beliefs\". OSF 5an26. Fielded 11 to 23 March 2011 by\nKnowledge Networks (KnowledgePanel),\
  \ US adults: 645 fielded, 435 completed (the response\nrate report), all 435 in the file and all built.\
  \ Files used: the data\n(TESS2_069_Paustian-Underdahl_Client.sav), the fielded questionnaire as Word\
  \ (\"TESS2 069 -\nPaustian-Underdahl_vfinal.doc\", \"Q\" below) and as text (the .txt beside it, the\
  \ same words\nwithout the pictures). The proposal (PaustianUnderdahl098.pdf) is not used: it describes\n\
  a 2 x 2 with executive and secretary items that were not fielded as such.\n\nEvery judgement is here,\
  \ in code, so the recipe can be re-derived and reviewed:\n\n* DESIGN. 2 (gender) x 2 (attractiveness)\
  \ x 4 (occupation) between people, 16 arms in\n  XTESS069 (Q's table and the .sav's value labels, \"\
  A / Female / Attractive / Manager of\n  Computer and Information Systems\" .. \"D / Male / Unattractive\
  \ / Human Resources\n  Specialist\", asserted equal; 23-32 people per arm). recipe_prep.py (Jev) named\
  \ XTESS069\n  the assignment at confidence 0.94. condition_num is XTESS069 - 1. The factors are the\n\
  \  study's own labels: `gender` (Female / Male), `attractiveness` (Attractive /\n  Unattractive), `occupation`\
  \ (the four job titles).\n* WHAT CARRIES EACH FACTOR. Gender: the name and pronouns in the profile (Diane\n\
  \  Williams, \"professional woman\" / David Williams, \"professional man\") and the photo.\n  Attractiveness:\
  \ the photo ALONE; Q's sixteen profiles are word-for-word the same\n  within each gender (asserted).\
  \ Occupation: only the hiring screens of Part III.\n* WHICH PHOTO IS WHICH ARM. Q's table names a photo\
  \ letter per arm: A for arms 1-4, B\n  for 5-8, C for 9-12, D for 13-16, and Q prints the four photos\
  \ in one paragraph under\n  \"Photos:\", above a line of the four letters \"A B C D\". The pictures\
  \ are inline Word 97\n  pictures; this script reads Q's own structure (the OLE streams, the piece table\
  \ and the\n  character runs' sprmCPicLocation) and finds exactly four in that paragraph, left to\n \
  \ right at character positions 1781, 1795, 1817 and 1834, each pointing to its own\n  picture record\
  \ in the Data stream. Each picture's bytes are taken from its own\n  OfficeArt BLIP record, not by searching\
  \ for image signatures (three JPEGs and one\n  PNG, 187 x 201, 171 x 229, 192 x 193 and 159 x 223 pixels).\
  \ Two independent checks,\n  both computed locally:\n  - Q29 is the attractiveness manipulation check\
  \ (\"how does Diane rate on physical\n    attractiveness?\", 1-9). Mean by photo: A 6.96, B 6.53, C\
  \ 4.20, D 4.77 (n 104, 111,\n    109, 109). A and B, which the table calls Attractive, are each rated\
  \ above both C\n    and D; `check_attractiveness` fails if that ordering is lost.\n  - Seen by eye:\
  \ the first and third pictures show the profile's woman, the second and\n    fourth its man, as A/C\
  \ Female and B/D Male require. (A check of judgement, recorded\n    here, not computed.)\n  The four\
  \ are copied to data/raw/5an26/images/photo_a.jpg, photo_b.jpg, photo_c.jpg and\n  photo_d.png. They\
  \ are small (Q carries the note \"WE WILL GET LARGER IMAGES FROM CLIENT,\n  YES/NO?\"), so the photos\
  \ respondents saw may have been larger copies of the same\n  pictures; the deposit holds no other copy.\
  \ Recorded in each catalogue entry.\n* IMAGE IDS are 5an26_photo_a .. 5an26_photo_d, Q's own neutral\
  \ letters. They say\n  nothing about attractiveness or gender. Our descriptions state only framing,\
  \ backdrop\n  and clothing: no judgement of looks, and no race, age or gender words.\n* CONDITION, BY\
  \ STAGE. Q's order: two instruction screens; Part I, the photo and\n  profile on one page with the Q1-Q7\
  \ grid; Parts II and III in random order (\"RANDOMIZE\n  AND RECORD ORDER OF PART II AND PART III\"\
  ); Part IV; then Q29. The data file has no\n  column recording the Part II / Part III order (all 67\
  \ columns checked), so for a\n  given respondent we cannot know which came first. Each row says only\
  \ what EVERY\n  respondent in its arm had certainly seen by its question:\n  - shared_context: the two\
  \ instruction screens, word-for-word (\"We're studying how\n    people quickly form first impressions\
  \ ...\", \"Refer back to the description and\n    picture ...\").\n  - Part I and Part II (tasks 0-20):\
  \ the photo, then the profile. Part II's page showed\n    only a link back to the photo and profile\
  \ (\"CLICK HERE TO REVIEW THE DESCRIPTION AND\n    PICTURE\"); everyone had seen both on the Part I\
  \ page. About half the respondents\n    had ALSO done Part III (the job and credentials) before Part\
  \ II, but which half is\n    not recorded, so Part II's condition cannot say so and does not. These\
  \ rows differ\n    only by gender and photo; the four occupation arms of each photo render identical\n\
  \    text here, declared per cell with `condition_text` (QC rule 1's exemption).\n  - Part III (tasks\
  \ 21-25): the photo and profile, then the job screen (\"Pretend you are\n    looking to hire someone\
  \ for the position of <job>\" and the job's description), the\n    credentials notice (\"Please review\
  \ Diane's credentials ... for a position in this\n    job.\"), and the line Q shows under the photo\
  \ and profile on the next page (\"Diane\n    attended Emory University and earned a bachelor's degree\
  \ in 1993. Diane has\n    completed a preliminary interview for this position, in which she scored well.\"\
  ).\n    That page repeats the photo and profile above the new line; the repeat is not\n    written out\
  \ a second time (a row carries each picture once). This is each arm's\n    `text`, the one QC rules\
  \ 5 and 23 read.\n  - Part IV (tasks 26-27): everything in Part III (both II and III precede IV), then\n\
  \    the Part IV screen about SAT scores, word-for-word. It does not vary by arm.\n  Screens are joined\
  \ by blank lines. No connecting words of ours anywhere in a\n  condition. The job title in \"Pretend\
  \ you are looking to hire someone for the\n  position of Manager of Human Resources\" has no full stop\
  \ in Q and is given none.\n* FILLS. Q's directives \"[IF XTESS069=1-4, 9-12: Diane/IF XTESS069=5-8,\
  \ 13-16: David]\",\n  the same with \"she/he\", and \"[INSERT OCCUPATION NAME BASED ON ASSIGNED\n  OCCUPATION=1-4]\"\
  \ are resolved per arm here, and nothing else bracketed may remain.\n  Q's OCCUPATION = 1-4 table (XTESS069\
  \ 1, 5, 9, 13 -> 1 and so on) is asserted to agree\n  with the design table's job per arm. Every question\
  \ wording is also checked against\n  the .sav's own variable label once its \"{Diane/David}\" fill is\
  \ put back.\n* OUTCOMES. 28, in Q's order:\n  - Q1-Q7 (tasks 0-6), Part I's grid, 1-9, \"Below average\"\
  \ / \"Average\" / \"Above\n    average\" (Q's header and the .sav's labels on 1, 5 and 9).\n  - Q8-Q21\
  \ (tasks 7-20), Part II's competency grid, 1-5, the same three labels on 1, 3\n    and 5. Each is the\
  \ grid's stem then the competency as Q lists it, joined by a space\n    (\"How adequately do you think\
  \ Diane exhibits the following competencies:\n    Aggression\"). The grid was randomised (\"[RANDOMIZE]\"\
  ), order not recorded; no row\n    says where its item sat.\n  - Q22-Q25 (tasks 21-24), Part III's grid,\
  \ 1-5, the same labels; each question is\n    the grid's stem \"On a scale of 1 (LOW) to 5 (HIGH) please\
  \ rate the applicant on the\n    following items.\" then the item, word-for-word (Q24's \"How well Diane\
  \ would fit in\n    on the job as a ...?\" is Q's grammar).\n  - Q26 (task 25), starting salary, six\
  \ US dollar bands, 1-6 in Q's order. The bands\n    are enumerated after the question as \"Options:\
  \ 1 = $20,000-$39,999, ...\" (the words\n    \"Options:\" and the \"n =\" codes are ours, as in 3muqx).\
  \ Q's question ends with an\n    unpaired closing quotation mark (\"should earn?”\"), absent from the\
  \ .sav's label;\n    dropped as typography.\n  - Q27 and Q28 (tasks 26-27), Part IV: of twenty hires\
  \ for work with numbers (Q27) or\n    words (Q28), how many would be men and how many women. One screen,\
  \ two boxes \"Men\"\n    and \"Women\", and the screen would not continue until they summed to 20 (Q27_TOTAL\n\
  \    and Q28_TOTAL are 20 for all 435). Built once each, from the \"Men\" box, with the\n    added sentence\
  \ 'Report only the number for \"Men\".' (docs/CONVENTIONS.md, One stem,\n    several labelled answer\
  \ fields). The \"Women\" box is 20 minus \"Men\" for every\n    respondent, so building it would add\
  \ a row and no information. 0-20.\n    These are kept as outcomes although the screen does not vary\
  \ by arm: they are\n    judgements asked after the manipulation, about hiring men and women, which is\
  \ what\n    the study is about; they are not about the respondent (the yjvpn moderator ruling)\n   \
  \ and not a check on the stimulus.\n  -1 \"Refused\" is the only non-answer code.\n* NOT BUILT. Q29,\
  \ the attractiveness manipulation check (docs/CONVENTIONS.md,\n  Attention and recall checks): 433 answers.\
  \ It is the evidence for the photo mapping\n  above. The Women boxes Q27_Female / Q28_Female (870 answers,\
  \ determined by the Men\n  boxes) and the constant totals.\n* WHO. All 435 completes; `CaseID` is the\
  \ participant id. Each refusal drops only\n  that row.\n* PERSONA. The KnowledgePanel PP* fields, XPARTY7,\
  \ XIDEO and XREL1, as es4xw:\n  education PPEDUCAT and region PPREG4 (Jev preferred PPREG4 over ppreg9\
  \ at 0.45 to\n  0.41, a close call; PPREG4 matches every other KnowledgePanel recipe). XREL1 code 12\n\
  \  \"Other non-Christian, please specify\" is rewritten to \"Other non-Christian\".\n  Sentinel codes\
  \ on XPARTY7 / XIDEO / XREL1 declared as in es4xw. The persona has no\n  field the profile names: nobody's\
  \ own name, occupation or looks is recorded.\n* UK FIT. rich accepted dollar amounts and US references\
  \ in image experiments\n  (9 Nov 2026). The US references here are Emory University, the SAT and the\
  \ salary\n  bands. The sample is American.\n* SOCSCI210 holds 5an26 (11,689 rows, 435 people) as FOUR\
  \ conditions (gender x\n  attractiveness, the occupations merged) and 27 items worded from the proposal,\
  \ not\n  from Q. Matched column by column on response distributions, its 27 items are exactly\n  the\
  \ .sav's Q1-Q26 and Q29 in file order, from Q8 on under proposal wordings that do\n  not belong to those\
  \ columns (Q23 is called the attractiveness rating, Q29 \"how many\n  would be women\", Q20's 1-5 answers\
  \ are stored x1000 and Q26's salary bands x20). Our\n  rows are its Q1-Q26 rows exactly (same people,\
  \ same answers), minus Q29 (433) as a\n  manipulation check, plus Q27 and Q28 Men (870): 11,689 - 433\
  \ + 870 = 12,126.\n  Its four conditions are our sixteen merged by photo; per photo our Q1-Q26 rows\
  \ plus\n  the Q29 answers equal its counts (tests/test_gen_5an26.py). Because the arms are\n  merged,\
  \ `comparable_to_socsci210` is false and the comparison lives in the test.\n* CAVEAT. The photos appear\
  \ to be of real people, with no statement of who they are or\n  of their consent, and the deposit states\
  \ no licence. rich accepted both on 9 Nov 2026\n  (as for es4xw). Recorded in each catalogue entry.\n\
  \n    uv run python scripts/gen_5an26.py --prep       # extract the four photos from Q\n    uv run python\
  \ scripts/gen_5an26.py --catalogue  # (re)write this study's images.json entries\n    uv run python\
  \ scripts/gen_5an26.py              # write the recipe\n    uv run python scripts/gen_5an26.py --check\
  \      # exit 1 if it differs"
condition:
  source_var: XTESS069
  shared_context: 'We''re studying how people quickly form first impressions, making important decisions
    from little information. First, please read the description of each person and study his or her picture
    briefly. Try to form an impression of her or him; imagine meeting someone like the person pictured
    and described. Then read the questions below the description.


    The person will never see any of your responses. Sometimes it will be difficult to be sure about these
    questions. That is perfectly natural. Please just give your best estimate based on all of the information
    here. Please try to respond with your first impressions.


    Refer back to the description and picture as much as you wish. Sometimes the question may seem difficult
    because of the limited information available here. If so, just use your overall feeling about each
    item. Please answer all of the questions.'
  factors:
  - gender
  - attractiveness
  - occupation
  considered_and_rejected:
    Q29: the attractiveness manipulation check (not an outcome); the evidence for which photo is which
      arm
  arms:
  - raw: 1
    condition_num: 0
    factors:
      gender: Female
      attractiveness: Attractive
      occupation: Manager of Computer and Information Systems
    text: '<image> Diane Williams is a 40-year-old professional woman. She''s been working in her current
      position for six years. Her hobbies include swimming and tennis. She also likes to spend time with
      family, friends, and her two dogs.


      Pretend you are looking to hire someone for the position of Manager of Computer and Information
      Systems


      Computer and information system managers supervise computer programmers, support specialists, systems
      analysts, and other computer related staff. These managers organize and coordinate hardware and
      software installation and upgrades, systems design and programming, expansion of computer networks,
      and the creation and use of internet and intranet sites. These managers divvy out and review the
      work assignments of their staff and stay updated on technological developments.


      Please review Diane''s credentials and results from a preliminary job interview for this position.
      Then, you will be asked to rate Diane for a position in this job.


      Diane attended Emory University and earned a bachelor''s degree in 1993. Diane has completed a preliminary
      interview for this position, in which she scored well.'
