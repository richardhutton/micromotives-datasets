    text: 'Some of the posts you might see when browsing on social media are political campaign posts.
      A new transparency law for online political campaigning has just come into force. Now, most digital
      campaign material will require details of who paid for and produced it. This is designed to help
      voters know who is trying to reach them online and influence their vote. You are about to see four
      randomly selected social media posts. Please review each example and answer a short number of questions
      about what you''ve seen. One of the four posts: "Common Sense Collective / 1 November / The Conservative
