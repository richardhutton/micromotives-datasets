      Britain / Campaign for a better Britain / Campaign for a better Britain / 1 November 2023 / From
      my own lived experience my current MP Lucy Fraser does nor represent me or any other person in her
      constituency that does not agree with Conservative party policy. It would be the same whatever the
      party if a different party to the one you support were elected. The majority of the time MP vote
      in line with party policy. MPs therefore represent party rather than constituent. Because of Parliament
      Protocol no other MP can represent me in parliament effectively leaving me with no representation.
      I believe it would be a mistake replacing Lords with elected representative. It would be nothing
      more than duplicating the House of Commons. It would just be another lot of MP following party politic
      (policies chosen by biggest donors to the party). At whatever level politics, policy is influenced
      by money whether it is lobbying or donations to political parties. I would prefer to see change
      in the way people are appointed to the Lords rather that directly elected politician. I would like
      to see businessmen and politicians and legal professions excluded from the Lords. I would also like
      to representation of other religions. Any election system chosen by government would be one that
      benefited the ruling party. Getting a fair system would be like getting turkeys to vote for Christmas
      / Very well argued. One of the obvious changes would be to bring in PR. That would mean an end to
      wasted votes(more or less). / Campaign for a better Britain is a community of activists and volunteers
      committed to introducing Proportional Representation to the House of Commons. / United Kingdom"
