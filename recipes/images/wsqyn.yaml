study_id: wsqyn
source: osf
title: 'Restrain Food Database validation: 520 food photographs, each rated on taste, craving, healthiness,
  diet choice, frequency, nutrients, recognition, quality and positivity'
data_file: wsqyn_long.csv
licence: CC BY 4.0 (OSF 7gcsk and component wsqyn, as the deposit states). Each photograph also carries
  its own licence, recorded per image in data/catalog/images.json from the database's Attributions_Database.xlsx.
comparable_to_socsci210: false
participant_id_var: response_id
notes: "Write recipes/images/wsqyn.yaml: the Restrain Food Database validation study (IMG34).\n\nRandle,\
  \ Duarte, Maizey, Tzavella, Adams & Chambers (Cardiff), \"The Restrain Food\nDatabase: validation of\
  \ an open-source database of foods that should be eaten more\nor less as part of a healthy diet\", Royal\
  \ Society Open Science 9:220923 (2022).\nOSF 7gcsk (project, CC BY 4.0); this study's materials and\
  \ data are its component\nwsqyn (CC BY 4.0). Answer key: the paper's Tables 1, 3, 4 and 5 (PMC9682305).\n\
  \n2,150 UK adults (Prolific, March 2022; the authors' pre-registered sample after\nexcluding 19 incomplete\
  \ and 148 too-fast participants) were each allocated to 1 of\n52 sets of 10 food photographs. Every\
  \ photograph was rated on three pages: page A\n(taste, craving, healthiness), page B (eat more or less,\
  \ frequency, five nutrient\nratings) and page C (recognition, image quality, positivity). A and B came\
  \ in\nrandom order, all 10 foods per page type before the next; C was always last.\n\nEvery judgement\
  \ is here, in code, so the recipe can be re-derived and reviewed:\n\n* INSTRUMENT. The Qualtrics export\
  \ in the deposit (VSM_Validation_Study.qsf) is the\n  authority for every word. The paper paraphrases\
  \ the instructions and gives the\n  taste anchor as \"Extremely\"; the fielded question says \"Very\
  \ much\".\n* WHAT WAS ON SCREEN. Each page showed one photograph with the food's name as a\n  heading\
  \ above it (paper section 3.1.5 and figure 4: \"the image is presented in\n  the middle of the screen\
  \ with a description presented above\"), then the page's\n  questions. The heading is the page's own\
  \ descriptive-text question, quoted\n  word-for-word after removing HTML and non-breaking spaces. It\
  \ differs between the\n  three pages of the same food in 215 of 520 foods, mostly in capitals (\"Apple\
  \ Pie\"\n  on A, \"Apple pie\" on C) but sometimes in words (\"Macaroni\" on A and B, \"Macaroni\n \
  \ & cheese\" on C; \"Spinache\" on A and B), so each page keeps its own.\n* PHOTOGRAPHS. The deposit's\
  \ .qsf names each page's picture by its Qualtrics\n  library id; the pictures were fetched from the\
  \ survey's own library\n  (cardiffunipsych.eu.qualtrics.com/ControlPanel/Graphic.php?IM=<id>), so each\n\
  \  row cites the exact file its page served, not the database's full-size copy.\n  744 distinct files.\
  \ In 514 foods the three pages show the same photograph,\n  sometimes as separately uploaded copies\
  \ whose bytes differ (re-encoded; the\n  catalogue says so per image). In 6 foods the C page shows a\
  \ DIFFERENT photograph\n  from A and B (e.g. \"Vegetable thai red curry\" C shows the prawn curry photograph\n\
  \  that \"Prawn thai red curry\" uses; \"Hamburger\" C shows a hamburger meal). Rows\n  cite what each\
  \ page showed; nothing is corrected.\n* ARMS. One arm per distinct (heading, image file): 853 arms.\
  \ An arm is shared\n  wherever heading and file are identical: across the pages of one food, and in\n\
  \  two places across foods (\"Hamburger\" in sets 46 and 47 is the same photograph\n  under the same\
  \ heading). Factors: `photo` (the image id, expressed only by the\n  picture) and `heading`. Hold out\
  \ by condition_num or image id, never by\n  condition string; re-encoded copies of one photograph have\
  \ different ids, and\n  the catalogue names the copy each one repeats. Because one food spans several\n\
  \  arms (294 of 520 foods), data/catalog/wsqyn_food_groups.json (written here)\n  maps every condition_num\
  \ to its set_item and database FoodID: a held-out image\n  split must group by those.\n* PAIRING PAGES\
  \ TO FOODS. In each set's flow branch the A, B and C randomisers list\n  10 blocks each; the k-th block\
  \ of each is food k (the block descriptions are\n  unreliable: \"A455\" occurs twice, \"B417 \" has\
  \ a trailing space). This pairing was\n  checked against the authors' own column header (vsm-header.rds)\
  \ for all 1,560\n  pages, and every answer written here is checked below against the authors'\n  primary-analysis\
  \ file, cell by cell.\n* DATA. Derived file data/raw/wsqyn/wsqyn_long.csv, written by this script from\
  \ the\n  raw Qualtrics export: one row per (person, food), 21,500 rows, holding the arm\n  code of each\
  \ page, every answer as the instrument's own choice code (looked up\n  by label), and the persona codes.\
  \ Answers are read by each column's ImportId,\n  never by the authors' renamed headers. Sample = the\
  \ ProlificIDs in\n  Final_data_primary_analyses.csv (the paper's analysed sample). 41 of them also\n\
  \  left an abandoned second attempt in the export; as the authors do, the attempt\n  that reached the\
  \ attention check is used. The participant id is the Qualtrics\n  ResponseId, so no Prolific id enters\
  \ the corpus.\n* OUTCOMES. 13 per food, wording word-for-word from the .qsf; slider endpoint\n  labels\
  \ are the sliders' own. \"Drag the slider to respond\" (the slider's handle\n  label) is mechanics and\
  \ dropped. Page B's grid asks one question with five rows\n  (Calories, Fat, Saturated fat, Sugar, Salt);\
  \ per docs/CONVENTIONS.md \"One stem,\n  several labelled answer fields\" each row is an outcome, and\
  \ the question gets\n  ONE added sentence, ours: 'Report only the rating for \"<row label>\".' The\n\
  \  frequency question's five options and the two nominal questions' options are\n  enumerated as \"\
  Options: 1 = ...\" (the codes are the instrument's). Image\n  quality is coded as offered, 1 Good, 2\
  \ Okay, 3 Bad. The grid's fifth row reads\n  \"Salt\" on 519 pages and \"Vitamins & minerals\" on one\
  \ (B257, \"Vegetable Thai Red\n  Curry\", set 26); that arm's fifth row quotes its own label (41 rows).\
  \ The\n  authors' header calls the column \"RateVM\" and their paper reports it as salt.\n* CONDITION.\
  \ shared_context quotes the task instructions word-for-word, dropping\n  only \"Click the arrow at the\
  \ bottom right of the screen to begin the study.\" as\n  survey mechanics. Words that are OURS: 'The\
  \ food was shown in the centre of the\n  screen, under the heading \"<heading>\":' (the paper's figure\
  \ 4 description).\n* PERSONA. All asked before the ratings (Demographics, then Hunger). Mapped: age,\n\
  \  sex (Prefer not to say = missing), ethnicity (18 options, scheme uk_wsqyn_osf),\n  dietary status\
  \ (the four options word-for-word), diagnosed eating disorder now\n  or in the past (Yes/No), hunger\
  \ (0-100 in steps of 10), and BMI computed by the\n  authors' own formula from the self-reported weight\
  \ and height (kg, or stones x\n  6.350293 + pounds / 2.2046; cm, or feet x 30.48 + inches x 2.54), rounded\
  \ to one\n  decimal, and left absent where the authors' analysis script drops it (<= 10 or\n  >= 90).\
  \ NOT mapped: dietary requirements (in this sample only \"Diabetic\", 51\n  people; others were excluded\
  \ by the authors), UK residence (a screener).\n* NOT BUILT. Page timings; the attention check (after\
  \ the task, and a check).\n* CROSSCHECK (29 Oct 2026, on the built rows). Every answer, age, hunger\
  \ and BMI\n  equals the authors' primary-analysis file (checked in this script). Against the\n  paper:\
  \ craving, healthiness and taste by Eat More / Eat Less (Table 4) agree to\n  0.01 (e.g. healthiness\
  \ 86.43 vs 86.43 and 20.02 vs 20.03); all 30 subcategory\n  means (Table 5) within 0.02, the same differences\
  \ the authors' own file shows,\n  so the paper's tables come from a marginally different extract. Age\
  \ 42.09\n  (13.91), sex 58.60 / 40.93 / 0.47 %, dietary status 1025 / 962 / 110 / 53, all as\n  Tables\
  \ 1 and 3. BMI is 26.89 (s.d. 6.08) on 2,144 people against the paper's\n  26.90 (6.98): the s.d. is\
  \ not reproduced by any cut of the deposited BMI. Two\n  kept values (10.2, 10.5) pass the authors'\
  \ rule but are implausible.\n\n    uv run python scripts/gen_wsqyn.py            # write the derived\
  \ file and recipe\n    uv run python scripts/gen_wsqyn.py --check    # exit 1 if either differs"
