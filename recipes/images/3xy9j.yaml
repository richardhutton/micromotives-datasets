      scenario: cardiac_arrest
      question_type: hypothetical_choice
    text: 'Imagine that one day you have a serious heart attack: an electrical abnormality in your heart
      makes it stop pumping, so your brain and other organs do not get enough blood. As a result, you
      fall down unconscious, and you will die quickly without treatment. Some paramedics are nearby, and
      they come quickly by ambulance. The paramedics can use CPR (cardiopulmonary resuscitation), in which
      they repeatedly compress your chest and blow air into your lungs. This is to try to keep blood flowing
      to your brain and other organs until your heart can be restarted. This treatment does not work for
      most patients, and some patients who receive CPR survive but are left with serious brain damage.
      <image> This graphic shows what would happen if treatment with CPR is given to 100 people with this
      kind of heart attack. In most of them, the treatment would make no difference: these people would
      die regardless of whether they receive CPR. CPR would allow 12 people to survive at a normal or
      near normal level of function. It would allow another 3 people to survive with some brain damage,
      but still able to live independently. 1 person would survive with too much brain damage to live
      independently, and another 1 person would survive in a coma.'
