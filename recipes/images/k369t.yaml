  - raw_values:
      condition: 3
      food name: 2
    condition_num: 0
    factors:
      label: no label
      dish: Beef in black bean sauce with rice
    text: 'The instructions read: "For each dish, you will be asked to decide how much you would like
      to eat as if you were eating it as main meal.

      You can change the quantity using the arrow keys on your keyboard:

      - tap on the right arrow to increase the quantity, on the left one to decrease the quantity

      - use the space bar to select the portion size you would like to eat.

      Before you make your choice, take the time to explore the full range of portion sizes.

      You need to increase the amount of food at least once to be able to select a portion and continue."


      The dish was shown as one of 50 photographs of increasing portion size, captioned "Beef in black
      bean sauce with rice". The first photograph showed the smallest portion; each tap of the right arrow
      showed the next larger one, up to the 50th.


      Photograph 30 of the 50: <image> Below the photograph: "Use the arrow keys to change the portion
      size. Use the spacebar to select the amount you would like to eat."'
