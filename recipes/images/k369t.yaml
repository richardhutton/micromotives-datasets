study_id: k369t
source: osf
title: 'kcal and PACE (minutes of walking) labelling and self-served portion size: 4 labelling groups
  x 18 dishes'
data_file: kcal_pace_data_OSF_final.xlsx
licence: none stated (OSF deposit k369t). Eric Robinson gave permission for research use of the OSF data,
  26 Oct 2026 (data/catalog/image_contacts.json, robinson).
comparable_to_socsci210: false
participant_id_var: subject
notes: "Write recipes/images/k369t.yaml: kcal and PACE labelling and portion choice (IMG27).\n\nMarty,\
  \ Franzon, Jones & Robinson (Liverpool), \"Socioeconomic position, energy\nlabelling and portion size\
  \ selection: an online study comparing calorie and\nphysical activity calorie equivalent (PACE) labelling\
  \ in UK adults\", OSF k369t;\npublished in Appetite 2021. Answer key: the deposit's pre-print (Table\
  \ 2,\nFigure 3). Instrument: the pre-registered protocol in the deposit, whose task\ntext the pre-print's\
  \ Additional file section 1 repeats.\n\n1,667 UK adults (Prolific, April-May 2020) were randomised between\
  \ subjects to\none of four labelling groups, then served themselves 18 dishes in random order.\nEach\
  \ dish was a set of 50 photographs, 20 kcal apart (20 to 1000 kcal); the\nfirst photograph shown was\
  \ the smallest, the right arrow stepped to the next\nlarger one, the left arrow back, and the space\
  \ bar confirmed. The deposit is\nLONG: one row per person per dish, 30,006 rows, with `portion` naming\
  \ the\nphotograph confirmed (e.g. \"BB17\" = beef in black bean sauce, photograph 17).\n\nEvery judgement\
  \ is here, in code, so the recipe can be re-derived and reviewed:\n\n* ARMS. `condition` (4 labelling\
  \ groups, between subjects) x `food name` (18\n  dishes, within subject): 72 arms, each data row one\
  \ (person, dish) trial, both\n  codes looked up BY LABEL. condition_num = group * 18 + dish. The person\
  \ id is\n  `subject`, so one person's 18 rows share one participant_id.\n* IMAGES. The deposit does\
  \ not hold the 900 task photographs. It holds, in the\n  protocol's Appendix K (familiarity task), one\
  \ small picture of each of the 18\n  dishes; the protocol and the pre-print (section 2.4, Table S1)\
  \ say those are\n  the 600 kcal portion, the 30th photograph. The pre-print's Figure 1 shows the\n \
  \ fielded tortellini screen at 600 kcal (\"600 kcal\", \"120 min\") and its plate\n  matches the Appendix\
  \ K tortellini picture. Each arm cites its dish's picture,\n  and the text says it is photograph 30\
  \ of the 50; it does not stand in for the\n  photograph the person confirmed, which the deposit does\
  \ not hold. The pictures\n  are 126-190 px, much smaller than on screen. Each dish's picture was matched\n\
  \  to the data's dish by the caption printed on it.\n  NOT cited: the example labels (protocol image1-3,\
  \ 10, 12, 14) and the beef\n  screenshots (image8, 9, 11, 13, 15) all show 500 kcal / 100 min, a value\
  \ that\n  belongs to one photograph of one dish; the label is described in words.\n* CONDITION. The\
  \ task instructions, word-for-word from protocol Appendix H, with\n  each group's own label sentence\
  \ where the protocol puts it (mid-paragraph, so\n  the instructions are repeated per arm, not hoisted).\
  \ Two sentences dropped as\n  survey mechanics: \"In this task, you will be shown pictures of 18 different\n\
  \  dishes.\" and \"Tap the spacebar to start.\" The on-screen line below the photo\n  is quoted from\
  \ the protocol's screenshots. The recommendation sentences are\n  quoted word-for-word (protocol Appendix\
  \ H, \"During the task\"; pre-print 2.3.2);\n  where on screen they sat is not recorded, so the text\
  \ says only that they were\n  shown. Words that are OURS, all description of the documented display:\n\
  \    \"The dish was shown as one of 50 photographs of increasing portion size,\n    captioned ...\"\
  , \"The first photograph showed the smallest portion; each tap\n    of the right arrow showed the next\
  \ larger one, up to the 50th.\", \"Photograph\n    30 of the 50:\", and per labelled group the label\
  \ clause (\"To the left of\n    each photograph a label showed ...\"). The label values are arithmetic\
  \ from\n    the protocol: 20 kcal per photograph, and 4 minutes of walking per 20 kcal\n    (500 kcal\
  \ = 100 min in the protocol, 600 kcal = 120 min in the pre-print);\n    only \"600 kcal\" and \"120\
  \ min\" are quoted, because only those were seen\n    beside photograph 30. The no-label group's text\
  \ names no calories.\n* OUTCOME. \"How much would you like to eat?\" is the screen's own question\n\
  \  (protocol screenshots). The response is the number of the photograph\n  confirmed, 1-50, read from\
  \ `portion` through a per-arm recode built from that\n  arm's own dish prefix. In every row kcal = 20\
  \ x that number (checked below), so\n  it is a 1:1 of the paper's kcal outcome. Scale labels are ours:\
  \ \"Photograph 1,\n  the smallest portion\" / \"Photograph 50, the largest portion\". One row is\n \
  \ dropped: a \"Biryani\" trial whose `portion` is \"TO31\", a tortellini photograph,\n  so which dish\
  \ was on screen cannot be told (the per-arm recode does not list\n  it). 1,178 rows confirm photograph\
  \ 1 although the instructions required one\n  increase first; going up and back down satisfies that,\
  \ so they are kept.\n* PERSONA. Baseline questionnaire (protocol Appendix G), all asked BEFORE the\n\
  \  task. Mapped: age, gender, ethnicity (five ONS groups, already in the\n  crosswalk), employment and\
  \ highest qualification (scheme uk_k369t_osf), years\n  of study after leaving school at 16 (the question\
  \ counts A levels, so not\n  named \"higher education\"), subjective social status (MacArthur ladder\
  \ 1-10),\n  currently dieting, and hunger (0-100). Qualification is stored as codes 1-9;\n  labels are\
  \ the questionnaire's, and the code order is the protocol's 1-9\n  coding, confirmed by the pre-print's\
  \ Table 1 counts. The question asks students\n  for the diploma being studied for, so for 52 students\
  \ education is the\n  qualification sought. NOT mapped: equivalised income (an OECD-equivalised\n  float,\
  \ not household income), BMI (unrounded floats, as in k7tw5), the\n  derived education composite and\
  \ binary, COVID-19 items (where they sat in the\n  flow is not recorded), and everything measured after\
  \ the task: executive\n  function, food choice motives, IPAQ, familiarity, liking, aim guessing.\n\n\
  \    uv run python scripts/gen_k369t.py            # write the recipe\n    uv run python scripts/gen_k369t.py\
  \ --check    # exit 1 if it differs"
