      WWW.RECONNECT.CO.UK/MANIFESTO / Find out more about our plans on our website / Learn more" <image>
      "The Reconnect Party / Political ad. / Our candidates are ready to represent the diversity of our
      nation for the first time in the next general election. / Most MPs have never had a job outside
      politics. / All our candidates have worked in the real world and understand the demands, stresses
      and joys of the lives you lead. / RECONNECT PARTY / together with you / Paid for by The Reconnect
