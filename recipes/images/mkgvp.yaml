    text: 'You were first shown: "We''re going to ask you about your perceptions of the criminal justice
      system." You were then asked: "Please indicate your level of agreement with the following statements:"
      for each of nine statements, shown in random order: "I am not satisfied with the police." "It is
      my moral duty to back the decisions made by the police because the police are legitimate authorities."
      "You should do what the police tell you even if you disagree." "The police care about the well-being
      of everyone they deal with." "I generally support how the police usually act." "I do not have confidence
      that police can do their job well." "It is my moral duty to do what the police tell me even if I
      do not understand or agree with the reasons." "The police cannot be trusted to make the right decisions."
      "The police generally have the same sense of right and wrong as I do." You were then asked: "Think
      back to the last time you were stopped by the police. How satisfied were you with the way they treated
      you?" After that: Please imagine being in the following hypothetical scenario and answer the questions
      as honestly and realistic as you can... Imagine you are walking down the street and you realize
      your new neighbor''s home has been broken into and vandalized while they were out of town. Instead
      of calling the police, you decide to go into the police department to report the crime to the police
      in person. The police department is only a few miles from your home. You leave your house and head
      to the police department. You now see the police department from a distance. <image> You are now
      closer to approaching the police department. <image>'
