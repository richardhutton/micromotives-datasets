    factors:
      product: mould cake
      substrate: horse manure
    text: 'There is a new interesting food product coming into the market, which is made from mycelium.
      Mycelium is the name for the vegetative structure of fungi, and consists of bundles of white or
      cream coloured mould strings called hyphae. These hyphae are able to absorb nutrients from their
      environment and transform them into high quality protein. As a result, mycelium is rich in protein
      and can be considered as an alternative for animal and plant based protein. Mycelium protein will
      be available on the market as a natural mould cake similar to tempeh and will have an appearance
      similar to the picture below. <image> Captioned: "Mycelium mould cake" Mycelium is grown with the
      use of substrates, which are the surfaces on which fungi live and can be either solid or liquid.
      The mycelium used for the novel product is grown using a substrate of composted horse manure mixed
      with straw, which provides necessary nutrients and looks similar to the substrate pictured below.
      <image> Captioned: "Composted horse manure mixed with straw"'
