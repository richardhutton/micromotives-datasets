  - raw: 48
    condition_num: 48
    factors:
      moment: follow-up
      game: Tetris
      message: FakeExpert1
    text: 'You were first shown a number of WhatsApp conversations, this one among them, and asked about
      each. You were then given this instruction: "Your next objective is to play a game. In the frame
      underneath you can start. The proceed-button will only appear after a minimum of 9 minutes of attentive
      play. After +-12 minutes of active playing, you will automatically move to the next page. While
      the goal is to attain as high a level as possible, do not worry about bad performance, what counts
      is active playing. Double click on Tetris to start the game. The goal is to form solid horizontal
      lines with no gaps. You can use the arrow keys to move the blocks. ..." You were then shown the
      same conversations again and asked about each. At the end of that survey the screen read: "Thank
      you for participating in this study! Below you will find more information about the study.

      The aim of this study is to learn more about how people perceive and engage with the techniques
      used in the production of misinformation on WhatsApp and other direct messaging apps. We are particularly
      interested in the best way to help teach people how to recognise misinformation on such platforms.
      In order to do this, we randomly assigned participants to either the training condition (an educational
      game about misinformation on WhatsApp) or the control condition (a Tetris game).

      The fake news game features four scenarios that are based on our current understanding of what techniques
      are common in the spread of misinformation on WhatsApp (the ''fake expert'' technique, using emotional
      language, polarising messaging, and calling for (often violent) action). The theory behind the game
      relies on a principle known as inoculation: just as medical vaccines trigger antibodies in our immune
      system by injecting a severely weakened dose of a virus, the same can be achieved with information,
      cultivating “mental antibodies”. By demystifying the techniques that are used in the production
      of misinformation, we hope to help people resist and identify misinformation when they encounter
      it on direct messaging apps. The game serves as a simulation to help people familiarise themselves
      with these tactics, as familiarity is key to being able to identify unwanted persuasion attempts.
      Although inspired by real events, the content of both pre-and post survey questions as well as the
      game is entirely fictional and you have not actually spread any fake news. ..." In a later, short
      follow-up survey the screen read: "You will be shown a number of WhatsApp conversations. On a scale
      from 1 to 7, please indicate how reliable you find each of them to be, how confident you are in
      your judgment, and how likely you are to share the message with others." The same conversations
      followed, each with its own questions, and this was one of them: <image>'
