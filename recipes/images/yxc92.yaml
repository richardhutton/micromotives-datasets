study_id: yxc92
source: osf
title: 'Join This Group: WhatsApp misinformation game vs Tetris; reliability, confidence and forwarding
  of 16 WhatsApp screenshots before, after and at follow-up'
data_file: yxc92_coded.xlsx
licence: none stated (OSF project yxc92 has no licence). Permission and the group column asked of the
  corresponding author 2 Nov 2026; built under rich's standing rule not to block on a missing licence.
comparable_to_socsci210: false
participant_id_var: pid
notes: "Write recipes/images/yxc92.yaml: \"Join This Group\", WhatsApp inoculation (IMG75).\n\nMaertens,\
  \ Basol, Roozenbeek, Azevedo, Cook & van der Linden, \"Inoculation Against\nMisinformation on Closed\
  \ Messaging Platforms: 'Join This Group' ...\", OSF yxc92,\nStudy 1 (UK). Fielded on Prolific in January\
  \ 2020 by the Cambridge Social\nDecision-Making Lab; it is chapter 3 of Melisa Basol's PhD thesis (\"\
  Essays on\nresistance against persuasion\", Cambridge 2022, Apollo repository), which is the\nearlier\
  \ write-up and is cited below as \"the thesis\".\n\nDesign. Everyone rated 16 WhatsApp screenshots (three\
  \ questions each, 1-7), was then\nrandomised to play the Join This Group game or Tetris, rated the same\
  \ 16 screenshots\nagain, and about a week later rated them a third time in a separate follow-up\nsurvey.\
  \ Every row is one screenshot, one question, at one of those three moments.\n\nEvery judgement is here,\
  \ in code, so the recipe can be re-derived and reviewed:\n\n* DATA. `JTG - Study 1 (UK) - Raw Data.csv`\
  \ (the authors' merged, anonymised T0+T10\n  file, one row per person, a Qualtrics CHOICE-TEXT export:\
  \ Gender reads \"Female\").\n  `--prep` writes `yxc92_coded.xlsx`: one row per person with T0 data,\
  \ a `pid`\n  (1-based row number in the raw file; the deposit has no identifier, by design),\n  the\
  \ used columns, and one `stim_<moment>_<item>` column per screenshot and moment\n  holding the arm that\
  \ person met there, blank where no row may be built. The\n  ratings are the displayed labels \"1\"..\"\
  7\": two matrices (Real1, Real3) have\n  internal answer keys 1,5..10 and 1,4..9, which a numeric export\
  \ would have shown;\n  the data hold only 1..7, which is the text export reading the labels.\n* ARM.\
  \ The T0 survey flow (T0.qsf) runs a BlockRandomizer (SubSet 1,\n  EvenPresentation) over two branches:\
  \ a group that sets embedded data `Tetris` = 1\n  and then shows the \"Control - Tetris\" block, and\
  \ the \"Inoculation - WhatsApp game\"\n  block. So `Tetris` is the randomiser's own record, not an inference;\
  \ the tracker's\n  \"arm from timing columns\" is corroboration only. Cross-tab (asserted in --prep):\n\
  \  every `Tetris` = 1 has no Join This Group page timing, every blank has no Tetris\n  timing, 504 of\
  \ 505 `Tetris` = 1 carry Tetris page timing and all 473 blanks that\n  reached the randomiser carry\
  \ game page timing (505 vs 473: even presentation over\n  978). One `Tetris` = 1 person has no Tetris\
  \ page timing; the flow puts that block\n  directly after the assignment, so they are kept as Tetris,\
  \ as the authors keep\n  them. Game arm restricted, as the authors restrict it (Script 2, step 5), to\
  \ the\n  people who typed the password shown at the end of the game (their list of 16\n  accepted spellings):\
  \ 417 of 473. The 56 others reached the game page but nothing\n  shows they reached its end, so their\
  \ post and follow-up rows are not built (their\n  pre rows are: those came before the randomiser). This\
  \ is a compliance selection,\n  following the authors, not a random one: the 56 averaged 1,046 s on\
  \ the game page\n  against 824 s for the 417, and 38 of them typed nothing, so the game arm's post and\n\
  \  follow-up rows hold those who entered a valid password while the Tetris arm holds everyone\n  assigned\
  \ to it. Proof against the paper: the\n  authors' exclusions applied to these arms give exactly their\
  \ 425 Tetris and 345\n  game players (Results_Tables.xlsx, Demographics; tested on the built rows).\n\
  * MOMENTS. Pre (item set .1, before the randomiser: one condition for both arms),\n  Post (.2, straight\
  \ after the game) and Follow-up (.3, the T10 survey). The same\n  16 Qualtrics graphics (IM ids) are\
  \ used at all three (asserted from both .qsf).\n  Follow-up rows only for people who finished T0 (the\
  \ debrief, its last screen, is\n  narrated) and have T10 data. The authors' 7-14 day window is not applied:\
  \ the\n  rows say only \"a later, short follow-up survey\", true for every interval seen\n  (1.1 to\
  \ 175 days).\n* WHICH PICTURE. The data column for each screenshot is its Qualtrics export tag\n  (FakeExpert1-1\
  \ -> FakeExpert1.1_1 ...). Each tag's question shows one graphic;\n  that graphic is matched to the\
  \ deposit's PNG three independent ways: (a) the\n  printouts (T0 and T10 \"Printout.pdf\") print the\
  \ pictures in block order, and each\n  printed picture is pixel-identical (grey-level distance 0-8.5\
  \ of 255) to exactly\n  one PNG, every other PNG at 20 or more; (b) each question's own <img> size equals\n\
  \  its PNG's pixel size (Real2's is the same picture scaled to width 211); (c) the\n  thesis's Appendix\
  \ 4 prints the crafted items under the same badges and numbers,\n  and its \"Real\" column in the same\
  \ order as (a) and (b). This CONTRADICTS the\n  deposit's own codebook and Script 2 comment, which call\
  \ Real1 the Hyderabad\n  hoax, Real2 the \"Indians in UK\" chain, Real3 the Adidas and Real4 the Aldi\
  \ scam:\n  the instrument says Real1 = Indians in UK, Real2 = Hyderabad, Real3 = Aldi,\n  Real4 = Adidas.\
  \ The authors' Natur_* scores average all four, so their results\n  are unaffected; per-item rows here\
  \ follow the instrument.\n* BLACK BOXES. The PNGs and the printed survey cover sender names, the group\
  \ name\n  and some words (brands, politicians, places, parties, an ethnic group) with black\n  boxes.\
  \ Both surveys were last modified on 6 May 2024, a minute before their\n  printouts, so the deposit\
  \ alone cannot show the boxes were on screen in 2020. The\n  thesis (2022) does: \"source information\
  \ was blacked out to avoid source\n  confounds\", it quotes an item with \"(blanked out)\", and its\
  \ Appendix 4 shows the\n  same boxed pictures. So the pictures are what respondents saw; nothing in\
  \ the text\n  describes them.\n* CONDITION. Words from the instrument, quoted: the pretest and posttest\
  \ explainer\n  screens; each game page's instruction (Tetris: its first paragraph; its second,\n  on\
  \ not entering a name in the high-score table and what to do if the game froze,\n  is operating instructions\
  \ and left out; game: both paragraphs); the T0 debrief's\n  first three paragraphs for follow-up rows\
  \ (the withdrawal paragraph and contact\n  lines left out). Each of those two partial quotes ends with\
  \ \" ...\" inside its\n  quote marks, saying only that the screen went on. The debrief came LAST in\
  \ the\n  first survey, after the post-test items, so post rows never quote it (an earlier\n  draft attributed\
  \ its description of the game to the researchers on post rows;\n  the independent checker failed that:\
  \ not on screen at that point, and it names\n  the four techniques the outcomes are about). Post rows\
  \ say only what the person\n  was given and did; the game arm's game is therefore described only by\
  \ its own\n  page. At follow-up the debrief is narrated as read. Words that are OURS (all\n  narration\
  \ of what the respondent did, true for every row they appear in): \"The\n  screen read:\", \"The conversations\
  \ followed, each with its own questions, and this\n  was one of them:\", \"You were first shown a number\
  \ of WhatsApp conversations, this\n  one among them, and asked about each.\", \"You were then given\
  \ this instruction:\",\n  \"You entered the password the game gave you at the end.\", \"Then the screen\
  \ read:\", \"The same conversations\n  followed, ...\", \"You were then shown the same conversations\
  \ again and asked about\n  each.\", \"At the end of that survey the screen read:\", \"In a later, short\n\
  \  follow-up survey the screen read:\". The 16 screenshots were shown in a random\n  order that the\
  \ export does not record, so no row says what came before it among\n  them. Not narrated: consent screens,\
  \ the Prolific ID and WhatsApp-use questions,\n  the T10 welcome screen.\n* ON SCREEN, NOT OURS. Follow-up\
  \ rows quote the debrief, which says \"we randomly\n  assigned participants to either the training condition\
  \ ... or the control\n  condition (a Tetris game)\". QC rule 17 flags \"randomly assigned\"; here it\
  \ was on\n  screen, at the end of the first survey, for every person given follow-up rows, so\n  it\
  \ is declared in `condition.on_screen_construction` (QC notes it instead of\n  warning). Dropping the\
  \ sentence would leave Tetris players' rows without what\n  they were told about their own game.\n*\
  \ OUTCOMES. 16 screenshots x 3 questions x 3 moments = 144. Wording is each live\n  question's own row\
  \ text (some read \"judgment\", some \"judgement\"); scale 1-7 with\n  the column labels \"Not at all\"\
  \ (1), \"Neutral\" (4), \"Very\" (7) from the qsf. Real1\n  and Real2 key their third row 4, not 3,\
  \ and the export names it _3: the row is\n  matched by position, and every _3 is the forwarding question.\n\
  * NOT BUILT. The open question \"what is the first that comes to mind when you hear\n  'Join this Group'?\"\
  \ (free text, game arm only); the 11 left-right and\n  libertarian-authoritarian agreement items (attitudes\
  \ asked after the treatment).\n* PERSONA. Gender, education, age band and party, asked at the end of\
  \ T0; WhatsApp\n  use in the last 12 months (asked before the pretest); news checking, social media\n\
  \  use, interest in politics and left-right self-placement (end of T0, habits and\n  identity a game\
  \ is not expected to move). Rewritten labels: \"Other, please\n  specify:\" -> \"Other\" (three people),\
  \ \"Other party, namely:\" -> \"Other party\";\n  \"Refuse to say\" (party) is a non-answer and left\
  \ absent; \"None\" (no party, 147\n  people) is an answer and kept as worded, so party goes to the .xlsx\
  \ as the\n  questionnaire's choice codes with their labels in the recipe (the .xlsx reader\n  would\
  \ read the text \"None\" as an empty cell). Sliders carry their own\n  end labels (\"4 on a scale from\
  \ 1 (Very liberal) to 7 (Very conservative)\").\n  Party, left-right, news and social media habits and\
  \ political interest were asked\n  after the game: mapped as stable traits, a disclosed judgement. Education\n\
  \  crosswalk scheme uk_yxc92_osf (data/catalog/persona_crosswalk_education.json):\n  Jev ordinal_span\
  \ read each of the five levels as one rung (0.89-1.0); GCSE-level,\n  the lowest option offered (there\
  \ is no \"no qualifications\" choice), goes to High\n  school by its label, as uk_yougov_18 and uk_3krjz_osf\
  \ map GCSE, a disclosed\n  judgement (151 people).\n* UK FIT. Twelve lab-made chats in British English\
  \ (the pub, a last-minute goal,\n  \"neighbourhood\") with a few imported details (an \"attorney\",\
  \ a .co.za link), and\n  four real messages: an Aldi £150 voucher scam, a free-shoes giveaway scam,\
  \ a\n  partisan chain message with its party and group names boxed, and an Indian\n  child-kidnapping\
  \ hoax with its place names boxed (\"Cops\", \"10:24 PM\"). All were\n  fielded to and rated by a UK\
  \ sample; none needs local knowledge to rate.\n\n    uv run python scripts/gen_yxc92.py --prep     \
  \  # copy the PNGs, write the coded .xlsx\n    uv run python scripts/gen_yxc92.py --catalogue  # (re)write\
  \ this study's images.json entries\n    uv run python scripts/gen_yxc92.py              # write the\
  \ recipe\n    uv run python scripts/gen_yxc92.py --check      # exit 1 if it differs"
