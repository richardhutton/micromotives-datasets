      language, polarising messaging, and calling for (often violent) action). The theory behind the game
      relies on a principle known as inoculation: just as medical vaccines trigger antibodies in our immune
      system by injecting a severely weakened dose of a virus, the same can be achieved with information,
      cultivating “mental antibodies”. By demystifying the techniques that are used in the production
