    condition_num: 2
    factors:
      inclusion: disability compliant
    text: 'News brief:

      Pastamasta Kitchen Features Wheelchair-Using Patron in Latest Campaign, Citing New EU Regulations

      Amsterdam, 8 February 2026 — Casual dining chain Pastamasta Kitchen has refreshed its "Ready for
      Lunch" advertisement to feature a real customer who uses a manual wheelchair in their campaign,
