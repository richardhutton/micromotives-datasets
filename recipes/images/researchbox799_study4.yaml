    condition_num: 0
    factors:
      inclusion: control
    text: 'News brief:

      Pastamasta Kitchen Features Patron in Latest Campaign

      Amsterdam 8 February 2026 — Casual dining chain Pastamasta Kitchen has refreshed its "Ready for
      Lunch" advertisement to feature a real customer in their campaign.

      The ad, shown below it: "pastamasta" <image>'
