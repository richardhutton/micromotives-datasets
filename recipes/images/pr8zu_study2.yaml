study_id: pr8zu
source: osf
experiment: study2
title: 'Health warning labels (image, text, both or none) on six of twelve drinks: whether an alcoholic
  drink is chosen'
data_file: Alcohol study 2 full dataset.xlsx
licence: 'No licence stated on OSF (pr8zu). Author permission: Gareth Hollands, 2 Nov 2026, credit required.'
comparable_to_socsci210: false
participant_id_var: PID
notes: "Write recipes/images/pr8zu_study2.yaml: the alcohol drink choice (IMG03, alcohol).\n\nClarke,\
  \ Pechey, Mantzari, Hollands et al., Cambridge: \"Impact of health warning\nlabels communicating the\
  \ risk of cancer on alcohol selection: an online\nexperimental study\", Addiction 116 (2021) 41-52,\
  \ doi:10.1111/add.15072 (CC BY\n4.0). OSF pr8zu, Study 2. The sibling of k7tw5 Study 2 (snacks).\n\n\
  6,024 UK adults who drink beer or wine at least weekly said which they prefer,\nwere randomised (Qualtrics)\
  \ to one of four label groups, a 2 (image: present /\nabsent) x 2 (text: present / absent) design, saw\
  \ twelve drinks one at a time and\nthen \"all the 12 drinks simultaneously, in random order\", and chose\
  \ one (paper,\nPrimary outcome). Whether the drinks were beer or wine followed the stated\npreference.\n\
  \nEvery judgement is here, in code, so the recipe can be re-derived and reviewed:\n\n* ARMS. The deposit\
  \ has no codebook, and its `Condition` codes are NOT the\n  protocol's group numbers (the protocol's\
  \ control is group 4; in the deposit\n  the control is the code whose people were all re-randomised\
  \ for\n  acceptability, `Acceptability condition` 2-4). The paper's Table 3 ties each\n  code to its\
  \ arm by count and by alcoholic selections, all exact: 1 control\n  (1,510; 1,157), 2 text-only (1,511;\
  \ 926), 3 image-only (1,502; 728), 4\n  image-and-text (1,501; 837). Table 1's gender and weekly-units\
  \ columns agree\n  with the same mapping.\n* DRINK is a factor, as in Study 1: the preference column\
  \ decides which twelve\n  drinks were shown, so 4 x 2 = 8 arms, and the `drink` factor equals the\n\
  \  persona's preference for every participant (not a randomised contrast).\n  !! WHICH CODE IS BEER\
  \ IS A JUDGEMENT, OPEN: we are asking the authors. !!\n  The paper's Table 1 literally labels code 1\
  \ \"Wine\" (its counts match code 1\n  exactly). Everything else favours 1 = Beer, and that is what\
  \ is built:\n  gender, AUDIT, units, the protocol's option order and Study 1's labelled\n  coding. If\
  \ the authors say 1 = Wine, swap DRINKS and rebuild. The deposit holds\n  1/2 with no labels. The protocol\
  \ lists the options \"Beer, Wine\" (Qualtrics\n  codes options in order, 1 = Beer). Code 1 is 77% male\
  \ and drinks more per\n  occasion; in Study 1, where the deposit labels them, beer drinkers are 77%\n\
  \  male and wine drinkers 29%, the same split as codes 1 and 2 here (77% and\n  29%). Against that,\
  \ the paper's Table 1 prints \"Wine\" beside the code 1 counts\n  (667 in image-and-text); but that\
  \ table is not internally consistent (its\n  image-and-text age bands, 451 / 572 / 482, are within one\
  \ of the deposit's\n  CONTROL group, 451 / 571 / 483), so 1 = Beer, 2 = Wine.\n* WHICH LABELS. Bowel\
  \ Cancer 1, Breast Cancer 1 and Liver Cancer 2 are starred\n  \"(Label 1-3)\" in the authors' stimuli\
  \ file (AlcoholLabellingOnlineStudyStimuli\n  8.3.20.docx, the file the paper cites as https://osf.io/6dx2u/,\
  \ sha256\n  checked). Its label images are byte-identical to the Study 1 labels already\n  catalogued,\
  \ so the image-and-text arm cites pr8zu_s1_* ids. \"Each health\n  consequence was shown twice (i.e.\
  \ on two drinks)\" (paper); which drink carried\n  which label cannot be determined from source, so\
  \ no row claims a pairing.\n  TEXT-ONLY: the same words, no picture (stimuli file examples). IMAGE-ONLY:\
  \ the\n  same photographs with no words; the deposit holds them only inset on an\n  example wine bottle,\
  \ not as label files, so the rows describe them in words,\n  reusing the checked descriptions of the\
  \ Study 1 catalogue entries.\n* THE DRINKS are named from the packaging in the stimuli file's \"Product\n\
  \  selection\" images (wine: word/media image22-23; beer: image24-25). The paper\n  confirms the make-up:\
  \ six alcoholic, \"three different soft drinks and three\n  different alcohol-free beers or wines\"\
  . The alcohol-free ones carry an\n  \"Alcohol free\" sticker in those images, which the rows say. The\
  \ pictures are\n  not attached: they show the drinks in two separate lines-up with no labels,\n  a layout\
  \ nobody saw and, for the alcoholic drinks, a state only the control\n  arm saw.\n* OUTCOME. The instruction\
  \ is the protocol's: 'Imagine you are offered a drink.\n  Please select the drink you would prefer to\
  \ drink [today/now, or later\n  today]'; the bracket is a draft placeholder and the fielded wording\
  \ is NOT\n  deposited. Rendered as \"now or later today\", which is what the paper\n  supports (\"either\
  \ immediately or later on that day\"). A judgement: flagged. The deposit\n  records ONLY whether the\
  \ drink chosen was alcoholic (`Primary outcome`, 1 /\n  0), never which drink, so the response is that\
  \ and the question says so.\n* NOT BUILT. The secondary outcomes concern a single bottle \"with or without\
  \ a\n  HWL\" whose label the deposit does not record; acceptability re-randomised the\n  control group.\
  \ The time-pressure pairs are a second, sequential task. Desire\n  to drink was not asked in Study 2.\n\
  * PERSONA. Labels: gender from the paper's Table 1 (1 Male: 779 in\n  image-and-text; 4 is \"Prefer\
  \ not to say\"); ethnicity in the order and wording\n  of the k7tw5 Study 2 Legend (same lab, same questionnaire,\
  \ matched by Table 1:\n  White 1,401 ... prefer not to say 12 in image-and-text); education by the same\n\
  \  Legend, the protocol's options in the same order (as in snacks, the paper's\n  \"Bachelor's degree\
  \ or higher\" counts codes 5, 6 and 7); income letters by the\n  protocol table; AUDIT-C answers by\
  \ the protocol's own 0-4 scoring, worded as\n  the Study 1 deposit labels them; weekly units by Table\
  \ 1's bands (exact\n  counts). Age -999 (12 people) is a non-answer. Not mapped: unrounded BMI,\n  units\
  \ consumed, the AUDIT score (derived), `Date`.\n\n    uv run python scripts/gen_pr8zu_study2.py    \
  \        # write the recipe\n    uv run python scripts/gen_pr8zu_study2.py --check    # exit 1 if it\
  \ differs"
condition:
  source_vars:
  - Condition
  - Which alcohol do you prefer?
  factors:
  - label
  - drink
  shared_context: You are shown pictures of twelve drinks, six alcoholic and six non-alcoholic, first
    one at a time and then all together in random order.
  arms:
  - raw_values:
      Condition: 1
      Which alcohol do you prefer?: 1
    condition_num: 0
    factors:
      label: none
      drink: beer
    text: The drinks are beer. The six alcoholic beers are Fourpure American Pale, Cisk Export, Farsons
      Gold Label Pale Ale, Heineken, Pistonhead Full Amber and San Miguel Especial. The six non-alcoholic
      drinks are three alcohol-free beers, each with an "Alcohol free" sticker (San Miguel 0,0, Heineken
      0.0 and Pistonhead Flat Tire), and three soft drinks (J2O Orange & Passion Fruit, Appletiser and
      Coca-Cola). All twelve are in their original packaging, with no health warning labels.
    images: []
  - raw_values:
      Condition: 1
      Which alcohol do you prefer?: 2
    condition_num: 1
    factors:
      label: none
      drink: wine
    text: The drinks are wine. The six alcoholic wines are Jack & Gina Zinfandel Rosé, Tesco Merlot, Vicuña
      Sauvignon Blanc, Oyster Bay Merlot, The Straw Hat rosé and a Chilean Sauvignon Blanc. The six non-alcoholic
      drinks are three alcohol-free wines, each with an "Alcohol free" sticker (Eisberg Sauvignon Blanc,
      Morouj Merlot and Bon Voyage Pinot Noir Rosé), and three soft drinks (Cawston Press Apple & Mango,
      Coca-Cola and Bottlegreen Sparkling Elderflower Pressé). All twelve are in their original packaging,
      with no health warning labels.
    images: []
  - raw_values:
      Condition: 2
      Which alcohol do you prefer?: 1
    condition_num: 2
    factors:
      label: text only
      drink: beer
    text: 'The drinks are beer. The six alcoholic beers are Fourpure American Pale, Cisk Export, Farsons
