study_id: a4y7s
source: osf
experiment: study2
title: 'AI labels on news headline cards, UK sample: ten Facebook-style cards per person, true or false
  and human- or AI-written, with or without an AI-generated label and definition, each rated for sharing
  and accuracy'
data_file: a4y7s_study2_coded.xlsx
licence: No licence on OSF a4y7s; used with the author's written permission (Sacha Altay, 3 Nov 2026).
comparable_to_socsci210: false
participant_id_var: pid
notes: "Write recipes/images/a4y7s_study2.yaml: AI labels on headline cards, UK sample (IMG69).\n\nAltay\
  \ & Gilardi (2024), \"People are skeptical of headlines labeled as AI-generated,\neven if true or human-made,\
  \ because they assume full AI automation\", PNAS Nexus 3(10)\npgae403, doi 10.1093/pnasnexus/pgae403\
  \ (open access, PMC11443540). OSF project a4y7s\n(\"GenAI labels\"), folder \"Study 2\": the Qualtrics\
  \ survey (Materials/Qualtrics.qsf and a\nWord copy), the 40 card pictures (Materials/Headlines/{Control_A,\
  \ Control_B, Labels_A,\nLabels_B}), the raw Qualtrics export (Data and Stats/Raw/Data.xlsx), the six\
  \ Prolific\ndemographic exports it is merged with ({Left, Center, Right}_{UK, US}.csv), the\nauthors'\
  \ cleaning and analysis script (Script_clean.R) and their long file\n(data_clean.xlsx). Study 1 (US\
  \ only, a different design) is in the same deposit and is\nnot built here.\n\nStudy 2 ran on Prolific\
  \ on 20-21 March 2024 in the US and the UK, each sample in\nthirds by Prolific's political-affiliation\
  \ screener. THIS RECIPE BUILDS THE UK SAMPLE\nONLY: 1,500 people. Each saw ten Facebook-style news cards\
  \ (photograph, headline,\nlede, no source), one per page in random order, and on each page answered\
  \ a sharing\nquestion and then an accuracy question (1-6).\n\nEvery judgement is here, in code, so the\
  \ recipe can be re-derived and reviewed:\n\n* DESIGN. Two randomisations. Between people, one of five\
  \ instruction screens\n  (`FL_61_DO`): Control (no labels), No Definition (AI-generated cards labelled),\
  \ and\n  Weak, Medium and Strong (labelled, plus a definition of \"AI-generated\"). Then one of\n  two\
  \ sets of ten stories (`FL_72_DO` for Control, `FL_74_DO` for the rest): each of\n  ten stories exists\
  \ in a human-written and an AI-written version, and set A shows one\n  version of each story, set B\
  \ the other. Within the person, the ten cards. So one row\n  per person per card per question; the coded\
  \ file is LONG (`pid`, `card`).\n* WHICH CARD WAS SHOWN. Read from the instrument, never from the variable\
  \ names. Each\n  of the four card blocks (Control_A, Control_B, Label_A, Label_B) holds ten sharing\n\
  \  questions, each displaying one Qualtrics graphic, and ten accuracy questions. The 39\n  distinct\
  \ graphics were fetched from the survey's own graphic URL\n  (ipz.qualtrics.com/CP/Graphic.php?IM=<id>)\
  \ and each is the same picture as one OSF\n  card. The files are not byte-identical (Qualtrics re-encodes\
  \ uploads), so --catalogue\n  compares pixels: reduced to 64x64 grey by macOS sips, every graphic is\
  \ within 0.41\n  grey levels (of 255) of its card and at least 10.9 from any other. Two findings,\n\
  \  both from that check:\n  - Control_B's tenth sharing question shows the right card, the AI-written\
  \ FALSE\n    vaccine-injury card (set B's mirror of Control_A's human-written one), but is\n    MIS-TAGGED\
  \ `1_t_AI_nol_sha` (true, AI-written). Only the tag is wrong. The\n    authors' script reads veracity\
  \ from the tag, so their file codes it true; ours\n    shows what was on screen.\n  - Label_A's tenth\
  \ sharing question is tagged `10_f_h_nol_sha` (false, human-written)\n    but shows the same graphic\
  \ as Control_B's tenth: the AI-written vaccine-injury card\n    without a label. The human-written version,\
  \ which the OSF folder Labels_A holds,\n    was never shown to anyone in Label_A. So in the four labelled\
  \ arms, set A, one\n    AI-written card went unlabelled. The authors code it human-written.\n  Neither\
  \ changes a response; both change what a row says it showed, and the crosscheck\n  asserts both differences\
  \ rather than tolerating them.\n* WHICH ACCURACY ANSWER BELONGS TO WHICH CARD. Each block's randomisation\
  \ is\n  \"Advanced\": the ten sharing questions (which carry the pictures) are shuffled into\n  ten\
  \ fixed slots and the ten accuracy questions stay put, two questions per page. So\n  the accuracy question\
  \ `k_accuracy` asks about whichever card was shown on page k,\n  and the display-order string (`<block>_DO`)\
  \ says which that was; --prep asserts that\n  string has the fixed accuracy question in every second\
  \ place. The authors' script\n  makes the same reassignment. The accuracy question's own words (\"the\
  \ above\n  headline\") point to the card on its page.\n* CONDITION. The instruction screen, then (Weak,\
  \ Medium, Strong) the reminder screen,\n  then the card. Word-for-word from the .qsf (HTML stripped,\
  \ line breaks to spaces):\n  - shared_context is the instruction text every arm shares: \"Some headlines\
  \ may be\n    human-generated while others may be generated by artificial intelligence (AI). If\n  \
  \  you see AI-generated headlines, they will be explicitly labeled as such.\" The\n    screen's first\
  \ sentence, \"Next, you will be presented with 10 news headlines and\n    asked to answer a few questions\
  \ about them.\", is survey mechanics describing the\n    whole sequence and is DROPPED (docs/CONVENTIONS.md,\
  \ sequence signposting). The\n    Control and No Definition screens are the same words (checked).\n\
  \  - Weak, Medium and Strong add their definition (\"AI-generated means that: - ...\")\n    and then\
  \ the reminder screen (\"As a reminder, AI-generated headlines means that:\n    - ...\", the source's\
  \ grammar kept). Between the two, those arms answered two\n    questions about the definition (a comprehension\
  \ check); they are not narrated.\n  - Then words that are OURS, \"One of the headlines:\", the card's\
  \ words in quotation\n    marks, and the <image> marker. Nothing is said of the other nine cards or\
  \ where\n    this one sat; the display order is recorded but random.\n* ONE CONDITION, TWO ARMS. A Control\
  \ person and a No Definition person who saw the\n  same unlabelled card read the same instruction words\
  \ and the same picture, so their\n  rows are one condition (`raws` lists both codes). They differ only\
  \ in what ELSE the\n  person saw (labels on other cards), which a row cannot say; that spillover is\
  \ the\n  authors' RQ4 and is not built. In all, 90 conditions: 30 with no definition (20\n  unlabelled\
  \ cards, 10 labelled) and 20 for each definition (10 labelled AI-written\n  cards, 9 human-written cards,\
  \ and the unlabelled AI-written vaccine-injury card).\n* PICTURES. 30 distinct cards, the OSF files\
  \ unaltered: 10 stories x (human-written,\n  AI-written, AI-written with the label). Human-written cards\
  \ appear byte-identically\n  in a Control and a Labels folder; the Control copy is catalogued. One Qualtrics\n\
  \  graphic (the labelled veteran card) is a smaller copy, 900x898 against 1140x1138;\n  same picture.\n\
  * WORDS IN THE PICTURES (text_in_image). The label line, the headline and the lede,\n  word-for-word,\
  \ \" / \" between blocks, line wraps joined with a space (a hyphen at a\n  wrap is kept: \"Asian-Pacific\"\
  ). En and em dashes become \"-\". The source's spelling is\n  kept: \"teenagers ticket\", \"wasnt\"\
  , \"Ukraininan\", \"In just Few Weeks!\". Left out and\n  described instead: words inside photographs\
  \ and logos (the CDC backdrop, the Russian\n  slide, the airline's livery and boarding pass, the NATO\
  \ summit logos, brand names on\n  cans, the Us Weekly logo) and the letters AI inside the label's chip\
  \ icon. The Adele\n  collage's two caption boxes are printed text over the photographs and are kept.\n\
  * OUTCOMES. Two per card, in the order asked on the page: \"If you saw this post\n  online, how likely\
  \ would you be to share it?\" (1 Extremely unlikely .. 6 Extremely\n  likely) and \"How accurate is\
  \ the claim in the above headline?\" (1 Certainly false ..\n  6 Certainly true). Identical in all 40\
  \ copies of each (checked); no recode; forced\n  answers, no missing values among those built.\n* NOT\
  \ BUILT. The comprehension check (two questions on the definition: a check, not\n  an outcome); the\
  \ attention check; trust in news asked after the cards, what\n  \"AI-generated\" means and what should\
  \ be labelled (asked once, after all ten cards,\n  so no single card is their condition); Study 1; the\
  \ US sample.\n* WHO. The authors' exclusions, which the consent page supports: Progress 99 or 100\n\
  \  (the page says a person may withdraw \"before submitting your answers ... by closing\n  the browser\"\
  ; a response that stopped short was withdrawn) and the attention check\n  passed (`Attention_check_recoded`\
  \ not 0). Then the UK sample: the Prolific ID is in\n  one of the three UK exports. 1,500 people, none\
  \ duplicated; --prep asserts the count.\n  `pid` is the 1-based data row of Data.xlsx; the Prolific\
  \ ID is not carried.\n* PERSONA. Prolific's own records, stable facts collected before the study: age,\
  \ sex,\n  ethnicity (`Ethnicity simplified`, crosswalk scheme uk_ons_five_group_short),\n  employment\
  \ (scheme uk_prolific_rhfd6, the same Prolific export labels), student\n  status, country of birth,\
  \ nationality, and Prolific's UK political-affiliation\n  screener (Left, Centre, Right; the sample's\
  \ quota variable). Then the three trust\n  statements of the screen asked BEFORE the cards (Q6, \"To\
  \ what extent do you agree or\n  disagree with the following statements?\"), answers word-for-word (Strongly\n\
  \  disagree .. Strongly agree, seven points with \"Tend to\"): trust in news, in\n  journalists and\
  \ in news on social media. They are pre-treatment attitudes, the\n  authors' baseline for H3; they correlate\
  \ with the outcomes but no answer follows\n  from them. Left absent: DATA_EXPIRED (ethnicity 1, employment\
  \ 127, student status\n  51, nationality 1, country of birth 1). Prolific's \"Not in paid work (e.g.\n\
  \  homemaker', 'retired or disabled)\" has two stray quote marks from the export; they\n  are typography\
  \ and removed. Not mapped: country of residence (UK for everyone),\n  `Language` (the export does not\
  \ say whether it is first or fluent language), the\n  Prolific submission status.\n* UK FIT. The sample\
  \ is British and was fielded these cards deliberately, to test the\n  US finding outside the US. The\
  \ ten stories: a WHO alcohol claim, a US-funded\n  biolabs claim about Ukraine, a war veteran's medals,\
  \ Adele's weight loss, a CDC\n  vaccine-injury claim, Ontario's drinks-container deposit scheme, a Bangladeshi\n\
  \  labour leader's death, British recruiters, American Airlines and \"skiplagging\", and\n  NATO's Asia-Pacific\
  \ partners. Three are about North American institutions (the CDC,\n  a US airline's domestic route,\
  \ Ontario and \"The Beer Store\"). The catalogue note\n  calls one card US-specific without naming it;\
  \ three qualify, so all three are\n  flagged here. All are kept as fielded: the\n  outcomes ask whether\
  \ the claim seems accurate and whether one would share the post,\n  which a UK reader can judge without\
  \ local knowledge, and dropping a card would cut\n  every person's set below the ten they saw. Flagged,\
  \ not hidden: the US/Canadian\n  cards measure how UK readers judge foreign news. American spelling\
  \ on the cards is\n  the source's (\"labor\", \"honor\", \"canceled\").\n* NOT ASKED OF JEV. Assignment,\
  \ card identity, persona and non-answer codes are\n  settled by the .qsf flow, pixel comparison, Prolific's\
  \ export labels and existing\n  crosswalk precedents; no paid call.\n\n    uv run python scripts/gen_a4y7s_study2.py\
  \ --prep       # (re)write the coded long .xlsx\n    uv run python scripts/gen_a4y7s_study2.py --catalogue\
  \  # check graphics, write images.json entries\n    uv run python scripts/gen_a4y7s_study2.py      \
  \        # write the recipe\n    uv run python scripts/gen_a4y7s_study2.py --check      # exit 1 if\
  \ it differs"
