study_id: 4hjcf
source: osf
title: 'Social corrections under false and true news posts: no comment, a correction with few or many
  likes, or with a fact-check link (UK, 2022)'
data_file: 4hjcf_wide.csv
licence: 'None stated: OSF 4hjcf gives no reuse terms. The authors were emailed for permission; built
  under rich''s ruling of 9 Nov 2026 that an unstated licence does not block an image build.'
comparable_to_socsci210: false
participant_id_var: ResponseId
notes: "Write recipes/images/4hjcf.yaml: social corrections under false and true news posts (IMG57).\n\
  \nStoeckel, Stöckli, Ceka, Ricchi, Lyons and Reifler, \"Social corrections act as a\ndouble-edged sword\
  \ by reducing the perceived accuracy of false and real news in the UK,\nGermany, and Italy\", Communications\
  \ Psychology 2 (2024) 10, doi:10.1038/s44271-024-00057-w,\nthe UK experiment (\"Experiment 1\"). OSF\
  \ 4hjcf, \"Social correction - an online experiment\nin the UK\": the Qualtrics export (analyses/data.csv,\
  \ semicolon-separated, cp1252), the\nauthors' six rendered R Markdown analyses (analyses/*.html), the\
  \ pre-registration and its\nupdate (methods/pre-reg.pdf, \"pre-reg update .pdf\") and the stimuli\n\
  (methods/posts/stimuli_osf.zip: 13 folders, four PNGs each). Pre-registered as OSF fpm2e\n(12 July 2022).\
  \ Dynata UK online panel, fielded 11-26 July 2022. No questionnaire is\ndeposited (the pre-registration's\
  \ \"uploaded questionnaire\" is not on OSF either; the\nregistration holds no files).\n\nEvery judgement\
  \ is here, in code, so the recipe can be re-derived and reviewed:\n\n* DESIGN. Within person. Each respondent\
  \ saw nine posts: true post 1, three false posts\n  (Qualtrics flow randomiser FL_7, 3 of 10), true\
  \ post 2, three false posts (FL_51, 3 of\n  10), true post 3 (the paper's \"Social media post assessment\
  \ task\"). Each post block\n  showed ONE of four PNGs, chosen by an in-block randomiser whose display-order\
  \ columns\n  are `<post>_DO_<post>_control / _sc / _sca / _scp`: exactly one of the four is set for\n\
  \  every respondent who reached the post (checked: never two, and never an answer\n  without one). After\
  \ the picture, three questions in a fixed order (their DO columns\n  are the constants 2, 3, 4): accuracy,\
  \ like, share.\n* WHICH ARM IS WHICH PICTURE (proven, not guessed). The data's arm suffixes are decoded\n\
  \  by the authors' own code, printed in analysis_truenews_osf.html and parsed here:\n  `grepl(\"scp\"\
  ) ~ 3`, `grepl(\"sca\") ~ 2`, `grepl(\"sc\") ~ 1`, `grepl(\"control\") ~ 0`,\n  then revalued 0 \"control\"\
  , 1 \"low ampl\", 2 \"high ampl\", 3 \"ampl+link\". The stimulus\n  files are named the same way in\
  \ every folder: control.png, \"low amp(lification)\",\n  \"high amp(lification)\" and \"high amp(lification)\
  \ + debunk(ing)\" / \"+ link\". So sc = the\n  low-amplification file, sca = high, scp = high + link.\
  \ Independent witness: the\n  per-arm effects in this deposit reproduce the paper's Table 1 under that\
  \ decoding and\n  under no other of the six permutations (`effects()`, crosscheck below).\n* WHICH POST\
  \ IS WHICH FOLDER (proven). The data's `post_k` (k = 1, 2, 3, 5, 6, 8, 10,\n  11, 12, 13) and `realpost_k`\
  \ (k = 1-3) are the folders \"Stimulus FALSE NEWS k\" and\n  \"Stimulus TRUE NEWS k\": the same ten\
  \ numbers, gaps included. Two witnesses: the\n  authors' congeniality code ties each false post to the\
  \ opinion it is congenial to\n  (1 NHS; 2, 3, 8, 10 vaccines; 5 Brexit; 6, 11 climate; 12, 13 Russia),\
  \ parsed here\n  and asserted against each folder's topic; and their true-news labels (1 \"effective\n\
  \  covid booster\", 2 \"monkeypox cases rise\", 3 \"covid jab and blood clot\") match the\n  three true\
  \ folders' pictures. The paper's Supplementary Table 36 lists the UK false\n  headlines in the same\
  \ order (1 Track & Trace ... 13 MFA Russia).\n* THE TREATMENT IS IN THE PICTURE. Each of the 52 PNGs\
  \ is a complete mock Facebook or\n  Twitter screenshot (made with zeoob.com, names and faces generated,\
  \ per the paper):\n  the post, and in the treatment arms a corrective comment (a \"miscorrection\" under\
  \ a\n  true post) above a second, supporting comment, with like counts, and in the link arm\n  a link\
  \ card under the correction. Nothing was overlaid by the survey. So each arm is\n  its picture; its\
  \ words are transcribed in the catalogue (`text_in_image`) and quoted\n  in the condition. Low and high\
  \ amplification differ in the correction's like count,\n  but not ONLY there: in several posts the supporting\
  \ comment's count, a comment's age\n  or one word also differs between files (post 1: 5 vs 6 likes;\
  \ post 5: 10 vs 1 likes\n  and 7h vs 4h; post 8: \"Seema\" vs \"Seems\"). The transcription records\
  \ each file as it\n  is; nothing is harmonised.\n* WORDS IN THE PICTURES (text_in_image). Every word\
  \ the platform or a person wrote:\n  names, handles, the post's own text and the words of its graphic,\
  \ time stamps, the\n  reaction, comment, share, retweet and like counts (the like counts ARE the\n \
  \ manipulation, so unlike be8a2 they are transcribed), comments, Facebook's\n  \"Like\"/\"Comment\"\
  /\"Share\"/\"Like · Reply · 7h\"/\"View more N Comments\"/\"Write a\n  comment...\", and on a link card\
  \ its source name and headline (and description line\n  where it has one). \" / \" separates blocks;\
  \ line wraps inside a block are joined with a\n  space; curly quotes and apostrophes are straightened,\
  \ \"…\" is written \"...\", and the\n  middle dot is spaced \" · \" (typography, CONVENTIONS). Every\
  \ word legible at the\n  file's own resolution is transcribed (ledger 153), including words inside a\n\
  \  photograph (the phone's \"NHS Test and Trace\", the vial's \"Moderna COVID-19 Vaccine\",\n  the ship's\
  \ \"TOKATU NELSON\", the generators' \"YADX166\" and \"aggreko\", the lectern's\n  \"Pfizer\", the vials'\
  \ \"COVID-19 VACCINE\"), a link card's kicker, byline and date, and\n  a video's logo and caption. Two\
  \ dates were read from blurred type and confirmed\n  outside the picture: false 5's \"10 NOVEMBER 2021\"\
  \ is the publication date of the\n  Full Fact article the card shows (fullfact.org/online/Brexit-EU-fishing-fuel-\n\
  \  subsidies, dated 10 Nov 2021 by the CIMPLE claim-review index); false 2's \"21\n  OCTOBER 2021\"\
  \ is read from the file alone. Left out, because they cannot be read or\n  are too many to transcribe\
  \ faithfully, and listed per picture in `UNQUOTED`: the\n  small print on vial labels, false 6's cut-off\
  \ orange letters, false 8's link-card\n  date line (about 6 pixels high; a checker read \"NOVEMBER 16,\
  \ 2021 / 8:20 PM /\n  UPDATED 9 MONTHS AGO\", which this maker could not confirm digit by digit, so\
  \ it is\n  not quoted), post 12's map, post 13's photographed documents, and two tiny marks in\n  link-card\
  \ photographs. Icons and emoji are not words. Typos are the source's\n  (\"Twitter for Adroid\", \"\
  @robertashcraft\", \"14:17 PM\", \"Seema Yeadon\", \"shi££\").\n* CONDITION. The task instructions are\
  \ not in the deposit (the paper says only that\n  respondents were \"asked to imagine that these posts\
  \ came up in their feed\"), so\n  nothing of them is quoted. Words that are OURS: 'You are shown a social\
  \ media post:\n  \"...\" <image>', and for a picture holding words not quoted (`UNQUOTED`) 'You are\n\
  \  shown a social media post (not every word in it is quoted here): \"...\" <image>'. The\n  clause\
  \ says only that the quotation is partial; it never says what the missing words\n  are (a condition\
  \ does not describe a picture, ledger 158); the catalogue's\n  `description` names them. No shared context.\n\
  * OUTCOMES. 13 posts x 3 questions = 39 outcomes, each with its post's own assignment\n  column (`Outcome.condition_var`,\
  \ the within-subject design). Wording from the\n  pre-registration's table of dependent variables, the\
  \ only deposited source; the paper\n  prints the same words. Accuracy \"To the best of your knowledge,\
  \ how accurate is the\n  claim in the above headline?\" 1-4 (pre-registration: \"not at all accurate/not\
  \ very\n  accurate/somewhat accurate/very accurate\"); like and share 1-5, \"1 = not at all\n  likely,\
  \ 5 = very likely\". Direction: false posts' accuracy is lower than true posts'\n  and every correction\
  \ arm lowers it, as the paper reports (1 = not at all accurate).\n* WHO, AND WHAT IS LEFT OUT. Every\
  \ respondent who reached a post; non-finishers' answers\n  to the posts they did see are kept (the melt\
  \ drops a blank answer). 9 people took the\n  survey twice under one panel id (`psid`); each attempt\
  \ is its own response\n  (`ResponseId`, the participant id) and is kept, as the authors did. EXCLUDED:\
  \ any\n  false post that BOTH flow randomisers drew for a person. FL_7 and FL_51 drew three\n  posts\
  \ each, independently, so the draws overlap for 1,429 of the 2,011 who finished\n  (1,030 by one post,\
  \ 383 by two, 16 by three); the data hold one answer and one arm for\n  such a post. Over everyone,\
  \ 1,888 person-post pairs, 1,464 people, 5,660 answers. Qualtrics shows a block reached a second time\
  \ again, with the earlier\n  answers pre-filled and editable, and keeps only the last answers (Qualtrics\
  \ support,\n  \"Question Blocks\" in Survey Flow). So the recorded answer may have been given on a\n\
  \  second viewing, and whether the second showing drew the same arm is not recorded:\n  the row's condition\
  \ cannot be verified (ledger 143, 150). Counted in\n  `double_drawn()`; the authors analysed these pairs\
  \ as single exposures.\n* PERSONA. Only what the source labels: `age_scr` (6 bands), `gender_scr`, `edu_scr`\n\
  \  (3 groups), all asked before the posts. No value labels are deposited; the codes are\n  read from\
  \ the paper's Supplementary Table 11 (demographics of the UK experiment),\n  whose counts reproduce\
  \ the codes' order (age 235, 285, 344, 355, 310, 415 for codes\n  1-6; education 771, 530, 643 for 1-3)\
  \ and from the authors' code (`gender_scr == 1 ~\n  \"female\"`, `== 2 ~ \"male\"`). Code 4 is the only\
  \ other gender code; Table 11's third\n  row is \"Non-binary / third gender / other\". Education's groups\
  \ are Table 11's note,\n  word-for-word. NOT mapped: `region_scr` (12 codes, no labels anywhere), `party`\n\
  \  (11 codes; the authors' recode names only code 1 and its other branches are\n  mis-keyed on `post`),\
  \ `leftright` (0-10, endpoints unknown), and the attitude\n  batteries (opinion_*, antiexpert_*, ssi_*,\
  \ crt_*, russia_feeling_1, ukraine_war),\n  whose code directions are not documented.\n* UK FIT, per\
  \ post. Fielded in the UK on a UK sample, most posts are UK stories (NHS\n  Test and Trace, Brexit fishing\
  \ fuel, COP26 in Glasgow, UK monkeypox, a UK inquest).\n  Two are not: false post 2 is a US story (a\
  \ Delta pilot) whose supporting comment\n  names Biden, and false post 10 is set in a New York hospital;\
  \ false posts 12 and 13\n  are Russia-Ukraine war disinformation. Flagged for the lead, not removed:\
  \ they were\n  what UK respondents saw.\n* LICENCE. None stated on OSF 4hjcf. The authors have been\
  \ emailed; built under\n  rich's standing ruling that an unstated licence does not block a build.\n\n\
  \    uv run python -I scripts/gen_4hjcf.py --prep       # images + derived wide CSV\n    uv run python\
  \ -I scripts/gen_4hjcf.py --catalogue  # (re)write this study's images.json entries\n    uv run python\
  \ -I scripts/gen_4hjcf.py              # write the recipe\n    uv run python -I scripts/gen_4hjcf.py\
  \ --check      # exit 1 if recipe or wide CSV differ"
