study_id: pr8zu
source: osf
experiment: study1
title: 'Pictorial health warning labels on beer or wine: 21 labels (7 harms x 3 photographs)'
data_file: Full dataset alcohol labelling study 1.xlsx
licence: none stated (OSF deposit pr8zu). Permission granted by the authors for research use (data/catalog/image_contacts.json,
  hollands).
comparable_to_socsci210: false
participant_id_var: Participant ID
notes: "Write recipes/images/pr8zu_study1.yaml: alcohol health warning labels (IMG01).\n\nClarke, Pechey,\
  \ Hollands et al., Cambridge: \"The impact of health warning labels\non alcohol selection: two online\
  \ experimental studies\", OSF pr8zu, Study 1. Results\nin Pechey et al. 2020, BMC Public Health 20:376\
  \ (PMC7114781), Table 3. The\nsibling of IMG02 (k7tw5, snacks): same lab, same design, same paper.\n\
  \nUK adults who drink beer or wine at least weekly were asked which they prefer;\neach then saw \"an\
  \ image of beer or wine (depending on preference) accompanied by\none of 21 different pictorial HWLs\"\
  \ (protocol v1.7, Study 1 procedure) and rated\nit. The deposit holds 5,537 people; the paper reports\
  \ 5,528.\n\nEvery judgement is here, in code, so the recipe can be re-derived and reviewed:\n\n* ARMS.\
  \ Two columns jointly define what a person saw. `Label Condition` (text,\n  \"Bowel cancer 2\"; coded\
  \ like a .sav by `sources.excel`) is the randomised label:\n  7 harms x 3 photographs. `Which alcohol\
  \ do you prefer?` (Beer/Wine) is NOT\n  randomised, but the protocol says it decided which drink the\
  \ label was shown on,\n  so it is part of the condition and a factor: 21 x 2 = 42 arms, every code looked\n\
  \  up BY LABEL. The images were matched to captions by document order in\n  \"Additional File Alcohol\
  \ HWLs.docx\" (each caption sits below its image), and\n  every caption was read against the words printed\
  \ on its image. The per-label\n  means reproduce the paper's Table 3 under the same names (Bowel Cancer\
  \ 1 highest\n  arousal, 4.76 vs 4.77; Breast Cancer 3 lowest, 3.65 vs 3.65; Bowel Cancer 1 least\n \
  \ supported, 3.50 vs 3.51), which ties the data's label names to the paper's.\n  Which photograph is\
  \ which within a harm rests on the caption order alone.\n  Because the drink follows preference, the\
  \ `drink` factor equals the persona's\n  alcohol preference for every participant: it is not a randomised\
  \ contrast.\n* CONDITION. The protocol calls the drink \"an image of an alcoholic beverage\n  (either\
  \ beer or wine)\"; the deposit does not hold that picture, nor the brand,\n  so the text says which\
  \ drink it was and the image is the label alone. The words\n  on the label are quoted word-for-word.\
  \ \"The drink is beer.\" / \"The drink is\n  wine.\" are our words, true for every row in their arm.\n\
  * OUTCOMES. Wording and endpoint labels from the protocol's Appendix 1, Study 1.\n  The arousal items\
  \ say \"the label on this bottle\" for beer and wine alike; that\n  is the protocol's wording and is\
  \ kept. Support is listed a (Strongly support) ..\n  g (Strongly oppose) but the deposit holds it \"\
  scored 1-7\"; the paper classes\n  ratings above 4 as acceptable and reports the bowel-cancer labels\
  \ least\n  acceptable, and in the deposit people answering 7 have the highest arousal\n  (mean 5.09\
  \ against 3.73 at 1) and the lowest AUDIT score, so 7 = Strongly\n  support. A judgement: flagged for\
  \ the checker. One `uncomfortable` cell holds\n  only spaces; `sources.excel` reads it as blank and\
  \ the row is dropped.\n* DESIRE TO DRINK IS NOT BUILT. \"How much do you want to drink this wine/beer\n\
  \  right now?\" is stored as codes 1, 2, 3, 4, 5, 8, 9: seven answers, no 6 or 7.\n  The paper's means\
  \ (e.g. Breast Cancer 3, 3.73) are the means of those raw codes,\n  so the paper averaged an 8 and a\
  \ 9 on a 7-point scale and cannot say which code\n  is which point. The deposit cannot either: drinking\
  \ measures rise with code from\n  1 to 4, then run 9 < 8 ~ 5 (AUDIT Q2 1.25, 1.40, 1.68, 1.76; median\
  \ units 14,\n  18, 29, 28), which suggests the order 1,2,3,4,9,8,5 rather than 1..5,8,9. No\n  mapping\
  \ is supported by the source, so none is written (Never fabricate).\n  Recoverable if the authors confirm\
  \ their Qualtrics coding.\n* PERSONA. The income key is a table image in the protocol\n  (data/raw/pr8zu/protocol_media/image4.jpeg),\
  \ identical to k7tw5's; transcribed\n  below per year. Education's Bachelor label is mis-encoded in\
  \ the deposit\n  (\"Bachelorâ€™s\"); restored to the protocol's own curly apostrophe. Education is\n\
  \  blank for 235 people; the protocol offered \"None\" and \"Prefer not to say\" and\n  the data has\
  \ neither as a label, so a blank MAY mean no qualifications. Left\n  absent rather than guessed. The\
  \ three AUDIT-C answers and the drink preference\n  are mapped as recorded. NOT mapped: BMI (unrounded\
  \ floats, as in k7tw5), weekly\n  units consumed and purchased (unrounded floats to 4 dp), the AUDIT\
  \ scores and\n  `Ethnicity Code` (derived from mapped answers), `Date`, and `Health condition\n  group`\
  \ (an Excel fill-down artefact: \"Bowel cancer\" ... then \"7 types of\n  cancer\", \"8 types of cancer\"\
  , ... \"800 types of cancer\").\n* PHOTO is a factor (1-3 within each harm), expressed only by the picture:\
  \ the\n  three photographs of a harm share their words. QC rules 1 and 5 compare words\n  AND images.\
  \ Split on condition_num or the image id, never the condition string.\n\n    uv run python scripts/gen_pr8zu_study1.py\
  \            # write the recipe\n    uv run python scripts/gen_pr8zu_study1.py --check    # exit 1 if\
  \ it differs"
