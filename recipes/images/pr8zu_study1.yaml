outcomes:
- var: N.E.A 'afraid' (1-7)
  task_num: 0
  question: How afraid does the label on this bottle make you feel?
  scale:
    min: 1
    max: 7
    min_label: Not at all afraid
    max_label: Very afraid
- var: N.E.A 'worried' (1-7)
  task_num: 1
  question: How worried does the label on this bottle make you feel?
  scale:
    min: 1
    max: 7
    min_label: Not at all worried
    max_label: Very worried
- var: N.E.A 'uncomfortable' (1-7)
  task_num: 2
  question: How uncomfortable does the label on this bottle make you feel?
  scale:
    min: 1
    max: 7
    min_label: Not at all uncomfortable
    max_label: Very uncomfortable
- var: N.E.A 'disgusted' (1-7)
  task_num: 3
  question: How disgusted does the label on this bottle make you feel?
  scale:
    min: 1
    max: 7
    min_label: Not at all disgusted
    max_label: Very disgusted
- var: Acceptability (scored 1-7)
  task_num: 4
  question: Do you support or oppose putting this label on alcohol?
  scale:
    min: 1
    max: 7
    min_label: Strongly oppose
    max_label: Strongly support
    mid_label: Neither oppose nor support
