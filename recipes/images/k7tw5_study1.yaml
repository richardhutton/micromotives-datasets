study_id: k7tw5
source: osf
experiment: study1
title: 'Pictorial health warning labels on a chocolate bar: 18 labels (6 harms x 3 photographs)'
data_file: Food labelling study 1 final dataset.xlsx
licence: none stated (OSF deposit k7tw5). Permission granted by the authors for research use (data/catalog/image_contacts.json,
  hollands).
comparable_to_socsci210: false
participant_id_var: PID
notes: "Write recipes/images/k7tw5_study1.yaml: the first image experiment (IMG02).\n\nHollands, Clarke,\
  \ Pechey et al., Cambridge: \"The impact of health warning labels\non snack selection: two online experimental\
  \ studies\", OSF k7tw5, Study 1. Results\nin Pechey et al. 2020, BMC Public Health 20:376 (PMC7114781).\n\
  \n4,618 UK adults who eat energy-dense snacks weekly and like chocolate were\nrandomised to \"view an\
  \ image of a chocolate bar accompanied by one of 18 different\npictorial HWLs\" (protocol v1.8, Study\
  \ 1 procedure) and rated it on six items.\n\nEvery judgement is here, in code, so the recipe can be\
  \ re-derived and reviewed:\n\n* ARMS. The data's `Label ` column holds text (\"Bowel cancer 2\"); `sources.excel`\n\
  \  codes it like a .sav. Each arm's code is looked up BY LABEL, never typed. The 18\n  labels are 6\
  \ harms x 3 photographs. Their images were matched to captions by\n  document order in \"Additional\
  \ File Food HWLs.docx\" (each caption sits below its\n  image) and every caption was read against the\
  \ words printed on the image; the\n  per-label means then reproduce the paper's (Bowel cancer 1 and\
  \ 2 both 4.59\n  negative arousal, Obesity 1 lowest at 3.12, Type 2 diabetes 3 most supported at\n \
  \ 4.55), which ties data labels to captions.\n* CONDITION. The words printed on the label are quoted\
  \ word-for-word in the text,\n  and the label itself is the image. The chocolate bar it sat beside is\
  \ not in\n  the deposit, so the text says it was there and the image is the label alone.\n* OUTCOMES.\
  \ Wording and endpoint labels from the protocol's Appendix 1. Support\n  is asked a (Strongly support)\
  \ .. g (Strongly oppose) but the deposit holds it\n  \"scored 1-7\"; the paper classes ratings above\
  \ 4 as acceptable and reports the\n  bowel-cancer labels least acceptable, so 7 = Strongly support.\
  \ A judgement:\n  flagged for the checker.\n* PERSONA. Income is stored as letters A-O; the key is a\
  \ table image in the\n  protocol (data/raw/k7tw5/protocol_media/image5.jpeg), transcribed below per\n\
  \  year. Education's Bachelor label is mis-encoded in the deposit (\"Bachelorâ€™s\");\n  restored to\
  \ the protocol's own curly apostrophe. BMI is NOT mapped: the deposit\n  stores it unrounded to 15 digits\
  \ and the melt renders raw values (debt: 4,618\n  people). \"Consumption Frequency\" (Daily/Weekly)\
  \ is not mapped: the deposit does\n  not say what it summarises. Education is blank for 262 people and\
  \ -888 for 24;\n  the protocol offered \"None\" and \"Prefer not to say\" and the data has neither,\
  \ so\n  a blank MAY mean no qualifications. Left absent rather than guessed.\n* PHOTO is a factor (1-3\
  \ within each harm), expressed only by the picture: the\n  three photographs of a harm share their words.\
  \ QC rules 1 and 5 compare words\n  AND images. Split on condition_num or the image id, never the condition\
  \ string.\n\n    uv run python scripts/gen_k7tw5_study1.py            # write the recipe\n    uv run\
  \ python scripts/gen_k7tw5_study1.py --check    # exit 1 if it differs"
condition:
  source_var: 'Label '
  factors:
  - harm
  - photo
  shared_context: You are shown a picture of a chocolate bar accompanied by a health warning label.
  arms:
  - raw: 4
    condition_num: 0
    factors:
      harm: bowel cancer
      photo: '1'
    text: 'The label reads: "Excess calories cause obesity which causes bowel cancer". <image>'
    images:
    - k7tw5_s1_bowel_cancer_1
  - raw: 5
    condition_num: 1
    factors:
      harm: bowel cancer
      photo: '2'
    text: 'The label reads: "Excess calories cause obesity which causes bowel cancer". <image>'
    images:
    - k7tw5_s1_bowel_cancer_2
  - raw: 6
    condition_num: 2
    factors:
      harm: bowel cancer
      photo: '3'
    text: 'The label reads: "Excess calories cause obesity which causes bowel cancer". <image>'
