    task_num: 0
    question: "[IF indmode=1 INSERT: Now think about anyone - either living with you or not living with you - who is sick, disabled or elderly whom you look after or give special help to. Typically, how many hours do you spend on the following care activities for them each week?; IF indmode=2 INSERT: Now think about anyone - either living with you or not living with you - who is sick, disabled or elderly whom you look after or give special help to. Typically, how many hours do you spend on the following care activities for them each week?; IF indmode=3 INSERT: Now think about anyone - either living with you or not living with you - who is sick, disabled or elderly whom you look after or give special help to. Typically, how many hours do you spend on the following care activities for them each week? If none, just enter zero.] Household activities (such as cooking, cleaning, laundry)"
    scale: {min: 0, max: 168}
