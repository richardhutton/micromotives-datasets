notes: "TESS 036 (Calarco). A 2 x 3 x 2 between-subjects vignette design (12 cells):\n  status   \
  \      - high (lawyer) / low (supermarket cashier)\n  drinking       - none / light (one glass)\
  \ / heavy (two glasses)\n  doctor_warning - absent / present (she recalls her doctor's advice)\n\
  \nArm texts composed from the verbatim VIGNETTE VERSION blocks in\n'[8041.033.035.036] TESS Combined_v10clean.txt'\
  \ (lines 525-570). The source\nvignettes are themselves templated - one frame with three slots -\
  \ so composing\nfrom the verified fragments mirrors how the instrument was built.\n\nQ7 and Q8 quote\
  \ the drinking level inline ('Megan's decision to [drink only\nwater/sip one glass of wine/finish\
  \ two glasses of wine]'). The condition text\nalready states what she drank, so the questions refer\
  \ to 'Megan's decision'\nwithout the insert - unambiguous, and it avoids needing per-arm-per-outcome\n\
  wording.\n\nJev flagged CALARCO_VIGNETTE as the assignment variable at confidence 0.80\nafter the\
  \ option list was widened; an earlier keyword shortlist had excluded\nit and produced a confident\
  \ wrong answer (BLOCKORDER2 at 0.99)."
