    text: Megan is a 27-year-old lawyer. One Friday, after a long day at the office, a few of Megan's
      co-workers invite her to join them at a nearby bar for drinks. Megan is seven months pregnant
      with her first child - but she agrees to tag along. At the bar, Megan and her colleagues swap
      stories and talk about possible names for Megan's baby. While chatting, Megan drinks only water.
