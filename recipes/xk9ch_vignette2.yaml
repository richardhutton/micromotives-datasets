    task_num: 0
    question: "How well do you think the following terms describe Jacob? \"Feminine\""
    scale: {min: 1, max: 7, min_label: "Not at all", max_label: "Very Well"}
  - var: Q10
    task_num: 1
    question: "How well do you think the following terms describe Jacob? \"Masculine\""
    scale: {min: 1, max: 7, min_label: "Not at all", max_label: "Very Well"}
