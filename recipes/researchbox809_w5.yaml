notes: 'ResearchBox 809, "Periodic Corporate Donations" (https://researchbox.org/809), Zenodo record 21934081.
  The paper is not named in the box and was not read.


  GENERATED by scripts/gen_researchbox809.py; every judgement is in its docstring. W5. Another moderator
  (AsPredicted #186611; Prolific, August 2024; US sample). 1,643 people kept by the authors'' .rmd (Status
  0, Finished 1, the recall check answered right for the arm). Between-person: one scenario each, assigned
  by the .qsf''s randomisers (condition, cond2; every recorded fill checked against the .qsf for every
  kept row). The row is every text screen from the scenario''s first screen to the reminder at the top
  of the measure page, word-for-word with its piped fields filled; the welcome screen, consent and id
  are dropped; bullets are written as lines starting ''- ''. Not built: the commitment, impact and skepticism
  blocks that follow the admire/favor/positive page, shown in a block order the .qsf randomises and the
  deposit does not record, so their rows would follow earlier questions that cannot be narrated in order;
  and the recall check (attention, used only for the exclusion). Pending rich''s ruling (20 Nov 2026:
  the later blocks are built for the A/B studies, 3 and W4, only).


  Wording from W5. Another moderator.qsf (the blocks the survey flow reaches). Typography normalised (HTML,
  non-breaking spaces, curly quotes); bold and underline dropped. Data: W5. Another moderator.csv. Persona:
  age (years; outside 18-100 left blank) and gender (the .qsf''s labels; ''Prefer not to say'' left blank).
  US sample, US dollars; invented companies.'
