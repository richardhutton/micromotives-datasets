study_id: researchbox3299
source: researchbox
experiment: study3
title: 'Gym membership: a sure $5 off training or a 10% chance it is free, after a small or large membership
  discount (Study 3)'
data_file: researchbox3299_study3.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/3299 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); archived as Zenodo doi:10.5281/zenodo.15453383. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Gaertig C & Simmons JP (2025), "Why (and When) Are Uncertain Price Promotions More Effective Than
  Equivalent Sure Discounts?", Journal of Consumer Research, doi:10.1093/jcr/ucaf036. ResearchBox 3299
  (https://researchbox.org/3299).


  GENERATED by scripts/gen_researchbox3299.py; every judgement is in its docstring. Study 3, Prolific,
  March 2023. A gym membership costing $40/month (with $4 off) or $480/year (with $48 off), plus $50 of
  personal training with a choice of $5 off or a 10% chance it is free. The wealth question and the promotion
  choice were asked on separate pages, in a randomised and recorded order (WQfirst); the second-asked
  one''s condition repeats the scenario as the second page did, after the narration ''You were asked "<earlier
  question>" You were then shown the scenario again:'' (ours). 2,221 of 2,925 kept (do file: 274 duplicate
  IPs, 55 duplicate Prolific IDs, then those who did not answer the rating). Rating: 1 = Definitely Promotion
  A (shown first) to 6 = Definitely Promotion B.


  Wording from the .qsf (Qualtrics_Study_3.qsf; its twin export has the same questions, see the docstring).
  Typography normalised (curly quotes, non-breaking and zero-width spaces). Persona: age (years; outside
  18-100 left blank) and gender, labels from the .qsf''s own choices.'
