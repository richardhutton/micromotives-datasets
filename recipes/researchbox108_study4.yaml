notes: 'Barnes AJ, Shavitt S (2024), "Top Rated or Best Seller? Cultural Differences in Responses to Attitudinal
  versus Behavioral Consensus Cues", Journal of Consumer Research 51(2):276-297, doi:10.1093/jcr/ucad074.
  ResearchBox 108 (https://researchbox.org/108).


  GENERATED by scripts/gen_researchbox108.py; every judgement is in its docstring. Study 4 (its .qsf created
  Feb 2023), 148 people: the deposit''s 153 rows less 5 that answered neither question (both were optional).
  No manipulation, so one condition: everyone read the same scenario and answered two questions on consecutive
  pages in a fixed order, which question is more important, then more relevant, 1 to 6 with the ends labelled.
  The second row narrates the first question as asked, in words of OURS: ''You were asked "Which of these
  criteria do you think is more important to consider?"''. Not built: the 16 culture items asked before
  the scenario (a measured moderator) and race (select all that apply). The .qsf also holds, outside the
  survey flow, copies of both questions with the ends reversed; the in-flow ones are used, and the codebook''s
  direction agrees. The deposit has no pre-registration for this study (only Study 2 has one), and every
  person with an answer is kept.


  Wording from Study 4 materials.qsf, read through the survey flow. Every picture in the flow is decorative
  (listed in the generator) and none is on the condition''s or the outcome''s screen. Typography normalised
  (HTML entities, non-breaking spaces). Persona: age (the .qsf validates 16-100) and gender, labels from
  the .qsf''s own choices.'
