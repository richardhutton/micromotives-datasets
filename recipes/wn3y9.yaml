notes: |-
  TESS3 221 (Samara Klar; GfK KnowledgePanel), "Untangling a Dislike for the
  Opposing Party". The .sav has 2,136 rows (708 fresh, 1,428 recontacted from
  TESS 197; X20271), CaseID unique. Deposit OSF wn3y9, KlarBRIEF70.zip: the
  .sav, the fielded questionnaire
  "310.209.00988.1_TESS3221_Klar_Northwestern_University _v1.00.docx", the
  response rate report; "Klar BR70.pdf" is the proposal.

  Line citations are 1-based line numbers in
    Q = "310.209.00988.1_TESS3221_Klar_Northwestern_University _v1.00.txt".


  DESIGN AND ASSIGNMENT

  A QUESTION-WORDING experiment: there is no stimulus screen; each arm asks
  two questions, how the respondent would feel if a son or daughter married
  someone who votes Democratic, and someone who votes Republican, worded six
  ways (XTESS197, Q 18, 47-200):
    1 "votes for the Democratic/Republican Party" (K01/K02);
    2 "voted for local Democratic/Republican candidates" (K03/K04);
    3 as 1 "but who RARELY talks about politics" (K05/K06);
    4 as 2 "but who RARELY talks about politics" (K07/K08);
    5 as 1 "and who FREQUENTLY talks about politics" (K09/K10);
    6 as 2 "and who FREQUENTLY talks about politics" (K11/K12).
  XFIRST (Q 19) randomised and recorded which of the pair came first (1 the
  Democratic question, 2 the Republican). So the conditions are wording x
  order, 12 cells, condition_num = 2 x (XTESS197 - 1) + (XFIRST - 1).
  Factors: reference (party | local_candidates), talk (unspecified | rarely |
  frequently), asked_first (democratic | republican).


  CONDITION AND OUTCOME TEXT

  As rpw4u, the wording experiment's question is the condition: 'You were
  asked: "<question>"', word-for-word (capitals of RARELY / FREQUENTLY kept;
  K11's double space normalised). The question asked second carries both, in
  the order shown: 'You were asked: "<first>" You were then asked:
  "<second>"' (CONVENTIONS, "Repeated measures within one block"; the order is
  recorded). Added words: "You were asked:" and "You were then asked:".
  Outcome: the question's own closing sentence, "Would you feel unhappy or
  happy?", 1 Very unhappy .. 3 Neither unhappy nor happy .. 5 Very happy.
  task 0 = the Democratic question, task 1 = the Republican.
  Missing: -1 Refused.


  PERSONA

  Knowledge Networks profile, as 4zscf: PPAGE, PPGENDER, PPEDUCAT, PPETHM,
  PPINCIMP, PPMARIT, PPWORK, PPREG4, PPHHSIZE, PPHOUSE, PPRENT, PPMSACAT, PPNET
  (no missing or negative code in any), plus the study's own merged XPARTYY
  (party), IDEO, REL1, REL2: -1 Refused declared for IDEO (14), REL1 (11), REL2
  (7); XPARTYY has no -1 here. (The first draft mapped only the four merged
  items, having missed the PP* columns; the checker, 25 Nov 2026, caught it.)
  Party is in the persona and the questions name the parties, but nothing says
  what either party's voters feel, so the answer is not derivable by
  substitution. REL1 uses the second US religion list; its code 2 label is
  severed and restored (as ztwqy), codes 11/12 drop "please specify"; no
  crosswalk scheme yet (pending).


  UK CHECK

  Not applicable as a fit test: an Eval study. US parties.


  ANSWER KEY

  SocSci210 (crosscheck, 25 Nov 2026): 6 conditions (no order), one task
  pooling the Democratic and Republican questions, 4,204 rows = ours. Their
  response counts are OURS REVERSED (their 1: 428, 2: 353, 3: 2,508, 4: 534,
  5: 381; ours 1: 381, 2: 534, 3: 2,508, 4: 353, 5: 428): they code the scale
  the other way round, so their 1 is "Very happy" where the .sav's 1 is "Very
  unhappy". Worth checking against their prompt before comparing scores.


  CHECKED 25 Nov 2026 by a separate checker (Sonnet), briefed to break it. All
  24 cells match a rebuild from Q (incl. the cumulative second question);
  counts and distribution match the .sav; the reversed SocSci210 coding
  confirmed (their prompt reads "1 (Very happy) to 5 (Very unhappy)"; they also
  word the stimuli differently). It FAILED the persona (PP* demographics left
  out); fixed above.
