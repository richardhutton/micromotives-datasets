notes: 'Gunadi MP, Evangelidis I (2022), "The Impact of Historical Price Information on Purchase Deferral",
  Journal of Marketing Research 59(3):623-640, doi:10.1177/00222437211060359. ResearchBox 402 (https://researchbox.org/402).


  GENERATED by scripts/gen_researchbox402.py; every judgement is in its docstring. Study 1b (pre-registered
  Dec 2020, AsPredicted #54763), 800 people, all kept. 2 x 2 between people (the price falls or rises;
  once, on January 17, or every day), shown day by day: everyone saw January 16 at $1200 (the same screen
  in every arm, one condition) and chose now or later; anyone who chose later saw the next day''s screen,
  which restates the earlier prices, up to January 19. Each day is its own condition and its own outcome
  (task 0-3), each outcome naming its own assignment column (cond_day1..cond_day4); a person has one row
  per day they reached (asserted: a day is answered exactly when the day before was answered "later").
  The instructions shown first, which say that choosing to wait updates the page, are in every row''s
  shared context. No words added. 1 = buy now, 2 = buy later, as answered. The pre-registered measure
  is the number of days a person chose later (0-4). A person who bought on day 1 has one row, whose condition
  cannot show their arm: none of it had been shown.


  Wording: every scenario and question is the fielded screen''s, from the data file''s variable labels
  (Qualtrics'' export of each question), typos kept; the materials PDF (no .qsf) supplies the page structure
  and order, the answer options, the price bounds and any text no label carries (the instructions, and
  day 3 of the single-decrease arm, whose label is cut short). No picture on any built study''s pages.
  Each data column is tied to its PDF screen by the dollar amounts in its label, exactly one match each.
  Where the PDF''s words differ from the fielded ones: the label stops before "Currently, the price of
  the TV is $900. What would you do?" (cut short in the export; the PDF used there). Typography normalised.
  The assignment is derived from which arm''s columns are filled. Persona: age (years; outside 18-100
  left blank) and gender, labels from the .sav''s value labels.'
