    for a product that you are interested in. You will be asked to make decisions at different points
    in time. The price of the product can change over time. For example, you will see a price and be asked
    to make a decision whether to buy at that moment at the current price, or wait in case the price changes.
    If you choose to wait, the page will update and the price may decrease, increase, or stay the same.
    Imagine that you consider buying a new TV. You have been checking the price of a TV that you like
    during the past days.'
