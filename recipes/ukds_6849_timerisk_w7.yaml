study_id: ukds_6849
source: innovation_panel
title: "Understanding Society Innovation Panel, experiment 9.13: time and risk preference choices
  (wave 7)"
data_file: timerisk_w7-derived.sav
licence: |-
  UK Data Service End User Licence (UKDS SN 6849). NOT redistributable. The EUL's
  definition of "Data Collection" includes the Documentation, so the variable and value
  labels are part of the collection as much as the microdata is. Nothing built from this
  recipe may leave the machine: `data/raw/` and `data/processed/*.parquet` are gitignored,
  and `src/micromotives_datasets/jev.py` refuses `source="ukds"` outright.

comparable_to_socsci210: false
experiment: timerisk_w7
participant_id_var: person

notes: "University of Essex, Institute for Social and Economic Research, \"Understanding\nSociety: Innovation Panel, Waves 1-17, 2008-2024\", UK Data Service SN 6849.\nExperiment 9.13 in the Innovation Panel User Guide, an Associated Study (Linking\nExperimental and Survey Data, ES/K001965/1, PI M. M. Galizzi), which asks that\npublications acknowledge it. Wave 7; GENERATED by `scripts/gen_ip_timerisk.py\n--recipes` from the questionnaire PDF, every string asserted to occur in it. Do not\nedit by hand.\n\nONE CONDITION, NOT AN EXPERIMENT (rich's ruling, 9 Oct 2026). One adult per selected\nhousehold answered 72 choices between sums of money at different times and 19 between\nlotteries, told beforehand that one in ten would be paid for real on one randomly drawn\nanswer, up to £250. Everyone saw the same preamble and the same choices; the only\nrandomisation, who was paid, came after the answers. Built because these are real,\nincentivised choices. The choices are identical in waves 6 and 7; the preambles are not.\n\nTHE CONDITION is the module's own preamble (Trpre), word-for-word, and for the\nlottery choices also the lottery preamble (Riskpre), plus, for the 4 face-to-face\nrespondents who first declined the lotteries and then continued, the second appeal they\nsaw (Riskpreb). Preamble sentences marked for one mode are resolved per row on\n`indmode`. The lottery preamble's web marker follows two sentences (\"You must complete\nall 91 items ... any money.\"); both are treated as web-only, an interpretation:\nface-to-face decliners got Riskpreb, which repeats the second.\n\nEDITS, by the sequence rule (docs/CONVENTIONS.md): each item's label \"Choice 01\" ...\n\"Choice 91\" is dropped, and choice 91's \"In this last choice, you will\" becomes \"You\nwill\". \"91 questions in this section\" in the preambles is kept: it states a count, not\nthe row's position. Answers are nominal (Option A or B; for choice 91 one of six\nlotteries), listed in each question.\n\nThe second appeal's closing instruction (\"If you do now want to continue enter 1 or\nelse just return the laptop to the interviewer.\"; in wave 7, press \"continue\") is\ndropped as survey mechanics: it tells the respondent how to operate the screen, and \"1\"\nis also an answer code in the rows that would carry it. One wave 6 respondent who was\nnot the household's selected person (TRFLAG = 0) nonetheless began and answered; the\nanswers are real and kept.\n\n`person` is a hash of `pidp`, the same construction as every Innovation Panel build;\nthe same respondents were asked again in wave 6, under one id."

condition:
  source_var: took_part
  factors: []
  shared_context: "[IF indmode=1 INSERT: This year, we are again interested in learning more about how people think and make decisions about various aspects of their lives. To do this, we have a set of very brief questions for you to complete yourself on the laptop. At the end, you will again have the chance to win an amount of money. In each question, you will be presented with a choice. There are two sets of questions. First, you will be asked to decide between different amounts of money that you could potentially receive at different points in time. In the second set of questions, you will be asked to decide between types of lottery games that you might prefer to play. In all of these questions, there is no right or wrong answer. Do not spend too much time on any question. Please answer quickly and honestly. Once you have made all your choices, you could receive a payment. Ten percent of respondents will be randomly selected to win. There are 91 questions in this section of the interview in total. If you are selected to receive the payment, one of the 91 questions will be selected at random, and your payment will be calculated based on your answer to that question. The highest amount that you could win is £250. If you are selected to receive the payment, the payment will be arranged at the end of the interview. If you have any questions, you can ask me now.; IF indmode=3 INSERT: This year, we are again interested in learning more about how people think and make decisions about various aspects of their lives. To do this, we will ask you a set of very brief questions. At the end, you will again have the chance to win an amount of money. In each question, you will be presented with a choice. There are two sets of questions. First, you will be asked to decide between different amounts of money that you could potentially receive at different points in time. In the second set of questions, you will be asked to decide between types of lottery games that you might prefer to play. In all of these questions, there is no right or wrong answer. Do not spend too much time on any question. Please answer quickly and honestly. Once you have made all your choices, you could receive a payment. Ten percent of respondents will be randomly selected to win. There are 91 questions in this section of the interview in total. If you are selected to receive the payment, one of the 91 questions will be selected at random, and your payment will be calculated based on your answer to that question. The highest amount that you could win is £250. If you are selected to receive the payment, the payment will be arranged at the end of the interview.]"
