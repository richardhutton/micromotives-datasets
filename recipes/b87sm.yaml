study_id: b87sm
source: tess
title: "How to Increase the Acceptance of Mobile App and Sensor Data Collection?"
data_file: 8041.087 WENZ weighted data 20210823.sav

# `experiment:` omitted. This deposit holds exactly ONE experiment — the
# 2x3x3x2x2 vignette assignment, shown 8 times per respondent in slots P_S1..
# P_S8 — not several independent experiments needing separate files (contrast
# rpw4u's ~15 DOV_*_Assign sub-experiments, or a5v96's two separately
# randomised vignettes, each of which DOES need `experiment:`). The prior
# draft's `experiment: scenario1` named a SCOPE LIMIT (the schema could only
# resolve one arm per respondent, so only slot 1 was built), not a
# sub-experiment; now that `Outcome.condition_var` resolves an arm per
# (respondent, item), all eight slots are one recipe and there is nothing left
# for the field to disambiguate. Matches the convention already used by every
# other single-experiment study (7jt2f, zrwjp, dh3nj, z358z, zaqkm, ...), all
# of which omit `experiment`. Output file is therefore `b87sm.parquet`, not
# `b87sm_scenario1.parquet`.

# SocSci210 reconstructed a DIFFERENT scope for this deposit: its 8 "conditions" are
# the eight PRESENTATION SLOTS (SCENARIO_1..SCENARIO_8), not the manipulation, and its
# stimulus text is one fixed vignette identical across all eight. The 2x3x3x2x2
# vignette experiment is entirely absent from their build. Proven by arithmetic in
# the notes below, so a numeric comparison is meaningless rather than a bug.
comparable_to_socsci210: false

notes: |
  TESS 8041.087 (Wenz, "How to increase the acceptance of mobile app and sensor
  data collection?"). AmeriSpeak web/phone panel, fielded 26 Jul - 9 Aug 2021
  (vFINALsimple lines 15-17). MAKER DRAFT — for checker review.

  Line citations below are 1-based line numbers in
    Q  = "8041.087 TESS Wenz vFINALsimple.txt"   (the fielded questionnaire)
    PG = "8041.087 TESS Wenz vFINALprog.txt"     (the programming version)
    PR = "TESS-1387.R1 description.txt"          (the PROPOSAL — not a text source)
    RP = "8041.087 TESS WENZ Project Report.txt"
    XL = "Independent Variables Map.xlsx"        (the fielded vignette lookup)


  THE DESIGN — a 2 x 3 x 3 x 2 x 2 within-subject vignette experiment

  Each respondent read EIGHT vignettes drawn without replacement from a universe
  of 72, and rated willingness to download a research app after each. Q lines
  628-631 give the randomisation for slot 1 verbatim:

      P_S1
      Randomly assigned value:
      1 through 72
      (See excel table for look up)

  and PG lines 277-283 repeat it in the preload table ("P_S1 ... Randomly
  assigned value: 1 through 72 (See excel table for look up)"). P_S2..P_S8 carry
  the same note at Q 632-659 / PG 284-332. Q line 71 ("[INSERT P_S1]") and PG
  line 496 ("[<unbold> INSERT P_S1 </unbold>]") place the drawn vignette inside
  SCENARIO_1, between the fixed opening (Q 68-70) and the outcome question
  (Q 73).

  The "excel table" is the deposit's "Independent Variables Map.xlsx". Its
  "Lookup table" sheet has 72 rows, one per preload value, with five factor
  columns (Tech_Support, Control_data, Incentive, Feedback,
  Protection_Privacy) and a "Text Displayed" column holding the exact text
  inserted for that value. Its "Updated Conditions Value Labels" sheet holds the
  per-level text. The 72 rows are exactly the full crossing
  2 x 3 x 3 x 2 x 2 = 72, each combination appearing once (checked
  programmatically: all 72 (Tech,Control,Inc,Feed,Priv) tuples distinct).

  FACTORS AND LEVELS (level text from XL, which is the fielded instrument; the
  factor NAMES follow PR line 23, "2 privacy statement x 2 technical support x
  3 control x 3 monetary incentive x 2 feedback ... a vignette universe of 72
  unique descriptions and each respondent will be randomly assigned to 8
  vignettes without replacement"):

    technical_support   1 letter with login details only
                        2 letter plus interviewer phone call
    data_control        1 can switch app off
                        2 can review and delete data
                        3 no control
    monetary_incentive  1 unconditional $20 (enclosed in the letter)
                        2 conditional $20 fixed (on download + keeping installed)
                        3 conditional $6 plus $1 per day, max $20
    feedback            1 personal summary provided
                        2 none
    privacy_statement   1 plain wording
                        2 formal wording


  ASSIGNMENT VARIABLE — P_S1, and the evidence

  The data file carries BOTH a single combined code and the decomposed factors,
  for every slot: P_S1..P_S8 (1..72) and P_S{k}_Tech_Support,
  P_S{k}_Control_data, P_S{k}_Incentive, P_S{k}_Feedback,
  P_S{k}_Protection_Privacy. The recipe declares the single code P_S1, because
  that is the variable the questionnaire itself names as randomised (Q 628-631);
  the decomposed columns appear nowhere in Q or PG and are a delivery
  convenience.

  They agree perfectly, which independently validates the arm -> factor mapping:
  mapping each P_S{k} value through XL's lookup table and comparing against the
  five P_S{k}_* columns gives 0 mismatches over all 1,948 x 8 = 15,584
  assignments. P_S1 has no missing values and all 72 values present, cell sizes
  16 to 41 (mean 1948/72 = 27.06). Slot-1 factor marginals from the data:
    technical_support  1012 / 936
    data_control       627 / 638 / 683
    monetary_incentive 639 / 644 / 665
    feedback           978 / 970
    privacy_statement  974 / 974
  All near-uniform, consistent with random draw without replacement.
  Draws are genuinely without replacement: all 8 of P_S1..P_S8 are distinct for
  1,948 of 1,948 respondents.

  DO NOT TRUST P_S1's OWN VALUE LABELS. In the .sav, P_S1's value labels quote
  only the Tech_Support sentence, so values 1, 2, 3, 7, 8, 9, ... all share the
  label "You would receive a letter with login details and a link to the app
  store where you could install the app". Read as a codebook it would look like
  a 2-level variable. The lookup table, not the value labels, defines the arm.
  (Same failure class as ledger #30/#5.)


  CONDITION MAPPING — DECLARED (rule 2)

  condition_num = P_S1 - 1, i.e. raw 1 -> 0 ... raw 72 -> 71, following the
  source's own preload numbering. There is no external convention to match here:
  SocSci210 did not build this manipulation at all (see below), so nothing
  constrains the index.


  SCOPE — ALL EIGHT SLOTS, now that the schema supports it

  This recipe builds all ten items: SCENARIO_1, SCENARIO_1_DIFFICULT,
  SCENARIO_1_SECURE (all about presentation slot 1) and SCENARIO_2..SCENARIO_8
  (one per remaining slot). The prior draft (`b87sm_scenario1.yaml`) built slot
  1 only, because `Condition` then resolved one arm per respondent ROW: a
  single recipe could not give SCENARIO_2 a different arm from SCENARIO_1, even
  though both are the SAME experiment drawing from the SAME 72-arm universe.
  `Outcome.condition_var` (committed since that draft) removes the limit: each
  outcome now names the variable holding ITS slot's draw, so the arm resolves
  per (respondent, item) rather than per respondent. This recipe is otherwise
  unchanged from the slot-1 draft — same 72 arms, same text, same factors.

  VERIFIED FOR SLOTS 2-8, not assumed:
    - Each SCENARIO_k (k=2..8) block in Q (lines 121-286) is byte-for-byte the
      same opening, insert point and question as SCENARIO_1, just with
      [INSERT P_S{k}] and "Scenario #{k}": "Please read Scenario #{k}
      carefully." / "Imagine that researchers from a public university invite
      you to participate..." / "How likely is it that you would download the
      app to participate in this research study?" with the identical
      RESPONSE OPTIONS block (00 Definitely would not participate .. 10
      Definitely would participate). Confirmed by reading Q lines 121-286
      directly (all seven SCENARIO_2..8 blocks).
    - The .sav carries SCENARIO_2..SCENARIO_8 with the SAME value labels as
      SCENARIO_1 ("0 - Definitely would not participate" .. "10 - Definitely
      would participate", plus 77/98/99), confirmed programmatically for
      SCENARIO_1, SCENARIO_2 and SCENARIO_8.
    - No SCENARIO_k for k>1 has a DIFFICULT or SECURE sibling — grepped both Q
      and the .sav column list; only SCENARIO_1 has them. Q 89/105 and PG
      520/544 are explicit that the two secondary items are asked once, about
      slot 1, with slot 1's vignette re-shown in a pop-up as a reminder — they
      are NOT repeated per slot.
    - P_S1..P_S8 all have 1,948 non-missing values, min 1 / max 72 / 72 distinct
      values each (checked programmatically). The notes already established
      (ORIGINAL VERIFICATION, above) that the five P_S{k}_* decomposed columns
      agree with XL's lookup table for ALL EIGHT slots (0 mismatches over
      1,948 x 8 = 15,584 assignments) — i.e. the 72-arm universe and its text
      are already confirmed correct for slots 2-8, not just slot 1. Nothing
      below re-derives the arm text; it reuses the 72 arms verbatim.

  All 1,948 delivered cases are used. RP line 56 says "In field, NORC collected
  1876 qualified interviews"; the file's QUAL is 1 ("Qualified Complete") for
  1,876 and 9 ("Invalid Complete") for 72, totalling 1,948. No QUAL filter is
  applied, which matches SocSci210 (their n_participants is 1,948).


  ROW ARITHMETIC — exact

  rows = respondents x items - refusals
       = 1,948 x 10 - 198
       = 19,480 - 198
       = 19,282

  The 198 dropped are code 98 "SKIPPED ON WEB" (PG line 422, "98 IMPLICIT
  REFUSAL, WEB SKIP"), per item: SCENARIO_1 12, SCENARIO_1_DIFFICULT 14,
  SCENARIO_1_SECURE 49, SCENARIO_2 11, SCENARIO_3 15, SCENARIO_4 16,
  SCENARIO_5 21, SCENARIO_6 22, SCENARIO_7 23, SCENARIO_8 15 (checked
  programmatically against the .sav; sums to 198). Codes 77 and 99 are
  declared missing too (PG lines 418-419) but occur 0 times on all ten items.
  Per-item kept counts: 1,936 + 1,934 + 1,899 + 1,937 + 1,933 + 1,932 + 1,927 +
  1,926 + 1,925 + 1,933 = 19,282.

  participants = 1,942, not 1,948: six respondents answered 98 on all ten
  items and so contribute no rows (1,948 - 6 = 1,942; checked programmatically
  — this is six, not the seven that answered 98 on all of slot 1's THREE
  items in the slot-1-only draft, because a respondent who skipped slot 1
  entirely can still answer slots 2-8). All 72 arms are non-empty across the
  full build.


  THE UNDECLARED-ASSIGNMENT SCREENS, NOW THAT P_S2..P_S8 ARE DECLARED

  Declaring P_S2..P_S8 as `Outcome.condition_var` (rather than recording them in
  `considered_and_rejected`, as the slot-1 draft did) puts them in
  `Recipe.assignment_variables`, which is exactly the set rule 11
  (`find_numbered_siblings`) and rule 9's sibling-suppression both key off. Two
  consequences, one good and one that needs an explicit entry:

    - Rule 11 now reports NOTHING for P_S2..P_S8 — correctly: they are declared,
      not merely rejected, so there is no further slot "left on the table" for
      it to name. (Previously it named exactly these seven.)

    - Rule 9's sibling-family suppression is DERIVED FROM the declared set
      (`_sibling_family`), and it only catches columns whose name ends in the
      SAME trailing digit as a declared variable (`P_S2` suppresses anything
      starting "P_S2", by prefix). With P_S1 alone declared, that family was
      {P_S2..P_S8} — which incidentally also prefix-matched their 35 decomposed
      component columns (`P_S2_Tech_Support` starts with "P_S2"). Now that
      P_S1..P_S8 are ALL declared, none of them is left OUTSIDE the declared set
      for the family computation to find, so the family is empty and that
      incidental protection disappears. Rule 9's anchor is still just the
      study-level `source_var` (P_S1 — unchanged), so each of the 35
      `P_S{k}_Tech_Support` / `_Control_data` / `_Incentive` / `_Feedback` /
      `_Protection_Privacy` columns for k=2..8 would otherwise be tested
      against it: label matches (PRELOAD), coverage 100%, 2-3 balanced levels,
      and — because slot k's draw is a DIFFERENT, largely independent draw from
      slot 1's — fully crossed with no empty cell. Measured: all 35 ARE fully
      crossed against P_S1 and WOULD be flagged. (P_S1's own five component
      columns are not at risk: they are a deterministic function of the SAME
      P_S1 value used as the anchor, so the crosstab has empty cells and rule 9
      excludes them on that basis alone, same as the slot-1 draft.)

  So all 35 are declared explicitly in `considered_and_rejected` below, with the
  accurate reason: each is a decomposed restatement of an already-declared
  per-item assignment variable (P_S{k}), not an independent randomisation —
  checked 0 mismatches against the fielded code value for exactly this reason.


  OUTCOMES

  Ten items, all 0-10 sliders. The first three refer to slot 1 only; the
  remaining seven are the SAME willingness-to-download question asked again
  after each of the other seven slots:
    task 0  SCENARIO_1            Q 73;  endpoints Q 76 / Q 86;  condition_var P_S1
    task 1  SCENARIO_1_DIFFICULT  Q 90;  endpoints Q 92 / Q 102; condition_var P_S1
    task 2  SCENARIO_1_SECURE     Q 106; endpoints Q 108 / Q 118; condition_var P_S1
    task 3  SCENARIO_2            Q 129; endpoints Q 132 / Q 142; condition_var P_S2
    task 4  SCENARIO_3            Q 153; endpoints Q 156 / Q 166; condition_var P_S3
    task 5  SCENARIO_4            Q 177; endpoints Q 180 / Q 190; condition_var P_S4
    task 6  SCENARIO_5            Q 201; endpoints Q 204 / Q 214; condition_var P_S5
    task 7  SCENARIO_6            Q 225; endpoints Q 228 / Q 238; condition_var P_S6
    task 8  SCENARIO_7            Q 249; endpoints Q 252 / Q 262; condition_var P_S7
    task 9  SCENARIO_8            Q 273; endpoints Q 276 / Q 286; condition_var P_S8

  Endpoint wording is taken from the questionnaire's RESPONSE OPTIONS blocks and
  matches the .sav value labels ("0 - Definitely would not participate" /
  "10 - Definitely would participate", etc.) for all ten items — checked
  programmatically for SCENARIO_1/2/8 and by reading Q 121-286 for the rest; all
  seven SCENARIO_2..8 blocks carry the identical RESPONSE OPTIONS text. The two
  secondary items (DIFFICULT, SECURE) are asked only about scenario 1 and PG
  lines 520 and 544 confirm the slot-1 vignette was re-shown in a pop-up while
  they were answered ("SHOW P_S1 IN POP UP ... SO THAT THE RESPONDENT CAN CLICK
  TO VIEW AS A VIGNETTE REMINDER"), so attaching them to the slot-1 arm
  (condition_var P_S1, same as task 0) is correct, not an assumption. They have
  no equivalent for slots 2-8 (verified: no SCENARIO_k_DIFFICULT/_SECURE column
  for k>1, and Q has no such block) — asked once, not per slot.

  No arm reverses the option order, so there is no per-arm response_recode. Note
  the DIFFICULT item runs low = good and the SECURE item runs low = bad, i.e.
  they point in opposite directions substantively; both are carried through as
  raw 0-10 with their own endpoint labels rather than being flipped to a common
  polarity, so the scale text disambiguates them (ledger #7/#9 class).

  Line numbers for Q 121-286 above were read directly (not estimated from the
  block starts): all seven SCENARIO_2..8 blocks were opened in full and their
  question/RESPONSE OPTIONS lines counted exactly as for SCENARIO_1.


  TEXT PROVENANCE

  shared_context = Q 56-62 (the DISPLAY_EXP description of the app and the data
  it collects) + Q 66, 68, 70 (the fixed opening of SCENARIO_1). Word-for-word
  from Q except for three documented omissions:

    0. "Please read Scenario #k carefully." (Q 66, 122, 146, 170, 194, 218, 242,
       266 — the number varies by slot). CAUGHT BY THE CHECKER, and it had been
       wrong: the sentence sat in shared_context hardcoded to "#1", so 13,513 of
       19,282 rows (70.1% — every SCENARIO_2..8 row) told the respondent they
       were reading scenario 1 while rating a different one.

       Fixed by DROPPING it rather than by varying it per slot, which is the
       same ruling as omission 1 below and for the same reason. A row is one
       (persona, condition, outcome, response) tuple and has no way to say "this
       is the fifth of eight scenarios you have read". "Please read Scenario #5
       carefully" inside a row that contains no scenarios #1-#4 asserts a
       sequence the row cannot represent. The number is navigation inside an
       8-screen block, not part of the manipulation: all 72 arms differ in the
       vignette, never in the signpost.

       Note what did NOT catch this. The 72 arms still rendered 72 distinct
       strings, so rules 1 and 5 were satisfied; the arm text itself was
       verified byte-for-byte against XL; the row counts reconcile exactly; QC
       passed with zero warnings. It was visible only by reading a rendered row
       and asking what it said. See CONVENTIONS, "Sequence signposting".

    1. Q 53-54, "On the following pages, you will see 8 different scenarios
       which vary in a number of features. All scenarios will contain study
       invitations that ask participants to download a research app to a
       smartphone." Survey mechanics about an 8-vignette battery; this recipe
       renders one vignette per row, so the sentence would be false in context.
       Omitted deliberately, not overlooked.
    2. The bracketed clause shown ONLY to respondents who answered SMARTPHONE=2
       (Q 54, "[SHOW IF SMARTPHONE = 2; Participants without a smartphone would
       be loaned a device for the study.]" and Q 68, "[SHOW IF SMARTPHONE = 2:
       If you do not own a smartphone, you would be loaned a device for the
       study.]"). This is a PER-RESPONDENT stimulus element, not a randomised
       one: 1,856 respondents answered Yes, 82 No, 10 skipped. The recipe cannot
       vary stimulus text by respondent (ledger #27), so the clause is omitted
       for everyone rather than shown to everyone. 82/1,948 = 4.2% of
       respondents therefore have condition text missing one sentence they saw.
       SocSci210 took the other choice and asserts it to all respondents.

  arm text = XL "Lookup table" -> "Text Displayed", for the matching preload
  value, verbatim. Whitespace only was normalised: trailing spaces stripped per
  line, and runs of 3+ newlines collapsed to a blank line. The latter matters for
  the 36 rows with feedback = none, where the source leaves the feedback slot
  empty and so contains "\n\n\n\n" between the incentive and privacy bullets.
  Checked: for all 72 values, "Text Displayed" is exactly the five per-level
  strings from the "Updated Conditions Value Labels" sheet joined by "\n\n",
  with the feedback slot replaced by the empty string when Feedback = 2 (0
  exceptions). After normalisation all 72 arm texts are distinct.

  The "The study would last for two weeks and you would be asked to leave the
  research app installed on your smartphone until the end of the study" sentence
  is part of the Tech_Support component in XL, so it appears in every arm but
  travels with the technical-support bullet, as fielded. It is intentionally NOT
  lifted into shared_context, to keep arm text byte-identical to the source.

  NOT taken from the proposal. PR lines 54-71 print what look like the same
  bullets, but the wording differs from what was fielded — e.g. PR line 57 has
  "you should leave the research app installed", which appears 0 times in XL and
  0 times in Q; XL has "you would be asked to leave". Likewise PR "would walk
  you through all steps" vs XL "to walk you through all steps". Ledger #35.


  SOCSCI210 — WHAT THEY BUILT, AND THE ARITHMETIC

  Their profile: n_rows 19,480, n_participants 1,948, 8 conditions, with
  rows_per_condition {0: 5844, 1: 1948, 2: 1948, 3: 1948, 4: 1948, 5: 1948,
  6: 1948, 7: 1948}.

  Their conditions are the eight PRESENTATION SLOTS, not the manipulation:
    19,480 = 1,948 x 10 items (SCENARIO_1..SCENARIO_8, plus
             SCENARIO_1_DIFFICULT and SCENARIO_1_SECURE)
    condition 0 = 5,844 = 1,948 x 3  (the three items that refer to slot 1)
    conditions 1..7 = 1,948 each     (SCENARIO_2..SCENARIO_8, one item each)

  Reproduced exactly: merging the raw distributions of those ten variables gives
  {0: 5079, 1: 1117, 2: 1197, 3: 1332, 4: 1024, 5: 2230, 6: 1189, 7: 1433,
  8: 1427, 9: 907, 10: 2347, 98: 198} — digit for digit their
  response_distribution. So they also kept code 98 (SKIPPED ON WEB) as a
  response value; the 198 is 12+11+15+16+21+22+23+15 across SCENARIO_1..8 plus
  14 and 49 on the two secondary items.

  Their stimulus text is ONE FIXED VIGNETTE, identical in all eight conditions
  (8 conditions, 2 distinct strings, and the two differ only in which outcome
  question is appended). The vignette they describe is the cell
  (Tech_Support 2, Control_data 2, Incentive 1, Feedback none,
  Protection_Privacy 2) = preload value 41 — so 71 of the 72 arms are described
  wrongly, and the whole five-factor manipulation is absent. It is also not
  verbatim: it is the PROPOSAL's wording with "would" rewritten to "will"
  (it contains "you should leave the research app installed", which is in PR and
  not in XL/Q), and it asserts "If you do not own a smartphone, you will be
  loaned a device for the study" to all respondents although Q 68 shows that
  clause only when SMARTPHONE = 2.

  Same defect class as sd7cf (factor dropped) and c5r2f (wrong scenario for
  every arm), and the same source error as z358z (ledger #35).

  `comparable_to_socsci210: false` because the scopes are STILL genuinely
  different, even though this build now covers the same TEN items SocSci210
  did: their unit is slot x respondent over all 8 slots, keeping code-98
  refusals as a response value; ours is the 72-cell arm x 10 items, dropping
  refusals, with the arm correctly varying per item rather than fixed at one
  mis-described vignette. n_rows no longer matches by coincidence either:
  theirs is 19,480 (keeps the 198 refusals as rows with response=98); ours is
  19,282 (drops them). Their arm assignment is not checkable against ours at
  all, since they never reconstructed one — they modelled 8 "conditions" that
  are presentation slots, not the 72-arm manipulation. The response
  distributions still agree exactly net of that recoding choice (see above),
  which is the strongest cross-check available in the absence of a real
  condition-level key on their side.


  LESSON — RESOLVED by Outcome.condition_var

  A within-subject repeated-measures vignette design randomises the arm PER
  ITEM, not per respondent. The slot-1 draft's `Condition` resolved one arm per
  respondent row, so it could only build one slot at a time. `Outcome.
  condition_var` / `condition_vars` (committed after that draft, see
  recipe.py and test_crossed_items.py) resolve the arm per (respondent, item)
  instead, which is what this recipe now uses for all ten outcomes. Kept here
  as a record of the gap that motivated the schema change, now closed.

  The companion observation about rule 9 is also resolved, but differently
  than first guessed: declaring the per-item variables (rather than adding a
  stem-matching rule) is itself what silences rule 11 correctly — see
  "THE UNDECLARED-ASSIGNMENT SCREENS" above — and it has the side effect of
  REMOVING rule 9's incidental protection for the 35 decomposed component
  columns, which this recipe now declares explicitly instead.


  WHAT THE CHECKER SHOULD RESOLVE

   1. Scope. All eight slots are now built (19,282 rows vs the prior 5,769).
      Confirm the verification done for slots 2-8 above (same question,
      same 0-10 scale, no DIFFICULT/SECURE sibling) is sufficient, or that the
      checker wants to re-derive it independently.
   2. `experiment:` is now omitted rather than `scenario1`. Confirm that is the
      right call given CONVENTIONS.md's description of the field (several
      independent experiments needing separate files) — this deposit has only
      one experiment, now built whole.
   2b. The 35 `P_S{k}_*` (k=2..8) decomposed-component columns are declared in
      `considered_and_rejected` because, once P_S1..P_S8 are ALL declared, they
      are no longer incidentally protected from rule 9 by the sibling-family
      mechanism (see notes above) — confirm the dry-run build actually produces
      zero rule-9 warnings with this recipe, and that the reasoning for why they
      would otherwise fire is correct rather than overcautious.
   3. privacy_statement level names. "plain wording" (level 1) / "formal
      wording" (level 2) are my reading of the two texts. PR line 25 calls the
      factor "Readability ... Easy / Difficult" but never says which level is
      which; level 1 is the shorter, plainer text, so 1 = Easy. Not stated
      anywhere in Q, PG or XL. Naming only — the arm text is verbatim either way.
   4. The two shared_context omissions (Q 53-54 mechanics; the SMARTPHONE = 2
      loaned-device clause). Both are deliberate and documented, but a checker
      may prefer the clause included for all, or the 82 non-owners excluded.
   5. Whether the three items should be one recipe or whether DIFFICULT/SECURE
      belong in a separate one — they are manipulation checks / mediators rather
      than the primary DV, and they point in opposite substantive directions.
   6. Whether QUAL = 9 ("Invalid Complete", 72 cases) should be excluded. Kept
      here to match SocSci210's 1,948 participants, but "invalid" is NORC's own
      flag and RP line 56 counts only the 1,876 qualified.
   7. Whitespace normalisation of the 72 arm texts (trailing spaces; "\n\n\n\n"
      -> "\n\n" for the 36 feedback = none arms). Content untouched; verify.
   8. Bullet glyphs: arm text keeps the source's "•"; shared_context uses
      "• " where Q 57-61 has tab-bullet-tab. Cosmetic normalisation.
   9. condition_num = P_S1 - 1 is arbitrary but declared; no external
      convention exists because SocSci210 built slots, not arms.
  10. I did not open Wenz1387.zip or the published paper. Neither is a text
      authority (ledger #35) and the fielded text is fully determined by XL, but
      the zip may contain the author's own analysis code, which would be a second
      witness on the arm -> factor mapping.
  11. XL's sheet is titled "Updated Conditions Value Labels". "Updated" implies
      an earlier version existed. Nothing in the deposit says what changed; the
      delivered P_S*_* columns match this version exactly for all 15,584
      assignments, so this is the version that was fielded, but the checker may
      want to confirm no superseded text is lurking in the .docx originals.

condition:
  source_var: P_S1
  factors: [technical_support, data_control, monetary_incentive, feedback, privacy_statement]

  # Shown to every respondent before Scenario #1 and identical across all 72 arms:
  # DISPLAY_EXP (vFINALsimple lines 56-62) + the fixed opening of SCENARIO_1
  # (lines 66, 68, 70). Verbatim except for the two omissions documented in notes.
  shared_context: |
    The research app, when downloaded to a smartphone, would send short surveys about how people spend their time and collect the following data:

    • Technical characteristics of the phone (for example, brand, screen size)
    • Whether the phone is currently in motion
    • The current location (every 5 minutes)
    • What apps are used and what websites are visited on the phone
    • The number of incoming and outgoing phone calls and text messages on the phone

    Please note that the research app would only collect information on when other apps are opened or when a call is made. The research app could not see what happens inside other apps or what is said in a phone call or a text message.

    Imagine that researchers from a public university invite you to participate in a research study that includes downloading a research app to your smartphone.

    The data collected from the app would help researchers to learn more about how Americans spend their time, such as work, childcare, and leisure.

  considered_and_rejected:
    # P_S1..P_S8 are NOT listed here any more: they are DECLARED, as the
    # study-level source_var (P_S1) and as each outcome's condition_var
    # (P_S2..P_S8) — see notes, SCOPE. A rejected-variable entry would be
    # inaccurate for a variable the recipe now uses to assign the arm.
    #
    # Their decomposed five-factor restatements are NOT listed here. Rule 9
    # suppresses any column named `<declared assignment>_<factor>` on its own,
    # and reports the count as one checkable note. Listing all 40 by hand was
    # the first fix attempted; it worked, but it put a pipeline concern into
    # forty lines of recipe, and the next within-subject study would have paid
    # it again.
    CONCERN_ORDER1: "Item-order randomisation for the CONCERN_A/CONCERN_B attitude
      battery, a later block that is not an outcome of this recipe. Not part of the
      vignette assignment."
    CONCERN_ORDER2: "See CONCERN_ORDER1."
    TRUST_ORDER1: "Item-order randomisation for the TRUST_A..TRUST_C battery, a later
      block that is not an outcome of this recipe. Not part of the vignette assignment."
    TRUST_ORDER2: "See TRUST_ORDER1."
    TRUST_ORDER3: "See TRUST_ORDER1."
    SMARTPHONE: "Self-reported smartphone ownership (1856 yes / 82 no / 10 skipped), a
      measured attribute, not randomised. It gates one conditional sentence in the
      stimulus — see the OMISSIONS note."

  arms:
    - raw: 1
      condition_num: 0
      factors: {technical_support: "letter with login details only", data_control: "can switch app off", monetary_incentive: "unconditional $20", feedback: "personal summary provided", privacy_statement: "plain wording"}
      text: |
        • You would receive a letter with login details and a link to the app store where you could install the app. The letter would also contain instructions on how to use the app.

        The study would last for two weeks and you would be asked to leave the research app installed on your smartphone until the end of the study.

        • The research app would allow you to switch it off at times when you do not want it to collect any data from your smartphone. However, it would be important for this study that you use this option only in rare cases and for short periods.

        • You would receive $20 enclosed in the invitation letter as a token of appreciation for your time.

        • You would also receive a personal summary of your results at the end of the study.

        • The study would be in line with U.S. regulations about data protection and privacy. All information collected by the research app would be confidential. It would only be used by the researchers and they would not share your individual data with anyone else. The researchers would write publications about the overall results of the study. They would also present the findings at international conferences.
