notes: 'Maesen S & Ang D, "Buy Now Pay Later: Impact of Installment Payments on Customer Purchases" (project
  title in the deposit''s README; no publication is named). ResearchBox 2170 (https://researchbox.org/2170).


  GENERATED by scripts/gen_researchbox2170.py; every judgement is in its docstring. Supplementary Study
  2 (Web Appendix H), 16 Oct 2023. A $27 set of four mugs paid $27 in 21 days or in 3 instalments of $9
  (at 7, 14 and 21 days), then three four-statement matrices on three pages in a fixed order: financial
  constraint (on the stimulus page), perceived costs, budget control. Each matrix''s statements were randomised
  (.qsf; recorded in FC1_DO and Q22_DO; the perceived-cost column Q21_DO is empty in the deposit). A later
  page''s condition is the stimulus screen and then the earlier pages, narrated (see the docstring). 597
  of 618 kept, the authors'' jamovi N: everyone assigned (of the other 21, 5 failed the opening attention
  check, which ends the survey, and 16 have no answer to it and nothing after). 1 = Not at all, 9 = Very
  much, as answered; the authors reverse the financial-constraint items.


  Wording from Supplementary Study 2 [Web Appendix H].qsf (the fielded export; the submission export SS2_BNPL_-Mugs.qsf
  agrees on every question shown, see the docstring). Typography normalised (non-breaking spaces); line
  breaks kept as the screen had them. Added words (ours): ''You were then asked (the statements were shown
  in a random order):'' and ''You were then asked:'', each followed by the earlier page''s lines in quotation
  marks. Persona: age (years; outside 18-100 left blank) and gender, labels from the .qsf''s own choices.'
