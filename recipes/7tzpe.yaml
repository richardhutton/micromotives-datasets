      text: |-
        Instructions: In this study we are interested in gathering information about the public's knowledge and beliefs concerning different illnesses and diseases to understand how people think about rare and common medical conditions. You will first read about a specific medical condition, followed by a brief vignette of a patient with that condition.

        Type II Diabetes
        Condition/Disease: Type II Diabetes Mellitus
        Diagnosis: Fasting plasma glucose level ≥7.0 mmol/l (126 mg/dl); Plasma ≥ 11.1 mmol/l (200 mg/dL) 2 hours after a glucose tolerance test
        Symptoms: Frequent urination; increased thirst and hunger; blurred vision
        Precondition: Impaired glucose tolerance or impaired fasting glucose
        Complications: Diabetes is a risk factor for stroke, cardiovascular disease, neuropathy, and kidney failure

        Instructions: On the next page you will read the case study of a patient who has been diagnosed with type II diabetes. Please read the profile carefully. There will be comprehension check questions about the profile at the end of the study.

        The patient is a 34-year old white female. Recently has felt exhausted at work and has had to leave early several days because of severe headaches and blurry vision. She has also noticed that she now takes more frequent trips to the bathroom during the day. When the patient visited her physician she was told that tests of her fasting glucose and glucose tolerance indicated that she was diabetic and that her symptoms were most likely caused by her diabetes. At 5'5" and weighing 205lbs, the patient is moderately obese. She is a non-smoker and reports occasional social drinking (3 - 5 drinks per week).
