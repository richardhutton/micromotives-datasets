notes: 'ResearchBox 809, "Periodic Corporate Donations" (https://researchbox.org/809), Zenodo record 21934081.
  The paper is not named in the box and was not read.


  GENERATED by scripts/gen_researchbox809.py; every judgement is in its docstring. 3. Serial mediation
  (AsPredicted #188881; Prolific, September 2024; US sample). 556 people kept by the authors'' .rmd (Status
  0, Finished 1, the recall check answered right for the arm). Between-person: one scenario each, assigned
  by the .qsf''s randomisers (condition; every recorded fill checked against the .qsf for every kept row).
  The row is every text screen from the scenario''s first screen to the reminder at the top of the measure
  page, word-for-word with its piped fields filled; the welcome screen, consent and id are dropped; bullets
  are written as lines starting ''- ''. The commitment and impact blocks after the admire/favor/positive
  page are built (rich, 20 Nov 2026), shown in a block order the .qsf randomises and the deposit does
  not record: each row carries the scenario, that block''s own reminder and its own question only, with
  nothing narrated about the other blocks, as 5a''s two pages are. Matrix rows are one outcome each, the
  row''s label appended to the stem in double quotes (layout, ours), each column tied to its row by the
  authors'' codebook. A slider question is followed by one sentence of ours naming its only label, written
  word-for-word in these notes. Not built: the recall check (attention, used only for the exclusion).


  Wording from 3. Serial mediation.qsf (the blocks the survey flow reaches). Typography normalised (HTML,
  non-breaking spaces, curly quotes); bold and underline dropped. Data: 3. Serial mediation.csv. Persona:
  age (years; outside 18-100 left blank) and gender (the .qsf''s labels; ''Prefer not to say'' left blank).
  US sample, US dollars; invented companies.'
condition:
  source_vars:
  - condition
  factors:
  - schedule
  arms:
  - raw_values:
      condition: 1
    condition_num: 0
    factors:
      schedule: aggregate
    text: 'Imagine YNA Corporation is an American fashion retailer company.


      Imagine that YNA Corporation recently pledged to donate a portion of their earnings to support wildlife
      and environmental conservation. This was their pledging statement:


      "YNA Corporation recognizes that we can use part of our earnings to do a significant amount of good.
      We pledge to make a total donation of $6 million in 2024 to support wildlife and environmental conservation."


      Reminder:

      - YNA Corporation pledged to make a total donation of $6 million in 2024 to support wildlife and
      environmental conservation.'
  - raw_values:
      condition: 2
    condition_num: 1
    factors:
      schedule: periodic
    text: 'Imagine YNA Corporation is an American fashion retailer company.


      Imagine that YNA Corporation recently pledged to donate a portion of their earnings to support wildlife
      and environmental conservation. This was their pledging statement:


      "YNA Corporation recognizes that we can use part of our earnings to do a significant amount of good.
      We pledge to donate $500,000 every month in 2024 to support wildlife and environmental conservation."


      Reminder:

      - YNA Corporation pledged to donate $500,000 every month in 2024 to support wildlife and environmental
