      KP''s Meal Planning Service


      Meals for families can be complicated.


      KP''s Meal Planning Service aims to make meals for families less complicated by providing a meal
      plan that allows parents to order separate meals for their children from a children''s menu and
      for themselves from a grown-up''s menu.


      KP''s Meal Planning Service is considering running a trial study in which they would send parents
      and their children a meal for them to try and evaluate.


      As a participant of this study, you would be eligible if they run the trial. For the trial, they
      would send you two trial meals: one pre-packaged meal of your choice for your child from the children''s
      menu and one pre-packaged meal of your choice for yourself from the grown-ups menu.


      Because this meal planning service is still in its trial phase, KP''s Meal Planning Service will
      ask you and your child to eat your meals during the same mealtime while sitting together.


      In this survey today, we would like you to go through the meal selection process on the beta version
      of KP''s Meal Planning Service website.


      Please note that whatever meals you choose in this survey would be the meals KP''s sends to you
      if they conduct the meal trial research study.


      This is KP''s Meal Planning Service''s website interface, where customers will be able to order
      from the kids'' menu and the grown-ups'' menu:


      First, please choose a meal for (here the screen showed what you had typed as your child''s name)
      from the options that are currently available on the Kids'' Menu:


      You were asked "Which do you choose for (here the screen showed what you had typed as your child''s
      name) to eat?", with the options "Turkey sandwich on wheat bread w/ baby carrots", "Veggie and hummus
      wheat wrap w/ mixed fruit", "Grilled chicken strips w/ apple slices" and "Caesar salad w/ grilled
      chicken".


      Now, you can choose a meal for yourself. As you choose, please note that you can share your grown-up''s
      meal with (here the screen showed what you had typed as your child''s name) for the purposes of
      the trial.


      Specifically, because this meal planning service is still in its testing trial phase, whatever grown-up''s
      meal you choose, we ask that you SHARE your grown-up''s meal with your child.


      The grown-up''s menu has the following options:'
