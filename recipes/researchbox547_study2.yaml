source: researchbox
experiment: study2
title: 'A meal-planning service will send a parent and child trial meals to eat together: after choosing
  the child''s meal, the parent is told they can or cannot share theirs, and picks one of eight grown-up''s
  meals (Study 2)'
data_file: researchbox547_study2.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/547 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy, record 21931233 (https://zenodo.org/records/21931233).
  Read 20 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'ResearchBox 547, "Sharing Food Can Backfire" (Wight et al., https://researchbox.org/547), Zenodo
  record 21931233. The paper was not read.


  GENERATED by scripts/gen_researchbox547.py; every judgement is in its docstring. Study 2 (AsPredicted
  #80516); Prolific, 19 Nov to 2 Dec 2021; US-run sample of parents living with their child. 791 people:
  the authors'' main-analysis filter (FullSampleFilter = 1) with a self-choice answer (792), less 1 who
  left the child''s-name box empty. Between people: one arm each, assigned by the .qsf''s one randomiser
  (share, menuOrder; every recorded fill checked against it for every kept person). The row is every screen
  from the child''s-name question to the self-choice page, word-for-word with its piped fields filled;
  consent, id, captcha, the phone screen and the screener are dropped. Earlier questions are narrated
  as asked (''You were asked "...", with the options ...''). Added words (ours): ''(here the screen showed
  what you had typed as your child''s name)'' wherever the screen piped the name typed for the child (CONVENTIONS,
  a per-respondent fill the deposit does not give); and the enumeration of the eight options after the
  question, ''N means "..."''. Pictures are dropped, not described (ledger 158): front pages, a title
  card, and menu boards whose words are the question''s own options in the same order. The answer is coded
  to its option''s position on screen; the meals by the .qsf''s recode value (healthy 1-4, unhealthy 5-8)
  are 1 "Grilled chicken sandwich w/ roasted baby carrots"; 2 "Mediterranean turkey wrap w/ roasted broccoli";
  3 "Balsamic grilled chicken breast w/ mixed fruit"; 4 "Grilled shrimp & veggies w/ dip"; 5 "Cheeseburger
  w/ fries"; 6 "Cheesesteak sandwich w/ tater tots"; 7 "Crispy chicken wrap w/ onion rings"; 8 "Fish &
  chips w/ tartar sauce". The menu order (healthy or unhealthy meals listed first) shows only in the order
  of the question''s options, so `menu_order` is carried on every arm but is not a condition factor, and
  each pair of arms differing only in it declares its shared text (condition_text), as researchbox2057
  does. Not built: the mediator items (set an example, concern, sharing the kid''s meal), anticipated
  enjoyment and the trial opt-in, which follow an "Order Summary" screen naming both meals the person
  chose.


  Wording from Study 2 #80516 Qualtrics Survey QSF.qsf (the blocks the survey flow reaches), a blinded
  copy whose randomised values and question labels match the .sav. Typography normalised (HTML, non-breaking
  spaces, curly quotes); bold and underline dropped. Data: Study 2 #80516 data and codebook.sav. Persona:
  the parent''s age (years; outside 18-100 left blank) and gender (the .qsf''s labels; self-described
  and ''Prefer not to say'' left blank).'
