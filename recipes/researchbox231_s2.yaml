comparable_to_socsci210: false
participant_id_var: pid
notes: 'De La Rosa W & Tully SM (2022), "The Impact of Payment Frequency on Consumer Spending and Subjective
  Wealth Perceptions", Journal of Consumer Research 48(6), doi:10.1093/jcr/ucab052. ResearchBox 231 (https://researchbox.org/231).


  GENERATED by scripts/gen_researchbox231.py; every judgement is in its docstring. Supplemental Study
  2, 2020. $950 to start, $650 rent, paid $140 each weekday or $700 each Friday; no overdraft constraint
  is stated. The survey flow also has an income randomizer whose only branch is Low, so every respondent
  had the $140 / $700 wording (the $280 / $1400 wording is never assigned). Only the FIRST spending decision
  is built. Every screen before it is the same for everyone in an arm, so its condition is fixed by the
  assignment. Every later screen shows a result and a balance that follow from the respondent''s own earlier
  choices ("You were late to work ...", "Alert: Your checking account balance is less than $0"), so no
  later decision, and no end-of-study question, has a condition shared by an arm: it would be one condition
  per path, stating each person''s own earlier answers as given. Not built for that reason: 14 further
  decisions. The TRUE/FALSE items that restate the instructions are comprehension checks, dropped. Balances
  are those the survey flow''s own embedded-data arithmetic produced for the arm (see the docstring).
  The decision screen showed a balance box beneath the question; it follows the added clause "Beneath
  the question below, the same screen showed:" (ours). Options in the .qsf order, which was fixed. 402
  of 431 kept (5 failed the attention check, 27 had taken a similar survey before, both by the rule the
  authors pre-registered for Studies 4-6 and S3; S2 has no pre-registration in the box).


  Wording from Supplemental_Study_2_-_Life_Simulator_Daily_vs_Weekly_w_no_constraints.qsf. Typography
  normalised (curly quotes, non-breaking spaces); line breaks kept as the screen had them; one blank line
  between screens. Persona: age (years; outside 18-100 left blank), and gender, income, education, labels
  from the .qsf''s own choices (income and education harmonised by the crosswalk scheme us_researchbox231_qualtrics).
  Ethnicity (multi-select) and own pay frequency not mapped.'
condition:
  source_vars:
  - pay
  factors:
  - pay_frequency
  arms:
  - raw_values:
      pay: 1
    condition_num: 0
    factors:
      pay_frequency: daily
    text: 'You are about to start a life simulator. In this simulator, you will work, incur expenses (like
      rent ($650), gas and electric ($95), phone ($75), health insurance ($150), laundry ($40), etc.)
      and make spending decisions just as you would in real life.

      It is important that you make decisions as you would in your everyday life. You will simulate life
      for five weeks.

      To start, you have $950 in your checking account. You have a job where you get paid $140 once a
      day, every weekday (Monday - Friday).


      We are about to start the life simulator.

      We ask that you take the simulation seriously. Please make decisions as you would in real life.


      Monday, June 1, 2020

      Your rent is due today. Pay your landlord $650.

      --------------------------

      Expense: $ -650

      Current Checking Account Balance: $ 300

      --------------------------


      Monday, June 1, 2020

      You worked a full day -- but it was tough. You are having trouble adjusting to the new work.

      You received a $140 paycheck today.

      --------------------------

      Income: $ 140

      Current Checking Account Balance: $ 440

      --------------------------


      Beneath the question below, the same screen showed:

      --------------------------

      Current Checking Account Balance: $ 440

      --------------------------'
