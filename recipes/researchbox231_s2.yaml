outcomes:
- var: decision1
  task_num: 0
  question: 'Monday, June 1, 2020

    Your favorite band is touring right now. The band is scheduled to play tonight at a local concert
    and your friend Alex is going. Tickets are $75.

    What do you do?

    1 means "Go to the concert"; 2 means "Stay home".'
