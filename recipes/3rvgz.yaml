  - var: Q8
    task_num: 8
    question: "Avantex wants to offer $1,000 scholarships to defray the living costs of students on the Dean's list (i.e., those with a GPA of 3.5 or higher). How many, if any, $1,000 scholarships should Avantex fund with its $10,000 annual donor fund?"
