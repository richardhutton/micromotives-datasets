    text: |-
      In this study, you will be asked to answer questions about values. Values are the things in life that matter most to you.
      Power: Social power, authority, wealth.
      Achievement: Successful, capable, ambitious.
      Hedonism: Pleasure, enjoying life, self-indulgence.
      Stimulation: Daring, a varied life, an exciting life.
      Self-Direction: Creativity, curious, freedom.
      Universalism: Protecting the environment, a world of beauty, unity with nature.
      Benevolence: Helpful, honest, forgiving.
      Tradition: Devout, accepting my portion in life, humble.
      Conformity: Politeness, obedient, honouring parents and elders.
      Security: Clean, national security, social order.
      In the following task, you will be asked to make some choices about the MOST and LEAST important values to you. You will make a number of these choices using different options.
      Which is the MOST and LEAST important factor to you as a guiding principle in YOUR life?
      Power
      Achievement
      Stimulation
      Tradition
      Conformity
      Security
      (the options are listed in the data file's order; the order on screen was not recorded)
    items:
