notes: 'Evangelidis I (2026), "Skimpflation Penalty: Decreases in Product Quality Trigger Stronger Consumer
  Reactions than Decreases in Size or Increases in Price", Journal of Consumer Research, doi:10.1093/jcr/ucag019.
  ResearchBox 2562 (https://researchbox.org/2562).


  GENERATED by scripts/gen_researchbox2562.py; every judgement is in its docstring. Study 6 (pre-registered,
  AsPredicted #249601 and #247301), 208 people. A university behavioural lab (the pre-registrations),
  paid for real: five people drawn to receive the option they chose and EUR 5 less its price. No conditions:
  everyone saw the same four screens in a fixed order (chocolate choice, chocolate quality, orange juice
  choice, orange juice quality), so one condition with four outcomes, each row carrying everything shown
  up to its own question. The three options were listed in a fixed order (no choice randomisation in the
  .qsf) and are enumerated in the question as shown, codes as the .qsf recodes them (its third option
  is choice 5, recoded 3). The instructions screen is kept (the real stakes); its welcome page, the timing
  items and the debrief are dropped. Added words (ours): ''You were asked "Which option do you prefer?"'',
  ''You were then asked "..."'' (the quality question word-for-word), ''You were then shown:'', and, where
  the deposit''s orange-juice screen reads "a cafeteria in [redacted for review purposes]", the clause
  ''(here the screen named a place)'' (the fielded screen named a place the deposit withholds). The two
  quality questions were not forced; all 208 answered both. No exclusions were pre-registered.


  Wording from Study 6 - Materials.qsf. The scenario is the condition and the closing question the outcome,
  both word-for-word. Where there are arms, the assignment is derived from which arm''s column is filled
  (each such question was ForceResponse, so a blank means not shown). Typography normalised (HTML entities,
  non-breaking spaces, curly quotes). Persona: age (years; the .qsf accepts 15-100) and gender, labels
  from the .qsf''s own choices, "I prefer not to answer" and "None of the above" left blank (Jev: non-answer,
  1.00 and 0.66).'
