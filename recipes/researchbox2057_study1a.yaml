notes: '"A Reexamination of the Effect of Forced Choice", ResearchBox 2057 (https://researchbox.org/2057),
  anonymous author, no paper named in the box. Study 1a.


  GENERATED by scripts/gen_researchbox2057.py; every judgement is in its docstring. Two groups between
  people: made to choose (A or B) or offered a no-choice option, four problems each. Problem order random
  and not recorded, so each row carries its own problem only. 204 people, all kept (AsPredicted #147483:
  ''I will not exclude any data''); sample: students in a university behavioural lab (pre-registration),
  country not stated. The forced and no-choice pages of a problem show the same lead and table; the manipulation
  is in the answer options, so it is in each arm''s outcome question (factor `choice`, carried on every
  arm, is not a condition factor here because the condition text does not express it; both arms of a problem
  declare the shared text).


  Wording from Study 1a - Materials.qsf (the blocks the survey flow reaches), word-for-word; no picture,
  script or piped text in it. Tables are one line per row, cells joined by " | ". Typography normalised.
  Added words (ours): the options'' enumeration after each question, ''1 means "..."; 2 means "..."''.
  Each answer is coded to its option''s position on screen. Persona: age (years) and gender, labels from
  the .qsf''s own choices.'
