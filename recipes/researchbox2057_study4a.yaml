study_id: researchbox2057
source: researchbox
experiment: study4a
title: 'Camera, laptop, restaurant: an all-average or a mixed option, with a go-elsewhere option or made
  to choose first (Study 4a)'
data_file: researchbox2057_study4a.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/2057 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy https://zenodo.org/records/21935325. Read
  19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: '"A Reexamination of the Effect of Forced Choice", ResearchBox 2057 (https://researchbox.org/2057),
  anonymous author, no paper named in the box. Study 4a.


  GENERATED by scripts/gen_researchbox2057.py; every judgement is in its docstring. Two groups between
  people: single stage (A, B or go elsewhere) or two stage (A or B, then a second question not built).
  Three problems each. Problem order random and not recorded, so each row carries its own problem only.
  301 people, all kept (AsPredicted #85573: ''I will not exclude any data''); sample: an online panel
  (the survey asks for a Prolific ID), country not stated. The forced and no-choice pages of a problem
  show the same lead and table; the manipulation is in the answer options, so it is in each arm''s outcome
  question (factor `choice`, carried on every arm, is not a condition factor here because the condition
  text does not express it; both arms of a problem declare the shared text). Not built: CamTwo2, LapTwo2,
  ResTwo2 (the two-stage second question asks about ''the one you chose'', the person''s own earlier answer,
  which a row cannot carry); Q33, Q31, Q36, Q29, Q31.0, Q39 (filler problems, the same in both groups).


  Wording from Study 4a - Materials.qsf (the blocks the survey flow reaches), word-for-word; no picture,
  script or piped text in it. Tables are one line per row, cells joined by " | ". Typography normalised.
  Added words (ours): the options'' enumeration after each question, ''1 means "..."; 2 means "..."''.
  Each answer is coded to its option''s position on screen. Persona: age (years) and gender, labels from
  the .qsf''s own choices.'
