notes: 'Maesen S & Ang D, "Buy Now Pay Later: Impact of Installment Payments on Customer Purchases" (project
  title in the deposit''s README; no publication is named). ResearchBox 2170 (https://researchbox.org/2170).


  GENERATED by scripts/gen_researchbox2170.py; every judgement is in its docstring. Study 3, 14 Oct 2023.
  A $24 T-shirt paid $24 now, $24 in 30 days, or in 3 instalments of $8, then four statements on financial
  constraint on the same page (order randomised and recorded, FC1_DO; the condition does not depend on
  it). 598 of 632 kept, the authors'' jamovi N: the filter IMC2 == 1 (closing attention check) and an
  assignment. 1 = Not at all, 9 = Very much, as answered; the authors reverse all four into a constraint
  score.


  Wording from BNPL_T-shirt_Study_3.qsf (the fielded export; the submission export Study3_BNPL_T-shirt.qsf
  agrees on every question shown, see the docstring). Typography normalised (non-breaking spaces); line
  breaks kept as the screen had them. Added words (ours): ''You were then asked (the statements were shown
  in a random order):'' and ''You were then asked:'', each followed by the earlier page''s lines in quotation
  marks. Persona: age (years; outside 18-100 left blank) and gender, labels from the .qsf''s own choices.'
condition:
  source_vars:
  - BNPL
  factors:
  - payment
  arms:
  - raw_values:
      BNPL: 0
    condition_num: 0
    factors:
      payment: pay_now
    text: 'Imagine that you need to buy a new T-shirt today with a price of $24.

      The payment method is:

      Pay $24 now'
  - raw_values:
      BNPL: 1
    condition_num: 1
    factors:
      payment: pay_in_30_days
    text: 'Imagine that you need to buy a new T-shirt today with a price of $24.

      The payment method is:

      Pay $24 in 30 days

      * No interest * No fees when you pay on time'
  - raw_values:
      BNPL: 2
    condition_num: 2
    factors:
      payment: three_instalments
    text: 'Imagine that you need to buy a new T-shirt today with a price of $24

      The payment method is:

      Pay in 3 instalments of $8

      * No interest * No fees when you pay on time'
outcomes:
- var: fc1
  task_num: 0
  question: To what extent does this payment method... make you feel less financially constrainted
  scale:
    min: 1
    max: 9
    min_label: Not at all
    max_label: Very much
- var: fc2
  task_num: 1
  question: To what extent does this payment method... allow you to spend as you like
  scale:
    min: 1
    max: 9
    min_label: Not at all
    max_label: Very much
- var: fc3
  task_num: 2
  question: To what extent does this payment method... improve your financial situation over others
  scale:
    min: 1
    max: 9
    min_label: Not at all
    max_label: Very much
- var: fc4
  task_num: 3
  question: To what extent does this payment method... help with your financial situation
  scale:
    min: 1
    max: 9
    min_label: Not at all
    max_label: Very much
