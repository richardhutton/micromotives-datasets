study_id: nhgxf
source: tess
title: "Emotional Reactions to Terrorism and Candidate Evaluations (Merolla, TESS3 218)"
data_file: TESS216_Merolla_Client.sav
licence: >-
  none stated on the OSF deposit, as for every TESS deposit built here (TESS
  archived its projects without reuse terms and has since suspended
  operations). Not re-checked against the OSF API for this node in this build.
  So there is no explicit grant of redistribution rights for this deposit, and
  none should be assumed.

# In SocSci210 (one of its 40 held-out studies: our Eval set). See ANSWER KEY.
comparable_to_socsci210: true

notes: |-
  TESS3 218 (Jennifer Merolla; GfK KnowledgePanel), fielded 24 June - 13 July
  2016 (Q 7-8). The .sav ("TESS216_Merolla_Client.sav", named 216 though the
  study is 218) has 611 rows, CaseID unique. Deposit OSF nhgxf, Merolla843.zip:
  the .sav/.dta, the fielded questionnaire
  "310.00209.0999.1_TESS3 218_Merolla_Final.docx", response rate report;
  Merolla843.pdf is the proposal.

  Line citations are 1-based line numbers in
    Q = "310.00209.0999.1_TESS3 218_Merolla_Final.txt" (textutil from the .docx).


  ASSIGNMENT

  XTESS218: 1 Anger (198), 2 Fear/Anxiety (214), 3 Relaxation (199). raw n ->
  condition_num n-1. Factor `emotion_induced`: anger | fear | relaxation.


  CONDITION TEXT: AN EMOTION-INDUCTION WRITING TASK

  Each arm's screen is a writing prompt with a large text box (Q 41, 48, 55):
  describe what makes you angry / afraid about the terrorist attacks of the
  last year, or what makes you relaxed. The prompt is quoted word-for-word,
  after ONE ADDED SENTENCE of ours (CONVENTIONS, "Narrating what the respondent
  did", the a42yg precedent), true for everyone in the arm, including the 110
  who wrote nothing (Qcondition1-3_Refused):
    'You were given this writing task, with a large text box to write in:'
  What anyone wrote is not used (open text; it is the respondent's own words,
  not a stimulus).


  OUTCOMES (20 tasks)

  tasks 0-7   Q1-Q8: Display1's lead ("We'd like to ask you some questions
              about candidates in the current U.S. presidential election ...",
              Q 62) and one statement each (Clinton / Trump: strong
              leadership, honest, competent, assertive), 1 Strongly disagree ..
              4 Neutral .. 7 Strongly agree. Each statement is its own screen;
              the block order and Clinton/Trump order were randomised and are
              not narrated.
  tasks 8-9   Q9, Q10: how well Clinton / Trump would handle foreign policy and
              national defense, 1 Extremely well .. 4 Not well at all.
  task 10     Q11: diplomacy (1) to readiness to use military force (7); 8
              "Haven't thought much about this" dropped by the recipe's codes.
  task 11     Q12: banning admittance of all refugees from Syria, 1 Strongly
              favor .. 5 Strongly oppose.
  task 12     Q13: US military action against ISIS (air strikes only / air
              strikes and ground troops / no action), nominal.
  tasks 13-14 Q14: feeling thermometer for Clinton and for Trump, 0-100, one
              stem two sliders (ADDED SENTENCE 'Report only the rating for
              "<name>".').
  task 15     Q15: 2016 vote choice (Clinton / Trump / Neither or would not
              vote), nominal; the first two options' order was randomised.
  tasks 16-17 Q18_1, Q18_2: men in politics stronger leaders / better at
              foreign affairs than women, 1 Strongly disagree .. 4 Strongly
              agree (ADDED SENTENCE 'Report only the answer for ...').
  tasks 18-19 Q19, Q20: worry / anger about a terrorist attack in the US in
              the next 12 months, 1 Not ... at all .. 4 Very; 5 "Haven't thought
              much about it" dropped.
  Missing: -1 Refused.
  NOT BUILT: Q15a (forced vote, only for those who chose Neither), Q16-Q17
  (which positions Clinton / Trump have held: knowledge multi-selects).


  PERSONA

  Knowledge Networks profile, as 4zscf, plus the merged DOV_XPARTY7, DOV_IDEO,
  DOV_REL1, DOV_REL2; -1 Refused declared for DOV_IDEO (11), DOV_REL1 (11),
  DOV_REL2 (11). DOV_REL1 uses the second US religion list (1 Catholic, 2
  Evangelical or Protestant ...), which has no crosswalk scheme yet, so QC
  warns on it as on a42yg and ztwqy (pending fix).


  UK CHECK

  Not applicable as a fit test: an Eval study. The 2016 US election.


  ANSWER KEY

  SocSci210 (crosscheck, 25 Nov 2026): 10 tasks, 9,344 rows; ours 20, 11,700.
  Their first five tasks POOL each Clinton/Trump pair into one task (1,204 =
  603 + 601 etc.); their later tasks match ours one to one (Q11 497, Q12 596,
  Q19 545, Q20 521, identical). The run FAILS on pooling and scope (they leave
  out Q9-Q10's pair split, Q13-Q15, Q18). They also reverse Q9/Q10, coding 1 as
  "Not well at all" (their 424 ones are our 174 + 250 fours).


  CHECKED 25 Nov 2026 by a separate checker (Sonnet), briefed to break it: PASS.
  All 3 arms and every outcome word-for-word in Q (only the declared added
  words); all 60 cells match the .sav (11,700 rows); the narration sentence true
  for all, including the 110 who wrote nothing; persona clean.
condition:
  source_var: XTESS218
  factors: [emotion_induced]
  considered_and_rejected:
    Q1_Q8_order: Order of the four candidate-pair blocks; a row cannot say where it sat.
    ClintonTrump_order: Whether Clinton or Trump came first in each pair; each statement is its own screen.
    Q18_Order: Order of Q18's two statements.
    Q19Q20order: Order of Q19 and Q20.
  arms:
    # Qcondition1 (Q 41)
    - raw: 1
      condition_num: 0
      factors: {emotion_induced: anger}
      text: |-
        You were given this writing task, with a large text box to write in:

        "The terrorist attacks that have occurred over the last year have evoked a lot of emotion in Americans. We are particularly interested in what makes you most angry, hostile, or disgusted about the attacks. Please write down in detail what makes you feel angry, hostile, or disgusted about the attacks. Write as detailed a description as possible. If you can, write your description so that someone reading it might even feel angry, hostile, or disgusted."
    # Qcondition2 (Q 48)
    - raw: 2
      condition_num: 1
      factors: {emotion_induced: fear}
      text: |-
        You were given this writing task, with a large text box to write in:

        "The terrorist attacks that have occurred over the last year have evoked a lot of emotion in Americans. We are particularly interested in what makes you most afraid, worried, or scared about the attacks. Please write down in detail what makes you feel afraid, worried, or scared about the attacks. Write as detailed a description as possible. If you can, write your description so that someone reading it might even feel afraid, worried, or scared."
    # Qcondition3 (Q 55)
    - raw: 3
      condition_num: 2
      factors: {emotion_induced: relaxation}
      text: |-
        You were given this writing task, with a large text box to write in:

        "Now we would like you to describe in general things that make you feel relaxed. It is okay if you don't remember all the details, just be specific about what exactly it is that makes you relaxed and what it feels like to be relaxed. Please describe the events that make you feel the most relaxed, these experiences could have occurred in the past or will happen in the future. If you can, write your description so that someone reading it might even feel relaxed."

