notes: 'ResearchBox 809, "Periodic Corporate Donations" (https://researchbox.org/809), Zenodo record 21934081.
  The paper is not named in the box and was not read.


  GENERATED by scripts/gen_researchbox809.py; every judgement is in its docstring. W1. Company eval stimulus
  sampling (AsPredicted #108254; Prolific, September 2022; US sample). 1,665 people kept by the authors''
  .rmd (Status 0, Finished 1, the recall check answered right for the arm). Between-person: one scenario
  each, assigned by the .qsf''s randomisers (condition, scenario; every recorded fill checked against
  the .qsf for every kept row). The row is every text screen from the scenario''s first screen to the
  reminder at the top of the measure page, word-for-word with its piped fields filled; the welcome screen,
  consent and id are dropped; bullets are written as lines starting ''- ''. The question names the arm''s
  own company (admire, favor, positive), so every arm carries its own wording; the Outcome-level question
  is the first arm''s form, overridden on every arm. Not built: the recall check (attention, used only
  for the exclusion).


  Wording from W1. Company eval stimulus sampling.qsf (the blocks the survey flow reaches). Typography
  normalised (HTML, non-breaking spaces, curly quotes); bold and underline dropped. Data: W1. Company
  eval stimulus sampling.csv. Persona: age (years; outside 18-100 left blank) and gender (the .qsf''s
  labels; ''Prefer not to say'' left blank). US sample, US dollars; invented companies.'
