study_id: e5rfg
experiment: six
source: tess
title: "Who has Narrow Brackets?"
data_file: TESS56_client.sav
licence: >-
  none stated on the OSF deposit (checked via the OSF API, 2026-10-10:
  registration e5rfg and its child components 2h7rt "Data" and 5jsqd "Materials
  and Methods" all have node_license null and no license relationship; same
  finding recorded 2026-10-02 in data/catalog/tess_uk_foundation_sources.csv).
  TESS states no reuse terms for its archived studies and has since suspended
  operations. So there is no explicit grant of redistribution rights for this
  deposit, and none should be assumed.

# Not in SocSci210 (tess_uk_foundation_sources.csv: in_socsci210=no), so there is
# no answer key to crosscheck against. Verified instead against the authors' own
# Table 4 (see notes, VERIFICATION) and by re-deriving every row from the .sav.
comparable_to_socsci210: false

notes: |-
  TESS 56 (Weizsacker; Rabin & Weizsacker, "Narrow Bracketing and Dominated
  Choices", AER 99(4) 2009, 1508-43), fielded by Knowledge Networks 31 Oct - 9 Nov
  2005, 1,910 fielded, 1,322 completes (completion report). The .sav has 1,322
  rows. One deposit, FOUR recipes, split along the design's own contrasts:
  e5rfg_tk (modules 1-2), e5rfg_ce (3-4), e5rfg_pair (5-6), e5rfg_six (7-10).


  SOURCES AND PROVENANCE

    Q    = "TESS 56 Final Questionnaire.doc" (Knowledge Networks file
           TESS56_Weizsacker_QuexV2.doc, last saved 10/26/2005), the FIELDED
           instrument. Not in the data component: it is in the OSF child component
           5jsqd "Materials and Methods" of registration e5rfg
           (https://osf.io/download/565db7518c5e4a3875d74ee9/, 223,232 bytes, sha256
           209002eff60b466f8830988d7cbe63290c0eb58ffbc636814e0892c82cc0cbc2),
           fetched 2026-10-10 into data/raw/e5rfg/quex/ and converted with macOS
           textutil. The recipes were generated from transcribed text by a
           maker script that asserted every line occurs in Q. Fielded version confirmed against the .sav: the MODULE
           variable carries the questionnaire's ten modules, every M*D* variable
           name in the .sav is a question id in Q, and every choice item's value
           labels list the options in Q's order (e.g. M2D1 1-4 = Q's A-D, M7D3
           1-4 = Q's four Decision 3 options).
    KN   = "Knowledge Networks Methodology.pdf" (same component,
           https://osf.io/download/565db7518c5e4a3875d74ee8/, sha256
           8ec3ce15a3d24dc0b527c0907553de900861358756af7025f323f5c835bc01ba).
    CR   = "TESS 56 Completion Report.doc" (https://osf.io/download/565db74f8c5e4a3877d7647a/,
           sha256 268191ed9c345b2b911cfc32cc8c41245f8869ef02b83a92d1c16ef7397761a4):
           field dates and N only.
    Data = TESS56_client.sav (OSF component 2h7rt, https://osf.io/download/3562b/,
           sha256 a3831a94572da8ccc6045a4c00a17af4b3f7f6fa536bf4eb10f51e4b6616ea8b).
    REF  = Rabin & Weizsacker, IZA DP 3040 (Sept 2007), https://docs.iza.org/dp3040.pdf
           (sha256 6c950e33edc9905743e4d84842d0d380d28334968c593006f2ba8dc6a9ab80ac),
           Table 4 and appendix Tables 8.1/8.2. Used ONLY as a numeric answer key.
           Its appendix reprints the instrument with relabelled options ("the labels
           of choice options were changed from the instructions, for the sake of
           the exposition"), so it is no authority on wording.


  THE DESIGN (Q lines 7-20)

  A weighted random draw put each respondent into ONE of ten modules (MODULE:
  90/87/92/106/108/111/175/188/179/186), then everyone took Module M (numeracy).
  Each module shows ALL its decisions first, then asks for the answers on later
  screens ("You will read about both/all six decisions before deciding how to
  answer them"). That preview is the narrow-bracketing manipulation, so every
  row's condition is the module's whole preview up to and including the "Now
  please answer ..." line, and the outcome is the answer-screen wording of that
  one decision. Nothing a respondent answered is narrated: every decision is in
  the preview before any answering starts.

  Two kinds of decision:
    choice  "Choose between:" 2 or 4 gambles, nominal, codes 1..n.
    CE      "Consider the following:" a 50/50 lottery and an unknown amount; the
            respondent types a dollar amount in a number box with a stated RANGE.

  All M*D* responses are NaN when not asked or skipped (no -1/-2 occurs in any
  outcome; missing_codes [-1, -2] declares the labelled codes anyway). All
  answered values are integers inside their questionnaire RANGE (checked).


  WORD-FOR-WORD vs WHAT WE CHANGED

  Every line of every condition and outcome is transcribed from Q; the generator
  asserted each of 188 transcribed lines occurs in Q (typography normalised:
  curly quotes straightened). Source typos kept: M7 Decision 5 says the unknown
  amount for option L lies "between $100 and $1600" while its range is $850-$2350
  (Q 367, 437); M10 Decision 5 "You win be given" (Q 913, 985). Preview and
  answer screens differ in places and each keeps its own words (M3/M4: preview
  "need to be given in Option B", answer screen "have to be given in option B").
  What is NOT word-for-word, all deliberate:
    1. Programmer notes in brackets, "SINGLE PUNCH ANSWER", number-box blanks
       ("________") and question ids are dropped.
    2. OPTION ORDER (the riskiest judgement, see below). Every choice item says
       "[RANDOMIZE ANSWER LIST ...]" / "[Randomize the order of options ...]", and
       no variable records the order shown. Options are therefore listed in the
       .sav's code order (= Q's order), with NO letters, both in the condition
       preview and in the outcome. The letters (typed "A." / "B." in modules
       1, 2, 5, 6) are dropped because a letter names a screen position that
       was randomised; no text anywhere refers to a choice option by letter, so
       dropping them loses nothing a respondent could use. In the outcome the
       options follow the corpus answer-key form for nominal items ('Decision 1:
       Choose between:' then '1 means "..."; 2 means "..."'), keyed by the .sav
       codes - an answer key, not a claim of display order.
    3. CE OPTION LETTERS. The CE lines in modules 3, 4 and 7-10 are not typed
       with letters in Q's text; Q's Word file auto-numbers them as a lettered
       list (decoded from the .doc's list tables: upper-letter format), and the
       question text refers to them by letter ("in option J ... over taking your
       chances with option I"). The letters used here are the ones the text's own
       references fix, which agree with Q's programmer notes ("options A and B in
       decision 1", "C-F in decision 2", "M and N in decision 6"). Q's Word
       numbering agrees with the text everywhere: where "Rules" lines sit in the
       same list they are at list level 1 (ilvl 1), which does not advance the
       level-0 letters. (A first decode ignored ilvl and wrongly reported
       disagreements; corrected after checking.) Rules are rendered as bullets
       ("•").
    4. Layout: paragraph breaks kept as newlines. The shared introduction of
       modules 7-10 is shared_context, and the pipeline joins it to the arm text
       with a space, so Q's paragraph break before "Decision 1" becomes a space
       (cosmetic, pipeline behaviour).


  EXCLUDED, WITH ROW COST

    * Two-box CE items, where the respondent types EITHER "losing ___" OR
      "winning ___" (M7D6_1/_2, M8D5_1/_2, M9D4_1/_2, M9D5_1/_2). The answer is
      a box choice plus an amount spread over two variables; the pipeline reads
      one variable per outcome, and a row from one box alone would hide which box
      was chosen. Many respondents also filled both boxes against "(Please make
      one entry)" (e.g. M7D6: 109 losing + 117 winning entries from 175
      respondents), so the answer is ambiguous for them. Cost: 4 items, 704
      answered respondent-items, 189 of them with both boxes filled. Their decisions still appear in the
      condition preview of modules 7-9, because respondents read them.
    * Module M (MM1-MM5): numeracy test with right answers, asked after the
      experiment; not behaviour and not persona (measured after the stimulus).
    * Persona fields marital_status (PPMARIT), employment (PPWORK) and
      housing_ownership (PPRENT): this 2005 file's labels ("Single (never
      married)", "I am disabled", "Own"/"Rent"/"Do not pay for housing", ...)
      are not in the persona crosswalks, so QC rule 14 warns. Adding them needs
      scripts/persona_harmonise.py to write data/catalog/, which this build may
      not touch. Restore all three once the crosswalk covers them.
    * INCLUDE (0 = refused more than a third of the variables, 23 respondents)
      is NOT used as a filter: their answered items are real answers (36 rows
      across the four recipes). REF's counts include them (Table 4 N matches).


  PERSONA

  Knowledge Networks standard profile, as c5r2f/7jt2f: PPAGE, PPGENDER, PPEDUCAT,
  PPETHM, PPINCIMP, PPREG4, PPHHSIZE, PPHOUSE, PPMSACAT, PPNET. No party, ideology
  or religion in this file. No field shares a domain with the outcome (risky
  choice) and no condition names a persona category. Jev (recipe_prep) picked
  PPEDUC for education (conf 1.00); PPEDUCAT is used instead, as every other
  KN-era recipe does, since the crosswalk harmonises that one.


  JEV (scripts/recipe_prep.py e5rfg --source tess)

    assignment: MODULE, conf 0.73, REVIEW (runner-up NONE_OF_THESE 0.18).
      Accepted: Q line 7 "do a weighted probability selection to one of 10
      survey modules", and MODULE's labels are "Module 1".."Module 10".
    labels: the one Jev/regex disagreement is INCLUDE (Jev: both labels
      non-answers, conf 0.41/0.43, REVIEW). Irrelevant: INCLUDE is neither
      persona nor outcome here.
    directives: "ppeduc = 4 - 9" (routing_only, conf 0.39, REVIEW) gates MM5,
      which is not built.


  RISKIEST JUDGEMENT

  Building the choice items at all. Their option order was randomised per
  respondent and not recorded (ledger #114, xk9ch's excluded pick-three items),
  so any listed order is one that half of respondents (2 options) or 23 in 24 (4
  options: M2D1, M6D1, M7D3, M10D2) did not see. Mitigation: no letters, no
  position words, code order = the instrument's own order; the outcome's
  '1 means "..."' legend is the answer key. The alternative, building only the CE items,
  would drop the dominated-choice experiment the study exists for. A checker
  should rule on this (kept on 2026-10-10 on the independent checker's verdict, pending rich's ruling); if it is overruled, e5rfg_tk and e5rfg_pair go entirely
  and e5rfg_six keeps only its 9 CE outcomes.


  VERIFICATION

  Re-derived every row from the .sav with an independent script
  (scripts/verify_e5rfg.py: its own module -> variable -> range table, not the
  recipe; reads the built parquets): 0 missing, 0 extra, 0 wrong (participant, task, condition, response)
  across all four recipes; persona age and gender match the .sav on every row;
  exactly one condition string per (condition, task) and one outcome string per
  task; no "[", "]" or "___" left in any text. Against REF Table 4, computed
  from the BUILT rows: 10 of 11 rows match to the printed two decimals (largest
  gap 0.01; N equal where REF prints one). Of those 0.01 gaps, T5's A&C is a
  rounding artefact; T7 Example 4 and T8 Example 3 differ because REF uses each
  treatment's common sample (respondents answering all of that treatment's
  choices: 171 and 186) while each row here stands alone. The exception is
  treatment 6 (module 6,
  Example 2 broad), where REF's "A and C" (0.09) and "B and C" (0.12) are our
  0.12 and 0.09. Module 10's M10D2 has the identical four options with
  identical value labels and matches REF exactly under the same mapping, so a
  transposition in REF's table is the likelier explanation; a swap of codes 2/3
  in the deposit's M6D1 cannot be ruled out from the source (23 rows affected
  if so). scripts/verify_e5rfg.py asserts this as a KNOWN difference: REF's
  printed values are stored, and the check requires that they fail directly and
  pass with exactly cells A&C/B&C swapped. Appendix Tables 8.1/8.2 (CE % at min, mean net CE, % at EV, % at max)
  match all 9 CE items built (REF reports losses sign-flipped with min/max
  swapped), except that two means differ by exactly 1.00 (M10D4 302.51 vs REF
  303.51; M10D5 -194.82 vs -195.82). REF itself warns the CE data are "probably
  unreliable" (about a third of answers sit at a range boundary).

  THIS RECIPE: e5rfg_six - modules 7-10, six decisions each, all previewed before
  any is answered (REF treatments 7-10). The modules differ wholesale, so no
  factor is declared; the comparisons REF draws are across them (Example 2 narrow
  on one screen in 7, on separate screens in 8, broad in 10; Example 4 broad in 7,
  narrow in 9, narrow on separate screens in 10; Example 3 in 8).
    arm 0 = MODULE 7: M7D1, M7D2 (Example 2), M7D3 (Example 4 broad, 4-way),
            M7D4 CE 100-1600, M7D5 CE 850-2350. [M7D6 two-box CE excluded]
    arm 1 = MODULE 8: M8D1, M8D2 (Example 3), M8D3 CE 500-1500, M8D4 CE
            500-1500 (loss), M8D6. [M8D5 excluded]
    arm 2 = MODULE 9: M9D1, M9D2 (Example 4), M9D3 CE 850-2350, M9D6 CE
            1000-2000. [M9D4, M9D5 excluded]
    arm 3 = MODULE 10: M10D1, M10D2 (Example 2 broad, 4-way), M10D3 CE 0-1000,
            M10D4 CE 0-1000 (loss), M10D5 CE 1500-2500, M10D6.
    The excluded items' decisions stay in the preview (condition), because they
    were read. Conditions are long (3,500-4,200 characters, every decision with
    its rules), which is what the respondent read before answering.
    Choice outcomes use the study recode 1-4; each CE outcome has an identity
    recode over its own RANGE.
    Rows: 3,608 = arm 0 859, arm 1 931, arm 2 709, arm 3 1,109.
    Per task 0-19: 174 171 172 172 170 | 187 188 185 185 186 | 179 179 177 174 |
    185 184 185 185 185 185.
    Q lines: module 7 302-454, module 8 495-647, module 9 680-841, module 10
    846-997.

condition:
  source_var: MODULE
  factors: []
  shared_context: |-
    The following pages describe six decisions that you will be asked to make about winning or losing money. You will read about all six decisions before deciding how to answer them. When it is time to decide, please make your decisions as though you were actually going to win or lose the money in all six cases.

    Please keep in mind that to win or lose in one decision does not make it more or less likely that you win or lose in another decision, as though the outcome of each decision were decided with a separate coin flip.
  arms:
    - raw: 7
      condition_num: 0
      factors: {}
      text: |-
        Decision 1: Choose between:
        not winning or losing any money
        a 50% chance of losing $500 and a 50% chance of winning $600

        Before answering, please read the second decision.

        Decision 2: Choose between:
        losing $500
        a 50% chance of losing $1000, and a 50% chance of not winning or losing any money

        Before answering, continue to the next page to read the third decision.

        Decision 3: Choose between:
        a 50% chance of losing $700 and a 50% chance of winning $950
        winning $200
        a 50% chance of losing $550 and a 50% chance of winning $950
        a 25% chance of losing $1450, a 25% chance of winning $50, a 25% chance of winning $200, and a 25% chance of winning $1700

        Before answering, please continue to the next page to read the fourth decision.

        Decision 4: Consider the following:
        I. You have a 50% chance of winning $100 and a 50% chance of winning $1600
        J. You will be given some unknown amount of money

        What is the smallest amount of money that you would need to be given in option J for you to select that option over taking your chances with option I?

        Rules:
        • Before the study began, an unknown amount between $100 and $1600 was determined for option J. If this unknown amount is higher than your answer, then you will receive the unknown amount. If the unknown amount is lower than or equal to your answer, you will receive option I.
        • All amounts between $100 and $1600 are possible and equally likely, as the unknown amount.

        Before answering, please continue to the next page to read the fifth decision.

        Decision 5: Consider the following:
        K. You have a 50% chance of winning $850 and a 50% chance of winning $2350
        L. You will be given some unknown amount of money

        What is the smallest amount of money that you would need to be given in option L for you to select that option over taking your chances with option K?

        Rules:
        • Before the study began, an unknown amount between $100 and $1600 was determined for option L. If this unknown amount is higher than your answer, then you will receive the unknown amount. If the unknown amount is lower than or equal to your answer, you will receive option K.
        • All amounts between $850 and $2350 are possible and equally likely, as the unknown amount.

        Before answering, please continue to the next page to read the sixth and final decision.

        Decision 6: Consider the following:
        M. You have a 50% chance of losing $1400 and a 50% chance of winning $100
        N. You win or lose some unknown amount of money

        The amount of money you could lose in option N could be as much as $1400, or you could win up to $100. What is the worst outcome that you would be willing to accept in option N and still be willing to select this over taking your chances with option M?

        Rules:
        • Before the study began, an unknown amount between "losing $1400" and "winning $100" was determined for option N. If this unknown amount is better for you than your answer, then you will get the unknown amount. If the unknown amount is worse than or equal to your answer, you will receive option M.
        • All amounts between "losing $1400" and "winning $100" are possible and equally likely, as the unknown amount.

        Now continue to answer all six questions.
