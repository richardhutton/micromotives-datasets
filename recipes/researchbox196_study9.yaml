notes: 'Mehr KS, Simmons JP (2024), "How Does Rating Specific Features of an Experience Alter Consumers''
  Overall Evaluations of That Experience?", Journal of Consumer Research 51(4):739-760, doi:10.1093/jcr/ucae005.
  ResearchBox 196 (https://researchbox.org/196).


  GENERATED by scripts/gen_researchbox196.py; every judgement is in its docstring. Study 9 (AsPredicted
  #63813), 1,089 people kept by the authors'' R script''s exclusions. Four domains (airplane, dentist,
  bookcase, sneakers), each person rating one scenario per domain (randomised among the domain''s 4, or
  3 for bookcase), on a rating screen randomised per domain: Overall only, Overall plus every attribute,
  plus the scenario''s positive attributes, or plus its negative ones (the .qsf''s display logic; the
  codebook''s attribute labels agree, asserted). The rating page repeated the scenario after ''Here is
  the scenario you read on the last page:''; the row states it once. The domains came in a random order
  that is recorded; only each person''s FIRST domain is built, because a later domain''s row would have
  to narrate every earlier one. Not built: 4,278 later-domain ratings of kept people. Also not built (main-session
  ruling, the riskiest part removed): the 337 people whose first domain was the bookcase, because the
  data''s three bookcase columns tie to the .qsf''s blocks bookcaseS1, S2 and S4 by position alone and
  S2 and S4 have the same rating rows, so the deposit cannot confirm which scenario text an answer belongs
  to. Built: the airplane, dentist and sneakers domains. 10 stars, the answer the number chosen.


