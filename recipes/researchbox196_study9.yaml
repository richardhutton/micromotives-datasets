    text: 'Imagine that you are flying somewhere for vacation.


      Upon getting to the airport, you go through security and find your way to your gate. Boarding has
      started, but is quite slow, so you wait 20 minutes before you''re allowed to go on the plane. Once
      on board, you struggle to find room for your carry-on bag and find your seat to be quite uncomfortable.
      Once the plane reaches cruising altitude, the flight attendants provide beverages and granola bars,
      and you spend part of the flight watching a movie on the TV screen in front of you. The plane lands
      uneventfully, but when you get to baggage claim to collect your bags, you find that they are missing.
      The airline delivers them to your home a week later.


      Beneath the scenario was the rating question below, with one row of stars, labelled "Overall".'
