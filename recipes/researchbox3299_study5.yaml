notes: 'Gaertig C & Simmons JP (2025), "Why (and When) Are Uncertain Price Promotions More Effective Than
  Equivalent Sure Discounts?", Journal of Consumer Research, doi:10.1093/jcr/ucaf036. ResearchBox 3299
  (https://researchbox.org/3299).


  GENERATED by scripts/gen_researchbox3299.py; every judgement is in its docstring. Study 5, Prolific,
  April 2023. An $11 product; 10% off framed as "10%" or "$1.10", against a 10% chance it is free; option
  order randomised and recorded (SureDiscountFirst). 1,187 of 1,227 kept (do file: 18 duplicate IPs, 2
  duplicate Prolific IDs, 20 who did not answer).


  Wording from the .qsf (Qualtrics_Study_5.qsf; its twin export has the same questions, see the docstring).
  Typography normalised (curly quotes, non-breaking and zero-width spaces). Persona: age (years; outside
  18-100 left blank) and gender, labels from the .qsf''s own choices.'
condition:
  source_vars:
  - Condition
  - SureDiscountFirst
  factors:
  - framing
  - order
  arms:
  - raw_values:
      Condition: 1
      SureDiscountFirst: 1
    condition_num: 0
    factors:
      framing: percent
      order: sure_first
    text: 'Imagine you are about to buy a product.


      The original price of the product is $11.


      You learn that the product comes with one of two types of price promotions, and that you can choose
      which type of price promotion you would like to receive.


      You can choose between two promotions:


      Promotion A: 10% off of the price of the product

      Promotion B: A 10% chance to get the product for free


      The promotion that you choose will be applied to the original price of the product ($11).'
  - raw_values:
      Condition: 1
      SureDiscountFirst: 0
    condition_num: 1
    factors:
      framing: percent
      order: uncertain_first
    text: 'Imagine you are about to buy a product.


      The original price of the product is $11.


      You learn that the product comes with one of two types of price promotions, and that you can choose
      which type of price promotion you would like to receive.


      You can choose between two promotions:


      Promotion A: A 10% chance to get the product for free

      Promotion B: 10% off of the price of the product


      The promotion that you choose will be applied to the original price of the product ($11).'
  - raw_values:
      Condition: 2
      SureDiscountFirst: 1
    condition_num: 2
    factors:
      framing: dollar
      order: sure_first
    text: 'Imagine you are about to buy a product.


      The original price of the product is $11.


      You learn that the product comes with one of two types of price promotions, and that you can choose
      which type of price promotion you would like to receive.


      You can choose between two promotions:


      Promotion A: $1.10 off of the price of the product

