        1: {outcome_question: "Currently, state law does not allow for Jaime to change the gender listed on their birth certificate from male to X. If given the opportunity, how willing would you be to sign a petition urging legislatures to change the law so that Jaime's birth certificate could be amended?"}
    # Q 229-233
