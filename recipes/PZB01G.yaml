  NO CROSSWALK YET — AS WITH QQM5MC AND LOGVPZ

  The UK persona vocabulary is designed after reading every UK deposit, not from
  one of them, so QC rule 14 will report these 19 persona fields as unmapped,
  which is correct and expected, exactly as `QQM5MC`'s notes record.


  WORDS WE ADDED, AND WHY — docs/CONVENTIONS.md "Narrating what the respondent
  did" / the `LOGVPZ`/`QQM5MC` precedent

  `shared_context` is composed, stating only facts the paper itself gives (p.7:
  YouGov; Wave 2 fielded 16 October - 9 November 2015, two weeks after Wave 1).
  The control arm's text narrates the absence of a vignette, per p.7's own
  description ("a control group, which was not exposed to a vignette"). Each
  treatment arm's text is the one composed lead-in sentence ("You are shown the
  following:") plus the three appendix paragraphs verbatim — see THE VIGNETTE
  JOIN above for exactly what is and is not asserted by this. The outcome
  question is the paper's own quoted wording (p.7) plus one composed sentence
  naming all four response codes by the source's own labels, in the same style
  `PMV0TG` uses for its binary forced choice: '1 means "Remain in the EU"; 2
  means "Leave the EU"; 3 means "Would not vote"; 4 means "Don't know".'


  VERIFICATION — scripts/verify_PZB01G.py, FROM THE BUILT PARQUET

  Two numbers the authors themselves published, both reproduced from the BUILT
  parquet rather than the deposit:
  1. Appendix Table A6's nine group sizes (563/636/551/617/553/587/610/652/564,
     sum 5,333) against the built `condition_num` value counts — exact match
     expected on every one of the nine, since no row is dropped (see ROW COUNT
     RECONCILIATION above).
  2. The paper's own stated control-group Wave 2 percentages (p.8: "among those
     in the control group... results changed slightly to 37.1 per cent, 44.0 per
     cent and 18.8 per cent, respectively" for Remain/Leave/DK-or-would-not-vote)
     against the built rows with `condition_num == 0`, merging response codes 3
     and 4 for the comparison only (see the DK ruling above for why they are
     NOT merged in the stored data). Independently recomputed here before
     writing this recipe, directly from the deposit, to confirm the check is
     even possible: 209/248/16/90 of 563 = 37.1%/44.0%/2.8%/16.0%, and
     2.8+16.0 = 18.8% — all three match the paper's printed figures exactly to
     one decimal place.

condition:
  source_var: split
  factors: [cultural_frame, economic_frame, political_frame]
  considered_and_rejected:
    cultvig: >-
      Per-frame code for the cultural argument alone (1 pro / 2 anti). Confirms
      `split`'s own coding (see notes) but is not itself the assignment variable
      — it is -9/-8 ("Not Asked"/"Skipped") for the control group, so it cannot
      resolve the control arm on its own.
    econvig: Same role as cultvig, for the economic argument.
    politicalvig: Same role as cultvig, for the political argument.
    controlsplit: >-
      A second, redundant encoding of the same nine-way assignment used
      elsewhere in the authors' own do-file for group-size tabulation; `split`
      is the one this recipe reads.
    control: >-
      Binary dummy (1 = control, 0 = any treatment), a strict function of
      `split == 1`. Not used as the assignment variable because it cannot
      distinguish the eight treatment cells from each other.
  shared_context: >-
    You are taking part in the second part of an online survey about the United
    Kingdom's membership of the European Union (EU), run by YouGov. This part
    was conducted between 16 October and 9 November 2015, about two weeks after
    you completed the first part of the survey.
  arms:
    - raw: 1
      condition_num: 0
      factors: {cultural_frame: absent, economic_frame: absent, political_frame: absent}
      text: >-
        You are not shown any statement about the EU. You go straight to the
        question below.

    - raw: 2
      condition_num: 1
      factors: {cultural_frame: pro, economic_frame: pro, political_frame: pro}
      text: >-
        You are shown the following:


        "Britain shares important values with our European neighbours, such as
        freedom of speech, gender equality, the rule of law, and respect for
        liberal democracy. Amid a world that seems less stable, and where there
        are competing ideologies, European countries can better promote and
        protect their values by acting together, as members of the European
        Union. For Britain, remaining in the EU would help defend its national
        culture, traditions and values."


        "Britain's membership of the European Union attracts significant inward
        foreign investment into the British economy. The EU is Britain's major
        trading partner, which in 2014 accounted for 45% of exports and 53% of
        imports of goods and services. It is estimated that over three million
        jobs in Britain are linked, directly or indirectly, to its exports to the
        European Union. By remaining in the EU, these economic benefits would be
        safeguarded."


        "If the European Union is to work in Britain's interests, then Britain
        needs to be involved in the decision-making process. France and Germany
        would have no incentive to listen to Britain if it is not working closely
        with them as a member of the EU. If Britain were to leave the EU, to
        continue to trade with EU countries it will need to apply EU rules on
        trade, investment, product standards and services, but it will have no
        say when these rules are made. For Britain, remaining in the EU would
        ensure that it enjoys these political benefits."

    - raw: 3
      condition_num: 2
      factors: {cultural_frame: anti, economic_frame: pro, political_frame: pro}
