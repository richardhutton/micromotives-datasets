      are other studies, and a row cannot say what came before it.'
  template:
    text: |-
      Professional reference inquires (or "reference checks") are a standard component of most hiring processes. The amount and quality of information obtained during these checks, however, widely varies. This study examines how information gleaned through this process is perceived by potential employers, co-workers, and clients. Review the email exchange on the following screen concerning a job applicant for a project manager position and answer the questions that follow.

      Hi A.J.,

      Sure. {gender.title} Morgan was employed by Highland Strategies as an Associate Project Manager from 2016 to 2019. From 2017 to 2019, I was {gender.possessive} direct supervisor. In this role, {gender.subject} was the primary contact between vendors and staff and oversaw project costs and schedule. This is a salaried, full-time, 40 hour/week position {hours.conj} {gender.title} {hours} Highland keeps monthly performance data (e.g., budget and schedule variance, stakeholder acceptance and feedback) and conducts quarterly performance reviews for all employees. In looking at the data, {gender.title} Morgan consistently performed in the top {performance} of employees in similar positions. Let me know if you have any additional questions.

      Taylor

      On Wed, Nov 25, 2020 at 10:33 AM Turner, Adam <aj.turner@diversified.com> wrote:

      > Dear Mr. Welch,

      > We are considering {gender} Morgan for a project manager position and {gender.subject} listed you as a professional
      > reference. Any information you can provide would be greatly appreciated. Thanks, in advance.

      > Sincerely,
      > A.J. Turner
      > Diversified Project Management
    outcome_questions:
      0: On the following scale, how committed do you think {gender.title} Morgan is to {gender.possessive}
        work?
      1: On the following scale, how competent do you think {gender.title} Morgan is?
      2: On the following scale, how likeable do you find {gender.title} Morgan?
      3: On the following scale, how reliable do you think {gender.title} Morgan is?
    dimensions:
      hours:
        var: P_MUNSCHEXP1
        levels:
          1:
            level: standard_hours
            text: Morgan worked standard business hours (M-F, 9am-5pm).
            parts:
              conj: and
          2:
            level: overwork
            text: Morgan often came in early and stayed late, putting in 50 or 60 hours/week.
            parts:
              conj: although
      gender:
        var: P_MUNSCHEXP2
        levels:
          1:
            level: woman
            text: Amy
            parts:
              title: Ms.
              possessive: her
              subject: she
          2:
            level: man
            text: Jason
            parts:
              title: Mr.
              possessive: his
              subject: he
      performance:
        var: P_MUNSCHEXP3
        levels:
          1:
            level: top_1pct
            text: 1%
          2:
            level: top_5pct
            text: 5%
          3:
            level: top_10pct
            text: 10%
          4:
            level: top_20pct
            text: 20%
          5:
            level: top_30pct
            text: 30%
          6:
            level: top_40pct
            text: 40%
          7:
            level: top_50pct
            text: 50%
          8:
            level: top_60pct
            text: 60%
outcomes:
- var: Q1_MUNSCH
  task_num: 0
  question: On the following scale, how committed do you think Ms./Mr. Morgan is to her/his work?
  scale:
    min: 1
    max: 7
    min_label: not at all committed
    max_label: extremely committed
- var: Q2_MUNSCH
  task_num: 1
  question: On the following scale, how competent do you think Ms./Mr. Morgan is?
  scale:
    min: 1
    max: 7
    min_label: not at all competent
    max_label: extremely competent
- var: Q3_MUNSCH
  task_num: 2
  question: On the following scale, how likeable do you find Ms./Mr. Morgan?
  scale:
    min: 1
    max: 7
    min_label: not at all likeable
    max_label: extremely likeable
- var: Q4_MUNSCH
  task_num: 3
  question: On the following scale, how reliable do you think Ms./Mr. Morgan is?
  scale:
    min: 1
    max: 7
    min_label: not at all reliable
    max_label: extremely reliable
