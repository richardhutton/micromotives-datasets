      # its last screen; every screen's own condition is in `items`.
      text: >-
        You were told: "The governments of the world have agreed to ensure additional investment and aid goes to developing countries in order to improve livelihoods and reduce extreme poverty by 2030." You were asked to rate your support for your government's efforts to meet that goal, then asked again after being told: "Now, consider this: some people say that rich countries already spend around 20-25% of the government budget to give aid to developing countries." and again after being told: "Now, consider this: investment is needed since 10 percent of the world's population or 734 million people live on less than $1.90 a day. And, economists have calculated that every $12.50 of aid invested in developing countries results in a return of around $15." Next you were told: "The governments of the world have agreed to work towards ending preventable deaths of newborns and children under 5 years of age by 2030." You were asked to rate your support for your government's efforts to meet that goal, then asked again after being told: "Now, consider this: some people say that in developing countries people are having more and more children, especially if fewer are dying in childbirth, which is unsustainable and will result in mass starvation and war." and again after being told: "Now, consider this: about 295,000 women die during and following pregnancy and childbirth each year. Improvements in people's lives around the world have seen the number of babies per woman fall to 2.5 children and low fertility rates are the norm in most parts of the world." Next you were told: "The governments of the world have agreed to work towards providing fair, affordable and safe access to drinking water for all by 2030." You were asked to rate your support for your government's efforts to meet this goal, asked again after being told: "Now, consider this: some people say that people who are used to drinking dirty water are immune to its effects, which means all of these efforts are a waste of time and money." and then were told: "Now, consider this: more than two billion people around the world still lack access to safe water. And, every $1 invested in water and toilets returns an average of $4 in increased productivity."
