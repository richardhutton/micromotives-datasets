study_id: del
source: dataverse
title: "Development Engagement Lab, Sandbox Great Britain July 2020: global goals messages"
data_file: DEL_Sandbox_GreatBritain_Jul2020_Data.sav
licence: CC0 1.0 doi:10.7910/DVN/LLM8VW, stated on the Harvard Dataverse deposit "DEL
  Sandbox 2020" and read from the Dataverse API (latestVersion.license, version 3) on 10
  Oct 2026. The deposit's Readme adds "DEL datasets are a public good and can be used with
  the appropriate citation."

comparable_to_socsci210: false
experiment: sandbox_jul2020_global_goals
participant_id_var: GUNQID

notes: |-
  Hudson, Jennifer; Hudson, David; Morini, Paolo, 2024, "DEL Sandbox 2020",
  https://doi.org/10.7910/DVN/LLM8VW, Harvard Dataverse, V1;
  DEL_Sandbox_GreatBritain_Jul2020_Data.sav. Fielded online by YouGov, 7-13 July 2020,
  n = 2,009 adults in Great Britain (the deposit's Readme). The Readme lists the
  survey's topics as "Information & misinformation; SDGs; Cooperation & trust".

  PANDEMIC CHECK. None of the nine screens of this experiment mentions Covid-19, the
  coronavirus, the pandemic or lockdown, and neither does the block's introduction.
  Elsewhere in the same survey, NOT part of this experiment: before it, the knowledge
  quiz (`deadly`, `wash`: Covid-19 vs flu, soap and the coronavirus) and the
  believability grid (`believability_2`-`_4` name Covid-19 and "the global pandemic",
  shown to a random subset via `Q_StatementsToShow`); after it, `coop`, `lead`,
  `covidaid`, `aware`, `trust`, `who`, `rolesgen` and `spread`, all Covid-framed. None of
  these is rendered.

  THE DESIGN IS WITHIN-SUBJECT, NOT 12 MESSAGES. The catalogue's summary ("each told as
  progress, failure or mixed") is not what the script contains. Every respondent was
  asked all nine screens: three goals (`wash` drinking water, `mat` deaths of newborns and
  children under 5, `pov` investment and aid to reduce extreme poverty), each asked
  three times in a row, always in this shape: `_p` the goal sentence alone; then `_fn`
  the goal sentence plus "Now, consider this:" and facts and figures in the goal's
  favour; and `_m` the goal sentence plus "Now, consider this: some people say that ..."
  and a claim against it. (The suffixes are the script's; reading `fn` as facts and `m`
  as myth or misinformation is ours, from the content and the Readme's topic list, and
  appears nowhere but the factor and comment names.) `experimentsplit` (1-12, labels
  only -9 "Not Asked" / -8 "Skipped", neither occurring) assigns only the ORDER: 6 goal
  orders x 2 follow-up orders (fn then m, or m then fn; the same for all three goals
  within a group). Each group has its own nine variables, `g<k><goal>_<p|fn|m>`, listed
  in the script in the order shown; the modules carry no `order=randomize`, and the
  .sav holds the variables in the same order. Group sizes 194 / 167 / 151 / 167 / 161 /
  171 / 152 / 167 / 153 / 163 / 190 / 173. No assignment code is recorded in the script
  (no `assign_treatment` line was exported).

  ROWS. Arms are the 12 groups (condition_num = experimentsplit - 1). Outcomes are the
  nine screens by CONTENT, not by position: task 0-2 wash p/fn/m, 3-5 mat p/fn/m, 6-8
  pov p/fn/m, each arm naming its own variable for each. Every screen asks the same
  question word-for-word ("Thinking about the information above ... how supportive or
  unsupportive are you of your government's efforts to meet this goal?"); "this goal"
  is the last goal the row's condition names. Factors: `goal_order` (the three goals in
  the order met) and `info_order` (`fn then m` / `m then fn`).

  THE CONDITION OF EACH SCREEN IS EVERYTHING THE RESPONDENT HAD BEEN SHOWN IN THIS
  BLOCK UP TO AND INCLUDING THAT SCREEN, in their group's order: earlier goals in full
  (goal sentence, then both follow-ups in the group's order), then the current goal's
  sentence and whichever of its follow-ups had been reached. That is how the goal order
  and the follow-up order (the only things randomised) reach the text, and it is true at
  every screen: nothing later is named (checked on all 108 cells). Each `items` entry
  declares its own `condition_text`; `text` on the arm is the whole block, identical to
  its last screen's condition, and is what QC rule 5 compares. Cells genuinely identical
  across arms (e.g. the first goal's screens in groups that share their first goal and
  follow-up order) are so because nothing had yet diverged, and are declared as such.
  Within a goal, each fielded screen repeated the goal sentence above its "Now, consider
  this:" line; the sentence is stated once per goal (compressed, not dropped).

  WORD-FOR-WORD vs NARRATION. Everything inside quotation marks is the instrument's,
  from DEL_Sandbox_GreatBritain_Jul2020_Survey.docx, with `**Now**` unbolded, curly
  apostrophes straightened and whitespace collapsed (the `pov_m` question's double space
  "unsupportive  are"); every one of the 9 (goal, screen) wordings is byte-identical
  across all 12 groups after that, and the codebook's variable labels agree with the
  script. The source's own "Now," is kept. ADDED by us (docs/CONVENTIONS.md, "Narrating
  what the respondent did"), and nothing else: "You were told:", "Next you were told:",
  "You were asked to rate your support for your government's efforts to meet that goal,
  then asked again after being told:", "and again after being told:", "You were asked
  to rate your support for your government's efforts to meet this goal, then were
  told:", "... asked again after being told: ... and then were told:", and the
  quotation marks. No numbers and no positions. "Asked to rate", not "rated": 397
  people answered "Don't know" on an earlier screen of the block and still contribute
  1,593 rows on later screens, so "You rated" would be false for them; being asked is
  true for everyone in the arm (found by the independent checker). DROPPED: the block introduction "We are now going to show you a series of
  statements about three goals the international community has committed to achieving.
  Please indicate the extent of your support or opposition based on the information
  provided." It describes the instrument's structure (a count of goals), the survey-
  mechanics ruling; the goal sentences carry its content ("The governments of the world
  have agreed ...").

  OUTCOME. 0 "Very unsupportive" ... 10 "Very supportive", as fielded. 11 "Don't know"
  dropped as a non-answer; 98 "Skipped" / 99 "Not Asked" (codebook labels; the .sav
  carries no value labels on these 108 variables) never occur and are declared so a
  re-fetched deposit that has them drops them.

  ROUTING. `routing_check: true`: every respondent answered all nine of their own
  group's variables and none of any other group's (0 cross-answers among 2,009), so
  `ambiguous_routing` is 0. "Not asked" is blank in this file.

  WHAT CAME BEFORE, the same for every group: aid priorities ranking, `intcon` /
  `conshould` (international interconnection), the knowledge quiz, `informed`, the
  conspiracy-mindset grid, and the believability grid, the block immediately before
  this one, which shows each person 3 of 16 statements (`Q_StatementsToShow`; every
  respondent has exactly 3), among them "Globally, the number of people living
  in extreme poverty declined from 36 per cent in 1990 to 10 per cent in 2015", "Each
  year, 100 million people are forced into extreme poverty due to healthcare costs" and
  "The economic fallout from the global pandemic could increase global poverty by as
  much as half a billion people" (`believability_4`). That draw is a separate, earlier
  randomisation that touches this experiment's poverty goal: 376 people saw
  `believability_4` immediately before this block; 361 of them contribute 2,993 rows here
  (found by the independent checker). That is unmodelled carry-over, spread across all
  12 groups by the independent draw, and it is not rendered.

  RISKIEST JUDGEMENT. That screen ORDER is what the script lists. Nothing in the data
  records it: there are no page timings in this deposit, so the order rests on the
  module listing (no `order=randomize`, unlike the knowledge module two blocks earlier)
  and the matching variable order in the .sav. If YouGov had shuffled screens inside a
  module, every condition naming an earlier goal or follow-up would be wrong while all
  counts reconciled. Second: rendering earlier goals into later screens' conditions at
  all (the alternative, each screen alone, would leave both randomised factors out of
  every row's text); it makes conditions long (26-370 words).

  COUNTS (built 10 Oct 2026). 18,081 cells (2,009 x 9); 2,193 "Don't know" dropped,
  leaving 15,888 rows from 1,932 people (77 answered "Don't know" on all nine). Per
  condition 1,500 / 1,343 / 1,180 / 1,367 / 1,282 / 1,334 / 1,249 / 1,287 / 1,184 /
  1,253 / 1,485 / 1,424; per task 1,854 / 1,807 / 1,766 / 1,819 / 1,699 / 1,687 /
  1,807 / 1,727 / 1,722. The maker re-derived all 15,888 (person, condition, task,
  response) tuples from the .sav with its own script, 0 missing and 0 extra; ages match
  the .sav on every person; each cell's condition was checked to contain exactly the
  script's screens up to that one, in order, and no other words than the narration
  above (both checks mutation-tested). The arm and item texts were generated from the
  questionnaire by the maker's own script (not in the repository), not hand-typed. No
  published reference exists to compare against.

  PERSONA and PERSON ID as in del_sandbox_feb2023_wordfeminist.yaml (study_id `del`,
  `GUNQID`, unique and never blank here), with this file's own names, which match Feb
  2023's: `education_level`, `gross_household` (HOUSEHOLD income). AGE IS REAL YEARS
  here (18-91; its only value labels are -9 "Not Asked" / -8 "Skipped"; ledger 145).
  Non-answer codes are declared from each variable's own value labels, identical to Feb
  2023's: region 12 Northern Ireland is a real region (none occur), 13 "Non UK &
  Invalid" a non-answer; past 2019 vote 98 "Other" is a real answer, kept; 99 "Don't
  know", 998/999 dropped. The condition names no persona category.

