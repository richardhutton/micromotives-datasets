  # from the fielded OSF questionnaire (Q 173, and again Q 739).
  RELIG:
    1: "Protestant (Baptist, Methodist, Non-denominational, Lutheran, Presbyterian, Pentecostal, Episcopalian, Reformed, Church of Christ, Jehovah's Witness, etc.)"
    # Real answer; the .sav label carries the text-box instruction "- Please
    # Specify:". The OSF questionnaire's preload table (Q 186) labels it "Something
    # else", which is what is used (same as s6urt).
    14: "Something else"
