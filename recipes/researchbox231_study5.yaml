    text: 'You are about to start a life simulator. In this simulator, you will work, incur expenses (rent
      ($650), cellphone ($75), internet ($75), health insurance ($150), electricity ($95), etc.) and make
      spending decisions just as you would in real life.

      It is important that you make decisions as you would in your everyday life. You will simulate life
      for four weeks.

      In this life simulator, you get paid $140 every day (Monday - Friday).

      To start, you have $875 in your checking account. You will always be shown your daily checking account
      balance at the bottom of the screen.

      NOTE: If you spend and your checking account balance goes negative, your negative balance will be
      deducted from your next paycheck. You will not incur any overdraft fees.

