outcomes:
- var: decision1
  task_num: 0
  question: 'Monday, February 1, 2021

    You move into a new apartment and your $650 rent is due on the first of every month. If you want the
    apartment to be professionally cleaned before you move in, you have to pay the landlord an additional
    $50.

    What do you do?

    1 means "Pay your rent and the cleaning fee"; 2 means "Just pay rent".'
