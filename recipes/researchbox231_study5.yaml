notes: 'De La Rosa W & Tully SM (2022), "The Impact of Payment Frequency on Consumer Spending and Subjective
  Wealth Perceptions", Journal of Consumer Research 48(6), doi:10.1093/jcr/ucab052. ResearchBox 231 (https://researchbox.org/231).


  GENERATED by scripts/gen_researchbox231.py; every judgement is in its docstring. Study 5, winter 2020-21.
  A four-week life simulator, $875 to start, paid $140 each weekday or $1,400 every two weeks; a negative
  balance is deducted from the next paycheck. The first decision comes before any pay day in either arm,
  so the arms differ only in the stated pay schedule. Only the FIRST spending decision is built. Every
  screen before it is the same for everyone in an arm, so its condition is fixed by the assignment. Every
  later screen shows a result and a balance that follow from the respondent''s own earlier choices ("You
  were late to work ...", "Alert: Your checking account balance is less than $0"), so no later decision,
  and no end-of-study question, has a condition shared by an arm: it would be one condition per path,
  stating each person''s own earlier answers as given. Not built for that reason: 27 further decisions,
  6 subjective-wealth and 4 prediction-uncertainty items, planning, mood (pictorial scales), discounting
  and financial literacy. The TRUE/FALSE items that restate the instructions are comprehension checks,
  dropped. Balances are those the survey flow''s own embedded-data arithmetic produced for the arm (see
  the docstring). The decision screen showed a balance box beneath the question; it follows the added
  clause "Beneath the question below, the same screen showed:" (ours). Options in the .qsf order, which
  was fixed. The first screen, an eligibility notice ("If you believe you may have taken part in a prior
  life simulation study ...") is survey mechanics, dropped. 1,120 of 1,200 kept (17 failed the attention
  check, 66 said they had taken the study before, 3 both; the paper''s N).


  Wording from Study_5_-_Life_Simulator_Daily_v_Biweekly_28_Questions.qsf. Typography normalised (curly
  quotes, non-breaking spaces); line breaks kept as the screen had them; one blank line between screens.
  Persona: age (years; outside 18-100 left blank), and gender, income, labels from the .qsf''s own choices
  (income and education harmonised by the crosswalk scheme us_researchbox231_qualtrics). Ethnicity (multi-select)
  and own pay frequency not mapped.'
