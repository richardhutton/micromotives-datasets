study_id: researchbox3251
source: researchbox
experiment: study3
title: 'Two $90 printers, the first $45 instore under a conditional promotion or no promotion, the store
  0, 30, 60 or 90 miles away: which option? (Study 3)'
data_file: researchbox3251_study3.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/3251 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Cheng A, Stadler Blank A (2025), "The Conditional-Promotion Paradox: When and Why Conditional
  Promotions Decrease Total Sales of the Promoted Product", Journal of Marketing Research 62(3):526-542,
  doi:10.1177/00222437241309324. ResearchBox 3251 (https://researchbox.org/3251).


  GENERATED by scripts/gen_researchbox3251.py; every judgement is in its docstring. Study 3 (AsPredicted
  #106746), 347 people: the data file''s Finished = 1 rows, as the authors'' script keeps and the paper
  reports. Promotion (the first printer $45 instore, $90 online) or none, between people (cond), crossed
  with the store''s distance within person: everyone saw four blocks, 0, 30, 60 and 90 miles, each with
  its own pair of printers (A/B, C/D, E/F, G/H), in a random order the deposit does not record (BlockRandomizer,
  SubSet 4, no _DO column). So each row carries its own block only, and each outcome names its own assignment
  column (arm_0 .. arm_90: 1 no promotion, 2 promotion). The options are listed in the .qsf''s fixed order
  with the piped instore price filled ($90 or $45, the embedded pipea .. pipeg, asserted to agree with
  cond); nominal, as answered. Not built: the introduction, which describes the sequence ("You will compare
  4 product pairs").


  Wording from Study 3_Qualtrics survey.qsf (the blocks the survey flow reaches), word-for-word: the scenario
  is the condition, each question the outcome. Typography normalised (HTML, non-breaking spaces, curly
  quotes); emphasis dropped. No words added. Data: Study 3_Qualtrics data_ResearchBox.xlsx. Persona: age
  (years, from the .qsf''s list; a band such as "22 or older" left blank) and gender (WA-B4: sex, as it
  asks), labels from the .qsf''s own choices, "Prefer not to respond" left blank and ", write in:" dropped
  from "Identity not listed".'
