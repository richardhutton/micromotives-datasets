study_id: researchbox3251
source: researchbox
experiment: wa_b3
title: 'A gas station at $3.50/gallon, with a $2.50 cash price you cannot use or no promotion: fill up
  here, a good deal, how many gallons, fair, regret? (Web Appendix B3)'
data_file: researchbox3251_wa_b3.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/3251 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Cheng A, Stadler Blank A (2025), "The Conditional-Promotion Paradox: When and Why Conditional
  Promotions Decrease Total Sales of the Promoted Product", Journal of Marketing Research 62(3):526-542,
  doi:10.1177/00222437241309324. ResearchBox 3251 (https://researchbox.org/3251).


  GENERATED by scripts/gen_researchbox3251.py; every judgement is in its docstring. Web Appendix B3 (AsPredicted
  #182519), 200 people: the data file''s Finished = 1 rows, as the authors'' script keeps and the paper
  reports. Two arms between people: no promotion (the scenario alone), or a promotion for customers paying
  in cash, $2.50/gallon, when you have no cash (the screen''s own words, "Unfortunately, do not have any
  cash on you!", kept). Next page: agreement that you will likely fill up here and that $3.50/gallon is
  a good deal (1 not at all, 7 extremely) and how many gallons (a 0-20 slider, whole gallons; its one
  row is labelled "gallons", the unit the question names). Next page, fixed order: three reactance items,
  fairness and regret, the same scale; those rows do not narrate the earlier page.


  Wording from WA-B3_Qualtrics survey.qsf (the blocks the survey flow reaches), word-for-word: the scenario
  is the condition, each question the outcome. Typography normalised (HTML, non-breaking spaces, curly
  quotes); emphasis dropped. No words added. Data: WA-B3_Qualtrics data_ResearchBox.xlsx. Persona: age
  (years, from the .qsf''s list; a band such as "22 or older" left blank) and gender (WA-B4: sex, as it
  asks), labels from the .qsf''s own choices, "Prefer not to respond" left blank and ", write in:" dropped
  from "Identity not listed".'
condition:
  source_vars:
  - cond
  shared_context: 'Imagine that you are driving on vacation and your fuel light goes on.


    A convenient gas station near your lodging charges $3.50/gallon.'
  factors:
  - promotion
  arms:
  - raw_values:
      cond: 1
    condition_num: 0
    factors:
      promotion: none
    text: ''
  - raw_values:
      cond: 2
    condition_num: 1
    factors:
      promotion: cash_only
    text: 'You notice that this gas station near you is currently running a price promotion.


      For customers paying in cash, gas is discounted to $2.50/gallon.


      Unfortunately, do not have any cash on you!


      This means you will still need to pay the regular price of $3.50 if you get gas here.'
outcomes:
- var: purch
  task_num: 0
  question: 'At this point, you can fill up at this gas station ($3.50/gallon) or keep on driving in search
    of a different gas station.


    Please indicate how much you agree to the following statements: I will likely fill up at this gas
    station ($3.50/gallon).'
  scale: &id001
    min: 1
    max: 7
    min_label: not at all
    max_label: extremely
- var: tu
  task_num: 1
  question: 'At this point, you can fill up at this gas station ($3.50/gallon) or keep on driving in search
    of a different gas station.


    Please indicate how much you agree to the following statements: Getting gas at $3.50/gallon in this
    gas station is a good deal.'
  scale: *id001
- var: extent
  task_num: 2
  question: How many gallons will you fill at this gas station at $3.50/gallon? If you don't intend to
    get gas at this gas station, click 0.
  scale:
    min: 0
    max: 20
- var: react1
  task_num: 3
  question: 'Please rate each of the following statements: I am frustrated because I can''t make free
    and independent decisions'
  scale: &id002
    min: 1
    max: 7
    min_label: not at all
    max_label: extremely
- var: react2
  task_num: 4
  question: 'Please rate each of the following statements: I am angry because my freedom of choice is
    restricted'
  scale: *id002
- var: react3
  task_num: 5
  question: 'Please rate each of the following statements: When a store wants me to do something, I feel
    like doing the exact opposite'
  scale: *id002
- var: fair
  task_num: 6
  question: 'Please rate each of the following statements: In this scenario, the pricing policy is fair.'
  scale: *id002
- var: regret
  task_num: 7
  question: 'Please rate each of the following statements: In this scenario, I will probably regret my
    decision.'
  scale: *id002
