study_id: researchbox2057
source: researchbox
experiment: study2b
title: 'Apartment, camera, speaker, hard drive: two options, a decoy or a compromise, made to choose or
  free to go elsewhere (Study 2b)'
data_file: researchbox2057_study2b.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/2057 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy https://zenodo.org/records/21935325. Read
  19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: '"A Reexamination of the Effect of Forced Choice", ResearchBox 2057 (https://researchbox.org/2057),
  anonymous author, no paper named in the box. Study 2b.


  GENERATED by scripts/gen_researchbox2057.py; every judgement is in its docstring. 2 x 3 between people:
  made to choose or offered a no-choice option (listed first, and named in the lead); two options, a dominated
  decoy, or a compromise. Four problems each. Problem order random and not recorded, so each row carries
  its own problem only. 1,202 people, all kept (AsPredicted #226927: ''I will not exclude any data'');
  sample: Prolific (the survey records Prolific fields), country not stated. Not built: *Confl_1-3 (three
  1-7 ratings of the decision the person had just made (dilemma, tough choice, options similar); the person''s
  own choice is not in the row).


  Wording from Study 2b - Materials.qsf (the blocks the survey flow reaches), word-for-word; no picture,
  script or piped text in it. Tables are one line per row, cells joined by " | ". Typography normalised.
  Added words (ours): the options'' enumeration after each question, ''1 means "..."; 2 means "..."''.
  Each answer is coded to its option''s position on screen. Persona: age (years) and gender, labels from
  the .qsf''s own choices.'
