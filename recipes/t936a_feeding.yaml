persona_label_rewrite:
  # Code 1's label carries an em dash ("Baptist—any denomination"); typography
  # normalises (CONVENTIONS), giving the string the other KN builds render.
  # The sample-variable spec (Q 24) labels code 12 "Other non-Christian, please
  # specify"; the fielded option is "Other non-Christian" (Q 782).
  XREL1:
    1: "Baptist-any denomination"
    12: "Other non-Christian"

