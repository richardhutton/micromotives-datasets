outcomes:
  - var: QV11
    task_num: 0
    question: "How favorable are you to Sarah's decision to formula-feed [Caroline/Bob]?"
    scale: {min: -5, max: 5, min_label: "Very unfavorable", max_label: "Very Favorable"}
  - var: QV12
    task_num: 1
    question: "How fair is Sarah's decision to formula-feed [Caroline/Bob]?"
    scale: {min: -5, max: 5, min_label: "Very unfair", max_label: "Very fair"}
  - var: QV13
    task_num: 2
    question: "How fair will other people find Sarah's decision to formula-feed [Caroline/Bob]?"
    scale: {min: -5, max: 5, min_label: "Very unfair", max_label: "Very fair"}
  - var: QV15
    task_num: 3
    question: "Which infant-feeding method do you think is better for a child?"
    scale: {min: -5, max: 5, min_label: "Breastfeeding is better", max_label: "Formula feeding is better"}

response_recode: {1: -5, 2: -4, 3: -3, 4: -2, 5: -1, 6: 0, 7: 1, 8: 2, 9: 3, 10: 4, 11: 5}
