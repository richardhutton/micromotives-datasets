  factors:
  - action
  arms:
  - raw_values:
      arm: 1
    condition_num: 0
    factors:
      action: price_increase
    text: Due to recent production cost increases, a British laundry detergent manufacturer has decided
      to make changes to one of its products. The detergent currently costs £6.00, comes in a 1,000 ml
      bottle, contains 30% active cleaning ingredients, and has a recommended dose of 50 ml per wash load.
      The manufacturer has decided to increase the price to £6.60, while keeping the bottle size, concentration,
      and recommended dose the same.
  - raw_values:
      arm: 2
    condition_num: 1
    factors:
      action: size_decrease
    text: Due to recent production cost increases, a British laundry detergent manufacturer has decided
      to make changes to one of its products. The detergent currently costs £6.00, comes in a 1,000 ml
      bottle, contains 30% active cleaning ingredients, and has a recommended dose of 50 ml per wash load.
      The manufacturer has decided to reduce the bottle size from 1,000 ml to 909 ml, while keeping the
      price, concentration, and recommended dose the same.
  - raw_values:
      arm: 3
    condition_num: 2
    factors:
      action: recoverable_quality
    text: Due to recent production cost increases, a British laundry detergent manufacturer has decided
      to make changes to one of its products. The detergent currently costs £6.00, comes in a 1,000 ml
      bottle, contains 30% active cleaning ingredients, and has a recommended dose of 50 ml per wash load.
      The manufacturer has decided to reduce the concentration of active cleaning ingredients from 30%
      to 27.3%, while keeping the price and bottle size the same. At the original 50 ml dose, the detergent
      now removes only 90.9% as many stains as before. Because the detergent is less concentrated, consumers
      now need to use 55 ml per wash load instead of 50 ml to achieve the same cleaning performance as
      before.
    items:
