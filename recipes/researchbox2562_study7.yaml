study_id: researchbox2562
source: researchbox
experiment: study7
title: 'A British detergent maker, facing higher costs, raises the price, shrinks the bottle, or weakens
  the formula in a way more detergent can or cannot make up: would you buy it? (Study 7)'
data_file: researchbox2562_study7.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/2562 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); archived as Zenodo doi:10.5281/zenodo.20808095. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Evangelidis I (2026), "Skimpflation Penalty: Decreases in Product Quality Trigger Stronger Consumer
  Reactions than Decreases in Size or Increases in Price", Journal of Consumer Research, doi:10.1093/jcr/ucag019.
  ResearchBox 2562 (https://researchbox.org/2562).


  GENERATED by scripts/gen_researchbox2562.py; every judgement is in its docstring. Study 7 (pre-registered,
  AsPredicted #294997), 1,005 people. Four arms between people: price (GBP 6.00 to 6.60), bottle size
  (1,000 ml to 909 ml), or a weaker formula (30% to 27.3% active ingredients) whose loss using more detergent
  does or does not recover. Would you buy it: 1 = No, 2 = Yes, as the .qsf codes it. The two quality arms
  then rated the new detergent''s quality on a page of its own (1 to 9, the source labelling the ends
  and the midpoint); those rows add, after the scenario, ''You were asked "Would you buy this detergent
  after this change?"'' (ours, narrating the screen before as asked). No exclusions were pre-registered.


  Wording from Study 7 - Materials.qsf. The scenario is the condition and the closing question the outcome,
  both word-for-word. Where there are arms, the assignment is derived from which arm''s column is filled
  (each such question was ForceResponse, so a blank means not shown). Typography normalised (HTML entities,
  non-breaking spaces, curly quotes). Persona: age (years; the .qsf accepts 15-100) and gender, labels
  from the .qsf''s own choices, "I prefer not to answer" and "None of the above" left blank (Jev: non-answer,
  1.00 and 0.66).'
condition:
  source_vars:
