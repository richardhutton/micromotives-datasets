study_id: researchbox755
source: researchbox
experiment: study4_election
title: 'Jordan votes for a District Attorney candidate from 2 or 6, choosing or first ranking them: how
  much does Jordan like the candidate? (Study 4)'
data_file: researchbox755_study4_election.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/755 ("All content posted to ResearchBox
  is under a CC By 4.0 License"); read from its Zenodo copy. Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Hu B, Moon A, VanEpps EM (2026), "Choice Set Size Neglect in Predicting Others'' Preferences",
  Psychological Science, doi:10.1177/09567976251400333. ResearchBox 755 (https://researchbox.org/755).


  GENERATED by scripts/gen_researchbox755.py; every judgement is in its docstring. Study 4, election scenario
  (AsPredicted #108512), 1,578 people: the authors'' exclusions as their .do file applies them (attrition,
  duplicate IP address or Prolific ID, failed attention check). 2 (2 or 6 options, Choice) x 2 (decide
  by choosing or by first ranking, Frame), between people. Jordan votes in a District Attorney primary
  between 2 candidates (one of the 15 pairs of six, candidate_combo_code, shown as Candidate A and Candidate
  B with the pair''s issues) or among all 6 (A-F), each with two issues in a table; the chosen option
  was drawn per person and piped in, and in the 6-option ranking arm the other five options'' ranks (2-6)
  were drawn and recorded. Arms are the cells drawn. The condition is the first page (the options), the
  deciding page, and the last page (who chose or ranked what, with the options again), joined by blank
  lines; the page before the last is the same and is not repeated. Tables are one line per row, cells
  joined by " | ". The question is on the last page (1 Not at all, 7 Very much). Everyone also answered
  the other Study 4 scenario, in a random order the deposit does not record, so no row narrates it. The
  coded column `like` is the one of the four exported liking columns (like2_1 .. _4, one per design cell)
  that the person answered, asserted to be the one for their cell.


  Wording from Study 4.qsf (the blocks the survey flow reaches), word-for-word, pipes filled from each
  person''s recorded fields: the scenario is the condition, each question the outcome. Typography normalised
  (HTML, non-breaking spaces, curly quotes); emphasis and highlighting dropped; a loading spinner picture
  (Study 4) dropped. No words added. Data: Study 4.xlsx. Persona: age (years, as typed) and gender (the
  .qsf''s labels; "Prefer not to disclose" left blank).'
