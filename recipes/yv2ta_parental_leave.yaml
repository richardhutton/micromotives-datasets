  age: PPAGE
  gender: PPGENDER
  education: PPEDUCAT
  ethnicity: PPETHM
  income: PPINCIMP
  marital_status: PPMARIT
  employment: PPWORK
  region: PPREG4
  household_size: PPHHSIZE
