      text: |-
          For the last two weeks, David has been feeling really down. He wakes up in the morning with a flat, heavy feeling that sticks with himself all day long. He isn't enjoying things the way he normally would. In fact, nothing seems to give him pleasure. Even when good things happen, they don't seem to make David happy. He pushes on through his days, but it is really hard. The smallest tasks are difficult to accomplish. He finds it hard to concentrate on anything. He feels out of energy and out of steam. And even though David feels tired when night comes, he can't get to sleep. David feels pretty worthless, and very discouraged. David’s family has noticed that he hasn't been himself for about the last month, and that he has pulled away from them. David just doesn't feel like talking. Because he has been having these problems, David was evaluated by a doctor who diagnosed him with major depression.
