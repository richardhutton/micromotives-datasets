      text: |-
          About a year ago, David was prescribed prescription pain medication. He took the pain medication regularly, and after a few weeks found that he increasingly felt the desire for more, even though his pain had improved. David went to several different doctors to get more prescriptions from them and then started getting them from a friend. Each time David tried to cut down, he felt anxious and became sweaty and nauseated for hours on end and also could not sleep. These symptoms lasted until he resumed taking the prescription pain medication. David’s friends complained that he had become unreliable – making plans one day and canceling them the next. His family said he had changed and that they could no longer count on him. David has been living this way for six months. Because he has been having these problems, David was evaluated by a doctor who diagnosed him with opioid use disorder.
