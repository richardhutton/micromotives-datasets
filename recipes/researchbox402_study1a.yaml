study_id: researchbox402
source: researchbox
experiment: study1a
title: 'Flight tickets whose price fell or rose, once or week by week, to $400 now: buy them now or later?
  (Study 1a)'
data_file: researchbox402_study1a.csv
licence: CC BY 4.0, stated on the box page https://researchbox.org/402 ("All content posted to ResearchBox
  is under a CC By 4.0 License"). Read 19 Nov 2026.
comparable_to_socsci210: false
participant_id_var: pid
notes: 'Gunadi MP, Evangelidis I (2022), "The Impact of Historical Price Information on Purchase Deferral",
  Journal of Marketing Research 59(3):623-640, doi:10.1177/00222437211060359. ResearchBox 402 (https://researchbox.org/402).


  GENERATED by scripts/gen_researchbox402.py; every judgement is in its docstring. Study 1a (pre-registered
  Sep 2019, AsPredicted #28377), 802 people, all kept ("We will not exclude any data"). 2 x 2 between
  people: the tickets were $600 (decrease) or $200 (increase) four weeks ago and are $400 now, having
  changed once (in the last week) or every week. 1 = buy now, 2 = buy later, as answered.


  Wording: every scenario and question is the fielded screen''s, from the data file''s variable labels
  (Qualtrics'' export of each question), typos kept; the materials PDF (no .qsf) supplies the page structure
  and order, the answer options, the price bounds and any text no label carries. No picture on any built
  study''s pages. Each data column is tied to its PDF screen by the dollar amounts in its label, exactly
  one match each. Where the PDF''s words differ from the fielded ones: fielded "weeks", the PDF "week".
  Typography normalised. The assignment is derived from which arm''s columns are filled. Persona: age
  (years; outside 18-100 left blank) and gender, labels from the .sav''s value labels.'
condition:
  source_vars:
  - arm
  shared_context: Imagine that you are buying flight tickets for your upcoming holidays. Only one airline
    flies directly to that destination.
  factors:
  - direction
  - frequency
  arms:
  - raw_values:
      arm: 1
    condition_num: 0
    factors:
      direction: decrease
      frequency: low
    text: Four weeks ago, the tickets were priced at $600. Three weeks ago, the tickets were priced at
      $600. Two weeks ago, the tickets were priced at $600. One weeks ago, the tickets were priced at
      $600. Currently the tickets cost $400.
  - raw_values:
      arm: 2
    condition_num: 1
    factors:
      direction: decrease
      frequency: high
    text: Four weeks ago, the tickets were priced at $600. Three weeks ago, the tickets were priced at
      $550. Two weeks ago, the tickets were priced at $500. One weeks ago, the tickets were priced at
      $450. Currently the tickets cost $400.
  - raw_values:
      arm: 3
    condition_num: 2
    factors:
      direction: increase
      frequency: low
    text: Four weeks ago, the tickets were priced at $200. Three weeks ago, the tickets were priced at
      $200. Two weeks ago, the tickets were priced at $200. One weeks ago, the tickets were priced at
      $200. Currently the tickets cost $400.
  - raw_values:
      arm: 4
    condition_num: 3
    factors:
      direction: increase
      frequency: high
    text: Four weeks ago, the tickets were priced at $200. Three weeks ago, the tickets were priced at
      $250. Two weeks ago, the tickets were priced at $300. One weeks ago, the tickets were priced at
      $350. Currently the tickets cost $400.
outcomes:
- var: choice
  task_num: 0
  question: What would you do?
  scale:
    min: 1
    max: 2
    min_label: I would buy the tickets now
    max_label: I would buy the tickets later
response_recode:
  1: 1
  2: 2
missing_codes: []
persona_map:
  age: age
  gender: gender
