[project]
name = "micromotives-datasets"
version = "0.1.0"
description = "Dataset-building pipeline for Micromotives — UK behavioural-prediction datasets in (persona, condition, outcome, response) form, modelled on SocSci210."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "requests>=2.31",
    "huggingface-hub>=0.34",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pyreadstat>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "types-requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/micromotives_datasets"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803"]  # test function/arg naming
"scripts/**" = ["E501", "B904", "RUF001", "RUF010", "T201"]  # ad-hoc inspection scripts

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_reexport = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyreadstat", "pyreadstat.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
